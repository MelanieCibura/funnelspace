<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blog — Funnelspace</title>
<meta name="description" content="Vom Keyword zum Kunden: Der Funnelspace-Blog ist kein zweites CMS, sondern die erste Stufe deines Funnels. Sieh der Redaktion beim Arbeiten zu." />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="site.css" />
<style>
.b2{background:var(--fs-paper)}
a{color:var(--fs-ink)}
a:hover{color:var(--fs-lime-deep)}
.b2-wrap{max-width:1280px;margin:0 auto;padding:0 40px}

/* ── Hero ─────────────────────────────────────────────── */
.b2-hero{background:var(--fs-ink);color:#fff;position:relative;overflow:hidden;padding:76px 40px 190px}
.b2-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.07) 1px,transparent 1.2px);background-size:8px 8px;pointer-events:none}
.b2-hero__inner{position:relative;max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:end}
.b2-kicker{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fs-lime);border:1px solid rgba(215,240,120,.3);background:rgba(215,240,120,.08);padding:6px 12px;border-radius:var(--radius-pill)}
.b2-hero h1{margin-top:26px;font-family:var(--font-display);font-size:clamp(42px,4.8vw,66px);font-weight:800;line-height:1.03;letter-spacing:-.035em;color:#fff;text-wrap:balance}
.b2-hero h1 em{font-style:normal;color:var(--fs-lime)}
.b2-lead{margin-top:22px;font-size:19px;line-height:1.55;color:rgba(255,255,255,.68);max-width:520px}
.b2-hero__cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.b2-hero__cta .btn--ghost{color:#fff;border-color:rgba(255,255,255,.28)}
.b2-hero__cta .btn--ghost:hover{border-color:#fff}
.b2-hero__note{margin-top:18px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;color:rgba(255,255,255,.42)}
.b2-chain{display:grid;gap:10px}
.b2-chain__t{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:6px}
.b2-chain__row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;border-top:1px solid rgba(255,255,255,.12);padding:12px 0}
.b2-chain__row:last-child{border-bottom:1px solid rgba(255,255,255,.12)}
.b2-chain__n{font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.35)}
.b2-chain__l{font-size:14.5px;color:rgba(255,255,255,.85)}
.b2-chain__v{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--fs-lime);letter-spacing:-.01em}

/* ── Workbench ────────────────────────────────────────── */
.b2-bench{max-width:1180px;margin:-140px auto 0;position:relative;z-index:2;background:var(--fs-white);border-radius:var(--radius-xl);box-shadow:0 44px 90px -30px rgba(0,0,0,.42);overflow:hidden;display:grid;grid-template-columns:274px 1fr}
.b2-rail{background:var(--fs-paper);border-right:1px solid var(--border-1);padding:22px 0}
.b2-rail__t{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);padding:0 22px 14px}
.b2-step{width:100%;display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;text-align:left;background:none;border:none;padding:13px 22px;cursor:pointer;position:relative;transition:background var(--dur-fast) var(--ease-in-out)}
.b2-step:hover{background:rgba(0,0,0,.03)}
.b2-step.on{background:var(--fs-white)}
.b2-step.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fs-lime-deep)}
.b2-step__n{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);padding-top:3px}
.b2-step.on .b2-step__n{color:var(--fs-lime-deep)}
.b2-step__l{font-family:var(--font-display);font-weight:700;font-size:14.5px;letter-spacing:-.01em;color:var(--fs-ink)}
.b2-step__d{font-size:12px;line-height:1.4;color:var(--fg-3);margin-top:3px;display:none}
.b2-step.on .b2-step__d{display:block}
.b2-step__bar{grid-column:2;height:2px;background:var(--fs-gray-200);border-radius:2px;margin-top:9px;overflow:hidden;display:none}
.b2-step.on .b2-step__bar{display:block}
.b2-step__bar i{display:block;height:100%;background:var(--fs-lime-deep);transition:width .2s linear}
.b2-rail__foot{padding:16px 22px 2px;border-top:1px solid var(--border-1);margin-top:14px;display:flex;align-items:center;gap:10px}
.b2-rail__foot button{border:1px solid var(--border-1);background:var(--fs-white);border-radius:var(--radius-pill);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;cursor:pointer;color:var(--fs-ink);transition:background var(--dur-fast)}
.b2-rail__foot button:hover{background:var(--fs-paper)}

.b2-panel{padding:26px 30px 30px;min-height:452px;display:flex;flex-direction:column;background-image:radial-gradient(var(--fs-gray-200) 1px,transparent 1.2px);background-size:14px 14px}
.b2-panel__head{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--border-1);margin-bottom:20px}
.b2-panel__head svg{width:17px;height:17px;color:var(--fs-ink)}
.b2-panel__head b{font-family:var(--font-display);font-size:15px;letter-spacing:-.01em}
.b2-panel__head span{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);letter-spacing:.06em}
.b2-fade{animation:b2in .38s var(--ease-out) both}
@keyframes b2in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* panel internals */
.b2-kw{display:grid;gap:8px}
.b2-kw__r{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-sm);padding:12px 14px}
.b2-kw__r.hot{border:2px solid var(--fs-ink)}
.b2-kw__q{font-size:14px}
.b2-kw__v{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-3)}
.b2-chip{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:var(--radius-pill);background:var(--fs-gray-100);color:var(--fs-ink-soft)}
.b2-chip--lime{background:var(--fs-lime);color:var(--fs-lime-ink)}

.b2-outline{display:grid;gap:9px}
.b2-outline__i{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-sm);padding:11px 14px}
.b2-outline__i b{font-family:var(--font-mono);font-size:10.5px;color:var(--fs-lime-deep)}
.b2-outline__i span{font-size:14px}
.b2-typing-cursor{display:inline-block;width:7px;height:15px;background:var(--fs-ink);vertical-align:-2px;margin-left:2px;animation:b2blink 1s steps(2) infinite}
@keyframes b2blink{50%{opacity:0}}

.b2-blocks{display:grid;gap:8px}
.b2-block{background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-sm);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.b2-block svg{width:15px;height:15px;color:var(--fg-3)}
.b2-block__t{font-size:13.5px}
.b2-block__t i{display:block;font-style:normal;font-size:11.5px;color:var(--fg-3);margin-top:2px}
.b2-block--accent{border:2px solid var(--fs-ink)}
.b2-block--accent svg{color:var(--fs-lime-deep)}
.b2-block__tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}

.b2-serp{background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-sm);padding:16px}
.b2-serp__u{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-3)}
.b2-serp__t{font-family:var(--font-display);font-size:18px;font-weight:700;color:#1a3fa0;margin-top:5px;letter-spacing:-.01em}
.b2-serp__d{font-size:13px;line-height:1.5;color:var(--fg-2);margin-top:6px}
.b2-seo{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:16px}
.b2-ring{width:76px;height:76px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:24px}
.b2-rules{display:grid;gap:7px}
.b2-rule{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--fs-ink)}
.b2-rule svg{width:15px;height:15px;color:var(--fs-lime-deep);flex-shrink:0}

.b2-pub{display:grid;gap:10px}
.b2-pub__r{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-sm);padding:13px 14px;font-size:13.5px}
.b2-pub__r svg{width:16px;height:16px;color:var(--fs-lime-deep)}
.b2-pub__r span{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);letter-spacing:.05em}

.b2-contact{background:var(--fs-white);border:2px solid var(--fs-ink);border-radius:var(--radius-md);padding:18px}
.b2-contact__h{display:flex;align-items:center;gap:12px}
.b2-avatar{width:42px;height:42px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:14px}
.b2-contact__n{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:-.01em}
.b2-contact__m{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-3);margin-top:2px}
.b2-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.b2-tl{margin-top:16px;border-top:1px solid var(--border-1);padding-top:14px;display:grid;gap:11px}
.b2-tl__i{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-size:13px}
.b2-tl__d{width:8px;height:8px;border-radius:50%;background:var(--fs-gray-300)}
.b2-tl__i.key .b2-tl__d{background:var(--fs-lime-deep)}
.b2-tl__t{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3)}

/* ── Sektionen ────────────────────────────────────────── */
.b2-sec{padding:104px 0}
.b2-sec--white{background:var(--fs-white)}
.b2-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fs-ink-soft)}
.b2-h2{font-family:var(--font-display);font-size:clamp(30px,3.3vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin-top:14px;max-width:760px;text-wrap:balance}
.b2-sub{font-size:18px;line-height:1.55;color:var(--fg-2);max-width:620px;margin-top:18px}

.b2-vs{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:52px}
.b2-card{border-radius:var(--radius-lg);padding:30px}
.b2-card--old{background:var(--fs-paper);border:1px solid var(--border-1)}
.b2-card--new{background:var(--fs-white);border:2px solid var(--fs-ink)}
.b2-card h3{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.b2-card ul{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:12px}
.b2-card li{display:grid;grid-template-columns:auto 1fr;gap:11px;font-size:14.5px;line-height:1.5;color:var(--fg-2)}
.b2-card li svg{width:16px;height:16px;margin-top:3px;flex-shrink:0}
.b2-card--old li svg{color:var(--fs-gray-400)}
.b2-card--new li{color:var(--fs-ink)}
.b2-card--new li svg{color:var(--fs-lime-deep)}
.b2-card__cost{margin-top:24px;padding-top:18px;border-top:1px solid var(--border-1);font-family:var(--font-mono);font-size:11.5px;letter-spacing:.05em;color:var(--fg-3)}
.b2-card--new .b2-card__cost{color:var(--fs-ink)}

.b2-row{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center;padding:64px 0;border-top:1px solid var(--border-1)}
.b2-row:first-of-type{border-top:none}
.b2-row--flip .b2-row__txt{order:2}
.b2-row h3{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.14;margin-top:12px}
.b2-row p{font-size:16.5px;line-height:1.6;color:var(--fg-2);margin-top:14px}
.b2-row ul{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:10px}
.b2-row li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14.5px;line-height:1.5}
.b2-row li svg{width:16px;height:16px;color:var(--fs-lime-deep);margin-top:3px}
.b2-illu{background:var(--fs-paper);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:26px;display:grid;place-items:center}
.b2-illu img{max-width:100%;height:auto;display:block}

.b2-stats{background:var(--fs-ink);color:#fff;padding:76px 40px;position:relative;overflow:hidden}
.b2-stats::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.07) 1px,transparent 1.2px);background-size:8px 8px}
.b2-stats__inner{position:relative;max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:36px}
.b2-stat b{display:block;font-family:var(--font-display);font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--fs-lime)}
.b2-stat span{display:block;font-size:14px;line-height:1.5;color:rgba(255,255,255,.6);margin-top:8px;max-width:220px}

.b2-faq{display:grid;gap:0;margin-top:44px;max-width:860px;border-top:1px solid var(--border-1)}
.b2-faq details{border-bottom:1px solid var(--border-1)}
.b2-faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0;font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.b2-faq summary::-webkit-details-marker{display:none}
.b2-faq summary svg{width:18px;height:18px;flex-shrink:0;color:var(--fs-ink-soft);transition:transform var(--dur-med) var(--ease-in-out)}
.b2-faq details[open] summary svg{transform:rotate(45deg)}
.b2-faq p{font-size:15px;line-height:1.6;color:var(--fg-2);margin:0 0 22px;max-width:680px}

@media(max-width:1080px){
.b2-hero__inner{grid-template-columns:1fr;gap:40px}
.b2-bench{grid-template-columns:1fr;margin:-120px 24px 0}
.b2-rail{border-right:none;border-bottom:1px solid var(--border-1)}
.b2-stats__inner{grid-template-columns:1fr 1fr;gap:28px}
.b2-vs,.b2-row{grid-template-columns:1fr;gap:28px}
.b2-row--flip .b2-row__txt{order:0}
.b2-wrap{padding:0 24px}
.nav__links{display:none}
}
</style>
</head>
<body class="b2">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const BP = {
  search:"M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z|m21 21-4.3-4.3",
  sparkles:"m12 3 1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9Z|M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9Z",
  layout:"M3 4h18v16H3z|M3 10h18|M9 20V10",
  globe:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z|M3 12h18|M12 3a14 14 0 0 1 0 18|M12 3a14 14 0 0 0 0 18",
  user:"M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z|M4 21a8 8 0 0 1 16 0",
  check:"M20 6 9 17l-5-5",
  circleCheck:"M22 11.1V12a10 10 0 1 1-5.9-9.1|m9 11 3 3L22 4",
  plus:"M12 5v14|M5 12h14",
  minus:"M5 12h14",
  type:"M4 7V4h16v3|M9 20h6|M12 4v16",
  image:"M3 5h18v14H3z|m3 16 5-5 4 4 3-3 6 6|M8.5 9.5h.01",
  mail:"M3 6h18v12H3z|m3 7 9 6 9-6",
  quote:"M7 7H4v6h6V7c0 4-1 6-3 7|M20 7h-3v6h6V7c0 4-1 6-3 7",
  send:"m22 2-7 20-4-9-9-4Z",
  clock:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z|M12 7v5l3 2",
  x:"M18 6 6 18|m6 6 12 12",
  euro:"M18 7a6 6 0 1 0 0 10|M4 10h9|M4 14h9",
  zap:"M13 2 4 14h7l-1 8 9-12h-7Z",
  rss:"M4 11a9 9 0 0 1 9 9|M4 4a16 16 0 0 1 16 16|M5 19h.01",
};
const I = ({n, ...r}) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...r}>
    {BP[n].split("|").map((d,i)=><path key={i} d={d} />)}
  </svg>
);

/* ── Panels ───────────────────────────────────────────── */
const PanelIdee = () => (
  <div className="b2-fade">
    <div className="b2-kw">
      {[["landingpage erstellen","2.400/Mon.","mittel",false],["e mail funnel aufbauen","880/Mon.","leicht",true],["crm für coaches","590/Mon.","leicht",false],["newsletter tool dsgvo","1.100/Mon.","schwer",false]].map(([q,v,d,hot])=>(
        <div key={q} className={"b2-kw__r" + (hot?" hot":"")}>
          <div className="b2-kw__q">{q}</div>
          <div className="b2-kw__v">{v}</div>
          <div className={"b2-chip" + (hot?" b2-chip--lime":"")}>{hot?"Thema wählen":d}</div>
        </div>
      ))}
    </div>
    <p style={{fontSize:"13px",color:"var(--fg-3)",marginTop:"18px",lineHeight:1.5}}>Vorschläge kommen aus deinen echten Daten: Suchanfragen auf deiner Seite, Fragen aus dem Posteingang, Themen deiner meistgeklickten E-Mails.</p>
  </div>
);

const PanelEntwurf = () => {
  const items = [["H1","E-Mail-Funnel aufbauen: die 5 Mails, die verkaufen"],["H2","Warum Einzel-Newsletter nichts bringen"],["H2","Mail 1–5: Aufbau, Timing, Betreffzeilen"],["H2","Automatisch statt manuell versenden"],["H2","Vorlage: Funnel in 15 Minuten kopieren"]];
  const [n, setN] = useState(0);
  useEffect(() => { setN(0); const t = setInterval(() => setN(v => v < items.length ? v+1 : v), 420); return () => clearInterval(t); }, []);
  return (
    <div className="b2-fade">
      <div className="b2-outline">
        {items.slice(0,n).map(([lvl,t])=>(
          <div key={t} className="b2-outline__i b2-fade"><b>{lvl}</b><span>{t}</span></div>
        ))}
      </div>
      {n < items.length && <div style={{marginTop:"12px",fontFamily:"var(--font-mono)",fontSize:"11.5px",color:"var(--fg-3)"}}>KI schreibt Gliederung<span className="b2-typing-cursor" /></div>}
      {n >= items.length && <p style={{fontSize:"13px",color:"var(--fg-3)",marginTop:"18px",lineHeight:1.5}}>Gliederung steht. Aus jedem Punkt macht die KI auf Wunsch einen ersten Absatz — in deiner Tonalität, aus deinen bisherigen Artikeln gelernt.</p>}
    </div>
  );
};

const PanelSchreiben = () => (
  <div className="b2-fade">

];
const DUR = 6200;

const Bench = () => {
  const [i, setI] = useState(0);
  const [p, setP] = useState(0);
  const [play, setPlay] = useState(true);
  useEffect(() => {
    if (!play) return;
    setP(0);
    const t0 = Date.now();
    const t = setInterval(() => {
      const v = (Date.now() - t0) / DUR;
      if (v >= 1) { setI(x => (x + 1) % STAGES.length); setP(0); }
      else setP(v * 100);
    }, 80);
    return () => clearInterval(t);
  }, [i, play]);
  const S = STAGES[i];
  return (
    <div className="b2-bench">
      <div className="b2-rail">
        <div className="b2-rail__t">Ein Artikel, sechs Schritte</div>
        {STAGES.map((s, k) => (
          <button key={s.id} className={"b2-step" + (k===i?" on":"")} onClick={()=>{setI(k);setP(0);}}>
            <span className="b2-step__n">{s.n}</span>
            <span>
              <span className="b2-step__l">{s.l}</span>
              <span className="b2-step__d">{s.d}</span>
            </span>
            <span className="b2-step__bar"><i style={{width: (play?p:0) + "%"}} /></span>
          </button>
        ))}
        <div className="b2-rail__foot">
          <button onClick={()=>setPlay(v=>!v)}>{play ? "Pause" : "Abspielen"}</button>
          <span style={{fontFamily:"var(--font-mono)",fontSize:"10.5px",color:"var(--fg-3)"}}>oder Schritt anklicken</span>
        </div>
      </div>
      <div className="b2-panel">
        <div className="b2-panel__head"><I n={S.icon} /><b>{S.meta}</b><span>Schritt {S.n} / 06</span></div>
        <S.C key={S.id} />
      </div>
    </div>
  );
};
