<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alle Funktionen im Überblick — Funnelspace</title>
<meta name="description" content="Alle Funktionen von Funnelspace, gruppiert nach dem, was du gerade brauchst: Leads gewinnen, verkaufen & betreuen, skalieren. Von jeder Kachel direkt zum Feature." />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="site.css" />
<style>
.fu-hero{padding:76px 40px 60px;position:relative;overflow:hidden}
.fu-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:11px 11px;opacity:.5;pointer-events:none}
.fu-hero__inner{max-width:1280px;margin:0 auto;position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:end}
.fu-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fs-ink);background:var(--fs-lime);padding:6px 12px;border-radius:var(--radius-pill);margin-bottom:22px}
.fu-hero h1{font-family:var(--font-display);font-size:clamp(40px,4.6vw,64px);font-weight:700;line-height:1.05;letter-spacing:-.03em;text-wrap:balance}
.fu-hero h1 em{font-style:normal;background:var(--fs-lime);color:var(--fs-lime-ink);padding:0 6px;border-radius:6px}
.fu-hero__lead{margin-top:20px;font-size:19px;line-height:1.55;color:var(--fg-2);max-width:520px}
.fu-hero__cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.fu-jump{display:flex;flex-direction:column;gap:10px}
.fu-jump__lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);margin-bottom:4px}
.fu-jump a{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-md);padding:14px 16px;text-decoration:none;color:inherit;transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out)}
.fu-jump a:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);color:inherit}
.fu-jump__n{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--fs-lime-ink);background:var(--fs-lime);border-radius:6px;padding:5px 0;text-align:center}
.fu-jump__t{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:-.01em}
.fu-jump__c{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.fu-bar{position:sticky;top:72px;z-index:60;background:rgba(250,250,247,.9);backdrop-filter:blur(10px);border-top:1px solid var(--border-1);border-bottom:1px solid var(--border-1);padding:12px 40px}
.fu-bar__inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fu-bar__lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);margin-right:6px}
.fu-bar a{font-size:13px;font-weight:600;color:var(--fg-2);text-decoration:none;border:1px solid var(--border-1);background:var(--fs-white);border-radius:var(--radius-pill);padding:7px 14px;transition:all var(--dur-fast) var(--ease-out)}
.fu-bar a:hover{border-color:var(--fs-ink);color:var(--fs-ink)}
.fu-bar a.on{background:var(--fs-ink);border-color:var(--fs-ink);color:#fff}
.fu-sec{padding:88px 40px;scroll-margin-top:150px}
.fu-sec--alt{background:var(--fs-white)}
.fu-sec__inner{max-width:1280px;margin:0 auto}
.fu-sec__head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;flex-wrap:wrap;margin-bottom:40px;padding-bottom:24px;border-bottom:2px solid var(--border-strong)}
.fu-sec__n{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--fs-lime-ink);background:var(--fs-lime);padding:4px 9px;border-radius:5px;display:inline-block;margin-bottom:14px}
.fu-sec__head h2{font-family:var(--font-display);font-size:clamp(30px,3.2vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.fu-sec__head p{margin-top:14px;font-size:17px;line-height:1.55;color:var(--fg-2);max-width:620px}
.fu-sec__meta{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-3);white-space:nowrap;line-height:1.7}
.fu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.fu-card{background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:26px;display:flex;flex-direction:column;gap:16px;transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out),border-color var(--dur-med) var(--ease-out)}
.fu-sec--alt .fu-card{background:var(--fs-paper)}
.fu-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--fs-gray-300)}
.fu-card--wide{grid-column:span 2}
.fu-card__top{display:grid;grid-template-columns:78px 1fr;gap:18px;align-items:center}
.fu-card__art{width:78px;height:78px;border-radius:var(--radius-md);border:1px solid var(--border-1);background:var(--fs-paper);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:8px 8px;display:grid;place-items:center;overflow:hidden}
.fu-sec--alt .fu-card__art{background-color:var(--fs-white)}
.fu-card__art img{max-width:76%;max-height:76%;object-fit:contain}
.fu-card__title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fu-card__title a{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em;text-decoration:none;color:var(--fs-ink)}
.fu-card__title a:hover{color:var(--fs-lime-deep)}
.fu-card__d{margin-top:8px;font-size:14.5px;line-height:1.55;color:var(--fg-2)}
.fu-tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:var(--radius-pill);background:var(--fs-lime);color:var(--fs-lime-ink)}
.fu-feats{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.fu-feats a{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--fg-2);text-decoration:none;background:var(--fs-paper);border:1px solid var(--border-1);border-radius:var(--radius-pill);padding:7px 13px;transition:all var(--dur-fast) var(--ease-out)}
.fu-sec--alt .fu-feats a{background:var(--fs-white)}
.fu-feats a::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fs-lime-deep);flex-shrink:0}
.fu-feats a:hover{border-color:var(--fs-ink);color:var(--fs-ink);background:var(--fs-white)}
.fu-feats a.soft::before{background:var(--fs-gray-300)}
.fu-card__link{margin-top:auto;padding-top:16px;border-top:1px solid var(--border-1);display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--fs-ink);text-decoration:none;transition:gap var(--dur-fast) var(--ease-out)}
.fu-card__link:hover{gap:11px;color:var(--fs-ink)}
.fu-card__link svg{width:15px;height:15px}
.fu-ai{grid-column:span 2;background:var(--fs-ink);border-radius:var(--radius-lg);padding:34px;display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:center;position:relative;overflow:hidden}
.fu-ai::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.09) 1px,transparent 1.2px);background-size:8px 8px}
.fu-ai__txt{position:relative}
.fu-ai__eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fs-lime)}
.fu-ai__txt h3{margin-top:12px;font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.02em;color:#fff;line-height:1.1}
.fu-ai__txt p{margin-top:12px;font-size:15px;line-height:1.6;color:rgba(255,255,255,.62);max-width:380px}
.fu-ai__cta{margin-top:22px;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--fs-lime);text-decoration:none}
.fu-ai__cta:hover{color:#fff}
.fu-ai__cta svg{width:15px;height:15px}
.fu-ai__subs{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fu-sub{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-md);padding:15px 16px;text-decoration:none;transition:background var(--dur-fast) var(--ease-out),transform var(--dur-med) var(--ease-out)}
.fu-sub:hover{background:rgba(255,255,255,.1);transform:translateY(-2px);color:inherit}
.fu-sub__t{font-family:var(--font-display);font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em}
.fu-sub__d{display:block;margin-top:5px;font-size:12.5px;color:rgba(255,255,255,.55);line-height:1.4;font-family:var(--font-sans);font-weight:400}
.fu-sub svg{width:15px;height:15px;color:var(--fs-lime)}
.fu-note{max-width:1280px;margin:0 auto;padding:0 40px 80px;font-size:13px;color:var(--fg-3);line-height:1.6}
.fu-final{background:var(--fs-ink);padding:92px 40px;text-align:center;position:relative;overflow:hidden}
.fu-final::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.07) 1px,transparent 1.2px);background-size:8px 8px}
.fu-final__inner{position:relative;max-width:720px;margin:0 auto}
.fu-final h2{font-family:var(--font-display);font-size:clamp(32px,3.8vw,50px);font-weight:700;letter-spacing:-.03em;color:#fff;text-wrap:balance}
.fu-final h2 em{font-style:normal;color:var(--fs-lime)}
.fu-final p{margin:16px auto 0;font-size:18px;color:rgba(255,255,255,.6)}
.fu-final__btns{display:flex;gap:12px;justify-content:center;margin-top:32px;flex-wrap:wrap}
a{color:var(--fs-ink)}a:hover{color:var(--fs-lime-deep)}
@media(max-width:1024px){
.fu-hero__inner{grid-template-columns:1fr;gap:44px;align-items:start}
.fu-grid{grid-template-columns:1fr}
.fu-card--wide,.fu-ai{grid-column:span 1}
.fu-ai{grid-template-columns:1fr;gap:26px}
}
@media(max-width:768px){
.fu-hero{padding:52px 22px}
.fu-bar{padding:10px 22px;top:64px}
.fu-sec{padding:60px 22px}
.fu-note{padding:0 22px 60px}
.fu-final{padding:64px 22px}
.fu-ai__subs{grid-template-columns:1fr}
.fu-card__top{grid-template-columns:60px 1fr;gap:14px}
.fu-card__art{width:60px;height:60px}
.nav__links{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const IArrow = ({size=15}) => (
  <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
);

const ILL = 'assets/illustrations/';
const FALLBACK = 'funktionen.html';
// Detailseiten, die es im Projekt schon gibt. Alles andere zeigt vorerst auf die Funktionsliste.
const PAGES = {
  'CRM & Pipeline': 'crm.html',
  'Kalender & Termine': 'kalender%20%F0%9F%9F%A2.html',
  'E-Mail-Marketing': 'email-marketing.html',
  'Kurse & Community': 'mitgliederbereich.html',
  'Automationen': 'automationen%20%F0%9F%9F%A2.html',
  'KI-Tools': 'ki-tools-v4.html',
  'Blog': 'blog-feature-v3.html',
  'Templates': 'templates%20%F0%9F%9F%A1.html',
  'Mobile App': 'apps.html',
  'Ask AI': 'ask-ai.html',
  'Conversation AI': 'conversation-ai%20%F0%9F%9F%A2.html',
  'Voice AI': 'voice-ai-v3%20%F0%9F%9F%A2.html',
  'AI Studio': 'ai-studio.html',
};
const linkTo = (name) => PAGES[name] || FALLBACK;

const PHASES = [
  {
    id: 'leads', n: '01', title: 'Leads gewinnen',
    lead: 'Sichtbar werden, Aufmerksamkeit einsammeln und aus Besuchern Kontakte machen — Seiten, Termine und Bewertungen in einem System.',
    groups: [
      { name: 'Funnels & Websites', img: 'funnel.png', tag: 'Kern',
        d: 'Landingpages, Sales-Funnels und ganze Websites bauen — mobiloptimiert, gehostet, ohne Baukasten-Zoo drumherum.',
        f: ['Funnel- und Seiten-Builder', 'Blog', 'Templates', 'Domains', 'Hosting', 'Formulare', 'Umfragen', 'Chat-Widget', 'QR-Codes'] },
      { name: 'Kalender & Termine', img: 'calendar.png', tag: 'Kern',
        d: 'Termin-Buchung ohne Hin und Her. Jede Buchung landet direkt beim Kontakt im CRM — inklusive Erinnerungen.',
        f: ['Buchungsseiten', 'Team-Kalender', 'Round-Robin', 'Erinnerungen', 'Zoom & Google Meet', 'No-Show-Handling'] },
      { name: 'Social Media & Bewertungen', img: 'social-media.png', wide: true,
        d: 'Beiträge planen, Google-Profil pflegen und Bewertungen automatisch anfragen — dein Social Proof arbeitet mit im Funnel.',
        f: ['Social Planner', 'Google Business Profil', 'Bewertungsanfragen', 'Review-Management'] },
    ],
  },
  {
    id: 'verkaufen', n: '02', title: 'Verkaufen & betreuen',
    lead: 'Aus Kontakten werden Kunden: ein Postfach für alle Kanäle, Angebote und Zahlungen im System, Kurse und Community gleich mit.',
    groups: [
      { name: 'CRM & Pipeline', img: 'crm.png', tag: 'Kern',
        d: 'Alle Kontakte, Deals und Aufgaben an einem Ort — mit Verlauf, Tags und Quelle pro Lead.',
        f: ['Kontakte', 'Smart Lists', 'Tags', 'Eigene Felder', 'Deals', 'Aufgaben', 'Notizen'] },
      { name: 'Postfach & Kommunikation', img: 'dashboard-funnelspace.png',
        d: 'Alle Kanäle in einem Postfach. Du antwortest an einer Stelle, der Verlauf hängt am Kontakt.',
        f: ['E-Mail', 'SMS', 'WhatsApp', 'Instagram', 'Facebook', 'Live-Chat', 'Telefonie', 'Missed-Call-Textback', 'Mobile App'] },
      { name: 'Zahlungen & Verträge', img: 'onlineshop.png',
        d: 'Verkaufen, abrechnen und unterschreiben lassen — vom Warenkorb bis zur Signatur ohne Zusatztool.',
        f: ['Produkte', 'Warenkorb', 'Upsells', 'Abos', 'Rechnungen', 'Angebote', 'Verträge mit E-Signatur', 'Stripe', 'PayPal'] },
      { name: 'Kurse & Community', img: 'mitgliederbereich.png',
        d: 'Mitgliederbereiche, die beim Kauf automatisch freigeschaltet werden — inklusive Zertifikat und Feed.',
        f: ['Mitgliederbereiche', 'Kurse', 'Zertifikate', 'Community-Feed'] },
    ],
  },
  {
    id: 'skalieren', n: '03', title: 'Skalieren',
    lead: 'Was funktioniert, läuft automatisch weiter: Workflows, Kampagnen, Zahlen — und KI, die Arbeit übernimmt.',
    groups: [
      { name: 'Automationen', img: 'automation.png', tag: 'Kern',
        d: 'Wenn-Dann-Regeln über alle Module hinweg. Trigger aus Funnel, Shop, Kalender und CRM — ohne Zapier dazwischen.',
        f: ['Workflow-Builder', 'Trigger', 'Trigger Links', 'Webhooks', 'Schnittstellen'] },
      { name: 'E-Mail-Marketing', img: 'email.png',
        d: 'Broadcasts, Newsletter und Sequenzen an Segmente, die aus deinem CRM kommen statt aus einer CSV.',
        f: ['Kampagnen', 'Newsletter', 'Broadcasts', 'Segmente', 'Vorlagen'] },
      { name: 'Reporting & Analytics', img: 'seo.png',
        d: 'Sehen, was wirklich verkauft: von der Anzeige bis zum Abschluss in einer Attribution.',
        f: ['Dashboards', 'Funnel-Statistiken', 'Attribution', 'Call-Reporting', 'Ads-Reporting'] },
    ],
    ai: {
      name: 'KI-Tools', eyebrow: 'Eigener Bereich',
      title: 'KI-Tools: dein Team, das nie schläft',
      d: 'Anrufe annehmen, Anfragen beantworten, Seiten bauen. Vier Agenten mit eigener Detailseite — alle auf demselben Datenraum.',
      subs: [
        { n: 'Ask AI', d: 'Fragen zum Tool, direkt im Tool beantwortet.' },
        { n: 'Conversation AI', d: 'Antwortet und qualifiziert in Chat, DM und Mail.' },
        { n: 'Voice AI', d: 'Nimmt Anrufe an und bucht Termine.' },
        { n: 'AI Studio', d: 'Ganze Seiten und Funnels per Prompt.' },
      ],
    },
  },
];

const countFeats = (p) => p.groups.reduce((s, g) => s + g.f.length, 0) + (p.ai ? p.ai.subs.length : 0);

const Card = ({ g, alt }) => (
  <div className={`fu-card${g.wide ? ' fu-card--wide' : ''}`}>
    <div className="fu-card__top">
      <div className="fu-card__art"><img src={ILL + g.img} alt="" /></div>
      <div>
        <div className="fu-card__title">
          <a href={linkTo(g.name)}>{g.name}</a>
          {g.tag && <span className="fu-tag">{g.tag}</span>}
        </div>
        <p className="fu-card__d">{g.d}</p>
      </div>
    </div>
    <ul className="fu-feats">
      {g.f.map(f => (
        <li key={f}><a href={linkTo(f)} className={PAGES[f] ? '' : 'soft'}>{f}</a></li>
      ))}
    </ul>
    <a className="fu-card__link" href={linkTo(g.name)}>{g.name} ansehen <IArrow /></a>
  </div>
);

const AICard = ({ ai }) => (
  <div className="fu-ai">
    <div className="fu-ai__txt">
      <div className="fu-ai__eyebrow">{ai.eyebrow}</div>
      <h3>{ai.title}</h3>
      <p>{ai.d}</p>
      <a className="fu-ai__cta" href={linkTo('KI-Tools')}>Alle KI-Tools ansehen <IArrow /></a>
    </div>
    <div className="fu-ai__subs">
      {ai.subs.map(s => (
        <a key={s.n} className="fu-sub" href={linkTo(s.n)}>
          <span className="fu-sub__t">{s.n}<span className="fu-sub__d">{s.d}</span></span>
          <IArrow />
        </a>
      ))}
    </div>
  </div>
);

const Hero = () => (
  <section className="fu-hero">
    <div className="fu-hero__inner">
      <div>
        <span className="fu-eyebrow">Funktionen</span>
        <h1>Alles, was du brauchst — <em>sortiert nach dem, was du willst.</em></h1>
        <p className="fu-hero__lead">Drei Phasen, zwölf Bereiche, jede Funktion einen Klick entfernt. Kein Feature-Bingo, sondern die Reihenfolge, in der du wirklich arbeitest.</p>
        <div className="fu-hero__cta">
          <a href="#signup" className="btn btn--primary btn-lg">14 Tage kostenlos testen</a>
          <a href="preise.html" className="btn btn--ghost btn-lg">Preise ansehen</a>
        </div>
      </div>
      <div className="fu-jump">
        <div className="fu-jump__lbl">Direkt springen</div>
        {PHASES.map(p => (
          <a key={p.id} href={`#${p.id}`}>
            <span className="fu-jump__n">{p.n}</span>
            <span className="fu-jump__t">{p.title}</span>
            <span className="fu-jump__c">{countFeats(p)} Funktionen</span>
          </a>
        ))}
      </div>
    </div>
  </section>
);

const Bar = () => {
  const [active, setActive] = useState('leads');
  useEffect(() => {
    const fn = () => {
      let cur = PHASES[0].id;
      PHASES.forEach(p => {
        const el = document.getElementById(p.id);
        if (el && el.getBoundingClientRect().top <= 200) cur = p.id;
      });
      setActive(cur);
    };
    fn();
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  return (
    <div className="fu-bar">
      <div className="fu-bar__inner">
        <span className="fu-bar__lbl">Übersicht</span>
        {PHASES.map(p => (
          <a key={p.id} href={`#${p.id}`} className={active === p.id ? 'on' : ''}>{p.n} · {p.title}</a>
        ))}
        <a href={FALLBACK} style={{marginLeft:'auto'}}>Alle Funktionen als Liste</a>
      </div>
    </div>
  );
};

const Phase = ({ p, i }) => (
  <section className={`fu-sec${i % 2 ? ' fu-sec--alt' : ''}`} id={p.id} data-screen-label={p.title}>
    <div className="fu-sec__inner">
      <div className="fu-sec__head">
        <div>
          <span className="fu-sec__n">{p.n}</span>
          <h2>{p.title}</h2>
          <p>{p.lead}</p>
        </div>
        <div className="fu-sec__meta">
          {p.groups.length + (p.ai ? 1 : 0)} Bereiche<br />{countFeats(p)} Funktionen
        </div>
      </div>
      <div className="fu-grid">
        {p.groups.map(g => <Card key={g.name} g={g} />)}
        {p.ai && <AICard ai={p.ai} />}
      </div>
    </div>
  </section>
);
