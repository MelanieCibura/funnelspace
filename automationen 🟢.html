  { q:'Was passiert, wenn ein Schritt fehlschlägt?', a:'Der Durchlauf wird im Protokoll als Fehler markiert — mit Grund und Zeitstempel. Du bekommst eine Benachrichtigung, korrigierst den Schritt und lässt betroffene Kontakte einzeln oder in Bulk erneut durchlaufen.' },

  { q:'Ist automatisiertes Mailing DSGVO-konform?', a:'Ja. Double-Opt-In, protokollierte Einwilligungen mit Zeitstempel und Quelle, Abmelde-Handling in jeder Sequenz, automatisierte Lösch-Workflows. Hosting in deutschen Rechenzentren, AV-Vertrag inklusive.' },

        <div className="au-night__sub">Alles, was gelaufen ist, während niemand am Rechner saß</div>

const Builder = () => {
  const [active, setActive] = useState('optin');
  const t = TRIGGERS.find(x => x.k === active);
  return (
    <div className="au-build" id="builder">
      <div className="au-build__bar">
        <div className="au-build__dots"><span/><span/><span/></div>
        <div className="au-build__name">Neue Automation · Entwurf</div>
        <div className="au-build__state">Live-Vorschau</div>
      </div>
      <div className="au-build__body">
        <div className="au-build__panel">
          <div className="au-build__panel-lbl">Wähle einen Trigger</div>
          <div className="au-build__opts">
            {TRIGGERS.map(o => (
              <button key={o.k} className="au-trigger-btn" aria-pressed={o.k === active} onClick={() => setActive(o.k)}>
                {o.icon}
                <span><b>{o.name}</b><small>{o.sub}</small></span>
              </button>
            ))}
          </div>
          <p className="au-build__hint">So sieht der Ablauf im echten Editor aus: Schritte darunter hängen, Verzweigungen daneben, Testlauf mit einem echten Kontakt — dann aktivieren.</p>
        </div>
        <div className="au-build__canvas" key={active}>
          {t.steps.map((s, i) => (
            <React.Fragment key={i}>
              {i > 0 && <div className="au-connector" style={{animationDelay:`${i*110-55}ms`}} />}
              <div className={`au-step${s.variant ? ' au-step--' + s.variant : ''}`} style={{animationDelay:`${i*110}ms`}}>
                <div className="au-step__ico">{s.icon}</div>
                <div>
                  <div className="au-step__kind">{s.kind}</div>
                  <div className="au-step__label">{s.label}</div>
                </div>
              </div>
            </React.Fragment>
          ))}
          <p className="au-build__result">{t.result}</p>
        </div>
      </div>
    </div>
  );
};

const Node = ({ step, kind, title, lead, action, children }) => (
  <section className={`au-node${action ? ' au-node--action' : ''}`} data-step={step}>
    <span className="au-node__kind">{kind}</span>
    <h2>{title}</h2>
    {lead && <p className="au-node__lead">{lead}</p>}
    {children}
  </section>
);

const Flow = () => {
  const ref = useRef(null);
  const [pulse, setPulse] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const el = ref.current; if (!el) return;
      const r = el.getBoundingClientRect();
      const track = r.height - 120;
      const p = Math.min(Math.max((window.innerHeight * 0.45 - r.top) / track, 0), 1);
      setPulse(p * track);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive:true });
    window.addEventListener('resize', onScroll);
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); };
  }, []);
  const [open, setOpen] = useState(0);
  return (
    <div className="au-flow" ref={ref}>
      <div className="au-flow__pulse" style={{'--pulse': pulse + 'px'}} />

      <div className="au-triggercard">
        <div className="au-triggercard__ico"><IMoon /></div>
        <div>
          <div className="au-triggercard__kind">Trigger</div>
          <div className="au-triggercard__label">Du machst den Laptop zu</div>
        </div>
        <div className="au-triggercard__time">22:40 Uhr</div>
      </div>

      <Node step="1" kind="Aktion · 23:14 Uhr" action
        title={<>Während du schläfst, passiert <em>trotzdem</em> das Richtige.</>}
        lead="Ein Kauf um kurz nach elf, eine Buchung um eins, ein abgebrochener Warenkorb um vier: jedes Event löst sofort den Ablauf aus, den du einmal gebaut hast. Kein Nachziehen am nächsten Morgen.">
        <NightLog />
      </Node>

      <Node step="2" kind="Bedingung"
        title={<>Bau dir einen Ablauf. <em>Jetzt gleich.</em></>}
        lead="Wähle links einen Trigger — rechts entsteht die Automation, Schritt für Schritt. Genau so arbeitest du auch im Editor.">
        <Builder />
      </Node>

      <Node step="3" kind="Bausteine" action
        title={<>42 Bausteine. Alle sprechen dieselbe Sprache.</>}
        lead="Weil alle Module dieselbe Datenbank nutzen, gibt es nichts zu verbinden und nichts zu mappen. Jedes Feld ist schon da.">
        <div className="au-palette">
          {PALETTE.map(p => (
            <div key={p.t} className="au-pal">
              <div className="au-pal__h">{p.i}<span>{p.t}</span><i>{p.n}</i></div>
              <ul>{p.items.map(x => <li key={x}>{x}</li>)}</ul>
            </div>
          ))}
        </div>
      </Node>

      <Node step="4" kind="Vorlage laden"
        title={<>Oder starte mit einem Ablauf, der <em>schon läuft</em>.</>}
        lead="30+ Vorlagen aus der Praxis. Laden, Texte anpassen, aktivieren — meist in unter 20 Minuten.">
        <div className="au-tpl">
          {TEMPLATES.map(t => (
            <article key={t.t} className="au-tpl__card">
              <span className={`au-tpl__tag${t.lime ? ' au-tpl__tag--lime' : ''}`}>{t.tag}</span>
              <h3>{t.t}</h3>
              <div className="au-mini">
                {t.steps.map((s,i) => <div key={i} className={`au-mini__s${i===0?' au-mini__s--lime':''}`}>{s}</div>)}
              </div>
              <div className="au-tpl__foot"><span>{t.foot[0]}</span><span>{t.foot[1]}</span></div>
            </article>
          ))}
        </div>
      </Node>

      <Node step="5" kind="Vergleich"
        title={<>Automation gehört <em>ins</em> Tool, nicht daneben.</>}
        lead="Der Unterschied zwischen einer Automation im System und einer verklebten Kette aus externen Zaps.">
        <div className="au-vs">
          <div className="au-vs__card">
            <div className="au-vs__lbl">Externe Automatisierung</div>
            <ul>
              <li><IX />Task-Kontingent — jeder Durchlauf kostet</li>
              <li><IX />Verzögerung von Minuten bis Stunden</li>
              <li><IX />Stille Ausfälle, wenn ein Zap abbricht</li>
              <li><IX />Kontaktdaten laufen durch ein drittes System</li>
              <li><IX />Jede Verbindung muss erst gemappt werden</li>
            </ul>
          </div>
          <div className="au-vs__card au-vs__card--good">
            <div className="au-vs__lbl">Funnelspace</div>
            <ul>
              <li><ICheck />Unbegrenzte Durchläufe in jedem Plan</li>
              <li><ICheck />Events feuern in Echtzeit, im Schnitt 0,4 s</li>
              <li><ICheck />Fehler landen im Protokoll — mit Benachrichtigung</li>
              <li><ICheck />Daten bleiben in deutschen Rechenzentren</li>
              <li><ICheck />Alle Felder sind schon da, nichts zu mappen</li>
            </ul>
          </div>
        </div>
        <div className="au-quote">
          <div>
            <blockquote>„Ich hatte 14 Zaps, die reihenweise still gestorben sind. Jetzt läuft alles an einer Stelle — und im Protokoll sehe ich sofort, was passiert ist."</blockquote>

              <div className="au-quote__av">MS</div>
              <div><div className="au-quote__n">Miriam Sattler</div><div className="au-quote__r">Business-Coach · Frankfurt</div></div>
            </div>
          </div>
          <div className="au-quote__stat">
            <div className="au-quote__stat-n">6 Std.</div>
            <div className="au-quote__stat-l">weniger Handarbeit pro Woche</div>
          </div>
        </div>
      </Node>

      <Node step="6" kind="Offene Fragen" action title={<>Bevor du baust.</>}>
        <div className="au-faq">
          {FAQS.map((f,i) => (
            <div key={i} className={`au-faq__item${open===i?' open':''}`}>

              <div className="au-faq__body">{f.a}</div>
            </div>
          ))}
        </div>
      </Node>
    </div>
  );
};
