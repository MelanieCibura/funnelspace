.fh{padding:80px 40px 56px;position:relative;overflow:hidden}
.fh__inner{max-width:1280px;margin:0 auto}
.fh__eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:18px}
.fh h1{font-family:var(--font-display);font-size:clamp(42px,5vw,68px);font-weight:700;line-height:1.04;letter-spacing:-.03em;text-wrap:balance}
.fh h1 em{font-style:normal;background:var(--fs-lime);color:var(--fs-lime-ink);padding:0 8px;border-radius:6px}
.fh__lead{margin-top:20px;font-size:19px;line-height:1.55;color:var(--fg-2);max-width:540px}
.fh__cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.fh__nums{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border-1);border:1px solid var(--border-1);border-radius:var(--radius-lg);overflow:hidden;margin-top:40px;max-width:620px}
.fh__num{background:var(--fs-white);padding:20px 22px}
.fh__num b{display:block;font-family:var(--font-display);font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1}
.fh__num span{display:block;margin-top:6px;font-size:13px;color:var(--fg-3);line-height:1.35}
.fh__band{max-width:1280px;margin:56px auto 0;background:var(--fs-white);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:10px 10px;border:1px solid var(--border-1);border-radius:var(--radius-xl);padding:20px 24px;overflow:hidden}

.fbar{position:sticky;top:72px;z-index:60;background:rgba(250,250,247,.9);backdrop-filter:blur(10px);border-top:1px solid var(--border-1);border-bottom:1px solid var(--border-1);padding:14px 40px}
.fbar__inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.fbar__chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{border:1px solid var(--border-1);background:var(--fs-white);color:var(--fg-2);font-family:var(--font-sans);font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--radius-pill);cursor:pointer;transition:all var(--dur-fast) var(--ease-out)}
.chip:hover{border-color:var(--fs-ink);color:var(--fs-ink)}
.chip--on{background:var(--fs-ink);border-color:var(--fs-ink);color:#fff}
.fbar__search{display:flex;align-items:center;gap:8px;background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-pill);padding:8px 14px;min-width:240px}
.fbar__search input{border:none;outline:none;background:none;font-family:var(--font-sans);font-size:14px;color:var(--fs-ink);width:100%}
.fbar__search input::placeholder{color:var(--fg-3)}
.fbar__search svg{width:15px;height:15px;color:var(--fg-3);flex-shrink:0}
.fsec{padding:80px 40px}
.fsec--alt{background:var(--fs-white)}
.fsec__inner{max-width:1280px;margin:0 auto}
.fsec__head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin-bottom:36px;flex-wrap:wrap}
.fsec__head h2{font-family:var(--font-display);font-size:clamp(28px,3vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.fsec__head p{margin-top:10px;font-size:16px;color:var(--fg-2);max-width:560px;line-height:1.55}
.fsec__count{font-family:var(--font-mono,monospace);font-size:12px;color:var(--fg-3);letter-spacing:.04em;white-space:nowrap}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.fcard{display:flex;flex-direction:column;gap:14px;background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:24px;text-decoration:none;color:inherit;transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out),border-color var(--dur-med) var(--ease-out)}
.fsec--alt .fcard{background:var(--fs-paper)}
.fcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--fs-gray-300)}
.fcard__art{width:100%;aspect-ratio:16/10;background:var(--fs-paper);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:8px 8px;border-radius:var(--radius-md);display:grid;place-items:center;overflow:hidden}
.fsec--alt .fcard__art{background-color:var(--fs-white)}
.fcard__art img{max-height:78%;max-width:70%;object-fit:contain}
.fcard__top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fcard h3{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.ftag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:var(--radius-pill);background:var(--fs-lime);color:var(--fs-lime-ink)}
.ftag--soon{background:var(--fs-gray-100);color:var(--fs-ink-soft)}
.fcard p{font-size:14px;line-height:1.55;color:var(--fg-2)}
.fcard ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.fcard li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--fg-2);line-height:1.45}
.fcard li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fs-lime-deep);flex-shrink:0;margin-top:6px}
.fcard__link{margin-top:auto;padding-top:4px;font-size:13px;font-weight:700;color:var(--fs-ink);display:inline-flex;align-items:center;gap:6px;transition:gap var(--dur-fast) var(--ease-out)}
.fcard:hover .fcard__link{gap:10px}
.fcard__link--muted{color:var(--fg-3);font-weight:600}
.fempty{padding:64px 0;text-align:center;color:var(--fg-3);font-size:16px}
.fstack{padding:88px 40px;background:var(--fs-ink);position:relative;overflow:hidden}
.fstack::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.06) 1px,transparent 1.2px);background-size:8px 8px}
.fstack__inner{max-width:1280px;margin:0 auto;position:relative;display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:center}
.fstack h2{font-family:var(--font-display);font-size:clamp(30px,3.2vw,46px);font-weight:700;letter-spacing:-.03em;color:#fff;line-height:1.08;text-wrap:balance}

.fstack__btns{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.frow{display:grid;grid-template-columns:1.1fr 1fr auto;gap:16px;align-items:center;padding:14px 18px;border-radius:var(--radius-md);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.frows{display:flex;flex-direction:column;gap:8px}
.frow__name{font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff}
.frow__old{font-size:13px;color:rgba(255,255,255,.45);text-decoration:line-through;text-decoration-color:rgba(215,240,120,.5);text-decoration-thickness:2px}
.frow__price{font-family:var(--font-display);font-weight:700;font-size:14px;color:rgba(255,255,255,.55);white-space:nowrap}

.frow--sum .frow__name{color:var(--fs-lime-ink)}
.frow--sum .frow__old{color:rgba(47,58,0,.7);text-decoration:none}
.frow--sum .frow__price{color:var(--fs-lime-ink);font-size:17px}
.fmatrix{border:1px solid var(--border-1);border-radius:var(--radius-lg);overflow:hidden;background:var(--fs-white)}
.fmatrix__row{display:grid;grid-template-columns:1.6fr repeat(3,minmax(90px,.6fr));gap:0;border-top:1px solid var(--border-1)}

.fmatrix__row>div:first-child{justify-content:flex-start;color:var(--fs-ink);font-weight:600}
.fmatrix__row--group>div:first-child{font-family:var(--font-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);font-weight:700}
.fmatrix__row--group{background:var(--fs-paper)}
.fdot{width:18px;height:18px;border-radius:50%;background:var(--fs-lime);display:grid;place-items:center;color:var(--fs-lime-ink)}

.fdash{color:var(--fs-gray-300);font-weight:700}

.fcta h2{font-family:var(--font-display);font-size:clamp(32px,3.6vw,50px);font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.fcta h2 em{font-style:normal;background:var(--fs-lime);color:var(--fs-lime-ink);padding:0 8px;border-radius:6px}

a{color:var(--fs-ink)}
a:hover{color:var(--fs-lime-ink)}

@media(max-width:768px){.fh{padding:56px 22px 40px}.fbar{padding:12px 22px;top:0}.fsec{padding:60px 22px}.fstack{padding:64px 22px}.fcta{padding:64px 22px}.fgrid{grid-template-columns:1fr}.fh__nums{grid-template-columns:1fr}.fmatrix__row{grid-template-columns:1.4fr repeat(3,1fr)}.fmatrix__row>div{padding:12px;font-size:13px}.nav__links{display:none}}

  <div className="fbar" id="uebersicht">
    <div className="fbar__inner">
      <div className="fbar__chips">
        <button className={`chip${cat==='alle'?' chip--on':''}`} onClick={()=>setCat('alle')}>Alle · {FEATURES.length}</button>
        {CATS.map(c => (
          <button key={c.k} className={`chip${cat===c.k?' chip--on':''}`} onClick={()=>setCat(c.k)}>{c.label}</button>
        ))}
      </div>
      <label className="fbar__search">
        <ISearch />
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Funktion suchen …" />
      </label>
    </div>
  </div>
);

const Card = ({ f }) => (
  <a className="fcard" href={f.href}>
    <div className="fcard__art"><img src={f.img} alt="" /></div>
    <div className="fcard__top">
      <h3>{f.n}</h3>
      {f.tag==='Beta' ? <span className="ftag ftag--soon">Beta</span> : null}
    </div>
    <p>{f.d}</p>
    <ul>{f.b.map(x => <li key={x}>{x}</li>)}</ul>
    <span className={`fcard__link${f.href==='#'?' fcard__link--muted':''}`}>{f.href==='#'?'Details folgen':'Mehr erfahren'} <IArrow /></span>
  </a>
);

const Sections = ({ cat, q }) => {
  const list = useMemo(() => {
    const needle = q.trim().toLowerCase();
    return FEATURES.filter(f =>
      (cat==='alle' || f.c===cat) &&
      (!needle || (f.n+' '+f.d+' '+f.b.join(' ')).toLowerCase().includes(needle))
    );
  }, [cat, q]);

  if (!list.length) return (
    <section className="fsec"><div className="fsec__inner"><div className="fempty">Keine Funktion zu „{q}" gefunden. Schreib uns kurz — vielleicht bauen wir sie.</div></div></section>
  );

  const groups = CATS.filter(c => list.some(f => f.c===c.k));
  return groups.map((c, i) => {
    const items = list.filter(f => f.c===c.k);
    return (
      <section key={c.k} className={`fsec${i%2?' fsec--alt':''}`}>
        <div className="fsec__inner">
          <div className="fsec__head">
            <div>
              <h2>{c.title}</h2>
              <p>{c.sub}</p>
            </div>
            <div className="fsec__count">{String(items.length).padStart(2,'0')} Funktionen</div>
          </div>
          <div className="fgrid">{items.map(f => <Card key={f.n} f={f} />)}</div>
        </div>
      </section>
    );
  });
};

const Stack = () => (
  <section className="fstack">
    <div className="fstack__inner">
      <div>
        <h2>Sechs Abos. Oder <em>eins</em>.</h2>
        <p>Die meisten Funnelspace-Kund:innen kündigen im ersten Monat drei bis fünf Tools. Nicht, weil wir billiger sind — sondern weil die Daten endlich zusammenhängen.</p>
        <div className="fstack__btns">
          <a href="Tarifrechner.html" className="btn btn--primary btn-lg">Ersparnis berechnen</a>
          <a href="umzugsservice.html" className="btn btn--ghost btn-lg" style={{borderColor:'rgba(255,255,255,.25)',color:'rgba(255,255,255,.85)'}}>Umzug ansehen</a>
        </div>
      </div>
      <div className="frows">
        {REPLACES.map(r => (
          <div key={r.n} className="frow">
            <span className="frow__name">{r.n}</span>
            <span className="frow__old">{r.old}</span>
            <span className="frow__price">{r.p} / Monat</span>
          </div>
        ))}
        <div className="frow frow--sum">
          <span className="frow__name">Alles zusammen in Funnelspace</span>
          <span className="frow__old">6 Tools, 1 Login</span>
          <span className="frow__price">ab 79 € / Monat</span>
        </div>
      </div>
    </div>
  </section>
);

const Matrix = () => (
  <section className="fsec fsec--alt">
    <div className="fsec__inner">
      <div className="fsec__head">
        <div>
          <h2>Was in welchem Plan steckt.</h2>
          <p>Keine Paywall auf Grundfunktionen. Die Pläne unterscheiden sich in Volumen, Team-Größe und den fortgeschrittenen Automationen.</p>
        </div>
        <a href="Preise.html" className="btn btn--ghost">Alle Preise ansehen</a>
      </div>
      <div className="fmatrix">
        <div className="fmatrix__row fmatrix__row--head">
          <div>Funktion</div><div>Starter</div><div>Business</div><div>Scale</div>
        </div>
        {MATRIX.map((r,i) => r[0]==='group' ? (
          <div key={i} className="fmatrix__row fmatrix__row--group"><div>{r[1]}</div><div/><div/><div/></div>
        ) : (
          <div key={i} className="fmatrix__row">
            <div>{r[1]}</div>
            {[r[2],r[3],r[4]].map((v,j) => (
              <div key={j}>{v ? <span className="fdot"><ICheck /></span> : <span className="fdash">—</span>}</div>
            ))}
          </div>
        ))}
      </div>
    </div>
  </section>
);

const FinalCTA = () => (
  <section className="fcta">
    <div className="fcta__inner">
      <h2>Such dir aus, womit du <em>anfängst</em>.</h2>
      <p>Alles ist ab dem ersten Tag freigeschaltet. 14 Tage kostenlos, keine Kreditkarte.</p>
      <div className="fcta__btns">
        <a href="#signup" className="btn btn--primary btn-lg">Jetzt kostenlos starten</a>
        <a href="#demo" className="btn btn--ghost btn-lg">Demo ansehen</a>
      </div>
    </div>
  </section>
);

const App = () => {
  const [cat, setCat] = useState('alle');
  const [q, setQ] = useState('');
  return (
    <>
      <Nav />
      <main>
        <Hero />
        <Bar cat={cat} setCat={setCat} q={q} setQ={setQ} />
        <Sections cat={cat} q={q} />
        <Stack />
        <Matrix />
      </main>
      <FinalCTA />
      <Footer />
    </>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
