const Demo = () => {
  const [k, setK] = useState('funnel');
  const [n, setN] = useState(0);
  const run = RUNS.find(r => r.k === k);
  useEffect(() => {
    setN(0);
    const ids = run.steps.map((_, i) => setTimeout(() => setN(i + 1), 650 + i * 900));
    return () => ids.forEach(clearTimeout);
  }, [k]);
  const done = n >= run.steps.length;
  return (
    <div className="aa-panel">
      <div className="aa-panel__bar">
        <div className="aa-panel__dots"><span/><span/><span/></div>
        <div className="aa-panel__name">Ask AI · dein Workspace</div>
        <div className="aa-panel__state">{done ? 'fertig' : <>Läuft <i/></>}</div>
      </div>
      <div className="aa-panel__body">
        <div className="aa-prompts">
          {RUNS.map(r => (
            <button key={r.k} aria-pressed={r.k === k} onClick={() => setK(r.k)}>
              {r.k === 'funnel' ? 'Funnel bauen' : r.k === 'crm' ? 'Leads nachfassen' : 'Wettbewerb prüfen'}

          <div className="aa-ask__txt">{run.q}</div>

              <div><div className="aa-step__t">{s.t}</div><div className="aa-step__s">{s.s}</div></div>
              <div className="aa-step__tag">{s.tag}</div>
            </div>
          ))}
          {done && (
            <div className="aa-result">
              <div><div className="aa-result__n">{run.res.n}</div><div className="aa-result__d">{run.res.d}</div></div>
              <div className="aa-result__btn">{run.res.b}</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

  { q:'Kann sie etwas veröffentlichen oder verschicken, ohne dass ich es merke?', a:'Nur wenn du es erlaubst. Standardmäßig endet jede Aufgabe im Entwurf und wartet auf deine Freigabe. Für wiederkehrende Abläufe kannst du einzelne Aktionen dauerhaft freigeben.' },
