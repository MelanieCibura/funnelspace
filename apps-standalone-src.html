<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funnelspace Apps — Desktop &amp; Mobile · Dein Business überall dabei</title>
  <meta name="description" content="Lade die Funnelspace-App für Mac, Windows, Linux, iOS und Android. Alle Funktionen, ein Account — nahtlos synchronisiert." />

  <!-- Resources referenced as strings inside JSX (not discoverable as HTML attributes) -->
  <meta name="ext-resource-dependency" content="assets/logos/funnelspace-mark.svg" data-resource-id="fsMark" />
  <meta name="ext-resource-dependency" content="assets/logos/funnelspace-wordmark.svg" data-resource-id="fsWordmark" />

  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="apps.css" />

  <template id="__bundler_thumbnail" data-bg-color="#FAFAF7">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#FAFAF7"/>
      <!-- desktop window -->
      <rect x="250" y="210" width="520" height="380" rx="26" fill="#FFFFFF" stroke="#2A2D33" stroke-width="6"/>
      <rect x="250" y="210" width="520" height="64" rx="26" fill="#F1F2F4"/>
      <circle cx="296" cy="242" r="9" fill="#E5675B"/>
      <circle cx="324" cy="242" r="9" fill="#E1A53F"/>
      <circle cx="352" cy="242" r="9" fill="#6CB04A"/>
      <rect x="290" y="306" width="150" height="252" rx="14" fill="#F1F2F4"/>
      <rect x="470" y="306" width="270" height="70" rx="12" fill="#2A2D33"/>
      <rect x="470" y="392" width="124" height="64" rx="12" fill="#D7F078"/>
      <rect x="610" y="392" width="130" height="64" rx="12" fill="#F1F2F4"/>
      <rect x="470" y="472" width="270" height="86" rx="12" fill="#F1F2F4"/>
      <!-- phone -->
      <rect x="724" y="300" width="190" height="360" rx="40" fill="#2A2D33"/>
      <rect x="740" y="318" width="158" height="324" rx="28" fill="#FAFAF7"/>
      <rect x="788" y="334" width="62" height="14" rx="7" fill="#2A2D33"/>
      <rect x="762" y="382" width="114" height="44" rx="12" fill="#D7F078"/>
      <rect x="762" y="440" width="114" height="120" rx="12" fill="#FFFFFF" stroke="#E6E8EB" stroke-width="3"/>
      <!-- accent dot -->
      <circle cx="600" cy="150" r="34" fill="#D7F078"/>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="Apps.jsx"></script>

  <script type="text/babel">
    const AppsCta = () => (
      <section className="cta-band">
        <h2>Bereit für Funnelspace auf allen Geräten?</h2>
        <p>Starte jetzt deine kostenlose Demo und nutze Funnelspace auf Desktop, Tablet und Smartphone.</p>
        <div className="cta-band__btns">
          <a href="#signup" className="btn btn--ink btn-lg">14 Tage kostenlos testen</a>
          <a href="#desktop" className="btn btn--ghost btn-lg" style={{borderColor:'var(--fs-lime-ink)', color:'var(--fs-lime-ink)'}}>Zu den Downloads</a>
        </div>
      </section>
    );

    const App = () => (
      <>
        <Nav />
        <main>
          <AppsHero />
          <DesktopApp />
          <MobileApp />
          <SyncBand />
        </main>
        <AppsCta />
        <Footer />
      </>
    );
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
