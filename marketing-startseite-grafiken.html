<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funnelspace — Alles, was du für dein Online-Business brauchst.</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="marketing-app.css">
  <style>
    /* Page-scoped overrides for the graphics version */
    .fs-hero__art {
      aspect-ratio: 7496 / 5574; width: 100%; min-height: 420px;
      background-image: url('assets/dashboard-funnelspace.png');
      background-size: contain; background-repeat: no-repeat; background-position: center;
      border: 0; border-radius: 0;
    }
    .fs-toolstack { padding-bottom: 64px; }
    .fs-toolstack__inner { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .fs-toolstack__head { margin-bottom: 24px; }
    .fs-toolstack__head p { margin: 0 auto; }
    .fs-toolstack__art { width: 100%; max-width: 720px; }
    .fs-toolstack__art img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="MarketingNav.jsx"></script>
  <script type="text/babel" src="MarketingHero.jsx"></script>
  <script type="text/babel" src="MarketingToolStack.jsx"></script>
  <script type="text/babel" src="MarketingProductGrid.jsx"></script>
  <script type="text/babel" src="MarketingFeatureRow.jsx"></script>
  <script type="text/babel" src="MarketingPricing.jsx"></script>
  <script type="text/babel" src="MarketingTestimonials.jsx"></script>
  <script type="text/babel" src="MarketingFooter.jsx"></script>

  <script type="text/babel">
    const App = () => (
      <>
        <Nav />
        <Hero />
        <ToolStack />
        <ProductGrid />
        <Features />
        <Pricing />
        <Testimonials />
        <CtaBand />
        <Footer />
      </>
    );
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
