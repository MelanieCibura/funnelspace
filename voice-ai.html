<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice AI — Funnelspace</title>
<meta name="description" content="Deine Voice AI nimmt Anrufe mit natürlicher Stimme an, qualifiziert Anrufer:innen, bucht Termine in deinen Kalender und legt alles im CRM ab. Auf Deutsch, rund um die Uhr." />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="site.css" />
<style>
/* ── Voice AI Feature Page ─────────────────────────────── */
.va-hero{background:var(--fs-ink);color:#fff;padding:96px 40px 88px;position:relative;overflow:hidden}
.va-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,0.06) 1px,transparent 1.2px);background-size:8px 8px;pointer-events:none}
.va-hero__inner{max-width:1280px;margin:0 auto;position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:72px;align-items:center}
.va-hero__eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fs-lime);background:rgba(215,240,120,0.1);border:1px solid rgba(215,240,120,0.3);padding:6px 12px;border-radius:var(--radius-pill);margin-bottom:22px}
.va-hero__eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fs-lime)}
.va-hero h1{font-family:var(--font-display);font-size:clamp(44px,5.2vw,72px);font-weight:700;line-height:1.04;letter-spacing:-.03em;text-wrap:balance;color:#fff}
.va-hero h1 em{font-style:normal;color:var(--fs-lime)}
.va-hero__lead{margin-top:22px;font-size:19px;line-height:1.55;color:rgba(255,255,255,0.7);max-width:520px}
.va-hero__cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.va-hero__proof{margin-top:24px;display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,0.5)}
.va-hero__proof span{display:flex;align-items:center;gap:6px}
.va-hero__proof > span::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--fs-lime)}
.va-hero__visual{position:relative;background:var(--fs-paper);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:10px 10px;border-radius:var(--radius-xl);padding:24px;aspect-ratio:1/0.95;display:grid;place-items:center;box-shadow:0 40px 80px -20px rgba(0,0,0,0.4)}
.va-hero__visual img{max-height:82%;max-width:82%;object-fit:contain}
.va-hero__badge{position:absolute;background:#fff;color:var(--fs-ink);border-radius:var(--radius-lg);padding:12px 16px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px}
.va-hero__badge--tl{top:24px;left:-24px}
.va-hero__badge--br{bottom:20px;right:-20px}
.va-hero__badge-dot{width:32px;height:32px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;font-weight:700;font-family:var(--font-display);font-size:13px}
.va-hero__badge-label{font-size:11px;color:var(--fg-3);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.va-hero__badge-val{font-size:15px;font-weight:700;font-family:var(--font-display);margin-top:2px}
.va-replaces{background:var(--fs-ink);background-image:linear-gradient(rgba(255,255,255,0.04),rgba(255,255,255,0.04));border-top:1px solid rgba(255,255,255,0.08);padding:22px 40px}
.va-replaces__inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.va-replaces__label{font-size:12px;color:rgba(255,255,255,0.4);font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.va-replaces__items{display:flex;gap:28px;flex-wrap:wrap}
.va-replaces__item{font-family:var(--font-display);font-weight:700;font-size:16px;color:rgba(255,255,255,0.4);letter-spacing:-.01em;text-decoration:line-through;text-decoration-color:rgba(215,240,120,0.5);text-decoration-thickness:2px}
/* Sections */
.va-sec{padding:104px 40px}
.va-sec--alt{background:var(--fs-white)}
.va-sec__inner{max-width:1280px;margin:0 auto}
.va-sec__head{max-width:720px;margin:0 auto 64px;text-align:center}
.va-eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
.va-sec__head h2{font-family:var(--font-display);font-size:clamp(34px,3.6vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.va-sec__head h2 em{font-style:normal;background:var(--fs-lime);color:var(--fs-lime-ink);padding:0 8px;border-radius:6px}
.va-sec__head p{margin-top:16px;font-size:18px;color:var(--fg-2);line-height:1.55}
/* Benefits */
.va-benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border-1);border:1px solid var(--border-1);border-radius:var(--radius-lg);overflow:hidden}
.va-benefit{background:var(--fs-white);padding:36px 32px;display:flex;flex-direction:column;gap:14px;transition:background var(--dur-med) var(--ease-out)}
.va-benefit:hover{background:var(--fs-paper)}
.va-benefit__icon{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;flex-shrink:0}
.va-benefit__icon svg{width:22px;height:22px}
.va-benefit h3{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.va-benefit p{font-size:15px;color:var(--fg-2);line-height:1.55}
/* Feature rows */
.va-feat{display:grid;grid-template-columns:1fr 1.15fr;gap:80px;align-items:center;padding:88px 0;border-top:1px solid var(--border-1)}
.va-feat:first-of-type{border-top:none;padding-top:0}
.va-feat--flip .va-feat__media{order:-1}
.va-feat__eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
.va-feat h3{font-family:var(--font-display);font-size:clamp(30px,3vw,42px);font-weight:700;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.va-feat__body{margin-top:16px;font-size:17px;color:var(--fg-2);line-height:1.55}
.va-feat ul{list-style:none;padding:0;margin-top:22px;display:flex;flex-direction:column;gap:12px}
.va-feat li{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--fg-2);line-height:1.5}
.va-feat li svg{width:18px;height:18px;flex-shrink:0;margin-top:3px;color:var(--fs-lime-deep)}
.va-feat__media{background:var(--fs-paper);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:10px 10px;border-radius:var(--radius-xl);padding:28px;border:1px solid var(--border-1);aspect-ratio:5/4;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
/* ── Mockup shell ─────────────────────────────────────── */
.mk{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border-1);width:100%;height:100%;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-md);overflow:hidden}
.mk__head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--border-1)}
.mk__title{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:-.01em}
.mk__sub{font-size:9px;color:var(--fg-3);margin-top:2px}
.mk__chip{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--fs-gray-100);color:var(--fs-ink-soft);white-space:nowrap}
.mk__chip--live{background:var(--fs-lime);color:var(--fs-lime-ink);display:inline-flex;align-items:center;gap:5px}
.mk__chip--live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fs-lime-ink);animation:va-pulse 1.6s var(--ease-in-out) infinite}
@keyframes va-pulse{0%,100%{opacity:1}50%{opacity:.25}}
/* Live call mockup */
.mk-call__wave{display:flex;align-items:flex-end;gap:3px;height:34px;padding:0 2px}
.mk-call__wave i{flex:1;background:var(--fs-gray-300);border-radius:2px;animation:va-bar 1.1s var(--ease-in-out) infinite}
.mk-call__wave i:nth-child(3n){background:var(--fs-lime-deep)}
@keyframes va-bar{0%,100%{height:18%}50%{height:92%}}
.mk-chat{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.mk-msg{max-width:86%;padding:8px 10px;border-radius:10px;font-size:11px;line-height:1.4}
.mk-msg--ai{background:var(--fs-ink);color:#fff;border-bottom-left-radius:4px;align-self:flex-start}
.mk-msg--caller{background:var(--fs-gray-100);color:var(--fs-ink);border-bottom-right-radius:4px;align-self:flex-end}
.mk-msg__who{font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-bottom:3px}
.mk-call__done{display:flex;align-items:center;gap:8px;background:var(--fs-lime);color:var(--fs-lime-ink);border-radius:10px;padding:8px 10px}
.mk-call__done svg{width:14px;height:14px;flex-shrink:0}
.mk-call__done-t{font-size:11px;font-weight:700;line-height:1.3}
.mk-call__done-s{font-size:9px;opacity:.75}
/* Agent setup mockup */
.mk-set{display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}
.mk-field{border:1px solid var(--border-1);border-radius:8px;padding:8px 10px}
.mk-field__lbl{font-size:8px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.mk-field__val{font-size:11px;color:var(--fs-ink);margin-top:4px;line-height:1.35}
.mk-pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.mk-pill{font-size:9px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--fs-gray-100);color:var(--fs-ink-soft)}
.mk-pill--on{background:var(--fs-ink);color:#fff}
.mk-pill--lime{background:var(--fs-lime);color:var(--fs-lime-ink)}
.mk-qs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.mk-q{display:flex;gap:8px;align-items:flex-start;font-size:10.5px;line-height:1.35;color:var(--fs-ink)}
.mk-q__n{width:15px;height:15px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);font-size:8px;font-weight:700;display:grid;place-items:center;flex-shrink:0;margin-top:1px}
.mk-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:8px;background:var(--fs-paper)}
.mk-toggle__t{font-size:10.5px;font-weight:600;color:var(--fs-ink)}
.mk-toggle__s{width:26px;height:15px;border-radius:999px;background:var(--fs-lime);position:relative;flex-shrink:0}
.mk-toggle__s::after{content:"";position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;background:#fff}
/* Handoff mockup */
.mk-sum{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.mk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mk-stat{background:var(--fs-paper);border-radius:8px;padding:8px}
.mk-stat__n{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:-.02em;color:var(--fs-ink)}
.mk-stat__l{font-size:8px;color:var(--fg-3);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.mk-note{border:1px solid var(--border-1);border-radius:8px;padding:9px 10px}
.mk-note__l{font-size:8px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);margin-bottom:4px}
.mk-note__t{font-size:10.5px;line-height:1.45;color:var(--fs-ink)}
.mk-tl{display:flex;flex-direction:column;gap:8px}
.mk-tl__label{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.mk-tl__item{display:flex;gap:9px;align-items:flex-start}
.mk-tl__dot{width:21px;height:21px;border-radius:50%;flex-shrink:0;background:var(--fs-gray-100);display:grid;place-items:center}
.mk-tl__dot svg{width:11px;height:11px;color:var(--fs-ink-soft)}
.mk-tl__dot--lime{background:var(--fs-lime)}
.mk-tl__dot--lime svg{color:var(--fs-lime-ink)}
.mk-tl__text{font-size:10.5px;line-height:1.35;color:var(--fs-ink)}
.mk-tl__text b{font-weight:700}
.mk-tl__time{font-size:9px;color:var(--fg-3);margin-top:1px}
/* Use cases */
.va-cases{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.va-case{background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:28px;display:flex;gap:18px;align-items:flex-start;transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out)}
.va-case:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.va-case__num{font-family:var(--font-display);font-weight:700;font-size:15px;width:36px;height:36px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;flex-shrink:0;color:var(--fs-ink)}
.va-case h4{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.01em}
.va-case p{font-size:14.5px;color:var(--fg-2);line-height:1.55;margin-top:8px}
/* Integrations */
.va-int{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.va-int__card{background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:28px 24px;display:flex;flex-direction:column;gap:12px;transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out)}
.va-int__card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.va-int__art{width:100%;aspect-ratio:16/10;background:var(--fs-paper);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:8px 8px;border-radius:var(--radius-md);display:grid;place-items:center;overflow:hidden}
.va-int__art img{max-height:80%;max-width:80%;object-fit:contain}
.va-int__card h4{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.va-int__card p{font-size:13px;color:var(--fg-2);line-height:1.5}
.va-int__link{margin-top:auto;font-size:13px;font-weight:700;color:var(--fs-ink);display:inline-flex;align-items:center;gap:4px;text-decoration:none;transition:gap var(--dur-fast) var(--ease-out)}
.va-int__link:hover{gap:8px}
/* Testimonials */
.va-testi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.va-testi{background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:18px}
.va-testi--dark{background:var(--fs-ink);border-color:var(--fs-ink)}
.va-testi--lime{background:var(--fs-lime);border-color:var(--fs-lime)}
.va-testi__stars{color:var(--fs-lime-deep);font-size:15px;letter-spacing:2px}
.va-testi--dark .va-testi__stars{color:var(--fs-lime)}
.va-testi--lime .va-testi__stars{color:var(--fs-lime-ink)}
.va-testi blockquote{font-size:17px;line-height:1.5;flex:1;font-family:var(--font-display);font-weight:500;letter-spacing:-.01em;border:none;padding:0;margin:0;color:var(--fg-1)}
.va-testi--dark blockquote{color:#fff}
.va-testi--lime blockquote{color:var(--fs-lime-ink)}
.va-testi__stat{display:flex;align-items:baseline;gap:8px;padding-top:16px;border-top:1px solid var(--border-1)}
.va-testi--dark .va-testi__stat{border-top-color:rgba(255,255,255,0.15)}
.va-testi--lime .va-testi__stat{border-top-color:rgba(47,58,0,0.15)}
.va-testi__stat-num{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.02em}
.va-testi--dark .va-testi__stat-num{color:var(--fs-lime)}
.va-testi__stat-lbl{font-size:12px;color:var(--fg-3);line-height:1.3}
.va-testi--dark .va-testi__stat-lbl{color:rgba(255,255,255,0.55)}
.va-testi--lime .va-testi__stat-lbl{color:rgba(47,58,0,0.7)}
.va-testi__who{display:flex;align-items:center;gap:12px}
.va-testi__avatar{width:40px;height:40px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.va-testi--lime .va-testi__avatar{background:var(--fs-ink);color:#fff}
.va-testi--dark .va-testi__avatar{background:#fff;color:var(--fs-ink)}
.va-testi__name{font-size:14px;font-weight:700}
.va-testi--dark .va-testi__name{color:#fff}
.va-testi__role{font-size:12px;color:var(--fg-3);margin-top:2px}
.va-testi--dark .va-testi__role{color:rgba(255,255,255,0.5)}
.va-testi--lime .va-testi__role{color:rgba(47,58,0,0.65)}
/* FAQ */
.va-faq{max-width:820px;margin:0 auto}
.va-faq__item{border-bottom:1px solid var(--border-1)}
.va-faq__item:first-child{border-top:1px solid var(--border-1)}
.va-faq__btn{width:100%;background:none;border:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:24px 0;gap:20px;text-align:left;font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--fs-ink);letter-spacing:-.01em}
.va-faq__icon{width:30px;height:30px;border-radius:50%;background:var(--fs-gray-100);flex-shrink:0;display:grid;place-items:center;font-size:18px;color:var(--fs-ink);transition:background var(--dur-fast),transform var(--dur-med) var(--ease-out)}
.va-faq__item.open .va-faq__icon{background:var(--fs-lime);transform:rotate(45deg)}
.va-faq__body{font-size:15px;color:var(--fg-2);line-height:1.65;overflow:hidden;max-height:0;transition:max-height var(--dur-slow) var(--ease-out),padding var(--dur-slow) var(--ease-out)}
.va-faq__item.open .va-faq__body{max-height:400px;padding-bottom:24px}
.va-note{max-width:820px;margin:28px auto 0;font-size:13px;color:var(--fg-3);line-height:1.55;text-align:center}
/* Final CTA */
.va-final{background:var(--fs-ink);padding:104px 40px;text-align:center;position:relative;overflow:hidden}
.va-final::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,0.06) 1px,transparent 1.2px);background-size:8px 8px}
.va-final__inner{position:relative;max-width:760px;margin:0 auto}
.va-final h2{font-family:var(--font-display);font-size:clamp(36px,4vw,56px);font-weight:700;letter-spacing:-.03em;color:#fff;text-wrap:balance}
.va-final h2 em{font-style:normal;color:var(--fs-lime)}
.va-final p{margin:16px auto 0;font-size:18px;color:rgba(255,255,255,0.6)}
.va-final__btns{display:flex;gap:12px;justify-content:center;margin-top:36px;flex-wrap:wrap}
a{color:var(--fs-ink)}
a:hover{color:var(--fs-lime-deep)}
@media (prefers-reduced-motion:reduce){.mk-call__wave i,.mk__chip--live::before{animation:none}}
@media (max-width:1024px){
.va-hero__inner{grid-template-columns:1fr;gap:48px}
.va-hero__badge--tl{left:-12px}
.va-hero__badge--br{right:-8px}
.va-benefits{grid-template-columns:1fr 1fr}
.va-feat{grid-template-columns:1fr;gap:40px}
.va-feat--flip .va-feat__media{order:0}
.va-cases{grid-template-columns:1fr}
.va-int{grid-template-columns:1fr 1fr}
.va-testi-grid{grid-template-columns:1fr}
}
@media (max-width:768px){
.va-hero{padding:64px 22px}
.va-sec{padding:72px 22px}
.va-replaces{padding:18px 22px}
.va-benefits{grid-template-columns:1fr}
.va-int{grid-template-columns:1fr}
.va-final{padding:72px 22px}
.nav__links{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">

/* Icons (Lucide-style, stroke 1.75) */
