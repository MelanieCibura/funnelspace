<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KI-Tools — Funnelspace</title>
<meta name="description" content="Deine KI-Mitarbeiter in Funnelspace: Voice AI, Conversation AI, Reviews AI, Content AI, Funnel & Website AI, Workflow AI, AI Studio, Agent Studio, MCP Server und Analytics-KI. Alle in einem Login." />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="site.css" />
<style>
.k2-hero{padding:84px 40px 76px;position:relative;overflow:hidden}
.k2-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:11px 11px;opacity:.5;pointer-events:none}
.k2-hero__inner{max-width:1280px;margin:0 auto;position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center}
.k2-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fs-lime-ink);background:var(--fs-lime);padding:6px 12px;border-radius:var(--radius-pill);margin-bottom:22px}
.k2-hero h1{font-family:var(--font-display);font-size:clamp(42px,5vw,68px);font-weight:700;line-height:1.04;letter-spacing:-.03em;text-wrap:balance}
.k2-hero h1 em{font-style:normal;background:var(--fs-lime);color:var(--fs-lime-ink);padding:0 6px;border-radius:6px}
.k2-hero__lead{margin-top:22px;font-size:19px;line-height:1.55;color:var(--fg-2);max-width:520px}
.k2-hero__cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap;align-items:center}
.k2-hint{margin-top:14px;font-size:13px;color:var(--fg-3);display:flex;align-items:center;gap:7px}
.k2-hint svg{width:15px;height:15px;color:var(--fs-lime-deep)}
/* Hero-Visual: KI-Oberfläche */
.k2-panel{background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);overflow:hidden}
.k2-panel__bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-1);background:var(--fs-gray-100)}
.k2-panel__mark{width:22px;height:22px;border-radius:7px;background:var(--fs-lime);display:grid;place-items:center;color:var(--fs-lime-ink)}
.k2-panel__mark svg{width:12px;height:12px}
.k2-panel__title{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:-.01em}
.k2-panel__kbd{margin-left:auto;font-family:var(--font-mono);font-size:10px;background:#fff;border:1px solid var(--border-1);padding:2px 6px;border-radius:4px;color:var(--fg-3)}
.k2-panel__q{padding:16px;border-bottom:1px solid var(--border-1);font-family:var(--font-mono);font-size:12.5px;line-height:1.5;color:var(--fs-ink)}
.k2-cursor{display:inline-block;width:7px;height:14px;background:var(--fs-ink);vertical-align:-2px;margin-left:2px;animation:k2-blink 1s steps(2) infinite}
@keyframes k2-blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.k2-panel__label{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);padding:12px 16px 6px}
.k2-row{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--border-1)}
.k2-row--on{background:var(--fs-lime-soft)}
.k2-row__dot{width:30px;height:30px;border-radius:9px;background:var(--fs-gray-100);display:grid;place-items:center;color:var(--fs-ink)}
.k2-row--on .k2-row__dot{background:var(--fs-lime);color:var(--fs-lime-ink)}
.k2-row__name{font-size:12.5px;font-weight:700;line-height:1.2}
.k2-row__meta{font-size:10.5px;color:var(--fg-3);margin-top:2px;line-height:1.3}
.k2-row__time{font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:var(--fs-ink-soft);white-space:nowrap}
.k2-panel__foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--border-1);background:var(--fs-paper)}
.k2-panel__foot-txt{font-size:11px;color:var(--fg-3)}
/* Sections */
.k2-sec{padding:100px 40px}
.k2-sec--alt{background:var(--fs-white)}
.k2-sec__inner{max-width:1280px;margin:0 auto}
.k2-sec__head{max-width:740px;margin:0 auto 56px;text-align:center}
.k2-sec__eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
.k2-sec__head h2{font-family:var(--font-display);font-size:clamp(32px,3.5vw,50px);font-weight:700;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.k2-sec__head h2 em{font-style:normal;background:var(--fs-lime);color:var(--fs-lime-ink);padding:0 8px;border-radius:6px}
.k2-sec__head p{margin-top:16px;font-size:18px;color:var(--fg-2);line-height:1.6}
/* Problem */
.k2-prob{display:grid;grid-template-columns:1fr 1.1fr;gap:64px;align-items:center;max-width:1280px;margin:0 auto}
.k2-prob h2{font-family:var(--font-display);font-size:clamp(30px,3.2vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
.k2-prob p{margin-top:18px;font-size:17px;line-height:1.65;color:var(--fg-2)}
.k2-prob p+p{margin-top:14px}
.k2-converge{display:grid;grid-template-columns:1fr 44px 1fr;gap:18px;align-items:center}
.k2-mess{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k2-tool{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-sm);padding:9px 10px;font-size:12px;font-weight:600;color:var(--fg-3)}
.k2-tool svg{width:14px;height:14px;flex-shrink:0;color:var(--fs-gray-400)}
.k2-tool span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k2-conv-arrow{display:grid;place-items:center;color:var(--fs-gray-400)}
.k2-conv-arrow svg{width:28px;height:28px}
.k2-one{background:var(--fs-ink);border-radius:var(--radius-lg);padding:26px 24px;color:#fff;position:relative;overflow:hidden}
.k2-one::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.09) 1px,transparent 1.2px);background-size:8px 8px}
.k2-one__logo{position:relative;width:38px;height:38px;border-radius:11px;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;margin-bottom:16px}
.k2-one__logo svg{width:20px;height:20px}
.k2-one__t{position:relative;font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.k2-one__d{position:relative;margin-top:10px;font-size:14px;line-height:1.55;color:rgba(255,255,255,.62)}
.k2-one__list{position:relative;list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:8px}
.k2-one__list li{display:flex;gap:9px;font-size:13px;color:rgba(255,255,255,.82);align-items:flex-start}
.k2-one__list li svg{width:15px;height:15px;flex-shrink:0;margin-top:2px;color:var(--fs-lime)}
/* Bundle-Karten */
.k2-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.k2-card{background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:26px 24px;display:flex;flex-direction:column;gap:14px;transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out)}
.k2-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.k2-card__icon{width:44px;height:44px;border-radius:var(--radius-md);background:var(--fs-lime-soft);border:1px solid var(--fs-lime);color:var(--fs-ink);display:grid;place-items:center}
.k2-card__icon svg{width:21px;height:21px}
.k2-card h3{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.02em}
.k2-card p{font-size:14.5px;line-height:1.6;color:var(--fg-2);margin-top:-4px}
.k2-card p b{color:var(--fs-ink);font-weight:700}
/* AI Studio Spotlight */
.k2-spot{max-width:1280px;margin:0 auto;background:var(--fs-lime);border:2px solid var(--fs-ink);border-radius:var(--radius-xl);overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
.k2-spot__txt{padding:56px 48px}
.k2-spot__eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fs-lime-ink);opacity:.65}
.k2-spot__txt h2{margin-top:14px;font-family:var(--font-display);font-size:clamp(30px,3.2vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.08;color:var(--fs-lime-ink);text-wrap:balance}
.k2-spot__txt p{margin-top:18px;font-size:17px;line-height:1.6;color:var(--fs-lime-ink);opacity:.82;max-width:460px}
.k2-spot__cta{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
.k2-spot__visual{background:var(--fs-ink);padding:40px;display:flex;flex-direction:column;gap:12px;justify-content:center;position:relative;overflow:hidden}
.k2-spot__visual::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.08) 1px,transparent 1.2px);background-size:8px 8px}
.k2-prompt{position:relative;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius-md);padding:14px 16px;font-family:var(--font-mono);font-size:12.5px;line-height:1.5;color:#fff}
.k2-prompt__l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fs-lime);margin-bottom:8px;font-family:var(--font-sans);font-weight:700}
.k2-steps{position:relative;display:flex;flex-direction:column;gap:8px}
.k2-step{display:grid;grid-template-columns:22px 1fr auto;gap:11px;align-items:center;background:rgba(255,255,255,.04);border-radius:var(--radius-sm);padding:11px 13px}
.k2-step__n{width:22px;height:22px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;font-size:11px;font-weight:800}
.k2-step__t{font-size:13px;font-weight:600;color:#fff}
.k2-step__s{font-family:var(--font-mono);font-size:10.5px;color:var(--fs-lime)}
/* Weitere Tools */
.k2-more{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.k2-more__item{background:var(--fs-paper);border:2px solid var(--border-strong);border-radius:var(--radius-lg);padding:26px 24px;display:flex;flex-direction:column;gap:12px}
.k2-sec--alt .k2-more__item{background:var(--fs-paper)}
.k2-more__icon{width:38px;height:38px;border-radius:var(--radius-sm);background:var(--fs-ink);color:var(--fs-lime);display:grid;place-items:center}
.k2-more__icon svg{width:19px;height:19px}
.k2-more__item h3{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.k2-more__item p{font-size:14px;line-height:1.6;color:var(--fg-2)}
/* Auf einen Blick */
.k2-glance{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-1);border:1px solid var(--border-1);border-radius:var(--radius-lg);overflow:hidden}
.k2-glance__col{background:#fff;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.k2-glance__h{display:flex;align-items:center;gap:9px}
.k2-glance__h svg{width:17px;height:17px;color:var(--fs-lime-deep)}
.k2-glance__h span{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:-.01em}
.k2-chips{display:flex;flex-wrap:wrap;gap:7px}
.k2-chip{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:var(--radius-pill);background:var(--fs-gray-100);color:var(--fs-ink-soft)}
/* Nutzen */
.k2-benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.k2-benefit{display:flex;flex-direction:column;gap:14px;padding:30px 26px;background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-lg)}
.k2-benefit__icon{width:44px;height:44px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center}
.k2-benefit__icon svg{width:21px;height:21px}
.k2-benefit h3{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.k2-benefit p{font-size:14.5px;line-height:1.6;color:var(--fg-2)}
/* Enthalten */
.k2-incl{max-width:960px;margin:0 auto;background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-lg);overflow:hidden}
.k2-incl__row{display:grid;grid-template-columns:1.5fr 1fr}
.k2-incl__row+.k2-incl__row{border-top:1px solid var(--border-1)}
.k2-incl__row--head{background:var(--fs-paper)}
.k2-incl__cell{padding:15px 20px;font-size:14.5px;color:var(--fg-2);line-height:1.5}
.k2-incl__cell+.k2-incl__cell{border-left:1px solid var(--border-1)}
.k2-incl__row--head .k2-incl__cell{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--fs-ink)}
.k2-incl__cell--k{font-weight:600;color:var(--fs-ink)}
.k2-incl__cell--hi{background:var(--fs-lime-soft);color:var(--fs-ink);font-weight:600}
.k2-note{max-width:960px;margin:20px auto 0;font-size:13.5px;line-height:1.6;color:var(--fg-3);display:flex;gap:9px;align-items:flex-start}
.k2-note svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}
/* FAQ */
.k2-faq{max-width:820px;margin:0 auto}
.k2-faq__item{border-bottom:1px solid var(--border-1)}
.k2-faq__item:first-child{border-top:1px solid var(--border-1)}
.k2-faq__btn{width:100%;background:none;border:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:22px 0;gap:20px;text-align:left;font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--fs-ink);letter-spacing:-.01em}
.k2-faq__icon{width:30px;height:30px;border-radius:50%;background:var(--fs-gray-100);flex-shrink:0;display:grid;place-items:center;font-size:18px;transition:background var(--dur-fast),transform var(--dur-med) var(--ease-out)}
.k2-faq__item.open .k2-faq__icon{background:var(--fs-lime);transform:rotate(45deg)}
.k2-faq__body{font-size:15px;color:var(--fg-2);line-height:1.65;overflow:hidden;max-height:0;transition:max-height var(--dur-slow) var(--ease-out),padding var(--dur-slow) var(--ease-out)}
.k2-faq__item.open .k2-faq__body{max-height:460px;padding-bottom:22px}
/* Final CTA */
.k2-final{background:var(--fs-ink);padding:100px 40px;text-align:center;position:relative;overflow:hidden}
.k2-final::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.07) 1px,transparent 1.2px);background-size:8px 8px}
.k2-final__inner{position:relative;max-width:740px;margin:0 auto}
.k2-final h2{font-family:var(--font-display);font-size:clamp(34px,4vw,54px);font-weight:700;letter-spacing:-.03em;color:#fff;text-wrap:balance}
.k2-final h2 em{font-style:normal;color:var(--fs-lime)}
.k2-final p{margin:16px auto 0;font-size:18px;color:rgba(255,255,255,.6)}
.k2-final__btns{display:flex;gap:12px;justify-content:center;margin-top:34px;flex-wrap:wrap}
.k2-final__hint{margin-top:20px;font-size:13px;color:rgba(255,255,255,.45)}
a{color:var(--fs-ink)}a:hover{color:var(--fs-lime-deep)}
@media(max-width:1024px){
.k2-hero__inner{grid-template-columns:1fr;gap:48px}
.k2-prob{grid-template-columns:1fr;gap:40px}
.k2-cards,.k2-more,.k2-benefits{grid-template-columns:1fr 1fr}
.k2-spot{grid-template-columns:1fr}
.k2-glance{grid-template-columns:1fr 1fr}
}
@media(max-width:768px){
.k2-hero{padding:56px 22px}
.k2-sec{padding:68px 22px}
.k2-cards,.k2-more,.k2-benefits,.k2-glance{grid-template-columns:1fr}
.k2-converge{grid-template-columns:1fr;gap:14px}
.k2-conv-arrow{transform:rotate(90deg)}
.k2-spot__txt{padding:36px 24px}
.k2-spot__visual{padding:24px}
.k2-incl__row{grid-template-columns:1fr}
.k2-incl__cell+.k2-incl__cell{border-left:none;border-top:1px solid var(--border-1)}
.k2-final{padding:68px 22px}
.nav__links{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const Icon = ({ d, size = 20 }) => (
  <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">{d}</svg>
);
const IPhone = p => <Icon {...p} d={<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2z"/>} />;
const IChat = p => <Icon {...p} d={<><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></>} />;
const IStar = p => <Icon {...p} d={<polygon points="12 2 15.1 8.6 22 9.6 17 14.5 18.2 21.4 12 18.1 5.8 21.4 7 14.5 2 9.6 8.9 8.6 12 2"/>} />;
const IPen = p => <Icon {...p} d={<><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></>} />;
const ILayout = p => <Icon {...p} d={<><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></>} />;
const IFlow = p => <Icon {...p} d={<><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M6 9v4a2 2 0 0 0 2 2h10"/></>} />;
const ISpark = p => <Icon {...p} d={<><path d="M12 3v4"/><path d="M12 17v4"/><path d="M3 12h4"/><path d="M17 12h4"/><path d="M5.6 5.6l2.8 2.8"/><path d="M15.6 15.6l2.8 2.8"/><path d="M5.6 18.4l2.8-2.8"/><path d="M15.6 8.4l2.8-2.8"/></>} />;
const IBot = p => <Icon {...p} d={<><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/></>} />;
const IPlug = p => <Icon {...p} d={<><path d="M9 2v6"/><path d="M15 2v6"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v5"/></>} />;
const IChart = p => <Icon {...p} d={<><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 4-6"/></>} />;
const ICheck = p => <Icon size={15} {...p} d={<polyline points="20 6 9 17 4 12"/>} />;
const IArrow = p => <Icon size={15} {...p} d={<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>} />;

  useEffect(() => {

};
