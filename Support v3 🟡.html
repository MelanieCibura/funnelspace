<style>
.sh{padding:80px 40px 56px}
.sh__inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center}
.sh__eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:18px}
.sh h1{font-family:var(--font-display);font-size:clamp(40px,4.8vw,66px);font-weight:700;line-height:1.04;letter-spacing:-.03em;text-wrap:balance}
.sh h1 em{font-style:normal;background:var(--fs-lime);color:var(--fs-lime-ink);padding:0 8px;border-radius:6px}
.sh__lead{margin-top:20px;font-size:19px;line-height:1.55;color:var(--fg-2);max-width:520px}
.sh__cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.sh__proof{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;font-size:13px;color:var(--fg-3)}
.sh__proof span{display:flex;align-items:center;gap:7px}
.sh__proof>span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fs-lime-deep)}
.sh__art{background:var(--fs-white);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:10px 10px;border:1px solid var(--border-1);border-radius:var(--radius-xl);padding:28px;display:grid;place-items:center}
.sh__art img{width:100%;max-width:440px;height:auto;display:block}
.srt{padding:0 40px}
.srt__inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-1);border:1px solid var(--border-1);border-radius:var(--radius-lg);overflow:hidden}
.srt__i{background:var(--fs-white);padding:22px 24px}
.srt__i>b{display:block;font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.srt__i>span{display:block;margin-top:7px;font-size:13px;color:var(--fg-3);line-height:1.4}
.ssec{padding:88px 40px}
.ssec--alt{background:var(--fs-white)}
.ssec__inner{max-width:1280px;margin:0 auto}
.ssec__head{max-width:660px;margin-bottom:44px}
.ssec__head--c{text-align:center;margin-left:auto;margin-right:auto}
.ssec__eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
.ssec__head h2{font-family:var(--font-display);font-size:clamp(30px,3.2vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
.ssec__head p{margin-top:14px;font-size:17px;color:var(--fg-2);line-height:1.55}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ccard{display:flex;flex-direction:column;gap:14px;background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:24px;text-decoration:none;color:inherit;transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out),border-color var(--dur-med) var(--ease-out)}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--fs-gray-300)}
.ccard__art{width:100%;aspect-ratio:16/10;background:var(--fs-paper);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:8px 8px;border-radius:var(--radius-md);display:grid;place-items:center;overflow:hidden}
.ccard__art img{max-height:80%;max-width:72%;object-fit:contain}
.ccard__top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ccard h3{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.ctag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:var(--radius-pill);background:var(--fs-gray-100);color:var(--fs-ink-soft)}
.ctag--live{background:var(--fs-lime);color:var(--fs-lime-ink)}
.ccard__sub{font-size:13px;font-weight:700;color:var(--fg-3);margin-top:-6px}
.ccard p{font-size:14px;line-height:1.55;color:var(--fg-2)}
.ccard__foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-1);display:flex;align-items:center;justify-content:space-between;gap:12px}
.ccard__link{font-size:13px;font-weight:700;color:var(--fs-ink);display:inline-flex;align-items:center;gap:6px;transition:gap var(--dur-fast) var(--ease-out)}
.ccard:hover .ccard__link{gap:10px}
.ccard__when{font-family:var(--font-mono,monospace);font-size:11px;letter-spacing:.04em;color:var(--fg-3);white-space:nowrap}
.zoom{padding:88px 40px;background:var(--fs-ink);position:relative;overflow:hidden}
.zoom::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.06) 1px,transparent 1.2px);background-size:8px 8px}
.zoom__inner{max-width:1280px;margin:0 auto;position:relative;display:grid;grid-template-columns:.95fr 1.05fr;gap:64px;align-items:center}
.zoom__eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fs-lime);margin-bottom:14px}
.zoom h2{font-family:var(--font-display);font-size:clamp(30px,3.2vw,44px);font-weight:700;letter-spacing:-.03em;color:#fff;line-height:1.08;text-wrap:balance}
.zoom p{margin-top:16px;font-size:17px;line-height:1.6;color:rgba(255,255,255,.65);max-width:520px}
.zoom__btns{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.zrows{display:flex;flex-direction:column;gap:8px}
.zrow{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 20px;border-radius:var(--radius-md);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.zrow__day{font-family:var(--font-mono,monospace);font-size:12px;letter-spacing:.06em;color:var(--fs-lime);white-space:nowrap}
.zrow__name{font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff}
.zrow__desc{font-size:13px;color:rgba(255,255,255,.55);margin-top:3px;line-height:1.45}
.zrow__time{font-family:var(--font-mono,monospace);font-size:12px;color:rgba(255,255,255,.5);white-space:nowrap}
.self{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.selfcard{background:var(--fs-paper);border:2px solid var(--border-strong);border-radius:var(--radius-lg);padding:30px 28px;display:flex;flex-direction:column;gap:16px}
.selfcard h3{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.selfcard>p{font-size:15px;line-height:1.55;color:var(--fg-2)}
.selflist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:1px;background:var(--border-1);border:1px solid var(--border-1);border-radius:var(--radius-md);overflow:hidden}
.selflist a{background:var(--fs-white);padding:13px 16px;font-size:14px;color:var(--fg-1);text-decoration:none;display:flex;justify-content:space-between;gap:12px;align-items:center;transition:background var(--dur-fast)}
.selflist a:hover{background:var(--fs-gray-100);color:var(--fs-ink)}
.selflist a>span{font-family:var(--font-mono,monospace);font-size:11px;color:var(--fg-3)}
.selfcard .btn{align-self:flex-start;margin-top:auto}
.d4y{max-width:1280px;margin:0 auto;background:var(--fs-lime);border-radius:var(--radius-xl);padding:52px 56px;display:grid;grid-template-columns:1fr auto;gap:48px;align-items:center}
.d4y__eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fs-lime-ink);opacity:.7;margin-bottom:12px}
.d4y h2{font-family:var(--font-display);font-size:clamp(28px,3vw,40px);font-weight:700;letter-spacing:-.03em;color:var(--fs-lime-ink);text-wrap:balance;line-height:1.1}
.d4y p{margin-top:14px;font-size:16px;line-height:1.6;color:var(--fs-lime-ink);opacity:.78;max-width:620px}
.faq{max-width:820px;margin:0 auto}
.faq__item{border-bottom:1px solid var(--border-1)}
.faq__item:first-child{border-top:1px solid var(--border-1)}
.faq__btn{width:100%;background:none;border:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;text-align:left;font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--fs-ink);letter-spacing:-.01em}
.faq__icon{width:28px;height:28px;border-radius:50%;background:var(--fs-gray-100);flex-shrink:0;display:grid;place-items:center;color:var(--fs-ink);transition:background var(--dur-fast),transform var(--dur-med) var(--ease-out)}
.faq__icon svg{width:14px;height:14px}
.faq__item.open .faq__icon{background:var(--fs-lime);transform:rotate(45deg)}
.faq__body{font-size:15px;color:var(--fg-2);line-height:1.65;overflow:hidden;max-height:0;transition:max-height var(--dur-slow) var(--ease-out),padding var(--dur-slow) var(--ease-out)}
.faq__item.open .faq__body{max-height:420px;padding-bottom:24px}
a{color:var(--fs-ink)}
a:hover{color:var(--fs-lime-ink)}
@media(max-width:1024px){.sh__inner,.zoom__inner{grid-template-columns:1fr;gap:40px}.cgrid{grid-template-columns:1fr 1fr}.srt__inner{grid-template-columns:1fr 1fr}.self{grid-template-columns:1fr}.d4y{grid-template-columns:1fr;padding:40px 32px}}
@media(max-width:768px){.sh{padding:56px 22px 40px}.srt{padding:0 22px}.ssec{padding:60px 22px}.zoom{padding:64px 22px}.cgrid,.srt__inner{grid-template-columns:1fr}.nav__links{display:none}}
</style>
