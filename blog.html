<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog — Funnelspace</title>
  <meta name="description" content="Tipps, Strategien und Praxiswissen für dein Online-Business." />
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
  <style>
    /* ── Blog-specific styles ─────────────────────────────────── */
    .blog-hero {
      padding: 72px 40px 64px;
      border-bottom: 1px solid var(--border-1);
    }
    .blog-hero__inner {
      max-width: 1280px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 40px;
    }
    .blog-hero__eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--fg-3); margin-bottom: 16px;
    }
    .blog-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(42px, 5vw, 68px);
      font-weight: 700; line-height: 1.05;
      letter-spacing: -0.03em; text-wrap: balance;
    }
    .blog-hero__lead {
      margin-top: 16px; font-size: 18px;
      color: var(--fg-2); max-width: 560px; line-height: 1.5;
    }
    .blog-hero__search {
      display: flex; align-items: center; gap: 0;
      background: var(--fs-white); border: 1.5px solid var(--border-2);
      border-radius: var(--radius-md); overflow: hidden;
      box-shadow: var(--shadow-xs);
    }
    .blog-hero__search input {
      border: none; outline: none; padding: 12px 16px;
      font-family: var(--font-sans); font-size: 14px;
      background: transparent; color: var(--fs-ink);
      width: 220px;
    }
    .blog-hero__search input::placeholder { color: var(--fg-3); }
    .blog-hero__search button {
      background: var(--fs-lime); border: none; cursor: pointer;
      padding: 12px 16px; display: grid; place-items: center;
      color: var(--fs-lime-ink); font-size: 14px; font-weight: 600;
    }
    .blog-hero__search button:hover { background: var(--fs-lime-deep); }

    /* ── Filter tabs ──────────────────────────────────────────── */
    .blog-filter {
      padding: 0 40px;
      border-bottom: 1px solid var(--border-1);
      background: var(--fs-white);
      position: sticky; top: 72px; z-index: 10;
    }
    .blog-filter__inner {
      max-width: 1280px; margin: 0 auto;
      display: flex; gap: 4px; overflow-x: auto;
      padding: 12px 0;
      scrollbar-width: none;
    }
    .blog-filter__inner::-webkit-scrollbar { display: none; }
    .filter-tab {
      padding: 7px 16px; border-radius: var(--radius-pill);
      font-size: 13px; font-weight: 500; color: var(--fg-2);
      background: transparent; border: 1px solid transparent;
      cursor: pointer; white-space: nowrap;
      transition: all var(--dur-fast) var(--ease-out);
      font-family: var(--font-sans);
    }
    .filter-tab:hover { background: var(--fs-gray-100); color: var(--fs-ink); }
    .filter-tab.active {
      background: var(--fs-ink); color: #fff; border-color: var(--fs-ink);
    }

    /* ── Featured post ────────────────────────────────────────── */
    .blog-main { max-width: 1280px; margin: 0 auto; padding: 56px 40px; }

    .post-featured {
      display: grid; grid-template-columns: 1.1fr 1fr; gap: 0;
      border: 1px solid var(--border-1); border-radius: var(--radius-xl);
      overflow: hidden; background: var(--fs-white);
      box-shadow: var(--shadow-sm);
      margin-bottom: 56px;
      text-decoration: none; color: inherit;
      transition: box-shadow var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out);
    }
    .post-featured:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .post-featured__img {
      background: var(--fs-paper);
      background-image: var(--fs-halftone);
      min-height: 380px;
      display: grid; place-items: center; position: relative; overflow: hidden;
    }
    .post-featured__img img {
      max-height: 260px; max-width: 75%;
    }
    .post-featured__img-label {
      position: absolute; top: 20px; left: 20px;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 4px 12px;
      border-radius: var(--radius-pill);
    }
    .post-featured__body {
      padding: 44px 48px;
      display: flex; flex-direction: column; justify-content: center; gap: 16px;
    }
    .post-featured__meta {
      display: flex; align-items: center; gap: 12px;
      font-size: 12px; color: var(--fg-3);
    }
    .post-featured__meta span { display: flex; align-items: center; gap: 5px; }
    .post-featured h2 {
      font-family: var(--font-display);
      font-size: clamp(24px, 2.5vw, 34px);
      font-weight: 700; line-height: 1.15;
      letter-spacing: -0.02em; text-wrap: balance;
    }
    .post-featured__excerpt { font-size: 16px; color: var(--fg-2); line-height: 1.55; }
    .post-featured__author {
      display: flex; align-items: center; gap: 10px;
      margin-top: 8px;
    }
    .post-featured__avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .post-featured__author-name { font-size: 13px; font-weight: 600; }
    .post-featured__author-date { font-size: 12px; color: var(--fg-3); margin-top: 1px; }

    /* ── Post grid ────────────────────────────────────────────── */
    .blog-section-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--fg-3);
      margin-bottom: 24px;
    }
    .posts-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
      margin-bottom: 64px;
    }
    .post-card {
      background: var(--fs-white); border: 1px solid var(--border-1);
      border-radius: var(--radius-lg); overflow: hidden;
      box-shadow: var(--shadow-xs);
      display: flex; flex-direction: column;
      text-decoration: none; color: inherit;
      transition: box-shadow var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out);
    }
    .post-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
    .post-card__img {
      background: var(--fs-paper); background-image: var(--fs-halftone);
      aspect-ratio: 16/9; display: grid; place-items: center; position: relative;
    }
    .post-card__img img { max-height: 110px; max-width: 60%; }
    .post-card__cat {
      position: absolute; top: 12px; left: 12px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: var(--fs-ink); color: #fff;
    }
    .post-card__body { padding: 20px 22px 22px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .post-card__meta { font-size: 12px; color: var(--fg-3); }
    .post-card h3 {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 700;
      line-height: 1.25; letter-spacing: -0.01em;
      text-wrap: balance;
    }
    .post-card__excerpt { font-size: 14px; color: var(--fg-2); line-height: 1.55; flex: 1; }
    .post-card__footer {
      display: flex; align-items: center; gap: 8px;
      margin-top: 12px; padding-top: 12px;
      border-top: 1px solid var(--border-1);
      font-size: 12px; color: var(--fg-3);
    }
    .post-card__avatar-sm {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center; font-size: 10px; font-weight: 700; flex-shrink: 0;
    }
    .post-card__read {
      margin-left: auto; font-size: 11px; font-weight: 600;
      color: var(--fs-ink); letter-spacing: 0.02em;
    }

    /* ── Newsletter CTA ──────────────────────────────────────── */
    .blog-newsletter {
      background: var(--fs-ink); border-radius: var(--radius-xl);
      padding: 52px 56px; margin-bottom: 64px;
      display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: center;
    }
    .blog-newsletter h3 {
      font-family: var(--font-display); font-size: 28px;
      font-weight: 700; letter-spacing: -0.02em; color: #fff;
    }
    .blog-newsletter p { margin-top: 8px; font-size: 15px; color: rgba(255,255,255,0.6); }
    .blog-newsletter__form { display: flex; gap: 0; flex-shrink: 0; }
    .blog-newsletter__form input {
      border: none; outline: none; padding: 13px 18px;
      font-family: var(--font-sans); font-size: 14px;
      background: rgba(255,255,255,0.08); color: #fff;
      border-radius: var(--radius-md) 0 0 var(--radius-md);
      width: 260px;
    }
    .blog-newsletter__form input::placeholder { color: rgba(255,255,255,0.35); }
    .blog-newsletter__form button {
      background: var(--fs-lime); color: var(--fs-lime-ink);
      border: none; padding: 13px 22px;
      font-family: var(--font-sans); font-size: 14px; font-weight: 700;
      cursor: pointer; border-radius: 0 var(--radius-md) var(--radius-md) 0;
      white-space: nowrap;
    }
    .blog-newsletter__form button:hover { background: var(--fs-lime-deep); }

    /* ── Pagination ───────────────────────────────────────────── */
    .blog-pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; margin-bottom: 48px;
    }
    .page-btn {
      width: 38px; height: 38px; display: grid; place-items: center;
      border-radius: var(--radius-sm); font-size: 14px; font-weight: 500;
      cursor: pointer; border: 1px solid var(--border-1);
      background: var(--fs-white); color: var(--fg-2);
      transition: all var(--dur-fast);
    }
    .page-btn:hover { border-color: var(--fs-ink); color: var(--fs-ink); }
    .page-btn.active { background: var(--fs-ink); color: #fff; border-color: var(--fs-ink); }
    .page-btn.arrow { font-size: 16px; }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 1024px) {
      .posts-grid { grid-template-columns: repeat(2, 1fr); }
      .post-featured { grid-template-columns: 1fr; }
      .post-featured__img { min-height: 240px; }
      .blog-newsletter { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .blog-hero { padding: 48px 24px 40px; }
      .blog-hero__inner { grid-template-columns: 1fr; }
      .blog-main { padding: 40px 24px; }
      .blog-filter { padding: 0 24px; }
      .posts-grid { grid-template-columns: 1fr; }
      .post-featured__body { padding: 28px 28px; }
      .blog-newsletter { padding: 32px 28px; }
      .blog-newsletter__form { flex-direction: column; }
      .blog-newsletter__form input { border-radius: var(--radius-md); width: 100%; }
      .blog-newsletter__form button { border-radius: var(--radius-md); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Nav.jsx"></script>

  <script type="text/babel">

    /* ── Data ─────────────────────────────────────────────────── */
    const CATEGORIES = ['Alle', 'Funnel & Conversion', 'E-Mail Marketing', 'CRM & Vertrieb', 'Mitgliederbereich', 'Praxistipps', 'Funnelspace News'];

    const FEATURED = {
      cat: 'Praxistipps',
      img: 'funnel.png',
      title: 'Von 0 auf 10.000 € MRR: Wie Lena ihren ersten Kurs mit einem einzigen Funnel ausverkauft hat',
      excerpt: 'Lena Meinhardt hatte keinen Technik-Background und kein Marketingbudget. Trotzdem schaffte sie ihren ersten 5-stelligen Launch — mit einem simplen Opt-In-Funnel und einer 5-stufigen E-Mail-Sequenz. Hier ist ihre Geschichte.',
      author: { name: 'Julia Baum', initials: 'JB', role: 'Content & Community' },
      date: '18. April 2026',
      readTime: '8 Min. Lesezeit',
    };

    const POSTS = [
      {
        cat: 'Funnel & Conversion',
        img: 'funnel.png',
        title: '7 Funnel-Fehler, die Conversions kosten — und wie du sie vermeidest',
        excerpt: 'Du hast Traffic, aber keine Leads? Wahrscheinlich liegt es an einem dieser klassischen Funnel-Fehler.',
        author: { name: 'Max Richter', initials: 'MR' },
        date: '15. April 2026',
        readTime: '6 Min.',
      },
      {
        cat: 'E-Mail Marketing',
        img: 'email.png',
        title: 'Die 5-E-Mail-Sequenz, die jeden Kaltlead in einen Käufer verwandelt',
        excerpt: 'Nicht jeder kauft sofort. Mit dieser bewährten Nurture-Sequenz holst du die raus, die nur noch einen kleinen Schubs brauchen.',
        author: { name: 'Sara Wolff', initials: 'SW' },
        date: '11. April 2026',
        readTime: '5 Min.',
      },
      {
        cat: 'CRM & Vertrieb',
        img: 'crm.png',
        title: 'CRM für Solopreneure: Warum eine einfache Pipeline mehr bringt als Excel',
        excerpt: 'Du brauchst kein komplexes CRM-System. Du brauchst Übersicht — und einen klaren nächsten Schritt für jeden Kontakt.',
        author: { name: 'Julia Baum', initials: 'JB' },
        date: '7. April 2026',
        readTime: '4 Min.',
      },
      {
        cat: 'Mitgliederbereich',
        img: 'mitgliederbereich.png',
        title: 'Wie du deinen Online-Kurs in 3 Tagen aufbaust und live schaltest',
        excerpt: 'Mit dem richtigen Setup dauert dein erster Kurs-Launch keine Woche. Hier ist der ehrliche Schritt-für-Schritt-Fahrplan.',
        author: { name: 'Tobias Haller', initials: 'TH' },
        date: '2. April 2026',
        readTime: '7 Min.',
      },
      {
        cat: 'Praxistipps',
        img: 'calendar.png',
        title: 'Automatische Terminbuchung: So sparst du 3 Stunden pro Woche',
        excerpt: 'Schluss mit E-Mail-Ping-Pong. Mit einem guten Kalender-Setup buchen Kunden selbst — und du hast Kopf frei für die echte Arbeit.',
        author: { name: 'Max Richter', initials: 'MR' },
        date: '27. März 2026',
        readTime: '3 Min.',
      },
      {
        cat: 'Funnelspace News',
        img: 'funnel.png',
        title: 'Neu: A/B-Tests im Funnel-Builder — teste, was wirklich konvertiert',
        excerpt: 'Ab sofort kannst du Landingpage-Varianten direkt in Funnelspace gegeneinander testen. Kein Drittanbieter, keine Hacks.',
        author: { name: 'Funnelspace Team', initials: 'FS' },
        date: '22. März 2026',
        readTime: '2 Min.',
      },
    ];

    /* ── Components ───────────────────────────────────────────── */

    const BlogHero = () => (
      <div className="blog-hero">
        <div className="blog-hero__inner">
          <div>
            <div className="blog-hero__eyebrow">Funnelspace Blog</div>
            <h1>Wissen für dein<br />Online-Business.</h1>
            <p className="blog-hero__lead">
              Praxistipps, Strategien und Fallstudien — damit du deinen Funnel,
              deine E-Mails und deinen Kurs auf das nächste Level bringst.
            </p>
          </div>
          <div className="blog-hero__search">
            <input type="text" placeholder="Artikel suchen …" />
            <button>Suchen</button>
          </div>
        </div>
      </div>
    );

    const BlogFilter = ({ active, setActive }) => (
      <div className="blog-filter">
        <div className="blog-filter__inner">
          {CATEGORIES.map(c => (
            <button
              key={c}
              className={`filter-tab${active === c ? ' active' : ''}`}
              onClick={() => setActive(c)}
            >
              {c}
            </button>
          ))}
        </div>
      </div>
    );

    const FeaturedPost = ({ post }) => (
      <a href="#" className="post-featured">
        <div className="post-featured__img">
          <img src={`assets/illustrations/${post.img}`} alt="" />
          <span className="post-featured__img-label">Featured</span>
        </div>
        <div className="post-featured__body">
          <div className="post-featured__meta">
            <span>{post.cat}</span>
            <span>·</span>
            <span>{post.readTime}</span>
          </div>
          <h2>{post.title}</h2>
          <p className="post-featured__excerpt">{post.excerpt}</p>
          <div className="post-featured__author">
            <div className="post-featured__avatar">{post.author.initials}</div>
            <div>
              <div className="post-featured__author-name">{post.author.name}</div>
              <div className="post-featured__author-date">{post.date}</div>
            </div>
          </div>
        </div>
      </a>
    );

    const PostCard = ({ post }) => (
      <a href="#" className="post-card">
        <div className="post-card__img">
          <img src={`assets/illustrations/${post.img}`} alt="" />
          <span className="post-card__cat">{post.cat}</span>
        </div>
        <div className="post-card__body">
          <div className="post-card__meta">{post.date}</div>
          <h3>{post.title}</h3>
          <p className="post-card__excerpt">{post.excerpt}</p>
          <div className="post-card__footer">
            <div className="post-card__avatar-sm">{post.author.initials}</div>
            <span>{post.author.name}</span>
            <span className="post-card__read">{post.readTime} →</span>
          </div>
        </div>
      </a>
    );

    const NewsletterBlock = () => (
      <div className="blog-newsletter">
        <div>
          <h3>Kein guter Artikel mehr verpassen.</h3>
          <p>Wöchentlich die besten Tipps direkt in dein Postfach — kein Spam, jederzeit abbestellbar.</p>
        </div>
        <div className="blog-newsletter__form">
          <input type="email" placeholder="deine@email.de" />
          <button>Abonnieren</button>
        </div>
      </div>
    );

    const Pagination = () => (
      <div className="blog-pagination">
        <button className="page-btn arrow">←</button>
        {[1,2,3,'…',8].map((p, i) => (
          <button key={i} className={`page-btn${p === 1 ? ' active' : ''}`}>{p}</button>
        ))}
        <button className="page-btn arrow">→</button>
      </div>
    );

    const App = () => {
      const [activeFilter, setActiveFilter] = React.useState('Alle');
      const filtered = activeFilter === 'Alle'
        ? POSTS
        : POSTS.filter(p => p.cat === activeFilter);

      return (
        <>
          <Nav />
          <BlogHero />
          <BlogFilter active={activeFilter} setActive={setActiveFilter} />
          <div className="blog-main">
            {activeFilter === 'Alle' && <FeaturedPost post={FEATURED} />}
            {filtered.length > 0 ? (
              <>
                <div className="blog-section-label">
                  {activeFilter === 'Alle' ? 'Aktuelle Artikel' : activeFilter}
                </div>
                <div className="posts-grid">
                  {filtered.map(p => <PostCard key={p.title} post={p} />)}
                </div>
              </>
            ) : (
              <p style={{color:'var(--fg-3)', fontSize:15, marginBottom: 48}}>
                Noch keine Artikel in dieser Kategorie.
              </p>
            )}
            <NewsletterBlock />
            <Pagination />
          </div>
          <footer style={{textAlign:'center', padding:'24px 40px', borderTop:'1px solid var(--border-1)', fontSize:13, color:'var(--fg-3)'}}>
            <a href="index.html" style={{color:'var(--fs-ink)', textDecoration:'none', fontWeight:600}}>← Zurück zur Startseite</a>
            <span style={{margin:'0 16px'}}>·</span>
            © 2026 Funnelspace GmbH
          </footer>
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
