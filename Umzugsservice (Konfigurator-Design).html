<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tool-Umzugsservice — Funnelspace</title>
  <meta name="description" content="Wir ziehen deine Tools, Funnels, E-Mails und Kontakte in 3–7 Tagen zu Funnelspace um. Schnell, sauber, stressfrei — ohne Datenverlust, ohne Technik-Chaos." />
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <style>
    /* ── Umzugsservice · Konfigurator-Design language ──────────── */

    /* Hero */
    .uk-hero { background: var(--fs-ink); color: #fff; padding: 96px 40px 88px; position: relative; overflow: hidden; }
    .uk-hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(215,240,120,0.06) 1px, transparent 1.2px); background-size: 8px 8px; pointer-events: none; }
    .uk-hero__inner { max-width: 1280px; margin: 0 auto; position: relative; display: grid; grid-template-columns: 1.05fr 1fr; gap: 72px; align-items: center; }
    .uk-hero__eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fs-lime); background: rgba(215,240,120,0.1); border: 1px solid rgba(215,240,120,0.3); padding: 6px 12px; border-radius: var(--radius-pill); margin-bottom: 22px; }
    .uk-hero__eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--fs-lime); }
    .uk-hero h1 { font-family: var(--font-display); font-size: clamp(42px, 5vw, 68px); font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; text-wrap: balance; color: #fff; }
    .uk-hero h1 em { font-style: normal; color: var(--fs-lime); }
    .uk-hero__tag { margin-top: 18px; font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: #fff; }
    .uk-hero__tag span { color: var(--fs-lime); }
    .uk-hero__tag span + span::before { content: "·"; color: rgba(255,255,255,0.3); margin: 0 10px; font-weight: 400; }
    .uk-hero__lead { margin-top: 20px; font-size: 18px; line-height: 1.55; color: rgba(255,255,255,0.7); max-width: 520px; }
    .uk-hero__cta { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; align-items: center; }
    .uk-hero__proof { margin-top: 24px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: rgba(255,255,255,0.5); }
    .uk-hero__proof span { display: flex; align-items: center; gap: 6px; }
    .uk-hero__proof span::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--fs-lime); }
    .uk-hero__visual { position: relative; background: var(--fs-paper); background-image: radial-gradient(var(--fs-gray-300) 1px, transparent 1.2px); background-size: 10px 10px; border-radius: var(--radius-xl); padding: 24px; aspect-ratio: 1/0.95; display: grid; place-items: center; box-shadow: 0 40px 80px -20px rgba(0,0,0,0.4); }
    .uk-hero__visual img { max-height: 84%; max-width: 84%; object-fit: contain; }
    .uk-hero__badge { position: absolute; background: #fff; color: var(--fs-ink); border-radius: var(--radius-lg); padding: 12px 16px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 12px; }
    .uk-hero__badge--tl { top: 24px; left: -24px; }
    .uk-hero__badge--br { bottom: 20px; right: -20px; }
    .uk-hero__badge-dot { width: 34px; height: 34px; border-radius: 50%; background: var(--fs-lime); color: var(--fs-lime-ink); display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); font-size: 12px; flex-shrink: 0; }
    .uk-hero__badge-label { font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; }
    .uk-hero__badge-val { font-size: 15px; font-weight: 700; font-family: var(--font-display); margin-top: 2px; }

    /* Types strip */
    .uk-types { background: rgba(255,255,255,0.04); border-top: 1px solid rgba(255,255,255,0.08); padding: 22px 40px; }
    .uk-types__inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
    .uk-types__label { font-size: 12px; color: rgba(255,255,255,0.4); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
    .uk-types__items { display: flex; gap: 26px; flex-wrap: wrap; }
    .uk-types__item { font-family: var(--font-display); font-weight: 700; font-size: 16px; color: rgba(255,255,255,0.55); letter-spacing: -0.01em; }
    .uk-types__item:nth-child(3n+1) { color: var(--fs-lime); }

    /* Shared section */
    .uk-sec { padding: 104px 40px; }
    .uk-sec--alt { background: var(--fs-white); }
    .uk-sec--paper { background: var(--fs-paper); }
    .uk-sec__inner { max-width: 1280px; margin: 0 auto; }
    .uk-sec__head { max-width: 740px; margin: 0 auto 64px; text-align: center; }
    .uk-eyebrow { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px; }
    .uk-sec__head h2 { font-family: var(--font-display); font-size: clamp(34px, 3.6vw, 52px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; text-wrap: balance; }
    .uk-sec__head h2 em { font-style: normal; background: var(--fs-lime); color: var(--fs-lime-ink); padding: 0 8px; border-radius: 6px; }
    .uk-sec__head p { margin-top: 16px; font-size: 18px; color: var(--fg-2); line-height: 1.55; }

    /* Perks — promise as numbered grid */
    .uk-perks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border-1); border: 1px solid var(--border-1); border-radius: var(--radius-lg); overflow: hidden; }
    .uk-perk { background: var(--fs-white); padding: 40px 32px; display: flex; flex-direction: column; gap: 14px; transition: background var(--dur-med) var(--ease-out); }
    .uk-perk:hover { background: var(--fs-paper); }
    .uk-perk__num { font-family: var(--font-display); font-weight: 800; font-size: 16px; width: 44px; height: 44px; border-radius: var(--radius-sm); background: var(--fs-lime); color: var(--fs-lime-ink); display: grid; place-items: center; }
    .uk-perk h3 { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
    .uk-perk p { font-size: 15px; color: var(--fg-2); line-height: 1.55; }

    /* What we move — card grid */
    .uk-move { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .uk-move__card { background: var(--fs-white); border: 1px solid var(--border-1); border-radius: var(--radius-md); padding: 22px 20px; display: flex; align-items: center; gap: 14px; transition: transform var(--dur-med) var(--ease-out), border-color var(--dur-med); }
    .uk-move__card:hover { transform: translateY(-3px); border-color: var(--fs-ink); }
    .uk-move__card--accent { background: var(--fs-lime); border-color: var(--fs-lime); }
    .uk-move__icon { width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--fs-paper); display: grid; place-items: center; color: var(--fs-ink); flex-shrink: 0; }
    .uk-move__icon svg { width: 20px; height: 20px; }
    .uk-move__card--accent .uk-move__icon { background: rgba(42,45,51,0.1); color: var(--fs-lime-ink); }
    .uk-move__card h4 { font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
    .uk-move__card small { display: block; font-size: 12px; color: var(--fg-3); margin-top: 3px; }
    .uk-move__card--accent small { color: var(--fs-lime-ink); opacity: 0.7; }
    .uk-move__cta { margin-top: 44px; text-align: center; }

    /* Timeline */
    .uk-timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; position: relative; }
    .uk-timeline::before { content: ""; position: absolute; top: 28px; left: calc(100%/8); width: calc(100% * 3/4); height: 2px; background: linear-gradient(90deg, var(--fs-lime) 0%, var(--fs-lime) 70%, rgba(215,240,120,0.3) 100%); }
    .uk-tl-step { padding: 0 24px 0 0; position: relative; }
    .uk-tl-step:last-child { padding-right: 0; }
    .uk-tl-step__num { width: 56px; height: 56px; border-radius: 50%; background: var(--fs-lime); color: var(--fs-lime-ink); display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; font-weight: 700; margin-bottom: 22px; position: relative; z-index: 1; border: 4px solid var(--fs-paper); }
    .uk-tl-step__label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 8px; }
    .uk-tl-step h3 { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px; }
    .uk-tl-step p { font-size: 14px; color: var(--fg-2); line-height: 1.6; }

    /* Stats + Testimonials */
    .uk-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 56px; }
    .uk-stat { text-align: center; padding: 28px 20px; border: 1px solid var(--border-1); border-radius: var(--radius-lg); background: var(--fs-white); }
    .uk-stat__num { font-family: var(--font-display); font-size: clamp(32px, 3.4vw, 44px); font-weight: 700; letter-spacing: -0.02em; }
    .uk-stat__num em { font-style: normal; background: var(--fs-lime); color: var(--fs-lime-ink); padding: 0 8px; border-radius: 6px; }
    .uk-stat__lbl { margin-top: 8px; font-size: 14px; color: var(--fg-2); line-height: 1.45; }
    .uk-testi-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    .uk-testi { background: var(--fs-white); border: 1px solid var(--border-1); border-radius: var(--radius-lg); padding: 28px; display: flex; flex-direction: column; gap: 18px; }
    .uk-testi--dark { background: var(--fs-ink); border-color: var(--fs-ink); }
    .uk-testi--lime { background: var(--fs-lime); border-color: var(--fs-lime); }
    .uk-testi__stars { color: var(--fs-lime-deep); font-size: 15px; letter-spacing: 2px; }
    .uk-testi--dark .uk-testi__stars { color: var(--fs-lime); }
    .uk-testi--lime .uk-testi__stars { color: var(--fs-lime-ink); }
    .uk-testi blockquote { font-size: 17px; line-height: 1.5; flex: 1; font-family: var(--font-display); font-weight: 500; letter-spacing: -0.01em; border: none; padding: 0; margin: 0; color: var(--fg-1); }
    .uk-testi--dark blockquote { color: #fff; }
    .uk-testi--lime blockquote { color: var(--fs-lime-ink); }
    .uk-testi__who { display: flex; align-items: center; gap: 12px; }
    .uk-testi__avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--fs-lime); color: var(--fs-lime-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .uk-testi--lime .uk-testi__avatar { background: var(--fs-ink); color: #fff; }
    .uk-testi--dark .uk-testi__avatar { background: #fff; color: var(--fs-ink); }
    .uk-testi__name { font-size: 14px; font-weight: 700; }
    .uk-testi--dark .uk-testi__name { color: #fff; }
    .uk-testi__role { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
    .uk-testi--dark .uk-testi__role { color: rgba(255,255,255,0.5); }
    .uk-testi--lime .uk-testi__role { color: rgba(47,58,0,0.65); }

    /* For you */
    .uk-foryou { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .uk-foryou__card { background: var(--fs-white); border: 1px solid var(--border-1); border-radius: var(--radius-lg); padding: 36px 32px; display: flex; flex-direction: column; gap: 16px; }
    .uk-foryou__icon { width: 56px; height: 56px; border-radius: var(--radius-md); background: var(--fs-lime); color: var(--fs-lime-ink); display: grid; place-items: center; }
    .uk-foryou__icon svg { width: 26px; height: 26px; }
    .uk-foryou__card h3 { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
    .uk-foryou__card h3 span { background: var(--fs-lime); padding: 0 6px; border-radius: 4px; color: var(--fs-lime-ink); }
    .uk-foryou__card p { font-size: 15px; color: var(--fg-2); line-height: 1.55; }

    /* Pricing */
    .uk-price { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .uk-price__card { background: var(--fs-white); border: 1px solid var(--border-1); border-radius: var(--radius-xl); padding: 36px 32px; display: flex; flex-direction: column; gap: 20px; position: relative; transition: transform var(--dur-med) var(--ease-out), box-shadow var(--dur-med); }
    .uk-price__card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .uk-price__card--featured { background: var(--fs-ink); color: #fff; border-color: var(--fs-ink); transform: scale(1.03); }
    .uk-price__card--featured:hover { transform: scale(1.03) translateY(-4px); }
    .uk-price__badge { position: absolute; top: -12px; left: 32px; background: var(--fs-lime); color: var(--fs-lime-ink); font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 12px; border-radius: var(--radius-pill); }
    .uk-price__name { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .uk-price__sub { font-size: 14px; color: var(--fg-2); line-height: 1.45; min-height: 42px; margin-top: 6px; }
    .uk-price__card--featured .uk-price__sub { color: rgba(255,255,255,0.65); }
    .uk-price__amount { font-family: var(--font-display); font-size: 52px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin-top: 6px; }
    .uk-price__amount small { font-size: 15px; font-weight: 500; color: var(--fg-3); letter-spacing: 0; }
    .uk-price__card--featured .uk-price__amount small { color: rgba(255,255,255,0.55); }
    .uk-price__list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .uk-price__list li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--fg-2); line-height: 1.5; }
    .uk-price__card--featured .uk-price__list li { color: rgba(255,255,255,0.8); }
    .uk-price__list li svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 3px; color: var(--fs-lime-deep); }
    .uk-price__card--featured .uk-price__list li svg { color: var(--fs-lime); }

    /* Who + consult */
    .uk-who { display: grid; grid-template-columns: 1fr 1.2fr; gap: 72px; align-items: center; background: var(--fs-white); border: 1px solid var(--border-1); border-radius: var(--radius-xl); padding: 48px; }
    .uk-who__portrait { aspect-ratio: 4/5; border-radius: var(--radius-lg); overflow: hidden; position: relative; border: 1px solid var(--border-1); background: var(--fs-paper); background-image: radial-gradient(var(--fs-gray-300) 1px, transparent 1.2px); background-size: 10px 10px; display: grid; place-items: center; }
    .uk-who__portrait img { max-width: 82%; max-height: 78%; object-fit: contain; }
    .uk-who__badge { position: absolute; bottom: 16px; left: 16px; background: var(--fs-lime); color: var(--fs-lime-ink); border-radius: var(--radius-md); padding: 8px 12px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .uk-who__intro { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--fs-ink); letter-spacing: -0.01em; }
    .uk-who h2 { font-family: var(--font-display); font-size: clamp(30px, 3vw, 42px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; margin-top: 4px; }
    .uk-who__tag { display: inline-flex; margin-top: 14px; font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--fs-ink); }
    .uk-who__tag span + span::before { content: "·"; color: var(--fs-gray-400); margin: 0 10px; }
    .uk-who p { margin-top: 18px; font-size: 16px; color: var(--fg-2); line-height: 1.6; }
    .uk-who__cta { margin-top: 26px; }

    /* FAQ */
    .uk-faq { max-width: 820px; margin: 0 auto; }
    .uk-faq__item { border-bottom: 1px solid var(--border-1); }
    .uk-faq__item:first-child { border-top: 1px solid var(--border-1); }
    .uk-faq__btn { width: 100%; background: none; border: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 24px 0; gap: 20px; text-align: left; font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--fs-ink); letter-spacing: -0.01em; }
    .uk-faq__num { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--fs-lime-deep); margin-right: 14px; }
    .uk-faq__icon { width: 30px; height: 30px; border-radius: 50%; background: var(--fs-gray-100); flex-shrink: 0; display: grid; place-items: center; font-size: 18px; color: var(--fs-ink); transition: background var(--dur-fast), transform var(--dur-med) var(--ease-out); }
    .uk-faq__item.open .uk-faq__icon { background: var(--fs-lime); transform: rotate(45deg); }
    .uk-faq__body { font-size: 15px; color: var(--fg-2); line-height: 1.65; overflow: hidden; max-height: 0; transition: max-height var(--dur-slow) var(--ease-out), padding var(--dur-slow) var(--ease-out); padding-left: 32px; }
    .uk-faq__item.open .uk-faq__body { max-height: 420px; padding-bottom: 24px; }

    /* Final CTA — ink */
    .uk-final { background: var(--fs-ink); padding: 104px 40px; text-align: center; position: relative; overflow: hidden; }
    .uk-final::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(215,240,120,0.06) 1px, transparent 1.2px); background-size: 8px 8px; }
    .uk-final__inner { position: relative; max-width: 760px; margin: 0 auto; }
    .uk-final h2 { font-family: var(--font-display); font-size: clamp(36px, 4vw, 56px); font-weight: 700; letter-spacing: -0.03em; color: #fff; text-wrap: balance; }
    .uk-final h2 em { font-style: normal; color: var(--fs-lime); }
    .uk-final p { margin: 16px auto 0; font-size: 18px; color: rgba(255,255,255,0.6); }
    .uk-final__btns { display: flex; gap: 12px; justify-content: center; margin-top: 36px; flex-wrap: wrap; }
    .uk-final__note { margin-top: 18px; font-size: 13px; color: rgba(255,255,255,0.4); }

    @media (max-width: 1024px) {
      .uk-hero__inner { grid-template-columns: 1fr; gap: 48px; }
      .uk-hero__badge--tl { left: -12px; } .uk-hero__badge--br { right: -8px; }
      .uk-perks { grid-template-columns: 1fr; }
      .uk-move { grid-template-columns: repeat(3, 1fr); }
      .uk-timeline { grid-template-columns: repeat(2, 1fr); gap: 32px; } .uk-timeline::before { display: none; }
      .uk-testi-grid { grid-template-columns: 1fr; }
      .uk-foryou { grid-template-columns: 1fr; }
      .uk-price { grid-template-columns: 1fr; } .uk-price__card--featured { transform: none; }
      .uk-who { grid-template-columns: 1fr; padding: 32px; gap: 32px; }
    }
    @media (max-width: 768px) {
      .uk-hero { padding: 64px 22px 64px; }
      .uk-sec { padding: 72px 22px; }
      .uk-types { padding: 18px 22px; }
      .uk-move { grid-template-columns: repeat(2, 1fr); }
      .uk-timeline { grid-template-columns: 1fr; }
      .uk-stats { grid-template-columns: 1fr; }
      .uk-final { padding: 72px 22px; }
      .nav__links { display: none; }
    }
  </style>
</head>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    const Icon = ({ d, size = 20 }) => (
      <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">{d}</svg>
    );
    const IMail = () => <Icon d={<><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></>} />;
    const IVideo = () => <Icon d={<><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></>} />;
