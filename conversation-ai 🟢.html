const Inbox = () => {
  const [active, setActive] = useState('wa');
  const [n, setN] = useState(1);
  const [done, setDone] = useState([]);
  const [autoplay, setAutoplay] = useState(true);
  const timers = useRef([]);
  const th = THREADS.find(t => t.id === active);

  const clearAll = () => { timers.current.forEach(clearTimeout); timers.current = []; };
  useEffect(() => () => clearAll(), []);

  useEffect(() => {
    const el = document.getElementById('ca-inbox');
    if (!el) return;
    const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) setAutoplay(false); }), { threshold: 0 });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  useEffect(() => {
    clearAll();
    if (n >= th.msgs.length) {
      setDone(d => d.includes(th.id) ? d : [...d, th.id]);
      if (autoplay) {
        const i = THREADS.findIndex(t => t.id === th.id);
        const next = THREADS[(i + 1) % THREADS.length];
        timers.current.push(setTimeout(() => { setActive(next.id); setN(1); }, 3400));
      }
      return;
    }
    const nx = th.msgs[n];
    const wait = nx.s === 'ai' ? 1400 + Math.min(nx.x.length * 16, 2600) : 1100 + Math.min(nx.x.length * 10, 1400);
    timers.current.push(setTimeout(() => setN(v => v + 1), wait));
  }, [active, n, autoplay]);

  const pick = id => { setAutoplay(false); setActive(id); setN(1); };
  const shown = th.msgs.slice(0, n);
  const pending = th.msgs[n];
  const finished = n >= th.msgs.length;

  return (
    <div className="ca-inbox" id="ca-inbox">
      <div className="ca-inbox__bar">
        <IChat size={17} />
        <div className="ca-inbox__t">Posteingang · alle Kanäle</div>
        <div className="ca-inbox__st">
          <span>Unbeantwortet <b>0</b></span>
          <span>Ø Antwortzeit <b>4 s</b></span>
          <span>Heute beantwortet <b>{124 + done.length}</b></span>
        </div>
      </div>
      <div className="ca-inbox__body">
        <div className="ca-list">
          <div className="ca-list__h">Eingang · Mi, 18:42</div>
          {THREADS.map(t => {
            const I = t.icon;
            const isDone = done.includes(t.id);
            return (
              <button key={t.id} className={`ca-th${t.id === active ? ' on' : ''}`} onClick={() => pick(t.id)}>
                <div className="ca-th__ch"><I size={14} /></div>
                <div>
                  <div className="ca-th__top"><span className="ca-th__n">{t.who}</span><span className="ca-th__t">{t.t}</span></div>
                  <div className="ca-th__p">{t.prev}</div>
                  <div className="ca-th__f">
                    {isDone ? <><span className="ca-th__ok"><ICheck size={11} /></span>von KI beantwortet</> : <><span className="ca-th__dot" />{t.id === active ? 'läuft' : 'wartet'}</>}
                    <span style={{ marginLeft: 'auto' }}>{t.ch}</span>
                  </div>
                </div>
              </button>
            );
          })}
          <div className="ca-list__foot">Ein Posteingang für WhatsApp, Instagram, TikTok, Messenger, SMS, Website-Chat und E-Mail. Du liest mit, die KI antwortet.</div>
        </div>
        <div className="ca-conv">
          <div className="ca-conv__h">
            <div className="ca-conv__av">{th.ini}</div>
            <div>
              <div className="ca-conv__n">{th.who}</div>
              <div className="ca-conv__m">{th.sub}</div>
            </div>
            <span className="ca-pill ca-pill--ai">Conversation AI aktiv</span>
          </div>
          <div className="ca-stream">
            {shown.map((m, i) => (
              <div key={th.id + i} className={`ca-msg ca-msg--${m.s}`}>
                <span className="ca-msg__w">{m.s === 'ai' ? 'Conversation AI' : th.who}</span>
                <div className="ca-msg__b">{m.x}</div>
              </div>
            ))}
            {pending && (
              <div className={`ca-msg ca-msg--${pending.s}`}>
                <span className="ca-msg__w">{pending.s === 'ai' ? 'Conversation AI · schreibt' : `${th.who} · tippt`}</span>
                <div className="ca-msg__b"><span className="ca-typing"><i /><i /><i /></span></div>
              </div>
            )}
          </div>
          <div className="ca-conv__foot">
            {finished ? th.outs.map((o, i) => (
              <span key={i} className={`ca-out${o.key ? ' ca-out--key' : ''}${o.hand ? ' ca-out--hand' : ''}`}>{o.i}{o.x}</span>
            )) : <span className="ca-out__idle">Was aus dem Gespräch entsteht, erscheint hier ↓</span>}
          </div>
        </div>
      </div>
    </div>
  );
};

/* ══ 8. Final: selbst schreiben ══ */
const REPLIES = [
  { q: 'Was kostet das Programm?', a: '2.400 € — zahlbar in 3 oder 6 Raten, ohne Zuschlag. Soll ich dir die Aufteilung schicken?' },
  { q: 'Habt ihr heute noch einen Termin frei?', a: 'Heute 17:15 ist frei, sonst morgen 11:00. Ich reserviere dir 17:15 für 15 Minuten — passt das?' },
  { q: 'Ich will kündigen.', a: 'Das nehme ich nicht selbst in die Hand. Ich gebe es sofort an Nadine weiter — sie meldet sich heute noch bei dir.' },
  { q: 'Schreibe ich mit einem Menschen?', a: 'Nein, ich bin der digitale Assistent von Nadine. Wenn du sie direkt sprechen willst, hole ich sie dazu.' },
];
const FALLBACK = 'Das steht bei mir nicht sauber drin — ich will dir nichts Falsches sagen. Ich gebe die Frage an Nadine weiter und melde mich mit einer klaren Antwort. Wenn es schneller gehen soll: 20 Minuten am Telefon?';

const Final = () => {
  const [msgs, setMsgs] = useState([{ s: 'ai', x: 'Hi! Ich bin der digitale Assistent von Nadine. Frag mich was zum Coaching-Programm.' }]);
  const [typing, setTyping] = useState(false);
  const [used, setUsed] = useState([]);
  const [val, setVal] = useState('');
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const send = (q, a) => {
    setMsgs(m => [...m.slice(-5), { s: 'you', x: q }]);
    setTyping(true);
    timers.current.push(setTimeout(() => { setTyping(false); setMsgs(m => [...m, { s: 'ai', x: a }]); }, 1300));
  };
  const submit = e => {
    e.preventDefault();
    const q = val.trim();
    if (!q) return;
    setVal('');
    const hit = REPLIES.find(r => r.q.toLowerCase() === q.toLowerCase());
    send(q, hit ? hit.a : FALLBACK);
  };

  return (
    <section className="ca-sec ca-sec--ink" id="demo">
      <div className="ca-final">
        <div>
          <h2>Schreib ihr <em>jetzt</em>.</h2>
          <p>Frage wählen oder selbst tippen — die Demo ist auf ein fiktives Coaching-Business eingerichtet und reagiert genau so, wie sie es in deinem Posteingang täte.</p>
          <div className="ca-final__btns">
            <a href="#signup" className="btn btn--primary btn-lg">14 Tage kostenlos starten</a>
            <a href="#setup" className="btn btn--ghost btn-lg" style={{ borderColor: 'rgba(255,255,255,0.25)', color: 'rgba(255,255,255,0.85)' }}>Einrichtung ansehen</a>
          </div>
        </div>
        <div className="ca-demo">
          <div className="ca-demo__h"><i />Live-Demo · Website-Chat</div>
          <div className="ca-demo__stream">
            {msgs.map((m, i) => (
              <div key={i} className={`ca-dm ca-dm--${m.s}`}>
                <span className="ca-dm__w">{m.s === 'ai' ? 'Conversation AI' : 'Du'}</span>{m.x}
              </div>
            ))}
            {typing && <div className="ca-dm ca-dm--ai"><span className="ca-dm__w">Conversation AI · schreibt</span><span className="ca-typing"><i /><i /><i /></span></div>}
          </div>
          <div className="ca-asks">
            {REPLIES.map(r => (
              <button key={r.q} className="ca-ask" disabled={typing} onClick={() => { setUsed(u => u.includes(r.q) ? u : [...u, r.q]); send(r.q, r.a); }}>
                {used.includes(r.q) ? '↺ ' : ''}{r.q}
              </button>
            ))}
          </div>
          <form className="ca-form" onSubmit={submit}>
            <input value={val} onChange={e => setVal(e.target.value)} placeholder="Eigene Nachricht schreiben …" aria-label="Nachricht" />
            <button type="submit">Senden</button>
          </form>
          <p className="ca-demo__note">Demo mit hinterlegtem Leitfaden · freie Eingaben zeigen den Standardsatz bei fehlender Info</p>
        </div>
      </div>
    </section>
  );
};
