<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funnelspace Apps — Desktop &amp; Mobile · Dein Business überall dabei</title>
  <meta name="description" content="Lade die Funnelspace-App für Mac, Windows, Linux, iOS und Android. Alle Funktionen, ein Account — nahtlos synchronisiert." />
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="apps.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="Apps.jsx"></script>

  <script type="text/babel">
    const AppsCta = () => (
      <section className="cta-band">
        <h2>Bereit für Funnelspace auf allen Geräten?</h2>
        <p>Starte jetzt deine kostenlose Demo und nutze Funnelspace auf Desktop, Tablet und Smartphone.</p>
        <div className="cta-band__btns">
          <a href="#signup" className="btn btn--ink btn-lg">14 Tage kostenlos testen</a>
          <a href="#desktop" className="btn btn--ghost btn-lg" style={{borderColor:'var(--fs-lime-ink)', color:'var(--fs-lime-ink)'}}>Zu den Downloads</a>
        </div>
      </section>
    );

    const App = () => (
      <>
        <Nav />
        <main>
          <AppsHero />
          <DesktopApp />
          <MobileApp />
          <SyncBand />
        </main>
        <AppsCta />
        <Footer />
      </>
    );
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
