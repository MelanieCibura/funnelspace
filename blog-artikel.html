<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Von 0 auf 10.000 € MRR — Funnelspace Blog</title>
  <meta name="description" content="Lena hatte keinen Technik-Background und kein Marketingbudget. Trotzdem schaffte sie ihren ersten 5-stelligen Launch — mit einem simplen Funnel." />
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
  <style>
    /* ── Article layout ──────────────────────────────────────── */
    .article-wrap {
      max-width: 1280px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 320px; gap: 64px;
      padding: 64px 40px 96px;
      align-items: start;
    }

    /* ── Article header ──────────────────────────────────────── */
    .article-header { margin-bottom: 48px; }
    .article-header__meta {
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; color: var(--fg-3); margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .article-header__cat {
      background: var(--fs-lime); color: var(--fs-lime-ink);
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 3px 10px;
      border-radius: var(--radius-pill);
    }
    .article-header h1 {
      font-family: var(--font-display);
      font-size: clamp(32px, 3.8vw, 54px);
      font-weight: 700; line-height: 1.1;
      letter-spacing: -0.03em; text-wrap: balance;
      margin-bottom: 20px;
    }
    .article-header__lead {
      font-size: 20px; line-height: 1.55;
      color: var(--fg-2); margin-bottom: 28px;
      border-left: 3px solid var(--fs-lime); padding-left: 20px;
    }
    .article-header__author {
      display: flex; align-items: center; gap: 14px;
      padding: 20px 0; border-top: 1px solid var(--border-1);
      border-bottom: 1px solid var(--border-1);
    }
    .article-header__avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center; font-weight: 700; font-size: 16px; flex-shrink: 0;
    }
    .article-header__author-name { font-size: 15px; font-weight: 700; }
    .article-header__author-meta { font-size: 13px; color: var(--fg-3); margin-top: 2px; }
    .article-header__share {
      margin-left: auto; display: flex; gap: 8px; align-items: center;
    }
    .share-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--fs-gray-100); border: none; cursor: pointer;
      display: grid; place-items: center; font-size: 15px;
      transition: background var(--dur-fast);
    }
    .share-btn:hover { background: var(--fs-gray-200); }

    /* ── Hero image ──────────────────────────────────────────── */
    .article-hero-img {
      width: 100%; aspect-ratio: 16/7;
      background: var(--fs-paper); background-image: var(--fs-halftone);
      border-radius: var(--radius-xl); border: 1px solid var(--border-1);
      display: grid; place-items: center; overflow: hidden;
      margin-bottom: 48px;
    }
    .article-hero-img img { max-height: 260px; max-width: 55%; }

    /* ── Article body ────────────────────────────────────────── */
    .article-body { font-size: 17px; line-height: 1.75; color: var(--fg-1); }
    .article-body p { margin-bottom: 24px; }
    .article-body h2 {
      font-family: var(--font-display);
      font-size: 30px; font-weight: 700; letter-spacing: -0.02em;
      margin: 48px 0 16px; color: var(--fs-ink);
    }
    .article-body h3 {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
      margin: 36px 0 12px; color: var(--fs-ink);
    }
    .article-body ul, .article-body ol {
      padding-left: 0; margin: 0 0 24px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .article-body ul { list-style: none; }
    .article-body ul li {
      display: flex; gap: 12px; align-items: flex-start;
    }
    .article-body ul li::before {
      content: ""; width: 18px; height: 18px; border-radius: 50%;
      background: var(--fs-lime); flex-shrink: 0; margin-top: 4px;
    }
    .article-body ol { list-style: none; counter-reset: ol-counter; }
    .article-body ol li {
      display: flex; gap: 14px; align-items: flex-start;
      counter-increment: ol-counter;
    }
    .article-body ol li::before {
      content: counter(ol-counter);
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--fs-ink); color: #fff;
      display: grid; place-items: center; flex-shrink: 0;
      font-size: 13px; font-weight: 700; margin-top: 1px;
    }
    .article-body blockquote {
      margin: 36px 0; padding: 24px 28px;
      background: var(--fs-white); border-left: 4px solid var(--fs-lime);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      border: 1px solid var(--border-1); border-left: 4px solid var(--fs-lime);
      font-size: 19px; font-style: italic; color: var(--fs-ink-soft);
      line-height: 1.5;
    }
    .article-body blockquote cite {
      display: block; margin-top: 10px;
      font-size: 13px; font-style: normal; color: var(--fg-3);
    }

    /* ── Callout boxes ───────────────────────────────────────── */
    .callout {
      margin: 32px 0; padding: 22px 26px;
      border-radius: var(--radius-lg); border: 1px solid var(--border-1);
    }
    .callout--tip { background: #F5FAEA; border-color: var(--fs-lime-deep); }
    .callout--tip::before { content: "💡 Tipp:"; display:block; font-weight:700; font-size:13px; color:var(--fs-lime-ink); margin-bottom:8px; letter-spacing:0.02em; }
    .callout--result { background: var(--fs-ink); color: #fff; border-color: var(--fs-ink); }
    .callout--result .callout-head { font-weight:700; font-size:13px; color:var(--fs-lime); margin-bottom:8px; letter-spacing:0.05em; text-transform:uppercase; }

    /* ── Stats highlight ─────────────────────────────────────── */
    .stat-highlight {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1px; background: var(--border-1);
      border: 1px solid var(--border-1); border-radius: var(--radius-lg);
      overflow: hidden; margin: 32px 0;
    }
    .stat-highlight__item { background: var(--fs-white); padding: 24px 20px; }
    .stat-highlight__num {
      font-family: var(--font-display); font-size: 40px;
      font-weight: 700; letter-spacing: -0.04em; line-height: 1;
      color: var(--fs-ink);
    }
    .stat-highlight__num span { color: var(--fs-lime-deep); }
    .stat-highlight__label { font-size: 13px; color: var(--fg-3); margin-top: 6px; }

    /* ── Tags ────────────────────────────────────────────────── */
    .article-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 48px; padding-top: 32px; border-top: 1px solid var(--border-1); }
    .article-tag {
      padding: 5px 14px; border-radius: var(--radius-pill);
      background: var(--fs-gray-100); color: var(--fg-2);
      font-size: 13px; font-weight: 500;
      text-decoration: none;
    }
    .article-tag:hover { background: var(--fs-gray-200); }

    /* ── Author box ──────────────────────────────────────────── */
    .author-box {
      margin-top: 48px; padding: 28px;
      background: var(--fs-white); border: 1px solid var(--border-1);
      border-radius: var(--radius-lg); display: flex; gap: 20px;
    }
    .author-box__avatar {
      width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center; font-size: 22px; font-weight: 700;
    }
    .author-box__name { font-size: 17px; font-weight: 700; }
    .author-box__role { font-size: 13px; color: var(--fg-3); margin-top: 2px; }
    .author-box__bio { margin-top: 10px; font-size: 14px; color: var(--fg-2); line-height: 1.6; }

    /* ── Sidebar ─────────────────────────────────────────────── */
    .sidebar { position: sticky; top: 96px; display: flex; flex-direction: column; gap: 24px; }
    .sidebar-card {
      background: var(--fs-white); border: 1px solid var(--border-1);
      border-radius: var(--radius-lg); padding: 22px;
    }
    .sidebar-card h4 {
      font-family: var(--font-display); font-size: 15px;
      font-weight: 700; letter-spacing: -0.01em; margin-bottom: 14px;
      color: var(--fs-ink);
    }
    /* Table of contents */
    .toc-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .toc-list li a {
      display: block; font-size: 13px; color: var(--fg-2);
      text-decoration: none; padding: 5px 10px;
      border-radius: var(--radius-sm); border-left: 2px solid transparent;
      transition: all var(--dur-fast);
    }
    .toc-list li a:hover { color: var(--fs-ink); background: var(--fs-gray-100); }
    .toc-list li.active a {
      color: var(--fs-ink); border-left-color: var(--fs-lime);
      background: var(--fs-gray-100); font-weight: 600;
    }
    /* CTA card */
    .sidebar-cta {
      background: var(--fs-ink); color: #fff;
      border-color: var(--fs-ink); text-align: center;
    }
    .sidebar-cta h4 { color: #fff; font-size: 17px; }
    .sidebar-cta p { font-size: 14px; color: rgba(255,255,255,0.65); line-height: 1.5; margin-bottom: 16px; }
    /* Related */
    .related-list { display: flex; flex-direction: column; gap: 14px; }
    .related-item { display: flex; gap: 12px; align-items: flex-start; text-decoration: none; color: inherit; }
    .related-item__img {
      width: 52px; height: 52px; border-radius: var(--radius-sm);
      background: var(--fs-paper); background-image: var(--fs-halftone);
      flex-shrink: 0; display: grid; place-items: center;
    }
    .related-item__img img { max-width: 38px; max-height: 38px; }
    .related-item__title { font-size: 13px; font-weight: 600; line-height: 1.4; color: var(--fs-ink); }
    .related-item__meta { font-size: 12px; color: var(--fg-3); margin-top: 3px; }
    .related-item:hover .related-item__title { color: var(--fs-ink-soft); }

    /* ── Next article ────────────────────────────────────────── */
    .next-article {
      max-width: 1280px; margin: 0 auto; padding: 0 40px 80px;
    }
    .next-article h3 {
      font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--fg-3); margin-bottom: 16px;
    }
    .next-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .next-card {
      background: var(--fs-white); border: 1px solid var(--border-1);
      border-radius: var(--radius-lg); padding: 22px;
      display: flex; gap: 16px; align-items: flex-start;
      text-decoration: none; color: inherit;
      transition: box-shadow var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out);
    }
    .next-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .next-card__img {
      width: 72px; height: 72px; border-radius: var(--radius-sm);
      background: var(--fs-paper); background-image: var(--fs-halftone);
      flex-shrink: 0; display: grid; place-items: center;
    }
    .next-card__img img { max-width: 50px; max-height: 50px; }
    .next-card__cat { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 5px; }
    .next-card__title { font-size: 16px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
    .next-card__meta { font-size: 13px; color: var(--fg-3); margin-top: 5px; }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 1024px) {
      .article-wrap { grid-template-columns: 1fr; gap: 48px; }
      .sidebar { position: static; }
      .stat-highlight { grid-template-columns: 1fr 1fr 1fr; }
    }
    @media (max-width: 768px) {
      .article-wrap { padding: 40px 24px 64px; }
      .next-article { padding: 0 24px 64px; }
      .next-cards { grid-template-columns: 1fr; }
      .stat-highlight { grid-template-columns: 1fr; }
      .article-header__share { display: none; }
      .nav__links { display: none; }
    }
  </style>
</head>
<body>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Nav.jsx"></script>

  <script type="text/babel">

    const TOC = [
      { id: 'ausgangslage', label: 'Die Ausgangslage' },
      { id: 'strategie', label: 'Die Strategie: Ein Funnel, eine Sequenz' },
      { id: 'schritt1', label: 'Schritt 1: Die Opt-In-Seite' },
      { id: 'schritt2', label: 'Schritt 2: Die 5-E-Mail-Sequenz' },
      { id: 'schritt3', label: 'Schritt 3: Die Sales Page' },
      { id: 'ergebnis', label: 'Das Ergebnis' },
      { id: 'fazit', label: 'Was du mitnehmen kannst' },
    ];

    const RELATED = [
      { img: 'email.png', cat: 'E-Mail Marketing', title: 'Die 5-E-Mail-Sequenz, die jeden Kaltlead in einen Käufer verwandelt', meta: '5 Min. Lesezeit' },
      { img: 'crm.png', cat: 'CRM & Vertrieb', title: 'CRM für Solopreneure: Warum eine einfache Pipeline mehr bringt als Excel', meta: '4 Min. Lesezeit' },
      { img: 'funnel.png', cat: 'Funnel & Conversion', title: '7 Funnel-Fehler, die Conversions kosten — und wie du sie vermeidest', meta: '6 Min. Lesezeit' },
    ];

    const Breadcrumb = () => (
      <div style={{padding:'16px 40px', borderBottom:'1px solid var(--border-1)', background:'var(--fs-white)'}}>
        <div style={{maxWidth:1280, margin:'0 auto', fontSize:13, color:'var(--fg-3)', display:'flex', gap:8, alignItems:'center'}}>
          <a href="index.html" style={{color:'var(--fg-3)', textDecoration:'none'}}>Startseite</a>
          <span>›</span>
          <a href="blog.html" style={{color:'var(--fg-3)', textDecoration:'none'}}>Blog</a>
          <span>›</span>
          <span style={{color:'var(--fs-ink)', fontWeight:500}}>Praxistipps</span>
        </div>
      </div>
    );

    const ArticleHeader = () => (
      <div className="article-header">
        <div className="article-header__meta">
          <span className="article-header__cat">Praxistipps</span>
          <span>18. April 2026</span>
          <span>·</span>
          <span>8 Min. Lesezeit</span>
        </div>
        <h1>Von 0 auf 10.000 € MRR: Wie Lena ihren ersten Kurs mit einem einzigen Funnel ausverkauft hat</h1>
        <p className="article-header__lead">
          Lena hatte keinen Technik-Background und kein Marketingbudget.
          Trotzdem schaffte sie ihren ersten 5-stelligen Launch — mit einem simplen
          Opt-In-Funnel und einer 5-stufigen E-Mail-Sequenz.
        </p>
        <div className="article-header__author">
          <div className="article-header__avatar">JB</div>
          <div>
            <div className="article-header__author-name">Julia Baum</div>
            <div className="article-header__author-meta">Content & Community · Funnelspace</div>
          </div>
          <div className="article-header__share">
            <button className="share-btn" title="Teilen">🔗</button>
            <button className="share-btn" title="LinkedIn">in</button>
            <button className="share-btn" title="Twitter/X">𝕏</button>
          </div>
        </div>
      </div>
    );

    const ArticleBody = () => (
      <div className="article-body">
        <div className="article-hero-img">
          <img src="assets/illustrations/funnel.png" alt="Funnel Illustration" />
        </div>

        <p>
          Als Lena Meinhardt im März 2025 ihre erste Funnelspace-Testphase startete,
          hatte sie genau drei Dinge: eine Idee für einen Business-Coaching-Kurs,
          eine kleine Instagram-Community mit 1.200 Followern — und keinerlei Plan,
          wie sie daraus ein echtes Business machen sollte.
        </p>
        <p>
          Neun Monate später hatte sie 4.200 zahlende Kund:innen, einen automatisierten
          Launch-Prozess und einen monatlich wiederkehrenden Umsatz, der ihr erlaubt,
          vollständig von ihrem Online-Business zu leben. Das Werkzeug dahinter: ein
          einziger Funnel, aufgebaut in einem einzigen Werkzeug.
        </p>

        <h2 id="ausgangslage">Die Ausgangslage</h2>
        <p>
          Lena ist keine Technikerin. Vor Funnelspace hatte sie es mit verschiedenen
          Tools versucht — ein Landinpage-Builder hier, ein E-Mail-Tool dort, ein
          separates Kurs-System obendrauf. Das Ergebnis: kaputte Schnittstellen,
          verlorene Leads und jede Menge Frustration.
        </p>
        <blockquote>
          „Ich habe mehr Zeit damit verbracht, meine Tools zum Miteinander-Reden zu
          bringen, als tatsächlich Inhalte zu erstellen. Das kann nicht der Plan sein."
          <cite>— Lena Meinhardt, Business-Coach</cite>
        </blockquote>
        <p>
          Der Wechsel zu Funnelspace war für Lena weniger eine Entscheidung für
          ein bestimmtes Tool — sondern die Entscheidung, endlich aufzuhören,
          fünf verschiedene Systeme zu jonglieren.
        </p>

        <h2 id="strategie">Die Strategie: Ein Funnel, eine Sequenz</h2>
        <p>
          Lenas Setup war bewusst einfach gehalten. Kein komplexes Automation-System,
          kein ausgefeilter Multi-Step-Funnel. Stattdessen setzte sie auf das
          Minimal-Effective-Dose-Prinzip:
        </p>
        <ol>
          <li>Eine Opt-In-Seite mit einem kostenlosen PDF-Leadmagneten</li>
          <li>Eine 5-teilige E-Mail-Sequenz, die Vertrauen aufbaut und auf den Kurs hinführt</li>
          <li>Eine Sales Page, die das Angebot klar und überzeugend präsentiert</li>
        </ol>
        <p>
          Kein Upsell, kein Webinar, kein Countdown-Timer. Nur ein klarer Pfad
          von Interesse bis Kauf.
        </p>

        <div className="callout callout--tip">
          Bevor du einen komplexen Funnel baust, teste immer zuerst das einfachste
          mögliche Setup. Komplexität löst keine Grundsatzprobleme — sie versteckt sie nur.
        </div>

        <h2 id="schritt1">Schritt 1: Die Opt-In-Seite</h2>
        <p>
          Der Leadmagnet war ein 12-seitiges PDF: <em>„Die 5 Fehler, die dich davon abhalten,
          deinen ersten Kurs zu launchen"</em>. Direkt auf Lenas Zielgruppe zugeschnitten —
          Menschen wie sie selbst vor einem Jahr.
        </p>
        <p>
          Die Opt-In-Seite war bewusst minimal: eine Überschrift, drei Bulletpoints,
          ein Formular. Keine Ablenkung, kein Navigation-Menü, kein Header-Bild mit
          generischem Stock-Foto. Conversion Rate: 47 %.
        </p>
        <ul>
          <li>Headline mit klarem Versprechen und spezifischem Ergebnis</li>
          <li>3 Bulletpoints, die den Wert des PDFs konkret benennen</li>
          <li>Formular nur mit Name und E-Mail — kein Telefon, keine Adresse</li>
          <li>„Keine Angst vor Spam"-Hinweis direkt unterm Button</li>
        </ul>

        <div className="stat-highlight">
          <div className="stat-highlight__item">
            <div className="stat-highlight__num">47<span>%</span></div>
            <div className="stat-highlight__label">Opt-In Conversion Rate</div>
          </div>
          <div className="stat-highlight__item">
            <div className="stat-highlight__num">1.2<span>k</span></div>
            <div className="stat-highlight__label">Neue E-Mail-Kontakte in 3 Wochen</div>
          </div>
          <div className="stat-highlight__item">
            <div className="stat-highlight__num">0<span>€</span></div>
            <div className="stat-highlight__label">Werbebudget eingesetzt</div>
          </div>
        </div>

        <h2 id="schritt2">Schritt 2: Die 5-E-Mail-Sequenz</h2>
        <p>
          Direkt nach dem Opt-In startete die Sequenz. Lena schrieb alle fünf Mails
          selbst — in einem Nachmittag. Keine KI, keine Agentur. Nur ehrliche Texte,
          die ihre Geschichte erzählten.
        </p>
        <p>Das Prinzip hinter den fünf Mails:</p>
        <ol>
          <li><strong>Willkommen & Lieferung</strong> — Das PDF, eine kurze Vorstellung, was als nächstes kommt</li>
          <li><strong>Die Geschichte</strong> — Lenas eigener Weg, ihr größter Fehler, was sie gelernt hat</li>
          <li><strong>Das Problem tiefer graben</strong> — Warum Kurs-Creator scheitern, obwohl sie gute Inhalte haben</li>
          <li><strong>Die Lösung vorstellen</strong> — Soft-Intro des Kurses, kein harter Verkauf</li>
          <li><strong>Das Angebot</strong> — Klares CTA zur Sales Page, Bonus für schnelle Entscheider</li>
        </ol>
        <p>
          Öffnungsrate der Sequenz: durchschnittlich 58 %. Click-Through auf die
          Sales Page nach E-Mail 5: 22 %.
        </p>

        <blockquote>
          „Die fünf Mails haben mehr verkauft als jeder Instagram-Post, den ich je
          gemacht habe. Und ich habe sie einmal geschrieben — seitdem laufen sie von alleine."
          <cite>— Lena Meinhardt</cite>
        </blockquote>

        <h2 id="schritt3">Schritt 3: Die Sales Page</h2>
        <p>
          Die Sales Page war länger als Lena zunächst gedacht hatte — rund 2.800 Wörter.
          Aber jede Sektion hatte eine klare Aufgabe:
        </p>
        <ul>
          <li>Headline — das Ergebnis, das Kund:innen kaufen (nicht den Kurs)</li>
          <li>Für-wen-das-ist — klare Abgrenzung der Zielgruppe</li>
          <li>Was du lernst — konkrete Lernziele, keine generischen Versprechen</li>
          <li>Über Lena — kurz, glaubwürdig, persönlich</li>
          <li>Testimonials — drei echte Kund:innen aus dem Beta-Kurs</li>
          <li>FAQ — die 8 wichtigsten Kaufhindernisse direkt entkräften</li>
          <li>Angebot & Preis — klar, ohne Verwirrung, mit Geld-zurück-Garantie</li>
        </ul>
