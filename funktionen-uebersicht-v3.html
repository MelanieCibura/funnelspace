<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alle Funktionen im Überblick — Funnelspace</title>
<meta name="description" content="Alle Funktionen von Funnelspace, gruppiert nach dem, was du gerade brauchst: Leads gewinnen, verkaufen & betreuen, skalieren. Von jeder Kachel direkt zum Feature." />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="site.css" />
<style>
/* Hero */
.fx-hero{padding:80px 40px 68px;position:relative;overflow:hidden}
.fx-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:11px 11px;opacity:.55;pointer-events:none}
.fx-hero__inner{max-width:1280px;margin:0 auto;position:relative;text-align:center;max-width:860px}
.fx-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fs-ink);background:var(--fs-lime);padding:6px 12px;border-radius:var(--radius-pill);margin-bottom:22px}
.fx-hero h1{font-family:var(--font-display);font-size:clamp(40px,4.8vw,66px);font-weight:700;line-height:1.04;letter-spacing:-.03em;text-wrap:balance}
.fx-hero h1 em{font-style:normal;background:var(--fs-lime);color:var(--fs-lime-ink);padding:0 6px;border-radius:6px}
.fx-hero__lead{margin:22px auto 0;font-size:19px;line-height:1.55;color:var(--fg-2);max-width:600px}
.fx-hero__cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap;justify-content:center}
/* Phasen-Strip */
.fx-strip{border-top:1px solid var(--border-1);border-bottom:1px solid var(--border-1);background:var(--fs-white)}
.fx-strip__inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.fx-phase{padding:28px 40px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;text-decoration:none;color:inherit;transition:background var(--dur-fast) var(--ease-out)}
.fx-phase:hover{background:var(--fs-lime-soft);color:inherit}
.fx-phase+.fx-phase{border-left:1px solid var(--border-1)}
.fx-phase__n{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--fs-lime-ink);background:var(--fs-lime);padding:4px 8px;border-radius:4px}
.fx-phase__t{display:block;font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.fx-phase__d{display:block;margin-top:6px;font-size:13.5px;color:var(--fg-3);line-height:1.45}
.fx-phase__c{margin-top:10px;font-family:var(--font-mono);font-size:11px;color:var(--fs-ink-soft);display:flex;align-items:center;gap:6px}
.fx-phase__c svg{width:13px;height:13px}
/* Sections */
.fx-sec{padding:96px 40px 40px}
.fx-sec__inner{max-width:1280px;margin:0 auto}
.fx-sec__head{max-width:740px;margin:0 auto 60px;text-align:center}
.fx-sec__eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
.fx-sec__head h2{font-family:var(--font-display);font-size:clamp(32px,3.5vw,50px);font-weight:700;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.fx-sec__head h2 em{font-style:normal;background:var(--fs-lime);color:var(--fs-lime-ink);padding:0 8px;border-radius:6px}
.fx-sec__head p{margin-top:16px;font-size:18px;color:var(--fg-2);line-height:1.55}
/* Gruppen-Header (Zahl · Titel · Subline in einer Zeile) */
.fx-group{scroll-margin-top:96px}
.fx-group+.fx-group{margin-top:64px;padding-top:56px;border-top:1px solid var(--border-1)}
.fx-group__head{display:flex;align-items:baseline;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.fx-group__n{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--fs-ink);background:var(--fs-lime);padding:3px 8px;border-radius:4px}
.fx-group__title{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.02em}
.fx-group__sub{font-size:15px;color:var(--fg-3);line-height:1.4}
.fx-group__meta{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--fg-3)}
/* Kategorie-Karten (Stil aus ki-tools) */
.fx-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.fx-card{background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:22px;display:flex;flex-direction:column;gap:12px;transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out)}
.fx-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.fx-card__art{width:100%;aspect-ratio:16/10;background:var(--fs-paper);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:9px 9px;border-radius:var(--radius-md);display:grid;place-items:center;overflow:hidden;border:1px solid var(--border-1)}
.fx-card__art img{max-height:120px;max-width:72%}
.fx-card__top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fx-card__top h3{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.fx-card__top h3 a{text-decoration:none;color:var(--fs-ink)}
.fx-card__top h3 a:hover{color:var(--fs-lime-deep)}
.fx-tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:var(--radius-pill);background:var(--fs-gray-100);color:var(--fs-ink-soft)}
.fx-tag--live{background:var(--fs-lime);color:var(--fs-lime-ink)}
.fx-card__d{font-size:14px;color:var(--fg-2);line-height:1.55}
.fx-feats{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:7px}
.fx-feats a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fg-2);text-decoration:none;background:var(--fs-paper);border:1px solid var(--border-1);border-radius:var(--radius-pill);padding:6px 11px;transition:all var(--dur-fast) var(--ease-out)}
.fx-feats a::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--fs-lime-deep);flex-shrink:0}
.fx-feats a.soft::before{background:var(--fs-gray-300)}
.fx-feats a:hover{border-color:var(--fs-ink);color:var(--fs-ink);background:#fff}
.fx-card__link{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-1);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--fs-ink);text-decoration:none}
.fx-card__link svg{width:15px;height:15px;transition:transform var(--dur-fast) var(--ease-out)}
.fx-card:hover .fx-card__link svg{transform:translateX(3px)}
/* KI-Spotlight */
.fx-spot{max-width:1280px;margin:32px auto 0;background:var(--fs-lime);border:2px solid var(--fs-ink);border-radius:var(--radius-xl);overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
.fx-spot__txt{padding:48px 44px}
.fx-spot__eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fs-lime-ink);opacity:.65}
.fx-spot__txt h3{margin-top:14px;font-family:var(--font-display);font-size:clamp(28px,3vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.08;color:var(--fs-lime-ink);text-wrap:balance}
.fx-spot__txt p{margin-top:16px;font-size:16.5px;line-height:1.6;color:var(--fs-lime-ink);opacity:.82;max-width:420px}
.fx-spot__cta{margin-top:28px}
.fx-spot__visual{background:var(--fs-ink);padding:32px;display:flex;flex-direction:column;gap:10px;justify-content:center;position:relative;overflow:hidden}
.fx-spot__visual::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.08) 1px,transparent 1.2px);background-size:8px 8px}
.fx-spot__l{position:relative;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fs-lime);font-weight:700;margin-bottom:4px}
.fx-sub{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:var(--radius-md);padding:14px 16px;text-decoration:none;transition:background var(--dur-fast) var(--ease-out),transform var(--dur-med) var(--ease-out)}
.fx-sub:hover{background:rgba(255,255,255,.1);transform:translateY(-2px);color:inherit}
.fx-sub__t{font-family:var(--font-display);font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em}
.fx-sub__d{display:block;margin-top:4px;font-size:12.5px;font-family:var(--font-sans);font-weight:400;color:rgba(255,255,255,.55);line-height:1.4}
.fx-sub svg{width:15px;height:15px;color:var(--fs-lime)}
.fx-note{max-width:1280px;margin:0 auto;padding:56px 40px 80px;font-size:13px;color:var(--fg-3);line-height:1.6}
/* Final */
.fx-final{background:var(--fs-ink);padding:96px 40px;text-align:center;position:relative;overflow:hidden}
.fx-final::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.07) 1px,transparent 1.2px);background-size:8px 8px}
.fx-final__inner{position:relative;max-width:740px;margin:0 auto}
.fx-final h2{font-family:var(--font-display);font-size:clamp(32px,3.8vw,52px);font-weight:700;letter-spacing:-.03em;color:#fff;text-wrap:balance}
.fx-final h2 em{font-style:normal;color:var(--fs-lime)}
.fx-final p{margin:16px auto 0;font-size:18px;color:rgba(255,255,255,.6)}
.fx-final__btns{display:flex;gap:12px;justify-content:center;margin-top:32px;flex-wrap:wrap}
a{color:var(--fs-ink)}a:hover{color:var(--fs-lime-deep)}
@media(max-width:1024px){
.fx-strip__inner{grid-template-columns:1fr}
.fx-phase+.fx-phase{border-left:none;border-top:1px solid var(--border-1)}
.fx-cards{grid-template-columns:1fr 1fr}
.fx-spot{grid-template-columns:1fr}
}
@media(max-width:768px){
.fx-hero{padding:56px 22px}
.fx-sec{padding:64px 22px 32px}
.fx-group__meta{margin-left:0;width:100%}
.fx-cards{grid-template-columns:1fr}
.fx-phase{padding:22px}
.fx-spot__txt{padding:32px 24px}
.fx-spot__visual{padding:22px}
.fx-note{padding:0 22px 60px}
.fx-final{padding:68px 22px}
.nav__links{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
const IArrow = ({size=15}) => (
  <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
);
const ILL = 'assets/illustrations/';
const FALLBACK = 'funktionen.html';
const PAGES = {
  'CRM & Pipeline': 'crm.html',
  'Kalender & Termine': 'kalender%20%F0%9F%9F%A2.html',
  'E-Mail-Marketing': 'email-marketing%20%F0%9F%9F%A2.html',
  'Kurse & Community': 'mitgliederbereich.html',
  'Automationen': 'automationen%20%F0%9F%9F%A2.html',
  'KI-Tools': 'ki-tools-v4.html',
  'Blog': 'blog-feature-v3.html',
  'Templates': 'templates%20%F0%9F%9F%A1.html',
  'Mobile App': 'apps.html',
  'Ask AI': 'ask-ai.html',
  'Conversation AI': 'conversation-ai%20%F0%9F%9F%A2.html',
  'Voice AI': 'voice-ai-v3%20%F0%9F%9F%A2.html',
  'AI Studio': 'ai-studio.html',
};
const linkTo = (n) => PAGES[n] || FALLBACK;

const PHASES = [
  {
    id: 'leads', n: '01', title: 'Leads gewinnen',
    strip: 'Sichtbar werden und aus Besuchern Kontakte machen.',
    eyebrow: 'Phase 01',
    h2a: 'Erst kommen die ', h2em: 'Leads',
    lead: 'Seiten, Termine und Bewertungen in einem System — jeder Kontakt landet direkt im CRM, ohne Zwischenschritt.',
    groups: [
      { name: 'Funnels & Websites', img: 'funnel.png', tag: 'Kern', live: true,
        d: 'Landingpages, Sales-Funnels und ganze Websites bauen — mobiloptimiert und gehostet.',
        f: ['Funnel- und Seiten-Builder', 'Blog', 'Templates', 'Domains', 'Hosting', 'Formulare', 'Umfragen', 'Chat-Widget', 'QR-Codes'] },
      { name: 'Kalender & Termine', img: 'calendar.png', tag: 'Kern', live: true,
        d: 'Termin-Buchung ohne Hin und Her. Jede Buchung hängt am Kontakt, Erinnerungen laufen automatisch.',
        f: ['Buchungsseiten', 'Team-Kalender', 'Round-Robin', 'Erinnerungen', 'Zoom & Google Meet', 'No-Show-Handling'] },
      { name: 'Social Media & Bewertungen', img: 'social-media.png', tag: 'Sichtbarkeit',
        d: 'Beiträge planen, Google-Profil pflegen, Bewertungen automatisch anfragen — Social Proof arbeitet mit.',
        f: ['Social Planner', 'Google Business Profil', 'Bewertungsanfragen', 'Review-Management'] },
    ],
  },
  {
    id: 'verkaufen', n: '02', title: 'Verkaufen & betreuen',
    strip: 'Aus Kontakten Kunden machen — und sie halten.',
    eyebrow: 'Phase 02',
    h2a: 'Dann wird ', h2em: 'verkauft',
    lead: 'Ein Postfach für alle Kanäle, Angebote und Zahlungen im System, Kurse und Community gleich mit.',
    groups: [
      { name: 'CRM & Pipeline', img: 'crm.png', tag: 'Kern', live: true,
        d: 'Alle Kontakte, Deals und Aufgaben an einem Ort — mit Verlauf, Tags und Quelle pro Lead.',
        f: ['Kontakte', 'Smart Lists', 'Tags', 'Eigene Felder', 'Deals', 'Aufgaben', 'Notizen'] },
      { name: 'Postfach & Kommunikation', img: 'dashboard-funnelspace.png', tag: 'Kern', live: true,
        d: 'Alle Kanäle in einem Postfach. Du antwortest an einer Stelle, der Verlauf bleibt beim Kontakt.',
        f: ['E-Mail', 'SMS', 'WhatsApp', 'Instagram', 'Facebook', 'Live-Chat', 'Telefonie', 'Missed-Call-Textback', 'Mobile App'] },
      { name: 'Zahlungen & Verträge', img: 'onlineshop.png', tag: 'Umsatz',
        d: 'Verkaufen, abrechnen und unterschreiben lassen — vom Warenkorb bis zur Signatur ohne Zusatztool.',
        f: ['Produkte', 'Warenkorb', 'Upsells', 'Abos', 'Rechnungen', 'Angebote', 'Verträge mit E-Signatur', 'Stripe', 'PayPal'] },
      { name: 'Kurse & Community', img: 'mitgliederbereich.png', tag: 'Betreuung',
        d: 'Mitgliederbereiche, die beim Kauf automatisch freigeschaltet werden — inklusive Zertifikat und Feed.',
        f: ['Mitgliederbereiche', 'Kurse', 'Zertifikate', 'Community-Feed'] },
    ],
  },
  {
    id: 'skalieren', n: '03', title: 'Skalieren',
    strip: 'Automationen, Kampagnen, Zahlen und KI.',
    eyebrow: 'Phase 03',
    h2a: 'Und dann ', h2em: 'skaliert',
    lead: 'Was funktioniert, läuft automatisch weiter: Workflows, Kampagnen, echte Zahlen — und KI, die Arbeit übernimmt.',
    groups: [
      { name: 'Automationen', img: 'automation.png', tag: 'Kern', live: true,
        d: 'Wenn-Dann-Regeln über alle Module hinweg. Trigger aus Funnel, Shop, Kalender und CRM — ohne Brücke dazwischen.',
        f: ['Workflow-Builder', 'Trigger', 'Trigger Links', 'Webhooks', 'Schnittstellen'] },
      { name: 'E-Mail-Marketing', img: 'email.png', tag: 'Reichweite',
        d: 'Broadcasts, Newsletter und Sequenzen an Segmente, die aus deinem CRM kommen statt aus einer CSV.',
        f: ['Kampagnen', 'Newsletter', 'Broadcasts', 'Segmente', 'Vorlagen'] },
      { name: 'Reporting & Analytics', img: 'seo.png', tag: 'Zahlen',
        d: 'Sehen, was wirklich verkauft: von der Anzeige bis zum Abschluss in einer Attribution.',
        f: ['Dashboards', 'Funnel-Statistiken', 'Attribution', 'Call-Reporting', 'Ads-Reporting'] },
    ],
    ai: {
      title: 'KI-Tools: dein Team, das nie schläft',
      d: 'Anrufe annehmen, Anfragen beantworten, Seiten bauen. Vier Agenten mit eigener Detailseite — alle auf demselben Datenraum.',
      subs: [
        { n: 'Ask AI', d: 'Fragen zum Tool, direkt im Tool beantwortet.' },
        { n: 'Conversation AI', d: 'Antwortet und qualifiziert in Chat, DM und Mail.' },
        { n: 'Voice AI', d: 'Nimmt Anrufe an und bucht Termine.' },
        { n: 'AI Studio', d: 'Ganze Seiten und Funnels per Prompt.' },
      ],
    },
  },
];
const countFeats = (p) => p.groups.reduce((s, g) => s + g.f.length, 0) + (p.ai ? p.ai.subs.length : 0);

const Hero = () => (
  <section className="fx-hero">
    <div className="fx-hero__inner">
      <span className="fx-eyebrow">Funktionen</span>
      <h1>Alles, was du brauchst — <em>sortiert nach dem, was du willst.</em></h1>
      <p className="fx-hero__lead">Drei Phasen, elf Bereiche, jede Funktion einen Klick entfernt. Kein Feature-Bingo, sondern die Reihenfolge, in der du wirklich arbeitest.</p>
      <div className="fx-hero__cta">
        <a href="#signup" className="btn btn--primary btn-lg">14 Tage kostenlos testen</a>
        <a href="#leads" className="btn btn--ghost btn-lg">Alle Funktionen ansehen</a>
      </div>
    </div>
  </section>
);

const Strip = () => (
  <div className="fx-strip">
    <div className="fx-strip__inner">
      {PHASES.map(p => (
        <a key={p.id} className="fx-phase" href={`#${p.id}`}>
          <span className="fx-phase__n">{p.n}</span>
          <span>
            <span className="fx-phase__t">{p.title}</span>
            <span className="fx-phase__d">{p.strip}</span>
            <span className="fx-phase__c">{countFeats(p)} Funktionen <IArrow size={13} /></span>
          </span>
        </a>
      ))}
    </div>
  </div>
);

const Card = ({ g }) => (
  <div className="fx-card">
    <div className="fx-card__art"><img src={ILL + g.img} alt="" /></div>
    <div className="fx-card__top">
      <h3><a href={linkTo(g.name)}>{g.name}</a></h3>
      <span className={`fx-tag${g.live ? ' fx-tag--live' : ''}`}>{g.tag}</span>
    </div>
    <p className="fx-card__d">{g.d}</p>
    <ul className="fx-feats">
      {g.f.map(f => <li key={f}><a href={linkTo(f)} className={PAGES[f] ? '' : 'soft'}>{f}</a></li>)}
    </ul>
    <a className="fx-card__link" href={linkTo(g.name)}>{g.name} ansehen <IArrow /></a>
  </div>
);

const Spotlight = ({ ai }) => (
  <div className="fx-spot">
    <div className="fx-spot__txt">
      <div className="fx-spot__eyebrow">Eigener Bereich</div>
      <h3>{ai.title}</h3>
      <p>{ai.d}</p>
      <div className="fx-spot__cta">
        <a href={linkTo('KI-Tools')} className="btn btn--ink btn-lg">Alle KI-Tools ansehen <IArrow /></a>
      </div>
    </div>
    <div className="fx-spot__visual">
      <div className="fx-spot__l">Vier Unterseiten</div>
      {ai.subs.map(s => (
        <a key={s.n} className="fx-sub" href={linkTo(s.n)}>
          <span className="fx-sub__t">{s.n}<span className="fx-sub__d">{s.d}</span></span>
          <IArrow />
        </a>
      ))}
    </div>
  </div>
);

const Phase = ({ p }) => (
  <div className="fx-group" id={p.id} data-screen-label={p.title}>
    <div className="fx-group__head">
      <span className="fx-group__n">{p.n}</span>
      <span className="fx-group__title">{p.title}</span>
      <span className="fx-group__sub">{p.strip}</span>
      <span className="fx-group__meta">{p.groups.length + (p.ai ? 1 : 0)} Bereiche · {countFeats(p)} Funktionen</span>
    </div>
    <div className="fx-cards">{p.groups.map(g => <Card key={g.name} g={g} />)}</div>
    {p.ai && <Spotlight ai={p.ai} />}
  </div>
);

const Final = () => (
  <section className="fx-final">
    <div className="fx-final__inner">
      <h2>Ein Tool statt <em>fünf Rechnungen</em>.</h2>
      <p>Alle Bereiche sind in jedem Tarif dabei. Du entscheidest, womit du anfängst.</p>
      <div className="fx-final__btns">
        <a href="#signup" className="btn btn--primary btn-lg">14 Tage kostenlos testen</a>
        <a href="preise.html" className="btn btn--ghost btn-lg" style={{borderColor:'rgba(255,255,255,0.3)',color:'#fff'}}>Preise ansehen</a>
      </div>
    </div>
  </section>
);

const App = () => (
  <>
    <Nav />
    <main>
      <Hero />
      <Strip />
      <section className="fx-sec">
        <div className="fx-sec__inner">
          <div className="fx-sec__head">
            <div className="fx-sec__eyebrow">Alle Bereiche</div>
            <h2>Sortiert nach dem, <em>was du gerade brauchst</em></h2>
            <p>Von der ersten Landingpage bis zur Automation, die nachts läuft. Jeder Bereich ist eine Kachel, jede Funktion ein Klick.</p>
          </div>
          {PHASES.map(p => <Phase key={p.id} p={p} />)}
        </div>
      </section>
      <p className="fx-note">Hinweis für die Abstimmung: Bereiche und Einzelfunktionen mit fertiger Detailseite sind direkt verlinkt (lime Punkt). Funktionen mit grauem Punkt zeigen vorerst auf die Funktionsliste — Ziele lassen sich jederzeit eintragen.</p>
      <Final />
    </main>
    <Footer />
  </>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
