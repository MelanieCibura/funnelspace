<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tool-Umzugsservice — Funnelspace</title>
  <meta name="description" content="Wir ziehen deine Tools, Funnels, E-Mails und Kontakte in 3–7 Tagen zu Funnelspace um. Schnell, sauber, stressfrei — ohne Datenverlust, ohne Technik-Chaos." />
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
  <style>
    /* ─────────────────────────────────────────────────────────
       Umzugsservice — eigenständige Page
       ───────────────────────────────────────────────────────── */

    /* ── Hero ───────────────────────────────────────────────── */
    .um-hero {
      background: var(--fs-ink); color: #fff;
      padding: 88px 40px 96px; position: relative; overflow: hidden;
    }
    .um-hero::before {
      content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(215,240,120,0.06) 1px, transparent 1.2px);
      background-size: 8px 8px; pointer-events: none;
    }
    .um-hero__inner {
      max-width: 1280px; margin: 0 auto; position: relative;
      display: grid; grid-template-columns: 1.1fr 1fr; gap: 72px; align-items: center;
    }
    .um-hero__eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--fs-lime);
      background: rgba(215,240,120,0.08); border: 1px solid rgba(215,240,120,0.3);
      padding: 6px 14px; border-radius: var(--radius-pill); margin-bottom: 24px;
    }
    .um-hero__eyebrow::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--fs-lime);
    }
    .um-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(42px, 5vw, 68px);
      font-weight: 700; line-height: 1.05;
      letter-spacing: -0.03em; text-wrap: balance; color: #fff;
    }
    .um-hero h1 em { font-style: normal; color: var(--fs-lime); }
    .um-hero__tag {
      margin-top: 18px; font-family: var(--font-display);
      font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
      color: #fff;
    }
    .um-hero__tag span { color: var(--fs-lime); }
    .um-hero__tag span + span::before { content: "·"; color: rgba(255,255,255,0.3); margin: 0 10px; font-weight: 400; }
    .um-hero__lead {
      margin-top: 22px; font-size: 17px; line-height: 1.6;
      color: rgba(255,255,255,0.7); max-width: 540px;
    }
    .um-hero__cta { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; align-items: center; }
    .um-hero__note { font-size: 13px; color: rgba(255,255,255,0.5); }

    /* Hero-Visual: Truck/Box stack illustration SVG */
    .um-hero__visual {
      position: relative; aspect-ratio: 1/1;
      background: var(--fs-paper);
      background-image: radial-gradient(var(--fs-gray-300) 1.2px, transparent 1.4px);
      background-size: 12px 12px;
      border-radius: var(--radius-xl); padding: 32px;
      box-shadow: 0 40px 80px -20px rgba(0,0,0,0.45);
      display: grid; place-items: center;
    }

    /* Floating "status" card on hero */
    .um-hero__card {
      position: absolute; bottom: -28px; left: -24px;
      background: #fff; color: var(--fs-ink);
      border-radius: var(--radius-lg); padding: 14px 18px;
      box-shadow: var(--shadow-lg); min-width: 240px;
    }
    .um-hero__card-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
    .um-hero__card-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--fs-ink-soft); }
    .um-hero__card-row + .um-hero__card-row { margin-top: 6px; }
    .um-hero__card-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--fs-lime); display: grid; place-items: center; color: var(--fs-lime-ink);
      font-size: 9px; font-weight: 900; flex-shrink: 0;
    }
    .um-hero__card-dot--empty { background: var(--fs-gray-200); color: transparent; }
    .um-hero__card-dot--current { background: var(--fs-ink); color: #fff; }

    .um-hero__badge {
      position: absolute; top: -14px; right: -14px;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      border-radius: var(--radius-md); padding: 12px 16px;
      font-family: var(--font-display); text-align: center;
      box-shadow: var(--shadow-md);
      transform: rotate(3deg);
    }
    .um-hero__badge-num { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
    .um-hero__badge-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; }

    /* ── Shared section ─────────────────────────────────────── */
    .um-sec { padding: 104px 40px; }
    .um-sec--alt { background: var(--fs-white); }
    .um-sec--ink { background: var(--fs-ink); color: #fff; }
    .um-sec__inner { max-width: 1280px; margin: 0 auto; }
    .um-sec__head { max-width: 740px; margin: 0 auto 60px; text-align: center; }
    .um-sec__head--left { margin: 0 0 56px; text-align: left; }
    .um-eyebrow {
      display: inline-block;
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px;
    }
    .um-sec--ink .um-eyebrow { color: rgba(255,255,255,0.5); }
    .um-sec__head h2 {
      font-family: var(--font-display);
      font-size: clamp(34px, 3.6vw, 52px);
      font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; text-wrap: balance;
    }
    .um-sec__head h2 em { font-style: normal; background: var(--fs-lime); color: var(--fs-lime-ink); padding: 0 8px; border-radius: 6px; }
    .um-sec--ink .um-sec__head h2 { color: #fff; }
    .um-sec__head p { margin-top: 16px; font-size: 18px; color: var(--fg-2); line-height: 1.55; }
    .um-sec--ink .um-sec__head p { color: rgba(255,255,255,0.65); }

    /* ── Promise section ─────────────────────────────────────── */
    .um-promise {
      display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center;
    }
    .um-promise__intro {
      font-family: var(--font-display); font-size: 22px; font-weight: 500;
      line-height: 1.45; letter-spacing: -0.01em; color: var(--fg-1);
      text-wrap: balance;
    }
    .um-promise__intro b { font-weight: 700; }
    .um-promise__intro em { font-style: normal; background: var(--fs-lime); color: var(--fs-lime-ink); padding: 0 6px; border-radius: 4px; }
    .um-promise__list { display: flex; flex-direction: column; gap: 24px; margin-top: 32px; }
    .um-promise__item {
      display: grid; grid-template-columns: 44px 1fr; gap: 18px; align-items: start;
    }
    .um-promise__num {
      width: 44px; height: 44px; border-radius: var(--radius-sm);
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center;
      font-family: var(--font-display); font-size: 17px; font-weight: 800;
    }
    .um-promise__item h3 {
      font-family: var(--font-display); font-size: 20px; font-weight: 700;
      letter-spacing: -0.01em; line-height: 1.2;
    }
    .um-promise__item p { margin-top: 6px; font-size: 15px; color: var(--fg-2); line-height: 1.55; }

    /* Illustration side */
    .um-promise__viz {
      aspect-ratio: 4/5;
      background: var(--fs-paper);
      background-image: radial-gradient(var(--fs-gray-300) 1px, transparent 1.2px);
      background-size: 10px 10px;
      border-radius: var(--radius-xl); padding: 32px;
      display: grid; place-items: center;
      border: 1px solid var(--border-1);
      position: relative; overflow: hidden;
    }

    /* ── What we move — cards grid ──────────────────────────── */
    .um-move {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    }
    .um-move__card {
      background: #fff; border: 1px solid var(--border-1);
      border-radius: var(--radius-md); padding: 22px 20px;
      display: flex; align-items: center; gap: 14px;
      transition: transform var(--dur-med) var(--ease-out), border-color var(--dur-med);
      text-decoration: none; color: inherit;
    }
    .um-move__card:hover { transform: translateY(-3px); border-color: var(--fs-ink); }
    .um-move__card--accent { background: var(--fs-lime); border-color: var(--fs-lime); }
    .um-move__card--accent:hover { border-color: var(--fs-lime-ink); }
    .um-move__icon {
      width: 40px; height: 40px; border-radius: var(--radius-sm);
      background: var(--fs-paper); display: grid; place-items: center;
      color: var(--fs-ink); flex-shrink: 0;
    }
    .um-move__icon svg { width: 20px; height: 20px; }
    .um-move__card--accent .um-move__icon { background: rgba(42,45,51,0.1); color: var(--fs-lime-ink); }
    .um-move__card h4 { font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
    .um-move__card small { display: block; font-size: 12px; color: var(--fg-3); margin-top: 3px; }
    .um-move__card--accent small { color: var(--fs-lime-ink); opacity: 0.7; }

    .um-move__cta { margin-top: 48px; text-align: center; }

    /* ── Timeline process ───────────────────────────────────── */
    .um-timeline {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
      position: relative;
    }
    .um-timeline::before {
      content: ""; position: absolute; top: 28px; left: calc(100%/8);
      width: calc(100% * 3/4); height: 2px;
      background: linear-gradient(90deg, var(--fs-lime) 0%, var(--fs-lime) 70%, rgba(215,240,120,0.3) 100%);
    }
    .um-tl-step { padding: 0 24px 0 0; position: relative; }
    .um-tl-step:last-child { padding-right: 0; }
    .um-tl-step__num {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center;
      font-family: var(--font-display); font-size: 20px; font-weight: 700;
      margin-bottom: 22px; position: relative; z-index: 1;
      border: 4px solid var(--fs-white);
    }
    .um-sec--alt .um-tl-step__num { border-color: var(--fs-white); }
    .um-tl-step__label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 8px; }
    .um-tl-step h3 { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px; }
    .um-tl-step p { font-size: 14px; color: var(--fg-2); line-height: 1.6; }

    /* ── Testimonials (3-col, quote-card style) ─────────────── */
    .um-testi {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
    }
    .um-testi__card {
      background: #fff; border: 1px solid var(--border-1);
      border-radius: var(--radius-lg); padding: 32px 28px;
      display: flex; flex-direction: column; gap: 22px;
      position: relative;
    }
    .um-testi__card--dark { background: var(--fs-ink); border-color: var(--fs-ink); color: #fff; }
    .um-testi__card--lime { background: var(--fs-lime); border-color: var(--fs-lime); }
    .um-testi__stars { color: var(--fs-lime-deep); font-size: 15px; letter-spacing: 3px; }
    .um-testi__card--dark .um-testi__stars { color: var(--fs-lime); }
    .um-testi__card--lime .um-testi__stars { color: var(--fs-lime-ink); }
    .um-testi__card h4 {
      font-family: var(--font-display); font-size: 22px; font-weight: 700;
      letter-spacing: -0.02em; line-height: 1.2; text-wrap: balance;
    }
    .um-testi__card--dark h4 { color: #fff; }
    .um-testi__card--lime h4 { color: var(--fs-lime-ink); }
    .um-testi__card blockquote {
      font-size: 15px; line-height: 1.6; flex: 1;
      border: none; padding: 0; margin: 0; color: var(--fg-2);
    }
    .um-testi__card--dark blockquote { color: rgba(255,255,255,0.78); }
    .um-testi__card--lime blockquote { color: rgba(47,58,0,0.78); }
    .um-testi__who { display: flex; align-items: center; gap: 12px; padding-top: 18px; border-top: 1px solid var(--border-1); }
    .um-testi__card--dark .um-testi__who { border-top-color: rgba(255,255,255,0.15); }
    .um-testi__card--lime .um-testi__who { border-top-color: rgba(47,58,0,0.15); }
    .um-testi__avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center;
      font-size: 13px; font-weight: 700;
    }
    .um-testi__card--dark .um-testi__avatar { background: #fff; color: var(--fs-ink); }
    .um-testi__card--lime .um-testi__avatar { background: var(--fs-ink); color: #fff; }
    .um-testi__name { font-size: 14px; font-weight: 700; }
    .um-testi__card--dark .um-testi__name { color: #fff; }
    .um-testi__role { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
    .um-testi__card--dark .um-testi__role { color: rgba(255,255,255,0.5); }
    .um-testi__card--lime .um-testi__role { color: rgba(47,58,0,0.6); }

    /* ── "For you if" blocks ────────────────────────────────── */
    .um-foryou { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .um-foryou__card {
      background: var(--fs-paper); border: 1px solid var(--border-1);
      border-radius: var(--radius-lg); padding: 36px 32px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .um-foryou__icon {
      width: 56px; height: 56px; border-radius: var(--radius-md);
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center;
    }
    .um-foryou__icon svg { width: 26px; height: 26px; }
    .um-foryou__card h3 {
      font-family: var(--font-display); font-size: 22px; font-weight: 700;
      letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance;
    }
    .um-foryou__card h3 span { background: var(--fs-lime); padding: 0 6px; border-radius: 4px; color: var(--fs-lime-ink); }
    .um-foryou__card p { font-size: 15px; color: var(--fg-2); line-height: 1.55; }

    /* ── Pricing ────────────────────────────────────────────── */
    .um-price {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
    }
    .um-price__card {
      background: #fff; border: 1px solid var(--border-1);
      border-radius: var(--radius-xl); padding: 36px 32px;
      display: flex; flex-direction: column; gap: 20px;
      position: relative;
      transition: transform var(--dur-med) var(--ease-out), box-shadow var(--dur-med);
    }
    .um-price__card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .um-price__card--featured {
      background: var(--fs-ink); color: #fff; border-color: var(--fs-ink);
      transform: scale(1.03);
    }
    .um-price__card--featured:hover { transform: scale(1.03) translateY(-4px); }
    .um-price__badge {
      position: absolute; top: -12px; left: 32px;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 5px 12px; border-radius: var(--radius-pill);
    }
    .um-price__header { display: flex; flex-direction: column; gap: 8px; }
    .um-price__name { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .um-price__sub { font-size: 14px; color: var(--fg-2); line-height: 1.45; min-height: 42px; }
    .um-price__card--featured .um-price__sub { color: rgba(255,255,255,0.65); }
    .um-price__amount {
      font-family: var(--font-display); font-size: 56px; font-weight: 800;
      letter-spacing: -0.04em; line-height: 1; margin-top: 6px;
    }
    .um-price__amount small { font-size: 15px; font-weight: 500; color: var(--fg-3); letter-spacing: 0; }
    .um-price__card--featured .um-price__amount small { color: rgba(255,255,255,0.55); }
    .um-price__list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .um-price__list li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--fg-2); line-height: 1.5; }
    .um-price__card--featured .um-price__list li { color: rgba(255,255,255,0.8); }
    .um-price__list li svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 3px; color: var(--fs-lime-deep); }
    .um-price__card--featured .um-price__list li svg { color: var(--fs-lime); }

    /* ── Who does it — Team section ─────────────────────────── */
    .um-who {
      display: grid; grid-template-columns: 1fr 1.2fr; gap: 72px; align-items: center;
      background: var(--fs-paper); border: 1px solid var(--border-1);
      border-radius: var(--radius-xl); padding: 48px;
    }
    .um-who__portrait {
      aspect-ratio: 4/5; border-radius: var(--radius-lg); overflow: hidden;
      background: var(--fs-gray-200);
      display: grid; place-items: center;
      position: relative;
      border: 1px solid var(--border-1);
    }
    .um-who__portrait-ph {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #E6E8EB 0%, #D4D7DC 100%);
      display: grid; place-items: center; color: var(--fs-gray-500);
      font-family: var(--font-display); font-size: 80px; font-weight: 700; letter-spacing: -0.02em;
    }
    .um-who__badge {
      position: absolute; bottom: 16px; left: 16px;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      border-radius: var(--radius-md); padding: 8px 12px;
      font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .um-who__intro { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--fs-ink); letter-spacing: -0.01em; }
    .um-who h2 { font-family: var(--font-display); font-size: clamp(32px, 3.2vw, 44px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; margin-top: 4px; }
    .um-who__tag {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
      font-family: var(--font-display); font-size: 16px; font-weight: 700;
      color: var(--fs-ink);
    }
    .um-who__tag span { color: var(--fs-ink); }
    .um-who__tag span + span::before { content: "·"; color: var(--fs-gray-400); margin: 0 10px; }
    .um-who p { margin-top: 20px; font-size: 16px; color: var(--fg-2); line-height: 1.6; }
    .um-who__cta { margin-top: 28px; }

    /* ── FAQ ─────────────────────────────────────────────────── */
    .um-faq { max-width: 820px; margin: 0 auto; }
    .um-faq__item { border-bottom: 1px solid var(--border-1); }
    .um-faq__item:first-child { border-top: 1px solid var(--border-1); }
    .um-faq__btn {
      width: 100%; background: none; border: none; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 0; gap: 20px; text-align: left;
      font-family: var(--font-display); font-size: 18px; font-weight: 600;
      color: var(--fs-ink); letter-spacing: -0.01em;
    }
    .um-faq__num {
      font-family: var(--font-display); font-size: 14px; font-weight: 700;
      color: var(--fs-lime-deep); margin-right: 14px;
    }
    .um-faq__icon {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--fs-gray-100); flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 18px; color: var(--fs-ink);
      transition: background var(--dur-fast), transform var(--dur-med) var(--ease-out);
    }
    .um-faq__item.open .um-faq__icon { background: var(--fs-lime); transform: rotate(45deg); }
    .um-faq__body {
      font-size: 15px; color: var(--fg-2); line-height: 1.65;
      overflow: hidden; max-height: 0;
      transition: max-height var(--dur-slow) var(--ease-out), padding var(--dur-slow) var(--ease-out);
      padding-left: 32px;
    }
    .um-faq__item.open .um-faq__body { max-height: 400px; padding-bottom: 24px; }

    /* ── Consult inline callout ─────────────────────────────── */
    .um-consult {
      background: var(--fs-ink); color: #fff;
      border-radius: var(--radius-xl); padding: 48px;
      display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: center;
      position: relative; overflow: hidden;
    }
    .um-consult::before {
      content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(215,240,120,0.08) 1px, transparent 1.2px);
      background-size: 8px 8px;
    }
    .um-consult__body { position: relative; }
    .um-consult h2 {
      font-family: var(--font-display); font-size: clamp(28px, 2.8vw, 38px);
      font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; color: #fff;
    }
    .um-consult h2 em { font-style: normal; color: var(--fs-lime); }
    .um-consult p { margin-top: 14px; font-size: 16px; color: rgba(255,255,255,0.7); line-height: 1.55; max-width: 480px; }
    .um-consult__btns { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
    .um-consult__visual { position: relative; }
    .um-consult__calendar {
      background: #fff; color: var(--fs-ink);
      border-radius: var(--radius-lg); padding: 20px;
      box-shadow: var(--shadow-lg);
    }
