<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Services — Funnelspace</title>
  <meta name="description" content="Done-for-You Services: Wir bauen deinen Funnel, dein CRM und deine Automationen — du lieferst die Vision, wir liefern das Ergebnis." />
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
  <style>

    /* ── Services Hero ───────────────────────────────────────── */
    .srv-hero {
      padding: 100px 40px 80px;
      background: var(--fs-ink); color: #fff;
      position: relative; overflow: hidden;
    }
    .srv-hero::before {
      content: "";
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(215,240,120,0.07) 1px, transparent 1.2px);
      background-size: 8px 8px;
      pointer-events: none;
    }
    .srv-hero__inner {
      max-width: 1280px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center;
    }
    .srv-hero__eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--fs-lime); margin-bottom: 20px;
    }
    .srv-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(40px, 5vw, 70px);
      font-weight: 700; line-height: 1.05;
      letter-spacing: -0.03em; text-wrap: balance; color: #fff;
    }
    .srv-hero h1 em {
      font-style: normal; color: var(--fs-lime);
    }
    .srv-hero__lead {
      margin-top: 20px; font-size: 18px; line-height: 1.55;
      color: rgba(255,255,255,0.65); max-width: 500px;
    }
    .srv-hero__cta { display: flex; gap: 12px; margin-top: 36px; flex-wrap: wrap; }
    .srv-hero__proof {
      margin-top: 24px; display: flex; gap: 20px; flex-wrap: wrap;
      font-size: 13px; color: rgba(255,255,255,0.45);
    }
    .srv-hero__proof span { display: flex; align-items: center; gap: 6px; }
    .srv-hero__proof span::before {
      content: ""; width: 12px; height: 12px; border-radius: 50%;
      background: var(--fs-lime); display: inline-block;
    }
    /* right side: floating process cards */
    .srv-hero__cards { display: flex; flex-direction: column; gap: 14px; }
    .srv-hero__card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius-lg); padding: 18px 22px;
      display: flex; align-items: center; gap: 16px;
    }
    .srv-hero__card-icon {
      width: 44px; height: 44px; border-radius: var(--radius-sm);
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center; font-size: 20px; flex-shrink: 0;
    }
    .srv-hero__card-title { font-size: 15px; font-weight: 700; color: #fff; }
    .srv-hero__card-desc { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 2px; }
    .srv-hero__card-price {
      margin-left: auto; font-family: var(--font-display);
      font-size: 18px; font-weight: 700; color: var(--fs-lime);
      white-space: nowrap; padding-left: 16px;
    }

    /* ── Trust bar ───────────────────────────────────────────── */
    .trust-dark {
      background: rgba(255,255,255,0.04);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 20px 40px;
    }
    .trust-dark__inner {
      max-width: 1280px; margin: 0 auto;
      display: flex; align-items: center; gap: 32px; flex-wrap: wrap;
    }
    .trust-dark__label { font-size: 12px; color: rgba(255,255,255,0.35); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
    .trust-dark__items { display: flex; gap: 28px; flex-wrap: wrap; }
    .trust-dark__item { font-size: 13px; color: rgba(255,255,255,0.5); display: flex; align-items: center; gap: 8px; }
    .trust-dark__item::before { content: "✓"; color: var(--fs-lime); font-weight: 700; }

    /* ── Shared section ──────────────────────────────────────── */
    .srv-section { padding: 96px 40px; }
    .srv-section--alt { background: var(--fs-white); }
    .srv-section__inner { max-width: 1280px; margin: 0 auto; }
    .srv-section__head { margin-bottom: 56px; }
    .srv-section__head--center { text-align: center; max-width: 680px; margin: 0 auto 56px; }
    .srv-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px;
    }
    .srv-section__head h2 {
      font-family: var(--font-display);
      font-size: clamp(32px, 3.5vw, 50px);
      font-weight: 700; letter-spacing: -0.03em; text-wrap: balance;
    }
    .srv-section__head p { margin-top: 14px; font-size: 18px; color: var(--fg-2); line-height: 1.5; }

    /* ── Service cards (main packages) ──────────────────────── */
    .pkg-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
    }
    .pkg {
      background: var(--fs-white); border: 1px solid var(--border-1);
      border-radius: var(--radius-xl); overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column;
      transition: transform var(--dur-med) var(--ease-out), box-shadow var(--dur-med) var(--ease-out);
    }
    .pkg:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .pkg--featured {
      border-color: var(--fs-ink); border-width: 2px;
      transform: scale(1.02);
    }
    .pkg--featured:hover { transform: scale(1.02) translateY(-4px); }
    .pkg__header {
      padding: 28px 28px 22px;
      border-bottom: 1px solid var(--border-1);
      position: relative;
    }
    .pkg--featured .pkg__header { background: var(--fs-ink); border-color: var(--fs-ink); }
    .pkg__badge {
      display: inline-flex; margin-bottom: 14px;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 3px 10px; border-radius: var(--radius-pill);
    }
    .pkg h3 {
      font-family: var(--font-display); font-size: 24px;
      font-weight: 700; letter-spacing: -0.02em;
    }
    .pkg--featured h3 { color: #fff; }
    .pkg__tagline { font-size: 14px; color: var(--fg-2); margin-top: 6px; line-height: 1.4; }
    .pkg--featured .pkg__tagline { color: rgba(255,255,255,0.6); }
    .pkg__price {
      margin-top: 18px; font-family: var(--font-display);
      font-size: 48px; font-weight: 700; letter-spacing: -0.04em; line-height: 1;
    }
    .pkg--featured .pkg__price { color: #fff; }
    .pkg__price sub { font-size: 22px; font-weight: 600; vertical-align: baseline; }
    .pkg__price small { font-size: 15px; font-weight: 400; letter-spacing: 0; color: var(--fg-3); }
    .pkg--featured .pkg__price small { color: rgba(255,255,255,0.45); }
    .pkg__timeline {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 10px; font-size: 13px; color: var(--fg-3);
    }
    .pkg--featured .pkg__timeline { color: rgba(255,255,255,0.45); }
    .pkg__body { padding: 24px 28px 28px; flex: 1; display: flex; flex-direction: column; gap: 20px; }
    .pkg__includes-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--fg-3);
    }
    .pkg ul {
      list-style: none; padding: 0; margin: 0;
      display: flex; flex-direction: column; gap: 10px;
    }
    .pkg li {
      display: flex; gap: 10px; align-items: flex-start;
      font-size: 14px; color: var(--fg-2); line-height: 1.4;
    }
    .pkg li::before {
      content: ""; width: 16px; height: 16px; border-radius: 50%;
      background: var(--fs-lime); flex-shrink: 0; margin-top: 2px;
    }
    .pkg__cta { margin-top: auto; }

    /* ── Process steps ───────────────────────────────────────── */
    .process {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
      position: relative;
    }
    .process::before {
      content: "";
      position: absolute; top: 28px; left: calc(100%/8);
      width: calc(100% * 3/4); height: 1px;
      background: linear-gradient(90deg, var(--fs-lime) 0%, var(--fs-gray-200) 100%);
    }
    .process-step { padding: 0 24px 0 0; }
    .process-step:last-child { padding-right: 0; }
    .process-step__num {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center;
      font-family: var(--font-display); font-size: 20px; font-weight: 700;
      margin-bottom: 22px; position: relative; z-index: 1;
      border: 3px solid var(--fs-paper);
    }
    .process-step__label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--fg-3); margin-bottom: 8px;
    }
    .process-step h3 {
      font-family: var(--font-display); font-size: 20px;
      font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px;
    }
    .process-step p { font-size: 14px; color: var(--fg-2); line-height: 1.6; }

    /* ── Add-ons ─────────────────────────────────────────────── */
    .addons {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    }
    .addon {
      background: var(--fs-white); border: 1px solid var(--border-1);
      border-radius: var(--radius-lg); padding: 22px 24px;
      display: flex; align-items: flex-start; gap: 16px;
      transition: box-shadow var(--dur-med) var(--ease-out);
    }
    .addon:hover { box-shadow: var(--shadow-md); }
    .addon__icon {
      width: 44px; height: 44px; border-radius: var(--radius-sm);
      background: var(--fs-gray-100); display: grid; place-items: center;
      font-size: 20px; flex-shrink: 0;
    }
    .addon h4 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .addon p { font-size: 13px; color: var(--fg-2); margin-top: 5px; line-height: 1.5; }
    .addon__price {
      margin-top: 10px; font-family: var(--font-display);
      font-size: 20px; font-weight: 700; color: var(--fs-ink); letter-spacing: -0.02em;
    }
    .addon__price small { font-size: 13px; font-weight: 400; color: var(--fg-3); letter-spacing: 0; }

    /* ── Testimonial strip ───────────────────────────────────── */
    .srv-testi-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
    }
    .srv-testi {
      background: var(--fs-white); border: 1px solid var(--border-1);
      border-radius: var(--radius-lg); padding: 28px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .srv-testi--dark {
      background: var(--fs-ink); border-color: var(--fs-ink);
    }
    .srv-testi__stars { color: var(--fs-lime-deep); font-size: 15px; letter-spacing: 2px; }
    .srv-testi blockquote {
      font-size: 16px; line-height: 1.6; flex: 1;
      border: none; padding: 0; margin: 0; color: var(--fg-1);
    }
    .srv-testi--dark blockquote { color: rgba(255,255,255,0.85); }
    .srv-testi__who { display: flex; align-items: center; gap: 12px; }
    .srv-testi__avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .srv-testi__name { font-size: 14px; font-weight: 700; }
    .srv-testi--dark .srv-testi__name { color: #fff; }
    .srv-testi__role { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
    .srv-testi--dark .srv-testi__role { color: rgba(255,255,255,0.4); }
    .srv-testi__result {
      background: var(--fs-lime); color: var(--fs-lime-ink);
      border-radius: var(--radius-md); padding: 12px 16px;
      font-size: 14px; font-weight: 700; text-align: center;
    }

    /* ── FAQ ─────────────────────────────────────────────────── */
    .faq-list { max-width: 800px; margin: 0 auto; }
    .faq-item { border-bottom: 1px solid var(--border-1); }
    .faq-item:first-child { border-top: 1px solid var(--border-1); }
    .faq-btn {
      width: 100%; background: none; border: none; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      padding: 22px 0; gap: 20px; text-align: left;
      font-family: var(--font-display); font-size: 18px; font-weight: 600;
      color: var(--fs-ink); letter-spacing: -0.01em;
    }
    .faq-icon {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--fs-gray-100); flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 18px; color: var(--fs-ink);
      transition: background var(--dur-fast), transform var(--dur-med) var(--ease-out);
    }
    .faq-item.open .faq-icon { background: var(--fs-lime); transform: rotate(45deg); }
    .faq-body {
      font-size: 15px; color: var(--fg-2); line-height: 1.65;
      overflow: hidden; max-height: 0;
      transition: max-height var(--dur-slow) var(--ease-out), padding var(--dur-slow) var(--ease-out);
    }
    .faq-item.open .faq-body { max-height: 400px; padding-bottom: 24px; }

    /* ── Final CTA ───────────────────────────────────────────── */
    .srv-final {
      background: var(--fs-ink); padding: 96px 40px;
      text-align: center; position: relative; overflow: hidden;
    }
    .srv-final::before {
      content: "";
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(215,240,120,0.06) 1px, transparent 1.2px);
      background-size: 8px 8px;
    }
    .srv-final h2 {
      font-family: var(--font-display);
      font-size: clamp(36px, 4vw, 58px);
      font-weight: 700; letter-spacing: -0.04em; color: #fff;
      text-wrap: balance; max-width: 800px; margin: 0 auto; position: relative;
    }
    .srv-final p { margin: 14px auto 0; font-size: 18px; color: rgba(255,255,255,0.55); position: relative; }
    .srv-final__btns { display: flex; gap: 14px; justify-content: center; margin-top: 36px; flex-wrap: wrap; position: relative; }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 1024px) {
      .srv-hero__inner { grid-template-columns: 1fr; gap: 48px; }
      .pkg-grid { grid-template-columns: 1fr; }
      .pkg--featured { transform: none; }
      .process { grid-template-columns: 1fr 1fr; gap: 32px; }
      .process::before { display: none; }
      .addons { grid-template-columns: 1fr 1fr; }
      .srv-testi-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .srv-hero { padding: 64px 24px 56px; }
      .srv-section { padding: 64px 24px; }
      .trust-dark { padding: 16px 24px; }
      .process { grid-template-columns: 1fr; }
      .addons { grid-template-columns: 1fr; }
      .srv-final { padding: 64px 24px; }
      .nav__links { display: none; }
    }
  </style>
</head>

          <div className="srv-hero__inner">
            <div>
              <div className="srv-hero__eyebrow">Done-for-You Services</div>

              <p className="srv-hero__lead">
                Kein Technik-Stress, kein Tool-Chaos. Wir bauen deinen Funnel, dein CRM

                <a href="#gespraech" className="btn btn--ghost btn-lg" style={{borderColor:'rgba(255,255,255,0.3)', color:'#fff'}}>Erstgespräch buchen</a>
              </div>
              <div className="srv-hero__proof">

            <div className="srv-hero__cards">

                <div key={c.title} className="srv-hero__card">

                    <div className="srv-hero__card-desc">{c.desc}</div>

            <span className="trust-dark__label">Inklusive in jedem Paket</span>
            <div className="trust-dark__items">
              {['Funnelspace-Einrichtung', 'Übergabe-Call', 'Revision-Runden', 'Setup-Dokumentation', 'DSGVO-konform'].map(i => (
                <span key={i} className="trust-dark__item">{i}</span>

            </div>
          </div>
        </div>
      </div>

      <section className="srv-section" id="pakete">

            <h2>Wähle das Paket, das zu deinem Ziel passt.</h2>
            <p>Von der schnellen Einzel-Lösung bis zum vollständigen Business-Setup — alles aus einer Hand.</p>
          </div>
          <div className="pkg-grid">
            {PACKAGES.map(pk => (
              <article key={pk.name} className={`pkg${pk.featured ? ' pkg--featured' : ''}`}>
                <div className="pkg__header">
                  {pk.featured && <div className="pkg__badge">Beliebt</div>}
                  <h3>{pk.name}</h3>
                  <p className="pkg__tagline">{pk.tagline}</p>
                  <div className="pkg__price"><sub>€</sub>{pk.price.toLocaleString('de')}<small> einmalig</small></div>

                    <a href="#gespraech" className={`btn ${pk.featured ? 'btn--primary' : 'btn--ghost'}`} style={{width:'100%', justifyContent:'center'}}>

    const Addons = () => (
      <section className="srv-section">

            {ADDONS.map(a => (
              <div key={a.title} className="addon">

                  <h4>{a.title}</h4>
                  <p>{a.desc}</p>
                  <div className="addon__price">{a.price}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

            <div className="faq-list">
              {FAQS.map((f, i) => (
                <div key={i} className={`faq-item${open === i ? ' open' : ''}`}>
                  <button className="faq-btn" onClick={() => setOpen(open === i ? null : i)}>
                    {f.q}

        <span style={{margin:'0 12px'}}>·</span>
        <a href="templates.html" style={{color:'var(--fg-2)', textDecoration:'none'}}>Templates</a>
        <span style={{margin:'0 12px'}}>·</span>
        © 2026 Funnelspace GmbH
      </footer>
    );

    const App = () => (
      <>
        <Nav />
        <main>
          <Hero />
          <Packages />
          <Process />
          <Addons />
          <Testimonials />
          <FAQ />
        </main>
        <FinalCTA />
        <SimpleFooter />
      </>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
