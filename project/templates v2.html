              </div>
            </div>
            <div className="tv-panel__foot">
              <div className="tv-chips">{s.chips.map(ch => <span className="tv-chip" key={ch}>{ch}</span>)}</div>
              <a href="#signup" className="btn btn--primary">Setup importieren</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
};
