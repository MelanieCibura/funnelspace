<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KI-Tools — Funnelspace</title>
<meta name="description" content="Deine KI-Mitarbeiter in Funnelspace: Conversations AI, Voice AI, Reviews AI, Content AI, AI Studio, Workflow AI und mehr — gruppiert nach dem, was sie für dich übernehmen." />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="site.css" />
<style>
/* Hero */
.kt-hero{padding:80px 40px 72px;position:relative;overflow:hidden}
.kt-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:11px 11px;opacity:.55;pointer-events:none}
.kt-hero__inner{max-width:1280px;margin:0 auto;position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center}
.kt-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fs-ink);background:var(--fs-lime);padding:6px 12px;border-radius:var(--radius-pill);margin-bottom:22px}
.kt-hero h1{font-family:var(--font-display);font-size:clamp(42px,5vw,70px);font-weight:700;line-height:1.04;letter-spacing:-.03em;text-wrap:balance}
.kt-hero h1 em{font-style:normal;background:var(--fs-lime);color:var(--fs-lime-ink);padding:0 6px;border-radius:6px}
.kt-hero__lead{margin-top:22px;font-size:19px;line-height:1.55;color:var(--fg-2);max-width:520px}
.kt-hero__cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.kt-hero__proof{margin-top:24px;display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--fg-3)}
.kt-hero__proof span{display:flex;align-items:center;gap:6px}
.kt-hero__proof span::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--fs-lime);flex-shrink:0}
.kt-panel{background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);overflow:hidden}
.kt-panel__bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-1);background:var(--fs-gray-100)}
.kt-panel__mark{width:22px;height:22px;border-radius:7px;background:var(--fs-lime);display:grid;place-items:center;color:var(--fs-lime-ink)}
.kt-panel__mark svg{width:12px;height:12px}
.kt-panel__title{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:-.01em}
.kt-panel__kbd{margin-left:auto;font-family:var(--font-mono);font-size:10px;background:#fff;border:1px solid var(--border-1);padding:2px 6px;border-radius:4px;color:var(--fg-3)}
.kt-panel__q{padding:16px;border-bottom:1px solid var(--border-1);font-family:var(--font-mono);font-size:12.5px;line-height:1.5;color:var(--fs-ink);min-height:62px}
.kt-cursor{display:inline-block;width:7px;height:14px;background:var(--fs-ink);vertical-align:-2px;margin-left:2px;animation:kt-blink 1s steps(2) infinite}
@keyframes kt-blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.kt-panel__label{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);padding:12px 16px 6px}
.kt-panel__list{display:flex;flex-direction:column}
.kt-row{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--border-1)}
.kt-row--on{background:var(--fs-lime-soft)}
.kt-row__dot{width:30px;height:30px;border-radius:9px;background:var(--fs-gray-100);display:grid;place-items:center;color:var(--fs-ink)}
.kt-row--on .kt-row__dot{background:var(--fs-lime);color:var(--fs-lime-ink)}
.kt-row__dot svg{width:15px;height:15px}
.kt-row__name{font-size:12.5px;font-weight:700;line-height:1.2}
.kt-row__meta{font-size:10.5px;color:var(--fg-3);margin-top:2px;line-height:1.3}
.kt-row__time{font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:var(--fs-ink-soft);white-space:nowrap}
.kt-panel__foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--border-1);background:var(--fs-paper)}
.kt-panel__foot-txt{font-size:11px;color:var(--fg-3)}
.kt-panel__foot-btn{background:var(--fs-ink);color:#fff;border-radius:8px;padding:7px 12px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
/* Stat strip */
.kt-strip{border-top:1px solid var(--border-1);border-bottom:1px solid var(--border-1);background:var(--fs-white)}
.kt-strip__inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.kt-stat{padding:30px 40px}
.kt-stat+.kt-stat{border-left:1px solid var(--border-1)}
.kt-stat__num{font-family:var(--font-display);font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.kt-stat__lbl{margin-top:8px;font-size:13px;color:var(--fg-2);line-height:1.4}
/* Sections */
.kt-sec{padding:100px 40px}
.kt-sec--alt{background:var(--fs-white)}
.kt-sec__inner{max-width:1280px;margin:0 auto}
.kt-sec__head{max-width:740px;margin:0 auto 56px;text-align:center}
.kt-sec__eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
.kt-sec__head h2{font-family:var(--font-display);font-size:clamp(32px,3.5vw,50px);font-weight:700;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.kt-sec__head h2 em{font-style:normal;background:var(--fs-lime);color:var(--fs-lime-ink);padding:0 8px;border-radius:6px}
.kt-sec__head p{margin-top:16px;font-size:18px;color:var(--fg-2);line-height:1.55}
/* Problem */
.kt-prob{display:grid;grid-template-columns:1fr 1.05fr;gap:64px;align-items:center;max-width:1280px;margin:0 auto}
.kt-prob h2{font-family:var(--font-display);font-size:clamp(30px,3.2vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
.kt-prob p{margin-top:18px;font-size:17px;line-height:1.65;color:var(--fg-2)}
.kt-converge{display:grid;grid-template-columns:1fr 44px 1fr;gap:18px;align-items:center}
.kt-mess{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kt-tool{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-sm);padding:9px 10px;font-size:12px;font-weight:600;color:var(--fg-3)}
.kt-tool svg{width:14px;height:14px;flex-shrink:0;color:var(--fs-gray-400)}
.kt-tool span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kt-conv-arrow{display:grid;place-items:center;color:var(--fs-gray-400)}
.kt-conv-arrow svg{width:28px;height:28px}
.kt-one{background:var(--fs-ink);border-radius:var(--radius-lg);padding:26px 24px;color:#fff;position:relative;overflow:hidden}
.kt-one::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.09) 1px,transparent 1.2px);background-size:8px 8px}
.kt-one__logo{position:relative;width:38px;height:38px;border-radius:11px;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;margin-bottom:16px}
.kt-one__t{position:relative;font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.kt-one__d{position:relative;margin-top:10px;font-size:14px;line-height:1.55;color:rgba(255,255,255,.62)}
.kt-one__list{position:relative;list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:8px}
.kt-one__list li{display:flex;gap:9px;font-size:13px;color:rgba(255,255,255,.82);align-items:flex-start}
.kt-one__list li svg{width:15px;height:15px;flex-shrink:0;margin-top:2px;color:var(--fs-lime)}
/* Tool groups */
.kt-group+.kt-group{margin-top:64px;padding-top:56px;border-top:1px solid var(--border-1)}
.kt-group__head{display:flex;align-items:baseline;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.kt-group__n{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--fs-ink);background:var(--fs-lime);padding:3px 8px;border-radius:4px}
.kt-group__title{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.02em}
.kt-group__sub{font-size:15px;color:var(--fg-3);line-height:1.4}
.kt-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.kt-card{background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:22px;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out)}
.kt-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.kt-card__art{width:100%;aspect-ratio:16/10;background:var(--fs-paper);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:9px 9px;border-radius:var(--radius-md);display:grid;place-items:center;overflow:hidden;border:1px solid var(--border-1)}
.kt-card__art img{max-height:120px;max-width:72%}
.kt-card__top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kt-card h3{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.kt-tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:var(--radius-pill);background:var(--fs-gray-100);color:var(--fs-ink-soft)}
.kt-tag--live{background:var(--fs-lime);color:var(--fs-lime-ink)}
.kt-card p{font-size:14px;color:var(--fg-2);line-height:1.55}
.kt-card p b{color:var(--fs-ink);font-weight:700}
.kt-card__link{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-1);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--fs-ink)}
.kt-card__link svg{width:15px;height:15px;transition:transform var(--dur-fast) var(--ease-out)}
.kt-card:hover .kt-card__link svg{transform:translateX(3px)}
/* Summer of AI Banner */
.kt-banner{max-width:1280px;margin:0 auto 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--fs-lime-soft);border:1px solid var(--fs-lime);border-radius:var(--radius-md);padding:14px 20px}
.kt-banner__badge{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;background:var(--fs-lime);color:var(--fs-lime-ink);padding:5px 10px;border-radius:var(--radius-pill)}
.kt-banner__txt{font-size:14.5px;color:var(--fs-ink);font-weight:600}
.kt-banner__note{font-size:12.5px;color:var(--fg-3);margin-left:auto}
/* AI Studio Spotlight */
.kt-spot{max-width:1280px;margin:0 auto;background:var(--fs-lime);border:2px solid var(--fs-ink);border-radius:var(--radius-xl);overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
.kt-spot__txt{padding:56px 48px}
.kt-spot__eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fs-lime-ink);opacity:.65}
.kt-spot__txt h2{margin-top:14px;font-family:var(--font-display);font-size:clamp(30px,3.2vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.08;color:var(--fs-lime-ink);text-wrap:balance}
.kt-spot__txt p{margin-top:18px;font-size:17px;line-height:1.6;color:var(--fs-lime-ink);opacity:.82;max-width:460px}
.kt-spot__cta{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
.kt-spot__visual{background:var(--fs-ink);padding:40px;display:flex;flex-direction:column;gap:12px;justify-content:center;position:relative;overflow:hidden}
.kt-spot__visual::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.08) 1px,transparent 1.2px);background-size:8px 8px}
.kt-prompt{position:relative;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius-md);padding:14px 16px;font-family:var(--font-mono);font-size:12.5px;line-height:1.5;color:#fff}
.kt-prompt__l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fs-lime);margin-bottom:8px;font-family:var(--font-sans);font-weight:700}
.kt-steps{position:relative;display:flex;flex-direction:column;gap:8px}
.kt-step{display:grid;grid-template-columns:22px 1fr auto;gap:11px;align-items:center;background:rgba(255,255,255,.04);border-radius:var(--radius-sm);padding:11px 13px}
.kt-step__n{width:22px;height:22px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;font-size:11px;font-weight:800}
.kt-step__t{font-size:13px;font-weight:600;color:#fff}
.kt-step__s{font-family:var(--font-mono);font-size:10.5px;color:var(--fs-lime)}
/* Flow */
.kt-flow{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(255,255,255,.14);border-radius:var(--radius-lg);overflow:hidden}
.kt-flow__step{background:var(--fs-ink);padding:26px 22px;display:flex;flex-direction:column;gap:10px}
.kt-flow__n{width:26px;height:26px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;font-size:12px;font-weight:800}
.kt-flow__tool{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--fs-lime)}
.kt-flow__t{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.01em;color:#fff;line-height:1.2}
.kt-flow__d{font-size:13px;color:rgba(255,255,255,.6);line-height:1.5}
.kt-flow__note{margin-top:28px;text-align:center;font-size:14px;color:rgba(255,255,255,.55)}
.kt-flow__note b{color:#fff}
/* Nutzen */
.kt-benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.kt-benefit{display:flex;flex-direction:column;gap:14px;padding:30px 26px;background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-lg)}
.kt-benefit__icon{width:44px;height:44px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center}
.kt-benefit__icon svg{width:21px;height:21px}
.kt-benefit h3{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.kt-benefit p{font-size:14.5px;line-height:1.6;color:var(--fg-2)}
/* Preise */
.kt-plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch}
.kt-plan{background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:30px 26px;display:flex;flex-direction:column;gap:16px}
.kt-plan--hi{border:2px solid var(--fs-ink);box-shadow:var(--shadow-md);position:relative}
.kt-plan__tag{position:absolute;top:-12px;left:26px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;background:var(--fs-lime);color:var(--fs-lime-ink);padding:5px 11px;border-radius:var(--radius-pill)}
.kt-plan h3{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.02em}
.kt-plan__price{display:flex;align-items:baseline;gap:6px}
.kt-plan__amount{font-family:var(--font-display);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.kt-plan__per{font-size:14px;color:var(--fg-3)}
.kt-plan__sub{font-size:14px;line-height:1.55;color:var(--fg-2);margin-top:-6px}
.kt-plan__list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.kt-plan__list li{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--fg-2)}
.kt-plan__list li svg{width:15px;height:15px;flex-shrink:0;margin-top:3px;color:var(--fs-lime-deep)}
.kt-plan .btn{margin-top:auto}
.kt-note{max-width:960px;margin:26px auto 0;font-size:13.5px;line-height:1.6;color:var(--fg-3);display:flex;gap:9px;align-items:flex-start}
.kt-note svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}
/* FAQ */
.kt-faq{max-width:820px;margin:0 auto}
.kt-faq__item{border-bottom:1px solid var(--border-1)}
.kt-faq__item:first-child{border-top:1px solid var(--border-1)}
.kt-faq__btn{width:100%;background:none;border:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:22px 0;gap:20px;text-align:left;font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--fs-ink);letter-spacing:-.01em}
.kt-faq__icon{width:30px;height:30px;border-radius:50%;background:var(--fs-gray-100);flex-shrink:0;display:grid;place-items:center;font-size:18px;transition:background var(--dur-fast),transform var(--dur-med) var(--ease-out)}
.kt-faq__item.open .kt-faq__icon{background:var(--fs-lime);transform:rotate(45deg)}
.kt-faq__body{font-size:15px;color:var(--fg-2);line-height:1.65;overflow:hidden;max-height:0;transition:max-height var(--dur-slow) var(--ease-out),padding var(--dur-slow) var(--ease-out)}
.kt-faq__item.open .kt-faq__body{max-height:460px;padding-bottom:22px}
/* Final CTA */
.kt-final{background:var(--fs-ink);padding:100px 40px;text-align:center;position:relative;overflow:hidden}
.kt-final::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.07) 1px,transparent 1.2px);background-size:8px 8px}
.kt-final__inner{position:relative;max-width:740px;margin:0 auto}
.kt-final h2{font-family:var(--font-display);font-size:clamp(34px,4vw,54px);font-weight:700;letter-spacing:-.03em;color:#fff;text-wrap:balance}
.kt-final h2 em{font-style:normal;color:var(--fs-lime)}
.kt-final p{margin:16px auto 0;font-size:18px;color:rgba(255,255,255,.6)}
.kt-final__btns{display:flex;gap:12px;justify-content:center;margin-top:34px;flex-wrap:wrap}
.kt-final__hint{margin-top:20px;font-size:13px;color:rgba(255,255,255,.45)}
a{color:var(--fs-ink)}a:hover{color:var(--fs-lime-deep)}
@media(max-width:1024px){
.kt-hero__inner{grid-template-columns:1fr;gap:48px}
.kt-strip__inner{grid-template-columns:1fr 1fr}
.kt-stat:nth-child(3){border-left:none}
.kt-stat:nth-child(n+3){border-top:1px solid var(--border-1)}
.kt-prob{grid-template-columns:1fr;gap:40px}
.kt-cards,.kt-benefits,.kt-plans{grid-template-columns:1fr 1fr}
.kt-spot{grid-template-columns:1fr}
.kt-flow{grid-template-columns:1fr 1fr}
}
@media(max-width:768px){
.kt-hero{padding:56px 22px}
.kt-sec{padding:68px 22px}
.kt-stat{padding:24px 22px}
.kt-strip__inner{grid-template-columns:1fr}
.kt-stat+.kt-stat{border-left:none;border-top:1px solid var(--border-1)}
.kt-cards,.kt-benefits,.kt-plans,.kt-flow{grid-template-columns:1fr}
.kt-converge{grid-template-columns:1fr;gap:14px}
.kt-conv-arrow{transform:rotate(90deg)}
.kt-spot__txt{padding:36px 24px}
.kt-spot__visual{padding:24px}
.kt-banner__note{margin-left:0}
.kt-final{padding:68px 22px}
.nav__links{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const Icon = ({ d, size = 20 }) => (
  <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">{d}</svg>
);

const Typing = () => {
  const [i, setI] = useState(0);
  useEffect(() => {
    if (i >= HERO_PROMPT.length) return;
    const t = setTimeout(() => setI(i + 1), i < 24 ? 52 : 26);
    return () => clearTimeout(t);
  }, [i]);
  return (<>{HERO_PROMPT.slice(0, i)}<span className="kt-cursor"/></>);
};
