<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Die Agentur — Umsetzungsservice | Funnelspace</title>
<meta name="description" content="Done-4-You mit festen Paketpreisen: Website, Funnels, Kursbereich, Community und Backend-Setup. Umsetzung in 14 Tagen, ab 249 €." />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="site.css" />
<link rel="stylesheet" href="agenturservice.css" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="agentur-data.jsx"></script>
<script type="text/babel">
const { useState } = React;
const eur = n => n.toLocaleString('de-DE');
const Check = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
const Clock = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>;

const ROW_IDS = ['webseite','blog','optin','sales','evergreen','quiz','onlineshop','kurs','community'];
const byId = id => AGENTUR_SERVICES.find(s => s.id === id);
const ROWS = ROW_IDS.map(byId);
const BACKEND = AGENTUR_SERVICES.filter(s => !ROW_IDS.includes(s.id));

const ARGS = [
  { n:'01', t:'Feste Pakete statt offener Projekte', d:'Unsere Done-4-You-Angebote basieren auf Setups, die wir für diese Branche und diese Software entwickelt haben. Statt langwierigem Individualprojekt bekommst du ein effizientes Setup — ausgerichtet auf Best Practices, Performance und Nutzerfreundlichkeit.', lime:true },
  { n:'02', t:'Templates, die Zeit und Geld sparen', d:'Hunderte Stunden stecken in unseren Premium-Templates, die nachweislich konvertieren. Beinhaltet dein Paket eine Website oder einen Funnel, wählst du dein Lieblings-Layout — wir passen Texte, Bilder und Branding an. Individuell, zum Bruchteil des Aufwands.' },
];

const Hero = () => (
  <section className="ags-hero">
    <div className="ags-hero__inner">
      <div>
        <div className="ags-kicker">Die Agentur · Done-4-You</div>
        <h1>Der schnellste Weg von der Idee zur <em>Umsetzung</em>.</h1>
        <p className="ags-hero__lead">
          Viele vergeuden Zeit und Geld damit, alles von Grund auf neu zu bauen — in der Annahme, ihr Setup müsse komplett
          individuell sein. Die erfolgreichsten setzen auf bewährte Systeme, kommen schnell in die Umsetzung und optimieren später.
          Genau dafür gibt es unsere festen Paketpreise.
        </p>
        <div className="ags-hero__cta">
          <a href="#pakete" className="btn btn--primary btn-lg">Services ansehen</a>
          <a href="#termin" className="btn btn--ghost btn-lg" style={{borderColor:'rgba(255,255,255,.3)', color:'#fff'}}>Termin vereinbaren</a>
        </div>
        <div className="ags-hero__facts">
          <div className="ags-hero__fact"><b>ab 249 €</b><span>Festpreis, einmalig</span></div>
          <div className="ags-hero__fact"><b>14 Tage</b><span>bis zur Übergabe</span></div>
          <div className="ags-hero__fact"><b>1 Runde</b><span>Korrekturen inklusive</span></div>
        </div>
      </div>
      <div className="ags-hero__visual"><img src="assets/illustrations/bg.jpg" alt="Funnelspace Agenturservice" /></div>
    </div>
  </section>
);

const Args = () => (
  <section className="ags-sec ags-sec--paper">
    <div className="ags-sec__inner">
      <div className="ags-head">
        <div className="ags-eyebrow">Warum feste Pakete</div>
        <h2>Weniger Komplexität. <em>Schneller live.</em></h2>
        <p>Wir nehmen dir die Entscheidungen ab, die dich sonst wochenlang aufhalten — ohne endlose Schleifen und ohne Agenturpreise.</p>
      </div>
      <div className="ags-args">
        {ARGS.map(a => (
          <div key={a.n} className={`ags-arg${a.lime ? ' ags-arg--lime' : ''}`}>
            <div className="ags-arg__num">{a.n}</div>
            <h3>{a.t}</h3>
            <p>{a.d}</p>
          </div>
        ))}
      </div>
    </div>
  </section>
);

const Jump = () => (
  <div className="ags-jump" id="pakete">
    <div className="ags-jump__inner">
      <span className="ags-jump__lbl">Wähle deine Services</span>
      {ROWS.map(s => <a key={s.id} href={`#${s.id}`}>{s.name}</a>)}
      <a href="#backend">Backend-Setup</a>
    </div>
  </div>
);

const Row = ({ s, i }) => {
  const incl = s.blocks.find(b => b.items) || { items: [] };
  const note = s.blocks.find(b => b.body);
  return (
    <section className={`ags-row ${i % 2 ? 'ags-row--white ags-row--flip' : 'ags-row--paper'}`} id={s.id} data-screen-label={s.name}>
      <div className="ags-row__inner">
        <div className="ags-row__media">
          <div className="ags-figure">
            {s.badge && <span className="ags-figure__badge">{s.badge}</span>}
            <img src={s.illu} alt="" />
          </div>
          <div className="ags-priceplate">
            <div><b>{eur(s.price)} €</b><span>einmalig, zzgl. USt.</span></div>
            <span className="ags-priceplate__time"><Clock /> {s.time}</span>
          </div>
        </div>
        <div>
          <div className="ags-row__num">{String(i + 1).padStart(2, '0')} · {AGENTUR_CATEGORIES.find(c => c.id === s.cat).label}</div>
          <h2>{s.name}</h2>
          <p className="ags-row__teaser">{s.teaser}</p>
          <div className="ags-tags">{s.tags.map(t => <span key={t}>{t}</span>)}</div>
          <div className="ags-incl">
            <div className="ags-incl__lbl">Was enthalten ist</div>
            <ul>{incl.items.map(it => <li key={it}><Check />{it}</li>)}</ul>
          </div>
          {note && <p className="ags-note"><b>{note.h}:</b> {note.body}</p>}
          <div className="ags-row__cta">
            <a href="#termin" className="btn btn--primary">Service anfragen — {eur(s.price)} €</a>
            <small>Antwort innerhalb von 1 Werktag</small>
          </div>
        </div>
      </div>
    </section>
  );
};

const Backend = () => (
  <section className="ags-sec ags-sec--paper" id="backend">
    <div className="ags-sec__inner">
      <div className="ags-head">
        <div className="ags-eyebrow">Backend-Setup</div>
        <h2>Das Fundament dahinter: <em>CRM, E-Mail, Automation.</em></h2>
        <p>Einzeln buchbar oder als Ergänzung zu jedem Paket oben. Kürzere Lieferzeiten, gleiche Festpreis-Logik.</p>
      </div>
      <div className="ags-args ags-backend">
        {BACKEND.map(s => (
          <div className="ags-arg" key={s.id} style={{display:'flex',flexDirection:'column',gap:0}}>
            <div className="ags-arg__num">{eur(s.price)} € · {s.time}</div>
            <h3>{s.name}</h3>
            <p>{s.teaser}</p>
            <div className="ags-incl" style={{marginTop:20}}>
              <ul style={{gridTemplateColumns:'1fr'}}>
                {(s.blocks.find(b => b.items) || {items:[]}).items.slice(0,4).map(it => <li key={it} style={{fontSize:14}}><Check />{it}</li>)}
              </ul>
            </div>
            <a href="#termin" className="btn btn--ink" style={{marginTop:24,justifyContent:'center'}}>Service anfragen</a>
          </div>
        ))}
      </div>
    </div>
  </section>
);

const Process = () => (
  <section className="ags-sec ags-sec--white">
    <div className="ags-sec__inner">
      <div className="ags-head">
        <div className="ags-eyebrow">Der Prozess</div>
        <h2>Vier Schritte — und der Aufwand liegt bei uns.</h2>
      </div>
      <div className="ags-steps">
        {AGENTUR_PROCESS.map(p => (
          <div className="ags-step" key={p.n}>
            <div className="ags-step__num">{p.n}</div>
            <div className="ags-step__lbl">{p.lbl}</div>
            <h3>{p.t}</h3>
            <p>{p.d}</p>
          </div>
        ))}
      </div>
    </div>
  </section>
);

const Notes = () => (
  <section className="ags-sec ags-sec--paper">
    <div className="ags-sec__inner">
      <div className="ags-head">
        <div className="ags-eyebrow">Wichtige Hinweise</div>
        <h2>Was von dir kommt — und was von uns.</h2>
        <p>Damit der Zeitplan hält, brauchen wir ein paar Dinge von deiner Seite. Alles andere übernehmen wir.</p>
      </div>
      <div className="ags-notes ags-notegrid">
        {AGENTUR_NOTES.map(n => (
          <div key={n.t}>
            <h4>{n.t}</h4>
            <p>{n.d}</p>
          </div>
        ))}
      </div>
    </div>
  </section>
);

const Faq = () => {
  const [open, setOpen] = useState(0);
  return (
    <section className="ags-sec ags-sec--white">
      <div className="ags-sec__inner">
        <div className="ags-head ags-head--center">
          <div className="ags-eyebrow">FAQ</div>
          <h2>Häufige Fragen zum Agenturservice.</h2>
        </div>
        <div className="ags-faq">
          {AGENTUR_FAQ.map((f, i) => (
            <div className={`ags-faq__item${open === i ? ' open' : ''}`} key={i}>
              <button className="ags-faq__btn" onClick={() => setOpen(open === i ? null : i)}>
                {f.q}<span className="ags-faq__icon">+</span>
              </button>
              <div className="ags-faq__body">{f.a}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
};

const Final = () => (
  <section className="ags-final" id="termin">
    <div className="ags-final__inner">
      <div>
        <h2>Du brauchst etwas Individuelles oder hast noch Fragen?</h2>
        <p>Vereinbare einen Termin — wir schauen uns dein Vorhaben an und sagen dir offen, welches Paket passt oder ob es ein eigenes Angebot braucht.</p>
        <div className="ags-final__btns">
          <a href="#booking" className="btn btn--ink btn-lg">Termin vereinbaren</a>
          <a href="#pakete" className="btn btn--ghost btn-lg" style={{borderColor:'var(--fs-lime-ink)', color:'var(--fs-lime-ink)'}}>Zurück zu den Services</a>
        </div>
        <p className="ags-final__note">30 Minuten · unverbindlich · kostenlos</p>
      </div>
      <div className="ags-final__card">
        <h4>Im Gespräch klären wir</h4>
        <ul>
          {['Welches Paket zu deinem Angebot passt','Was du vorbereiten musst — und was nicht','Einen realistischen Termin für deinen Launch','Ob eine Kombination günstiger ist als Einzelpakete'].map(i => (
            <li key={i}><Check />{i}</li>
          ))}
        </ul>
      </div>
    </div>
  </section>
);

const App = () => (
  <>
    <Nav />
    <main>
      <Hero />
      <Args />
      <Jump />
      {ROWS.map((s, i) => <Row key={s.id} s={s} i={i} />)}
      <Backend />
      <Process />
      <Notes />
      <Faq />
    </main>
    <Final />
    <Footer />
  </>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
