<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRM — Funnelspace</title>
  <meta name="description" content="Alle Kontakte, Deals und Follow-ups an einem Ort. Das Funnelspace-CRM arbeitet Hand in Hand mit deinen Funnels, E-Mails und dem Kalender." />
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
  <style>
    /* ── CRM Feature Page ───────────────────────────────────── */

    /* Hero */
    .crm-hero {
      background: var(--fs-ink); color: #fff;
      padding: 96px 40px 88px; position: relative; overflow: hidden;
    }
    .crm-hero::before {
      content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(215,240,120,0.06) 1px, transparent 1.2px);
      background-size: 8px 8px; pointer-events: none;
    }
    .crm-hero__inner {
      max-width: 1280px; margin: 0 auto; position: relative;
      display: grid; grid-template-columns: 1.05fr 1fr; gap: 72px; align-items: center;
    }
    .crm-hero__eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--fs-lime);
      background: rgba(215,240,120,0.1); border: 1px solid rgba(215,240,120,0.3);
      padding: 6px 12px; border-radius: var(--radius-pill);
      margin-bottom: 22px;
    }
    .crm-hero__eyebrow::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--fs-lime);
    }
    .crm-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(44px, 5.2vw, 72px);
      font-weight: 700; line-height: 1.04;
      letter-spacing: -0.03em; text-wrap: balance; color: #fff;
    }
    .crm-hero h1 em { font-style: normal; color: var(--fs-lime); }
    .crm-hero__lead {
      margin-top: 22px; font-size: 19px; line-height: 1.55;
      color: rgba(255,255,255,0.7); max-width: 520px;
    }
    .crm-hero__cta { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
    .crm-hero__proof {
      margin-top: 24px; display: flex; gap: 20px; flex-wrap: wrap;
      font-size: 13px; color: rgba(255,255,255,0.5);
    }
    .crm-hero__proof span { display: flex; align-items: center; gap: 6px; }
    .crm-hero__proof span::before {
      content: ""; width: 12px; height: 12px; border-radius: 50%;
      background: var(--fs-lime);
    }
    /* Hero illustration card */
    .crm-hero__visual {
      position: relative;
      background: var(--fs-paper);
      background-image: radial-gradient(var(--fs-gray-300) 1px, transparent 1.2px);
      background-size: 10px 10px;
      border-radius: var(--radius-xl);
      padding: 24px; aspect-ratio: 1/0.95;
      display: grid; place-items: center;
      box-shadow: 0 40px 80px -20px rgba(0,0,0,0.4);
    }
    .crm-hero__visual img {
      max-height: 82%; max-width: 82%; object-fit: contain;
    }
    .crm-hero__badge {
      position: absolute; background: #fff; color: var(--fs-ink);
      border-radius: var(--radius-lg); padding: 12px 16px;
      box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 12px;
    }
    .crm-hero__badge--tl { top: 24px; left: -24px; }
    .crm-hero__badge--br { bottom: 20px; right: -20px; }
    .crm-hero__badge-dot {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center;
      font-weight: 700; font-family: var(--font-display); font-size: 14px;
    }
    .crm-hero__badge-label { font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; }
    .crm-hero__badge-val { font-size: 15px; font-weight: 700; font-family: var(--font-display); margin-top: 2px; }

    /* Replaces-strip */
    .crm-replaces {
      background: rgba(255,255,255,0.04);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 22px 40px;
    }
    .crm-replaces__inner {
      max-width: 1280px; margin: 0 auto;
      display: flex; align-items: center; gap: 32px; flex-wrap: wrap;
    }
    .crm-replaces__label { font-size: 12px; color: rgba(255,255,255,0.4); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
    .crm-replaces__items { display: flex; gap: 28px; flex-wrap: wrap; }
    .crm-replaces__item {
      font-family: var(--font-display); font-weight: 700; font-size: 16px;
      color: rgba(255,255,255,0.4); letter-spacing: -0.01em;
      text-decoration: line-through; text-decoration-color: rgba(215,240,120,0.5);
      text-decoration-thickness: 2px;
    }

    /* Shared section */
    .crm-sec { padding: 104px 40px; }
    .crm-sec--alt { background: var(--fs-white); }
    .crm-sec__inner { max-width: 1280px; margin: 0 auto; }
    .crm-sec__head { max-width: 720px; margin: 0 auto 64px; text-align: center; }
    .crm-sec__head--left { margin: 0 0 56px; text-align: left; }
    .crm-eyebrow {
      display: inline-block;
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px;
    }
    .crm-sec__head h2 {
      font-family: var(--font-display);
      font-size: clamp(34px, 3.6vw, 52px);
      font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; text-wrap: balance;
    }
    .crm-sec__head h2 em { font-style: normal; background: var(--fs-lime); color: var(--fs-lime-ink); padding: 0 8px; border-radius: 6px; }
    .crm-sec__head p { margin-top: 16px; font-size: 18px; color: var(--fg-2); line-height: 1.55; }

    /* Benefits grid (6 points) */
    .crm-benefits {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
      background: var(--border-1); border: 1px solid var(--border-1);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    .crm-benefit {
      background: var(--fs-white); padding: 36px 32px;
      display: flex; flex-direction: column; gap: 14px;
      transition: background var(--dur-med) var(--ease-out);
    }
    .crm-benefit:hover { background: var(--fs-paper); }
    .crm-benefit__icon {
      width: 44px; height: 44px; border-radius: var(--radius-sm);
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .crm-benefit__icon svg { width: 22px; height: 22px; }
    .crm-benefit h3 { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .crm-benefit p { font-size: 15px; color: var(--fg-2); line-height: 1.55; }

    /* Feature row */
    .crm-feat {
      display: grid; grid-template-columns: 1fr 1.15fr; gap: 80px; align-items: center;
      padding: 88px 0; border-top: 1px solid var(--border-1);
    }
    .crm-feat:first-of-type { border-top: none; padding-top: 0; }
    .crm-feat--flip .crm-feat__media { order: -1; }
    .crm-feat__eyebrow {
      display: inline-block;
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px;
    }
    .crm-feat h3 {
      font-family: var(--font-display);
      font-size: clamp(30px, 3vw, 42px);
      font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance;
    }
    .crm-feat__body { margin-top: 16px; font-size: 17px; color: var(--fg-2); line-height: 1.55; }
    .crm-feat ul { list-style: none; padding: 0; margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
    .crm-feat li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--fg-2); line-height: 1.5; }
    .crm-feat li svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 3px; color: var(--fs-lime-deep); }
    .crm-feat__media {
      background: var(--fs-paper);
      background-image: radial-gradient(var(--fs-gray-300) 1px, transparent 1.2px);
      background-size: 10px 10px;
      border-radius: var(--radius-xl); padding: 28px;
      border: 1px solid var(--border-1);
      aspect-ratio: 5/4; position: relative; overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    /* ── Mockup: Pipeline Kanban ─────────────────────────── */
    .mk-pipeline {
      background: #fff; border-radius: var(--radius-lg);
      border: 1px solid var(--border-1);
      width: 100%; height: 100%;
      padding: 14px; display: flex; flex-direction: column; gap: 10px;
      box-shadow: var(--shadow-md); overflow: hidden;
    }
    .mk-pipeline__head {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 10px; border-bottom: 1px solid var(--border-1);
    }
    .mk-pipeline__title { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
    .mk-pipeline__actions { display: flex; gap: 4px; }
    .mk-pipeline__actions span {
      width: 8px; height: 8px; border-radius: 50%; background: var(--fs-gray-300);
    }
    .mk-pipeline__board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: 1; min-height: 0; }
    .mk-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .mk-col__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px; border-radius: 6px; background: var(--fs-gray-100);
      font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--fs-ink-soft);
    }
    .mk-col__count {
      background: #fff; color: var(--fs-ink); font-weight: 700; padding: 2px 6px;
      border-radius: 999px; font-size: 9px; letter-spacing: 0;
    }
    .mk-col--hot .mk-col__head { background: var(--fs-lime); color: var(--fs-lime-ink); }
    .mk-col--hot .mk-col__count { background: rgba(255,255,255,0.5); }
    .mk-card {
      background: #fff; border: 1px solid var(--border-1);
      border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 5px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .mk-card__name { font-size: 11px; font-weight: 700; color: var(--fs-ink); letter-spacing: -0.01em; line-height: 1.2; }
    .mk-card__meta { font-size: 9px; color: var(--fg-3); line-height: 1.3; }
    .mk-card__foot { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
    .mk-card__val { font-family: var(--font-display); font-weight: 700; font-size: 11px; color: var(--fs-ink); }
    .mk-avatar {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center;
      font-size: 8px; font-weight: 700;
    }
    .mk-avatar--ink { background: var(--fs-ink); color: #fff; }
    .mk-avatar--gray { background: var(--fs-gray-300); color: var(--fs-ink); }
    .mk-tag {
      display: inline-block; padding: 1px 6px; border-radius: 999px;
      font-size: 8px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      background: var(--fs-gray-100); color: var(--fs-ink-soft); align-self: flex-start;
    }
    .mk-tag--hot { background: var(--fs-lime); color: var(--fs-lime-ink); }
    .mk-tag--warm { background: #FFEFD4; color: #7C5200; }
    .mk-tag--cold { background: #E5F1F9; color: #1E4C74; }

    /* ── Mockup: Kontaktliste ───────────────────────────── */
    .mk-list {
      background: #fff; border-radius: var(--radius-lg);
      border: 1px solid var(--border-1);
      width: 100%; height: 100%; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: var(--shadow-md); overflow: hidden;
    }
    .mk-list__head {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 10px; border-bottom: 1px solid var(--border-1);
    }
    .mk-list__search {
      flex: 1; background: var(--fs-gray-100); border-radius: 8px;
      padding: 6px 10px; font-size: 11px; color: var(--fg-3);
      display: flex; align-items: center; gap: 6px;
    }
    .mk-list__btn {
      background: var(--fs-ink); color: #fff;
      padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: 700;
    }
    .mk-list__filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .mk-filter {
      padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 600;
      background: var(--fs-gray-100); color: var(--fs-ink-soft);
    }
    .mk-filter--active { background: var(--fs-ink); color: #fff; }
    .mk-filter--lime { background: var(--fs-lime); color: var(--fs-lime-ink); }
    .mk-list__table {
      display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 0;
    }
    .mk-row {
      display: grid; grid-template-columns: 1.4fr 1fr auto auto; gap: 10px;
      padding: 8px 6px; border-radius: 6px; align-items: center;
      transition: background var(--dur-fast);
    }
    .mk-row:hover { background: var(--fs-paper); }
    .mk-row__who { display: flex; align-items: center; gap: 8px; }
    .mk-row__who .mk-avatar { width: 22px; height: 22px; font-size: 9px; }
    .mk-row__name { font-size: 11px; font-weight: 700; color: var(--fs-ink); line-height: 1.2; }
    .mk-row__mail { font-size: 9px; color: var(--fg-3); }
    .mk-row__tags { display: flex; gap: 3px; flex-wrap: wrap; }
    .mk-row__val { font-family: var(--font-display); font-weight: 700; font-size: 11px; color: var(--fs-ink); text-align: right; }
    .mk-row__stage {
      font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 3px 7px; border-radius: 999px;
      background: var(--fs-gray-100); color: var(--fs-ink-soft); white-space: nowrap;
    }
    .mk-row__stage--lime { background: var(--fs-lime); color: var(--fs-lime-ink); }

    /* ── Mockup: Deal Detail + Timeline ─────────────────── */
    .mk-deal {
      background: #fff; border-radius: var(--radius-lg);
      border: 1px solid var(--border-1);
      width: 100%; height: 100%; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: var(--shadow-md); overflow: hidden;
    }
    .mk-deal__head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding-bottom: 12px; border-bottom: 1px solid var(--border-1);
    }
    .mk-deal__title { font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.2; letter-spacing: -0.01em; }
    .mk-deal__sub { font-size: 10px; color: var(--fg-3); margin-top: 2px; }
    .mk-deal__val {
      font-family: var(--font-display); font-weight: 700; font-size: 20px;
      color: var(--fs-ink); letter-spacing: -0.02em; white-space: nowrap;
    }
    .mk-deal__stages { display: flex; gap: 4px; }
    .mk-deal__stage {
      flex: 1; height: 4px; border-radius: 999px; background: var(--fs-gray-200);
    }
    .mk-deal__stage--done { background: var(--fs-lime); }
    .mk-deal__stage--curr { background: var(--fs-ink); }
    .mk-deal__stage-labels { display: flex; gap: 4px; margin-top: 4px; }
    .mk-deal__stage-lbl {
      flex: 1; font-size: 8px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--fg-3); text-align: center;
    }
    .mk-deal__stage-lbl--curr { color: var(--fs-ink); }
    .mk-tl { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
    .mk-tl__label { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); }
    .mk-tl__items { display: flex; flex-direction: column; gap: 8px; }
    .mk-tl__item { display: flex; gap: 10px; align-items: flex-start; }
    .mk-tl__dot {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      background: var(--fs-gray-100); display: grid; place-items: center;
    }
    .mk-tl__dot svg { width: 11px; height: 11px; color: var(--fs-ink-soft); }
    .mk-tl__dot--lime { background: var(--fs-lime); }
    .mk-tl__dot--lime svg { color: var(--fs-lime-ink); }
    .mk-tl__text { font-size: 11px; line-height: 1.35; color: var(--fs-ink); }
    .mk-tl__text b { font-weight: 700; }
    .mk-tl__time { font-size: 9px; color: var(--fg-3); margin-top: 1px; }

    /* ── Integration section ────────────────────────────── */
    .crm-int {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    }
    .crm-int__card {
      background: #fff; border: 1px solid var(--border-1);
      border-radius: var(--radius-lg); padding: 28px 24px;
      display: flex; flex-direction: column; gap: 12px;
      transition: transform var(--dur-med) var(--ease-out), box-shadow var(--dur-med) var(--ease-out);
    }
    .crm-int__card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .crm-int__art {
      width: 100%; aspect-ratio: 16/10;
      background: var(--fs-paper);
      background-image: radial-gradient(var(--fs-gray-300) 1px, transparent 1.2px);
      background-size: 8px 8px;
      border-radius: var(--radius-md);
      display: grid; place-items: center; overflow: hidden;
    }
    .crm-int__art img { max-height: 80%; max-width: 80%; object-fit: contain; }
    .crm-int__card h4 { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
    .crm-int__card p { font-size: 13px; color: var(--fg-2); line-height: 1.5; }
    .crm-int__link {
      margin-top: auto; font-size: 13px; font-weight: 700; color: var(--fs-ink);
      display: inline-flex; align-items: center; gap: 4px; text-decoration: none;
      transition: gap var(--dur-fast) var(--ease-out);
    }
    .crm-int__link:hover { gap: 8px; }

    /* Testimonials */
    .crm-testi-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    .crm-testi {
      background: var(--fs-white); border: 1px solid var(--border-1);
      border-radius: var(--radius-lg); padding: 28px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .crm-testi--dark { background: var(--fs-ink); border-color: var(--fs-ink); }
    .crm-testi--lime { background: var(--fs-lime); border-color: var(--fs-lime); }
    .crm-testi__stars { color: var(--fs-lime-deep); font-size: 15px; letter-spacing: 2px; }
    .crm-testi--dark .crm-testi__stars { color: var(--fs-lime); }
    .crm-testi--lime .crm-testi__stars { color: var(--fs-lime-ink); }
    .crm-testi blockquote {
      font-size: 17px; line-height: 1.5; flex: 1;
      font-family: var(--font-display); font-weight: 500; letter-spacing: -0.01em;
      border: none; padding: 0; margin: 0; color: var(--fg-1);
    }
    .crm-testi--dark blockquote { color: #fff; }
    .crm-testi--lime blockquote { color: var(--fs-lime-ink); }
    .crm-testi__who { display: flex; align-items: center; gap: 12px; }
    .crm-testi__avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .crm-testi--lime .crm-testi__avatar { background: var(--fs-ink); color: #fff; }
    .crm-testi--dark .crm-testi__avatar { background: #fff; color: var(--fs-ink); }
    .crm-testi__name { font-size: 14px; font-weight: 700; }
    .crm-testi--dark .crm-testi__name { color: #fff; }
    .crm-testi__role { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
    .crm-testi--dark .crm-testi__role { color: rgba(255,255,255,0.5); }
    .crm-testi--lime .crm-testi__role { color: rgba(47,58,0,0.65); }
    .crm-testi__stat {
      display: flex; align-items: baseline; gap: 8px;
      padding-top: 16px; border-top: 1px solid var(--border-1);
    }
    .crm-testi--dark .crm-testi__stat { border-top-color: rgba(255,255,255,0.15); }
    .crm-testi--lime .crm-testi__stat { border-top-color: rgba(47,58,0,0.15); }
    .crm-testi__stat-num { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .crm-testi--dark .crm-testi__stat-num { color: var(--fs-lime); }
    .crm-testi__stat-lbl { font-size: 12px; color: var(--fg-3); line-height: 1.3; }
    .crm-testi--dark .crm-testi__stat-lbl { color: rgba(255,255,255,0.55); }
    .crm-testi--lime .crm-testi__stat-lbl { color: rgba(47,58,0,0.7); }

    /* FAQ */
    .crm-faq { max-width: 820px; margin: 0 auto; }
    .crm-faq__item { border-bottom: 1px solid var(--border-1); }
    .crm-faq__item:first-child { border-top: 1px solid var(--border-1); }
    .crm-faq__btn {
      width: 100%; background: none; border: none; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 0; gap: 20px; text-align: left;
      font-family: var(--font-display); font-size: 18px; font-weight: 600;
      color: var(--fs-ink); letter-spacing: -0.01em;
    }
    .crm-faq__icon {

            {BENEFITS.map(b => (
              <div key={b.t} className="crm-benefit">
                <div className="crm-benefit__icon">{b.i}</div>
                <h3>{b.t}</h3>
                <p>{b.d}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const Feature1 = () => (
      <div className="crm-feat">
        <div>
          <span className="crm-feat__eyebrow">Pipeline</span>
          <h3>Sieh deinen Umsatz, bevor er passiert.</h3>
          <p className="crm-feat__body">
            Dein Kanban-Board zeigt jeden Deal nach Phase, Wert und Nächstem-Schritt — sortiert nach
            Wahrscheinlichkeit. Du weißt jeden Montag, wo du den Telefonhörer abnehmen musst.
          </p>
          <ul>
            <li><ICheck />Mehrere Pipelines (Verkauf, Onboarding, Coaching-Batches)</li>
            <li><ICheck />Deal-Wert, Wahrscheinlichkeit & Close-Datum pro Karte</li>
            <li><ICheck />Drag-&-Drop zwischen Phasen — Automation feuert automatisch</li>
            <li><ICheck />Forecast-Zahl im Header, live berechnet</li>
          </ul>
        </div>
        <div className="crm-feat__media"><PipelineMock /></div>
      </div>
    );

    const Feature2 = () => (
      <div className="crm-feat crm-feat--flip">
        <div>
          <span className="crm-feat__eyebrow">Kontakte & Segmente</span>
          <h3>Filtere deine Liste wie ein Spreadsheet — mit Tempo.</h3>
          <p className="crm-feat__body">
            Kombiniere Tags, Quelle, Umsatz, letzter E-Mail-Klick und Custom Fields zu Segmenten, die
            sich live aktualisieren. Aus jedem Segment: Mail-Sequenz, Export oder neue Zielgruppe.
          </p>
          <ul>
            <li><ICheck />Live-Segmente: Regel einmal, Liste wächst automatisch</li>
            <li><ICheck />Bulk-Aktionen: Tag setzen, Pipeline zuweisen, E-Mail senden</li>
            <li><ICheck />CSV-Import mit Mapping oder Migration aus HubSpot & Co.</li>
            <li><ICheck />Unbegrenzt Custom Fields — Business-konform strukturiert</li>
          </ul>
        </div>
        <div className="crm-feat__media"><ListMock /></div>
      </div>
    );

    const Feature3 = () => (
      <div className="crm-feat">
        <div>
          <span className="crm-feat__eyebrow">Verlauf & Automation</span>
          <h3>Jede Interaktion automatisch protokolliert.</h3>
          <p className="crm-feat__body">
            Geöffnete Mails, geklickte Links, gebuchte Calls, gezahlte Rechnungen — alles landet
            chronologisch im Kontakt-Profil. Du greifst nie wieder ins Leere, weil du „nicht weißt,
            wo ihr stehengeblieben seid".
          </p>
          <ul>
            <li><ICheck />E-Mails, Calls, Notizen, Buchungen, Käufe in einer Timeline</li>
            <li><ICheck />Trigger: Tag gesetzt → Sequenz startet → Deal verschiebt sich</li>
            <li><ICheck />Erinnerungen für Follow-ups mit einem Klick</li>
            <li><ICheck />Interne Notizen & Team-Mentions (@Kolleg:in)</li>
          </ul>
        </div>
        <div className="crm-feat__media"><DealMock /></div>
      </div>
    );

    const Features = () => (
      <section className="crm-sec">
        <div className="crm-sec__inner">
          <div className="crm-sec__head">
            <div className="crm-eyebrow">So funktioniert's</div>
            <h2>Drei Bausteine. Ein flüssiger Arbeitstag.</h2>
          </div>
          <Feature1 />
          <Feature2 />
          <Feature3 />
        </div>
      </section>
    );

    const Integrations = () => (
      <section className="crm-sec crm-sec--alt">
        <div className="crm-sec__inner">
          <div className="crm-sec__head">
            <div className="crm-eyebrow">Native Integration</div>
            <h2>Dein CRM spricht mit dem ganzen Stack.</h2>
            <p>Keine Zapier-Bastelei. Funnelspace-Module teilen sich eine Datenbank — Daten fließen automatisch.</p>
          </div>
          <div className="crm-int">
            {INTEGRATIONS.map(i => (
              <div key={i.t} className="crm-int__card">
                <div className="crm-int__art"><img src={i.img} alt="" /></div>
                <h4>{i.t}</h4>
                <p>{i.d}</p>
                <a href="#" className="crm-int__link">{i.link} <IArrow /></a>
              </div>
            ))}
          </div>
        </div>
      </section>
    );

    const Testimonials = () => (
      <section className="crm-sec">
        <div className="crm-sec__inner">
          <div className="crm-sec__head">
            <div className="crm-eyebrow">Stimmen aus der Praxis</div>
            <h2>Schon 2.000+ Creator:innen arbeiten damit.</h2>
          </div>
          <div className="crm-testi-grid">
            {TESTIMONIALS.map(t => (
              <article key={t.name} className={`crm-testi${t.tone==='dark'?' crm-testi--dark':t.tone==='lime'?' crm-testi--lime':''}`}>
                <div className="crm-testi__stars">★★★★★</div>
                <blockquote>{t.quote}</blockquote>
                <div className="crm-testi__stat">
                  <div className="crm-testi__stat-num">{t.stat}</div>
                  <div className="crm-testi__stat-lbl">{t.statLbl}</div>
                </div>
                <div className="crm-testi__who">
                  <div className="crm-testi__avatar">{t.initials}</div>
                  <div>
                    <div className="crm-testi__name">{t.name}</div>
                    <div className="crm-testi__role">{t.role}</div>
                  </div>
                </div>
              </article>
            ))}
          </div>
        </div>
      </section>
    );

    const FAQ = () => {
      const [open, setOpen] = useState(0);
      return (
        <section className="crm-sec crm-sec--alt">
          <div className="crm-sec__inner">
            <div className="crm-sec__head">
              <div className="crm-eyebrow">FAQ</div>
              <h2>Häufige Fragen zum CRM.</h2>
            </div>
            <div className="crm-faq">
              {FAQS.map((f, i) => (
                <div key={i} className={`crm-faq__item${open === i ? ' open' : ''}`}>
                  <button className="crm-faq__btn" onClick={() => setOpen(open === i ? -1 : i)}>
                    {f.q}
                    <span className="crm-faq__icon">+</span>
                  </button>
                  <div className="crm-faq__body">{f.a}</div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const FinalCTA = () => (
      <section className="crm-final">
        <div className="crm-final__inner">
          <h2>Starte mit einem CRM, das <em>mitarbeitet</em>.</h2>
          <p>14 Tage kostenlos. Keine Kreditkarte. Dein erster Lead ist in 15 Minuten drin.</p>
          <div className="crm-final__btns">
            <a href="#signup" className="btn btn--primary btn-lg">Jetzt kostenlos starten</a>
            <a href="#demo" className="btn btn--ghost btn-lg" style={{borderColor:'rgba(255,255,255,0.25)', color:'rgba(255,255,255,0.85)'}}>Live-Demo buchen</a>
          </div>
        </div>
      </section>
    );

    /* ── Tweaks ──────────────────────────────────────────────── */

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "headlineVariant": "ordnung"
    }/*EDITMODE-END*/;

    const TweaksPanel = ({ state, setState, visible, onClose }) => {
      if (!visible) return null;
      const opts = [
        { k:'ordnung', l:'Ordnung', d:'„… an einem Ort."' },
        { k:'lead', l:'Lead-Angst', d:'„Nie wieder einen Lead vergessen."' },
        { k:'integration', l:'Integration', d:'„… spricht mit deinem Funnel."' },
      ];
      return (
        <div style={{
          position:'fixed', bottom:20, right:20, zIndex:200,
          background:'#fff', border:'1px solid var(--border-1)',
          borderRadius: 'var(--radius-lg)', boxShadow:'var(--shadow-lg)',
          padding:20, width:280, fontFamily:'var(--font-sans)'
        }}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14}}>
            <div style={{fontFamily:'var(--font-display)', fontWeight:700, fontSize:16}}>Tweaks</div>
            <button onClick={onClose} style={{background:'none', border:'none', cursor:'pointer', fontSize:18, color:'var(--fg-3)'}}>×</button>
          </div>
          <div style={{fontSize:11, fontWeight:700, letterSpacing:'0.08em', textTransform:'uppercase', color:'var(--fg-3)', marginBottom:10}}>Hero-Headline</div>
          <div style={{display:'flex', flexDirection:'column', gap:8}}>
            {opts.map(o => (
              <button key={o.k} onClick={() => {
                const next = {...state, headlineVariant: o.k};
                setState(next);
                window.parent.postMessage({type:'__edit_mode_set_keys', edits:{headlineVariant:o.k}}, '*');
              }} style={{
                textAlign:'left', padding:'10px 12px',
                border: state.headlineVariant===o.k ? '2px solid var(--fs-ink)' : '1px solid var(--border-1)',
                background: state.headlineVariant===o.k ? 'var(--fs-lime)' : '#fff',
                borderRadius: 10, cursor:'pointer', fontFamily:'var(--font-sans)'
              }}>
                <div style={{fontSize:13, fontWeight:700}}>{o.l}</div>
                <div style={{fontSize:11, color:'var(--fg-3)', marginTop:2}}>{o.d}</div>
              </button>
            ))}
          </div>
        </div>
      );
    };

    /* ── App ─────────────────────────────────────────────────── */

    const App = () => {
      const [state, setState] = useState(TWEAK_DEFAULTS);
      const [tweaksVisible, setTweaksVisible] = useState(false);

      React.useEffect(() => {
        const handler = (e) => {
          if (!e.data) return;
          if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
          if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
        };
        window.addEventListener('message', handler);
        window.parent.postMessage({type:'__edit_mode_available'}, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      return (
        <>
          <Nav />
          <main>
            <Hero variant={state.headlineVariant} />
            <Benefits />
            <Features />
            <Integrations />
            <Testimonials />
            <FAQ />
          </main>
          <FinalCTA />
          <Footer />
          <TweaksPanel
            state={state}
            setState={setState}
            visible={tweaksVisible}
            onClose={() => {
              setTweaksVisible(false);
              window.parent.postMessage({type:'__edit_mode_dismissed'}, '*');
            }}
          />
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
