<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blog — Funnelspace</title>
<meta name="description" content="Diese Seite ist selbst ein Funnelspace-Blogartikel. Schalte auf Editor-Ansicht und sieh, wie sie gebaut ist: Blöcke, SEO-Check, Opt-in und Funnel-CTA direkt im Artikel." />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="site.css" />
<link rel="stylesheet" href="blog-feature.css" />
</head>
<body class="bf-body">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const P = {
  eye:"M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z|M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z",
  pen:"M12 20h9|M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z",
  check:"M20 6 9 17l-5-5",
  circleCheck:"M22 11.1V12a10 10 0 1 1-5.9-9.1|m9 11 3 3L22 4",
  plus:"M12 5v14|M5 12h14",
  grip:"M9 5h.01|M9 12h.01|M9 19h.01|M15 5h.01|M15 12h.01|M15 19h.01",
  trash:"M3 6h18|M8 6V4h8v2|M19 6l-1 14H6L5 6",
  copy:"M8 8h12v12H8z|M4 16V4h12",
  type:"M4 7V4h16v3|M9 20h6|M12 4v16",
  image:"M3 5h18v14H3z|m3 16 5-5 4 4 3-3 6 6|M8.5 9.5h.01",
  quote:"M7 7H4v6h6V7c0 4-1 6-3 7|M20 7h-3v6h6V7c0 4-1 6-3 7",
  mail:"M3 6h18v12H3z|m3 7 9 6 9-6",
  code:"m8 8-4 4 4 4|m16 8 4 4-4 4",
  layout:"M3 4h18v16H3z|M3 10h18|M9 20V10",
  search:"M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z|m21 21-4.3-4.3",
  cloud:"M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.3 9.4 4 4 0 0 0 7 19Z|m9 14 2 2 4-4",
  share:"M4 12v7h16v-7|M12 3v13|m8 7 4-4 4 4",
  sliders:"M4 6h16|M4 12h16|M4 18h16|M9 4v4|M15 10v4|M7 16v4",
  send:"m22 2-7 20-4-9-9-4Z",
  clock:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z|M12 7v5l3 2",
};
const Icon = ({n, ...r}) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...r}>
    {P[n].split("|").map((d,i)=><path key={i} d={d} />)}
  </svg>
);

/* ── Block wrapper with editor chrome ─────────────────────── */
const Blk = ({label, children, onRemove}) => (
  <div className="blk">
    <div className="blk__bar">
      <span className="blk__grip"><Icon n="grip" /></span>
      <span>{label}</span>
      <div className="blk__tools">
        <button title="Duplizieren"><Icon n="copy" /></button>
        <button title="Einstellungen"><Icon n="sliders" /></button>
        <button title="Löschen" onClick={onRemove}><Icon n="trash" /></button>
      </div>
    </div>
    {children}
  </div>
);

/* ── Insertable block templates ───────────────────────────── */
const TEMPLATES = {
  text:  {label:"Textblock", icon:"type", node:<p>Neuer Textblock. Schreib los — oder lass die KI einen ersten Entwurf aus deiner Überschrift bauen.</p>},
  image: {label:"Bild", icon:"image", node:<div className="bf-figure"><img src="assets/illustrations/blog.png" alt="" /><div className="bf-figcap">Bildunterschrift bearbeiten</div></div>},
  quote: {label:"Zitat", icon:"quote", node:<blockquote className="bf-quote"><p>„Ein Zitat, das hängen bleibt."</p><cite>Name, Rolle</cite></blockquote>},
  cta:   {label:"Funnel-CTA", icon:"layout", node:<div className="bf-cta-blk"><div><h3>Hol dir die Vorlage</h3><p>Verlinkt direkt auf einen Funnel aus deinem Workspace.</p></div><div className="bf-cta-blk__side"><a href="#" className="btn btn--primary">Funnel wählen</a></div></div>},
  optin: {label:"E-Mail-Opt-in", icon:"mail", node:<div className="bf-optin"><h3>Newsletter-Block</h3><p>Trägt Leser direkt in eine Liste im CRM ein.</p><div className="bf-optin__form"><input placeholder="deine@mail.de" /><button className="btn btn--ink">Eintragen</button></div></div>},
  code:  {label:"Code", icon:"code", node:<pre className="bf-code"><span className="k">&lt;script&gt;</span> fs.track(<span className="k">'artikel_gelesen'</span>) <span className="k">&lt;/script&gt;</span></pre>},
};

const Slot = ({open, onToggle, onPick}) => (
  <div className={"slot" + (open ? " open" : "")} style={{position:"relative"}}>
    <div className="slot__line" />
    <button className="slot__btn" onClick={onToggle} title="Block einfügen"><Icon n="plus" /></button>
    <div className="slot__line" />
    {open && (
      <div className="palette" style={{top:"100%", left:"50%", transform:"translateX(-50%)"}}>
        <div className="palette__title">Block einfügen</div>
        {Object.entries(TEMPLATES).map(([k,t])=>(
          <button key={k} onClick={()=>onPick(k)}><Icon n={t.icon} />{t.label}</button>
        ))}
      </div>
    )}
  </div>
);

/* ── SEO panel ────────────────────────────────────────────── */
const SeoPanel = () => {
  const [t, setT] = useState("Blog in Funnelspace: Artikel, die Leads bringen");
  const [s, setS] = useState("blog-leads");
  const [d, setD] = useState("Schreib Artikel, verteile sie automatisch und mach Leser zu Kontakten – alles in Funnelspace, ohne zweites CMS.");
  const rules = [
    {ok: t.length >= 35 && t.length <= 60, txt:"Titel zwischen 35 und 60 Zeichen"},
    {ok: /blog/i.test(t), txt:"Fokus-Keyword im Titel"},
    {ok: d.length >= 110 && d.length <= 160, txt:"Meta-Beschreibung 110–160 Zeichen"},
    {ok: s.length > 0 && s.length <= 24 && !/\s/.test(s), txt:"Kurzer, sauberer Slug"},
    {ok: true, txt:"Bild mit Alt-Text hinterlegt"},
  ];
  const score = Math.round(rules.filter(r=>r.ok).length / rules.length * 100);
  const good = score >= 80;
  return (
    <div className="bf-panel">
      <div className="bf-panel__head"><Icon n="search" />SEO-Check</div>
      <div className="bf-score">
        <div className="bf-score__ring" style={{background: good ? "var(--fs-lime)" : "var(--fs-gray-100)", color: good ? "var(--fs-lime-ink)" : "var(--fg-2)", border: good ? "none" : "1px solid var(--border-1)"}}>{score}</div>
        <div className="bf-score__txt"><b>{good ? "Bereit zum Veröffentlichen" : "Fast fertig"}</b>Live berechnet, während du tippst.</div>
      </div>
      <div className="bf-field"><label>SEO-Titel<i>{t.length}/60</i></label><input value={t} onChange={e=>setT(e.target.value)} /></div>
      <div className="bf-field"><label>Slug</label><input value={s} onChange={e=>setS(e.target.value)} /></div>
      <div className="bf-field"><label>Meta-Beschreibung<i>{d.length}/160</i></label><textarea rows="3" value={d} onChange={e=>setD(e.target.value)} /></div>
      <div className="bf-serp">
        <div className="bf-serp__url">funnelspace.de › blog › {s || "…"}</div>
        <div className="bf-serp__t">{t.slice(0,60) || "Ohne Titel"}{t.length>60?"…":""}</div>
        <div className="bf-serp__d">{d.slice(0,160)}{d.length>160?"…":""}</div>
      </div>
      <div className="bf-rules">
        {rules.map((r,i)=>(
          <div key={i} className={"bf-rule " + (r.ok?"ok":"no")}><Icon n={r.ok?"circleCheck":"clock"} />{r.txt}</div>
        ))}
      </div>
    </div>
  );
};

/* ── Page ─────────────────────────────────────────────────── */
const SECTIONS = [
  {id:"warum", label:"Warum ein eigener Blog"},
  {id:"editor", label:"Blöcke statt Baukasten-Chaos"},
  {id:"seo", label:"SEO ohne Plugin-Wildwuchs"},
  {id:"lead", label:"Vom Leser zum Lead"},
  {id:"verteilen", label:"Einmal schreiben, überall zeigen"},
  {id:"faq", label:"Häufige Fragen"},
];

const App = () => {
  const [edit, setEdit] = useState(false);
  const [openSlot, setOpenSlot] = useState(null);
  const [ins, setIns] = useState({});
  const [prog, setProg] = useState(0);
  const [active, setActive] = useState("warum");
  const artRef = useRef(null);

  useEffect(() => {
    const fn = () => {
      const el = artRef.current; if (!el) return;
      const top = el.offsetTop, h = el.offsetHeight;
      const y = window.scrollY + window.innerHeight * 0.35;
      setProg(Math.max(0, Math.min(1, (y - top) / h)) * 100);
      let cur = SECTIONS[0].id;
      SECTIONS.forEach(s => { const n = document.getElementById(s.id); if (n && n.getBoundingClientRect().top < 200) cur = s.id; });
      setActive(cur);
    };
    window.addEventListener("scroll", fn, {passive:true}); fn();
    return () => window.removeEventListener("scroll", fn);
  }, []);

  useEffect(() => { if (!edit) setOpenSlot(null); }, [edit]);

  const add = (slot, type) => {
    setIns(p => ({...p, [slot]: [...(p[slot]||[]), {type, id: Math.random().toString(36).slice(2)}]}));
    setOpenSlot(null);
  };
  const drop = (slot, id) => setIns(p => ({...p, [slot]: (p[slot]||[]).filter(b => b.id !== id)}));

  const blocks = [
    {label:"Textblock", node:(<>
      <p className="bf-lede">Du hast etwas zu sagen, und du willst, dass es gefunden wird. Nur landet dein Blog meistens in einem eigenen System: eigenes Login, eigene Rechnung, eigene Datenbank — und deine Leser landen nirgendwo.</p>
      <p>Der Funnelspace-Blog liegt dort, wo dein Business ohnehin läuft. Jeder Artikel kennt deine Funnels, deine Listen und dein CRM. Genau diese Seite hier ist ein Beispiel: <strong>Sie ist ein ganz normaler Blogartikel aus Funnelspace.</strong> Schalte oben rechts auf <em>Editor-Ansicht</em> — du siehst dieselben Blöcke, die auch du beim Schreiben siehst.</p>
    </>)},
    {label:"Überschrift + Text", node:(<>
      <h2 id="warum">Warum ein eigener Blog — und nicht nur Social Media</h2>
      <p>Reichweite auf fremden Plattformen ist geliehen. Ein Artikel auf deiner Domain arbeitet Jahre für dich, taucht in der Suche auf und gehört dir. Content-Marketing ist damit die einzige Traffic-Quelle, die günstiger wird, je länger du sie betreibst.</p>
    </>)},
    {label:"Statistik-Block", node:(
      <div className="bf-stats">
        <div className="bf-stat"><b>0 €</b><span>Extra-Kosten für WordPress, Hosting und Plugins</span></div>
        <div className="bf-stat"><b>1 Login</b><span>Artikel, Leads und Verkäufe im selben Workspace</span></div>
        <div className="bf-stat"><b>&lt; 1 s</b><span>Ladezeit dank statisch ausgelieferter Seiten</span></div>
      </div>
    )},
    {label:"Überschrift + Text", node:(<>
      <h2 id="editor">Blöcke statt Baukasten-Chaos</h2>
      <p>Du schreibst in Blöcken: Text, Bild, Zitat, Galerie, Code, Video — und dazu die Blöcke, die es nur bei uns gibt, weil sie mit dem Rest der Plattform reden. Ein Klick auf das Plus zwischen zwei Blöcken, fertig. Alles, was du einfügst, bleibt responsiv und im Design deiner Marke.</p>
    </>)},
    {label:"Bild", node:(
      <div className="bf-figure">
        <img src="assets/illustrations/blog.png" alt="Isometrische Illustration des Funnelspace-Blogs" />
        <div className="bf-figcap">Der Editor: links Blöcke, rechts SEO — mehr Bedienoberfläche brauchst du nicht.</div>
      </div>
    )},
    {label:"Checkliste", node:(
      <ul className="bf-check">
        <li><Icon n="circleCheck" /><span><strong>Versionen &amp; Entwürfe.</strong> Jede Änderung wird gespeichert, jede Version lässt sich zurückholen.</span></li>
        <li><Icon n="circleCheck" /><span><strong>Terminiert veröffentlichen.</strong> Artikel schreiben, Datum setzen, weiterarbeiten.</span></li>
        <li><Icon n="circleCheck" /><span><strong>KI-Entwurf.</strong> Aus Stichpunkten eine Gliederung, aus der Gliederung ein erster Text — in deiner Tonalität.</span></li>
        <li><Icon n="circleCheck" /><span><strong>Mehrere Autoren.</strong> Rollen, Freigaben und Kommentare für dein Team.</span></li>
      </ul>
    )},
    {label:"Überschrift + Text", node:(<>
      <h2 id="seo">SEO ohne Plugin-Wildwuchs</h2>
      <p>Titel, Slug, Meta-Beschreibung, Open-Graph-Bild, Sitemap, saubere Überschriften-Hierarchie: alles eingebaut. Rechts im Editor siehst du live, wie dein Artikel bei Google aussieht — <strong>probier es aus, das Panel dort ist echt.</strong> Ändere den Titel und beobachte die Vorschau.</p>
    </>)},
    {label:"Zitat", node:(
      <blockquote className="bf-quote">
        <p>„Ich habe drei Jahre lang WordPress gepflegt, damit ein Blog läuft. Jetzt schreibe ich einfach."</p>
        <cite>Beispielhafte Nutzerstimme — durch echtes Testimonial ersetzen</cite>
      </blockquote>
    )},
    {label:"Überschrift + Text", node:(<>
      <h2 id="lead">Vom Leser zum Lead — im selben Artikel</h2>
      <p>Der Unterschied zu jedem anderen Blog: Dein Artikel kann verkaufen. Setz einen Opt-in-Block mitten in den Text, und der Kontakt landet direkt in deiner Liste — mit Artikel-Tag, damit deine Automation weiß, wofür er sich interessiert.</p>
    </>)},
    {label:"E-Mail-Opt-in", node:(
      <div className="bf-optin">
        <h3>Content-Plan für 30 Tage</h3>
        <p>Themen, Formate und Verteilkanäle als Vorlage. Kommt direkt in dein Postfach.</p>
        <form className="bf-optin__form" onSubmit={e=>e.preventDefault()}>
          <input type="email" placeholder="deine@mail.de" />
          <button className="btn btn--ink">Plan holen</button>
        </form>
        <small>Tag „content-plan" · Liste „Blog-Leser" · Double-Opt-in aktiv</small>
      </div>
    )},
    {label:"Funnel-CTA", node:(
      <div className="bf-cta-blk">
        <div>
          <h3>Und wenn er kaufen will?</h3>
          <p>Der CTA-Block verlinkt auf einen Funnel aus deinem Workspace — inklusive Tracking, welcher Artikel den Verkauf gebracht hat.</p>
        </div>
        <div className="bf-cta-blk__side"><a href="#signup" className="btn btn--primary btn-lg">Blog kostenlos testen</a></div>
      </div>
    )},
    {label:"Überschrift + Text", node:(<>
      <h2 id="verteilen">Einmal schreiben, überall zeigen</h2>
      <p>Ist der Artikel live, macht Funnelspace den Rest: Newsletter an deine Liste, Beitrag für deine Kanäle, Eintrag in die Sitemap. Du entscheidest nur, was raus soll.</p>
    </>)},
    {label:"FAQ", node:(
      <div id="faq">
        <h2 style={{marginBottom:"24px"}}>Häufige Fragen</h2>
        <div className="bf-faq">
          {[
            ["Kann ich meinen bestehenden Blog umziehen?","Ja. Importiere aus WordPress oder per RSS — inklusive Bilder, Kategorien und Weiterleitungen der alten URLs, damit dein Ranking bleibt. Beim Umzugsservice übernehmen wir das für dich."],
            ["Läuft der Blog auf meiner eigenen Domain?","Der Blog liegt unter deiner Domain, wahlweise als /blog oder als Subdomain. SSL richten wir automatisch ein."],
            ["Wie schnell ist der Blog?","Artikel werden statisch ausgeliefert und über ein CDN gecacht. Keine Plugins, die die Seite ausbremsen."],
            ["Ist der Blog DSGVO-konform?","Gehostet in Deutschland, Opt-ins mit Double-Opt-in und dokumentierter Einwilligung, keine externen Tracker per Default."],
          ].map(([q,a],i)=>(
            <details key={i}>
              <summary>{q}<Icon n="plus" /></summary>
              <p>{a}</p>
            </details>
          ))}
        </div>
      </div>
    )},
  ];

  const rendered = [];
  blocks.forEach((b, i) => {
    rendered.push(<Slot key={"s"+i} open={openSlot===i} onToggle={()=>setOpenSlot(openSlot===i?null:i)} onPick={t=>add(i,t)} />);
    (ins[i]||[]).forEach(item => {
      const t = TEMPLATES[item.type];
      rendered.push(<Blk key={item.id} label={t.label} onRemove={()=>drop(i,item.id)}>{t.node}</Blk>);
    });
    rendered.push(<Blk key={"b"+i} label={b.label}>{b.node}</Blk>);
  });

  return (
    <>
      <Nav />
      <div className="bf-bar">
        <div className="bf-bar__inner">
          <div className="bf-crumb"><a href="index.html">Funnelspace</a> › <a href="funktionen.html">Funktionen</a> › <b>Blog</b></div>
          <div className="bf-bar__spacer" />
          {edit && <div className="bf-savehint"><Icon n="cloud" />Entwurf gespeichert · gerade eben</div>}
          <div className="bf-modes">
            <button aria-pressed={!edit} onClick={()=>setEdit(false)}><Icon n="eye" />Leseansicht</button>
            <button aria-pressed={edit} onClick={()=>setEdit(true)}><Icon n="pen" />Editor</button>
          </div>
        </div>
        <div className="bf-progress" style={{width: prog + "%"}} />
      </div>

      <header className="bf-head">
        <div className="bf-head__inner">
          <span className="bf-eyebrow">Feature · Blog</span>
          <h1>Diese Seite ist ein <mark>Blogartikel</mark>. Gebaut in Funnelspace.</h1>
          <p className="bf-head__lead">Kein zweites CMS, kein Plugin-Zoo, keine extra Rechnung. Schreib Artikel dort, wo auch deine Funnels, E-Mails und Kontakte liegen — und mach Leser zu Kunden, ohne die Seite zu wechseln.</p>
          <div className="bf-byline">
            <div className="bf-avatar">FS</div>
            <div className="bf-byline__meta"><b>Redaktion Funnelspace</b>15. August 2026 · 6 Min. Lesezeit</div>
            <div className="bf-tags">
              <span className="bf-tag">Content-Marketing</span>
              <span className="bf-tag">SEO</span>
              <span className="bf-tag">Produkt</span>
            </div>
          </div>
        </div>
      </header>

      <div className={"bf-layout" + (edit ? " is-edit" : "")}>
        <aside className="bf-side">
          <div className="bf-side__label">Inhalt</div>
          <nav className="bf-toc">
            {SECTIONS.map(s => <a key={s.id} href={"#"+s.id} className={active===s.id?"on":""}>{s.label}</a>)}
          </nav>
          <p className="bf-side__note">Das Inhaltsverzeichnis baut sich automatisch aus deinen H2-Überschriften.</p>
        </aside>

        <article className="bf-article" ref={artRef}>{rendered}</article>

        <aside className="bf-rail">
          {edit ? <SeoPanel /> : (
            <>
              <div className="bf-panel">
                <div className="bf-panel__head"><Icon n="pen" />So ist diese Seite gebaut</div>
                <p style={{fontSize:"13.5px",color:"var(--fg-2)",lineHeight:1.55}}>Schalt oben auf <strong>Editor</strong>: Du siehst Blockrahmen, kannst zwischen zwei Absätzen neue Blöcke einfügen und den SEO-Check live bedienen.</p>
                <button className="btn btn--primary btn-sm" style={{marginTop:"14px"}} onClick={()=>setEdit(true)}>Editor-Ansicht öffnen</button>
              </div>
              <div className="bf-panel">
                <div className="bf-panel__head"><Icon n="share" />Teilen</div>
                <div className="bf-share"><a href="#">LinkedIn</a><a href="#">X</a><a href="#">Link kopieren</a></div>
              </div>
              <div className="bf-panel">
                <div className="bf-panel__head"><Icon n="type" />Weiterlesen</div>
                <a className="bf-mini" href="blog.html"><span className="bf-mini__n">01</span><span className="bf-mini__t">In 15 Minuten zum ersten Funnel</span></a>
                <a className="bf-mini" href="email-marketing.html"><span className="bf-mini__n">02</span><span className="bf-mini__t">E-Mail-Sequenzen, die nicht nerven</span></a>
                <a className="bf-mini" href="crm.html"><span className="bf-mini__n">03</span><span className="bf-mini__t">Was gehört ins CRM — und was nicht?</span></a>
              </div>
            </>
          )}
        </aside>
      </div>

      <section className="bf-dist">
        <div className="bf-wrap">
          <h2>Nach dem Veröffentlichen fängt die Arbeit an. Bei uns nicht.</h2>
          <p className="bf-dist__lead">Ein Artikel ist der Anfang einer Kette. Funnelspace hängt die restlichen Glieder automatisch dran — weil alle Teile im selben System liegen.</p>
          <div className="bf-flow">
            <div className="bf-step"><span className="bf-step__n">01</span><h3>Artikel live</h3><p>Statisch ausgeliefert, in der Sitemap, mit sauberen Meta-Daten.</p></div>
            <div className="bf-step"><span className="bf-step__n">02</span><h3>Newsletter raus</h3><p>Der Artikel geht als E-Mail an das Segment, das zum Thema passt.</p></div>
            <div className="bf-step"><span className="bf-step__n">03</span><h3>Leser wird Kontakt</h3><p>Opt-in im Text legt den Kontakt mit Artikel-Tag im CRM an.</p></div>
            <div className="bf-step"><span className="bf-step__n">04</span><h3>Automation startet</h3><p>Passende Sequenz, passender Funnel — und du siehst, welcher Artikel verkauft hat.</p></div>
          </div>
        </div>
      </section>

      <CtaBand />
      <Footer />
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
