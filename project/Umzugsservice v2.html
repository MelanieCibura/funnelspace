<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tool-Umzugsservice — Funnelspace</title>
  <meta name="description" content="Wir ziehen deine Tools, Funnels, E-Mails und Kontakte in 3–7 Tagen zu Funnelspace um. Schnell, sauber, stressfrei — ohne Datenverlust, ohne Technik-Chaos." />
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <style>
    /* ── Umzugsservice v2 · editorial / paper-forward ──────────── */

    /* Hero — light, editorial */
    .u2-hero { background: var(--fs-paper); padding: 72px 40px 88px; position: relative; overflow: hidden; }
    .u2-hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(var(--fs-gray-300) 1px, transparent 1.3px); background-size: 22px 22px; opacity: 0.5; pointer-events: none; }
    .u2-hero__inner { max-width: 1280px; margin: 0 auto; position: relative; display: grid; grid-template-columns: 1.08fr 0.92fr; gap: 64px; align-items: center; }
    .u2-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fs-ink); background: var(--fs-lime); padding: 6px 14px; border-radius: var(--radius-pill); margin-bottom: 24px; }
    .u2-hero h1 { font-family: var(--font-display); font-size: clamp(44px, 5.4vw, 74px); font-weight: 800; line-height: 1.02; letter-spacing: -0.035em; text-wrap: balance; color: var(--fs-ink); }
    .u2-hero h1 em { font-style: normal; position: relative; white-space: nowrap; }
    .u2-hero h1 em::after { content: ""; position: absolute; left: -2px; right: -2px; bottom: 0.06em; height: 0.34em; background: var(--fs-lime); z-index: -1; border-radius: 2px; }
    .u2-hero__tag { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    .u2-hero__tag span { font-family: var(--font-display); font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--fs-ink); background: var(--fs-white); border: 1.5px solid var(--fs-ink); padding: 6px 14px; border-radius: var(--radius-pill); }
    .u2-hero__lead { margin-top: 22px; font-size: 18px; line-height: 1.6; color: var(--fg-2); max-width: 520px; }
    .u2-hero__cta { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; align-items: center; }
    .u2-hero__note { font-size: 13px; color: var(--fg-3); }
    .u2-hero__visual { position: relative; background: var(--fs-white); border: 2px solid var(--fs-ink); border-radius: var(--radius-xl); padding: 28px; aspect-ratio: 1/1.02; display: grid; place-items: center; box-shadow: 14px 14px 0 var(--fs-ink); }
    .u2-hero__visual img { max-height: 86%; max-width: 86%; object-fit: contain; }
    .u2-hero__card { position: absolute; bottom: -26px; left: -22px; background: var(--fs-ink); color: #fff; border-radius: var(--radius-lg); padding: 16px 20px; box-shadow: var(--shadow-lg); min-width: 244px; }
    .u2-hero__card-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fs-lime); }
    .u2-hero__card-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: rgba(255,255,255,0.85); }
    .u2-hero__card-row + .u2-hero__card-row { margin-top: 7px; }
    .u2-hero__dot { width: 15px; height: 15px; border-radius: 50%; background: var(--fs-lime); color: var(--fs-lime-ink); display: grid; place-items: center; font-size: 9px; font-weight: 900; flex-shrink: 0; }
    .u2-hero__dot--now { background: #fff; color: var(--fs-ink); }
    .u2-hero__dot--wait { background: rgba(255,255,255,0.18); color: transparent; }

    /* Migrate-from logo strip */
    .u2-from { background: var(--fs-ink); padding: 26px 40px; }
    .u2-from__inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
    .u2-from__label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.45); white-space: nowrap; }
    .u2-from__items { display: flex; gap: 12px; flex-wrap: wrap; }
    .u2-from__chip { font-family: var(--font-display); font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: rgba(255,255,255,0.72); border: 1px solid rgba(255,255,255,0.16); padding: 7px 14px; border-radius: var(--radius-pill); }

    /* Shared section */
    .u2-sec { padding: 104px 40px; }
    .u2-sec--white { background: var(--fs-white); }
    .u2-sec--paper { background: var(--fs-paper); }
    .u2-sec__inner { max-width: 1280px; margin: 0 auto; }
    .u2-sec__head { max-width: 760px; margin: 0 0 60px; }
    .u2-sec__head--center { margin: 0 auto 60px; text-align: center; }
    .u2-sec__eyebrow { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fs-lime-deep); margin-bottom: 14px; }
    .u2-sec__head h2 { font-family: var(--font-display); font-size: clamp(34px, 3.8vw, 54px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; text-wrap: balance; color: var(--fs-ink); }
    .u2-sec__head h2 em { font-style: normal; position: relative; }
    .u2-sec__head h2 em::after { content: ""; position: absolute; left: -1px; right: -1px; bottom: 0.08em; height: 0.32em; background: var(--fs-lime); z-index: -1; border-radius: 2px; }
    .u2-sec__head p { margin-top: 16px; font-size: 18px; color: var(--fg-2); line-height: 1.55; }

    /* Promise — editorial two-col */
    .u2-promise { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 72px; align-items: start; }
    .u2-promise__lead { font-family: var(--font-display); font-size: clamp(24px, 2.6vw, 34px); font-weight: 700; line-height: 1.18; letter-spacing: -0.025em; color: var(--fs-ink); text-wrap: balance; position: sticky; top: 90px; }
    .u2-promise__lead em { font-style: normal; color: var(--fs-lime-deep); }
    .u2-promise__list { display: flex; flex-direction: column; }
    .u2-promise__item { display: grid; grid-template-columns: 52px 1fr; gap: 20px; padding: 26px 0; border-bottom: 1px solid var(--border-1); }
    .u2-promise__item:first-child { border-top: 1px solid var(--border-1); }
    .u2-promise__num { font-family: var(--font-display); font-size: 32px; font-weight: 800; color: var(--fs-ink); line-height: 1; letter-spacing: -0.03em; }
    .u2-promise__item h3 { font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
    .u2-promise__item p { margin-top: 8px; font-size: 15px; color: var(--fg-2); line-height: 1.6; }
    .u2-promise__cta { margin-top: 32px; }

    /* What we move — tag cloud */
    .u2-move { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 960px; margin: 0 auto; }
    .u2-move__chip { display: inline-flex; align-items: center; gap: 12px; background: var(--fs-white); border: 1.5px solid var(--fs-ink); border-radius: var(--radius-pill); padding: 14px 22px; font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: -0.01em; color: var(--fs-ink); transition: transform var(--dur-med) var(--ease-out), background var(--dur-med); }
    .u2-move__chip:hover { transform: translateY(-3px); background: var(--fs-lime); }
    .u2-move__chip svg { width: 20px; height: 20px; }
    .u2-move__chip--accent { background: var(--fs-lime); }
    .u2-move__cta { margin-top: 48px; text-align: center; }

    /* Timeline — vertical editorial */
    .u2-timeline { max-width: 780px; margin: 0 auto; position: relative; }
    .u2-timeline::before { content: ""; position: absolute; left: 27px; top: 12px; bottom: 12px; width: 2px; background: var(--border-1); }
    .u2-tl-step { display: grid; grid-template-columns: 56px 1fr; gap: 28px; padding-bottom: 40px; position: relative; }
    .u2-tl-step:last-child { padding-bottom: 0; }
    .u2-tl-step__num { width: 56px; height: 56px; border-radius: 50%; background: var(--fs-ink); color: var(--fs-lime); display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; font-weight: 800; position: relative; z-index: 1; }
    .u2-tl-step__label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fs-lime-deep); margin-bottom: 6px; }
    .u2-tl-step h3 { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .u2-tl-step p { font-size: 15px; color: var(--fg-2); line-height: 1.6; max-width: 560px; }
    .u2-tl-step__body { padding-top: 4px; }

    /* Testimonials — featured + two */
    .u2-testi { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
    .u2-testi__col { display: flex; flex-direction: column; gap: 20px; }
    .u2-testi__card { background: var(--fs-white); border: 1px solid var(--border-1); border-radius: var(--radius-lg); padding: 32px; display: flex; flex-direction: column; gap: 18px; }
    .u2-testi__card--feat { background: var(--fs-ink); border-color: var(--fs-ink); color: #fff; padding: 44px; justify-content: center; }
    .u2-testi__card--lime { background: var(--fs-lime); border-color: var(--fs-lime); }
    .u2-testi__stars { color: var(--fs-lime-deep); font-size: 15px; letter-spacing: 2px; }
    .u2-testi__card--feat .u2-testi__stars { color: var(--fs-lime); }
    .u2-testi__card--lime .u2-testi__stars { color: var(--fs-lime-ink); }
    .u2-testi__card blockquote { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.01em; line-height: 1.4; flex: 1; border: none; padding: 0; margin: 0; color: var(--fg-1); font-size: 18px; }
    .u2-testi__card--feat blockquote { font-size: clamp(24px, 2.4vw, 30px); color: #fff; }
    .u2-testi__card--lime blockquote { color: var(--fs-lime-ink); }
    .u2-testi__who { display: flex; align-items: center; gap: 12px; }
    .u2-testi__avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--fs-lime); color: var(--fs-lime-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .u2-testi__card--feat .u2-testi__avatar { background: #fff; color: var(--fs-ink); }
    .u2-testi__card--lime .u2-testi__avatar { background: var(--fs-ink); color: #fff; }
    .u2-testi__name { font-size: 14px; font-weight: 700; }
    .u2-testi__card--feat .u2-testi__name { color: #fff; }
    .u2-testi__role { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
    .u2-testi__card--feat .u2-testi__role { color: rgba(255,255,255,0.55); }
    .u2-testi__card--lime .u2-testi__role { color: rgba(47,58,0,0.65); }

    /* For you */
    .u2-foryou { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .u2-foryou__card { background: var(--fs-white); border: 1px solid var(--border-1); border-radius: var(--radius-lg); padding: 36px 32px; display: flex; flex-direction: column; gap: 16px; transition: transform var(--dur-med) var(--ease-out), box-shadow var(--dur-med); }
    .u2-foryou__card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .u2-foryou__icon { width: 56px; height: 56px; border-radius: var(--radius-md); background: var(--fs-ink); color: var(--fs-lime); display: grid; place-items: center; }
    .u2-foryou__icon svg { width: 26px; height: 26px; }
    .u2-foryou__card h3 { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
    .u2-foryou__card h3 span { position: relative; }
    .u2-foryou__card h3 span::after { content: ""; position: absolute; left: -1px; right: -1px; bottom: 0.05em; height: 0.32em; background: var(--fs-lime); z-index: -1; border-radius: 2px; }
    .u2-foryou__card p { font-size: 15px; color: var(--fg-2); line-height: 1.55; }

    /* Pricing */
    .u2-price { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .u2-price__card { background: var(--fs-white); border: 1.5px solid var(--fs-ink); border-radius: var(--radius-xl); padding: 36px 32px; display: flex; flex-direction: column; gap: 20px; position: relative; transition: transform var(--dur-med) var(--ease-out), box-shadow var(--dur-med); }
    .u2-price__card:hover { transform: translateY(-4px); box-shadow: 10px 10px 0 var(--fs-ink); }
    .u2-price__card--featured { background: var(--fs-ink); color: #fff; }
    .u2-price__card--featured:hover { box-shadow: 10px 10px 0 var(--fs-lime); }
    .u2-price__badge { position: absolute; top: -12px; left: 32px; background: var(--fs-lime); color: var(--fs-lime-ink); font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 12px; border-radius: var(--radius-pill); }
    .u2-price__name { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .u2-price__sub { font-size: 14px; color: var(--fg-2); line-height: 1.45; min-height: 42px; margin-top: 6px; }
    .u2-price__card--featured .u2-price__sub { color: rgba(255,255,255,0.65); }
    .u2-price__amount { font-family: var(--font-display); font-size: 52px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; margin-top: 6px; }
    .u2-price__amount small { font-size: 15px; font-weight: 500; color: var(--fg-3); letter-spacing: 0; }
    .u2-price__card--featured .u2-price__amount small { color: rgba(255,255,255,0.55); }
    .u2-price__list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .u2-price__list li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--fg-2); line-height: 1.5; }
    .u2-price__card--featured .u2-price__list li { color: rgba(255,255,255,0.8); }
    .u2-price__list li svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 3px; color: var(--fs-lime-deep); }
    .u2-price__card--featured .u2-price__list li svg { color: var(--fs-lime); }

    /* Who + consult */
    .u2-who { display: grid; grid-template-columns: 1fr 1.15fr; gap: 64px; align-items: center; }
    .u2-who__portrait { aspect-ratio: 4/5; border-radius: var(--radius-xl); overflow: hidden; position: relative; border: 2px solid var(--fs-ink); background: var(--fs-paper); background-image: radial-gradient(var(--fs-gray-300) 1px, transparent 1.2px); background-size: 10px 10px; display: grid; place-items: center; box-shadow: 12px 12px 0 var(--fs-lime); }
    .u2-who__portrait img { max-width: 84%; max-height: 80%; object-fit: contain; }
    .u2-who__badge { position: absolute; bottom: 16px; left: 16px; background: var(--fs-ink); color: var(--fs-lime); border-radius: var(--radius-md); padding: 8px 12px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .u2-who__intro { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--fs-lime-deep); letter-spacing: -0.01em; }
    .u2-who h2 { font-family: var(--font-display); font-size: clamp(32px, 3.2vw, 46px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; margin-top: 4px; }
    .u2-who__tag { display: inline-flex; margin-top: 14px; font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--fs-ink); }
    .u2-who__tag span + span::before { content: "·"; color: var(--fs-gray-400); margin: 0 10px; }
    .u2-who p { margin-top: 18px; font-size: 16px; color: var(--fg-2); line-height: 1.6; }
    .u2-who__cta { margin-top: 26px; }

    /* Consult booking */
    .u2-consult { background: var(--fs-ink); color: #fff; border-radius: var(--radius-xl); padding: 48px; display: grid; grid-template-columns: 1.25fr 1fr; gap: 44px; align-items: center; position: relative; overflow: hidden; }
    .u2-consult::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(215,240,120,0.08) 1px, transparent 1.2px); background-size: 8px 8px; }
    .u2-consult__body { position: relative; }
    .u2-consult__eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fs-lime); }
    .u2-consult h2 { font-family: var(--font-display); font-size: clamp(28px, 2.8vw, 40px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; color: #fff; margin-top: 12px; }
    .u2-consult h2 em { font-style: normal; color: var(--fs-lime); }
    .u2-consult p { margin-top: 14px; font-size: 16px; color: rgba(255,255,255,0.7); line-height: 1.55; max-width: 460px; }
    .u2-consult__btns { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
    .u2-consult__cal { background: #fff; color: var(--fs-ink); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-lg); position: relative; }
    .u2-consult__cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .u2-consult__cal-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
    .u2-consult__cal-nav { display: flex; gap: 4px; }
    .u2-consult__cal-nav span { width: 22px; height: 22px; border-radius: 6px; background: var(--fs-gray-100); display: grid; place-items: center; font-size: 10px; color: var(--fs-ink-soft); }
    .u2-consult__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .u2-consult__day { aspect-ratio: 1; display: grid; place-items: center; font-size: 11px; color: var(--fs-ink); border-radius: 6px; }
    .u2-consult__day--dow { font-size: 9px; color: var(--fg-3); font-weight: 700; }
    .u2-consult__day--muted { color: var(--fs-gray-400); }
    .u2-consult__day--avail { background: var(--fs-paper); font-weight: 700; }
    .u2-consult__day--sel { background: var(--fs-lime); color: var(--fs-lime-ink); font-weight: 800; }
    .u2-consult__slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-1); }
    .u2-consult__slot { padding: 4px 10px; background: var(--fs-paper); border-radius: 6px; font-size: 11px; font-weight: 600; }
    .u2-consult__slot--taken { color: var(--fs-gray-400); text-decoration: line-through; }
    .u2-consult__slot--sel { background: var(--fs-ink); color: #fff; }

    /* FAQ */
    .u2-faq { max-width: 820px; margin: 0 auto; }
    .u2-faq__item { border-bottom: 1px solid var(--border-1); }
    .u2-faq__item:first-child { border-top: 1px solid var(--border-1); }
    .u2-faq__btn { width: 100%; background: none; border: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 24px 0; gap: 20px; text-align: left; font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--fs-ink); letter-spacing: -0.01em; }
    .u2-faq__num { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--fs-lime-deep); margin-right: 14px; }
    .u2-faq__icon { width: 30px; height: 30px; border-radius: 50%; background: var(--fs-gray-100); flex-shrink: 0; display: grid; place-items: center; font-size: 18px; color: var(--fs-ink); transition: background var(--dur-fast), transform var(--dur-med) var(--ease-out); }
    .u2-faq__item.open .u2-faq__icon { background: var(--fs-lime); transform: rotate(45deg); }
    .u2-faq__body { font-size: 15px; color: var(--fg-2); line-height: 1.65; overflow: hidden; max-height: 0; transition: max-height var(--dur-slow) var(--ease-out), padding var(--dur-slow) var(--ease-out); padding-left: 32px; }
    .u2-faq__item.open .u2-faq__body { max-height: 420px; padding-bottom: 24px; }

    /* Final CTA — lime */
    .u2-final { background: var(--fs-lime); padding: 100px 40px; text-align: center; position: relative; overflow: hidden; color: var(--fs-lime-ink); }
    .u2-final::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(47,58,0,0.08) 1px, transparent 1.3px); background-size: 22px 22px; opacity: 0.5; }
    .u2-final__inner { position: relative; max-width: 740px; margin: 0 auto; }
    .u2-final h2 { font-family: var(--font-display); font-size: clamp(36px, 4.2vw, 56px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; color: var(--fs-lime-ink); text-wrap: balance; }
    .u2-final p { margin: 16px auto 0; font-size: 18px; color: rgba(47,58,0,0.75); line-height: 1.5; }
    .u2-final__btns { display: flex; gap: 12px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }
    .u2-final__note { margin-top: 18px; font-size: 13px; color: rgba(47,58,0,0.55); }

    @media (max-width: 1024px) {
      .u2-hero__inner { grid-template-columns: 1fr; gap: 56px; }
      .u2-promise { grid-template-columns: 1fr; gap: 32px; } .u2-promise__lead { position: static; }
      .u2-testi { grid-template-columns: 1fr; }
      .u2-foryou { grid-template-columns: 1fr; }
      .u2-price { grid-template-columns: 1fr; }
      .u2-who { grid-template-columns: 1fr; gap: 40px; }
      .u2-consult { grid-template-columns: 1fr; padding: 32px; }
    }

                {['M','D','M','D','F','S','S'].map((d,i) => <div key={i} className="u2-consult__day u2-consult__day--dow">{d}</div>)}

                {[4,5,6,7,8,9,10].map(d => <div key={'r2-'+d} className={`u2-consult__day ${[6,7,8].includes(d)?'u2-consult__day--avail':''}`}>{d}</div>)}
                {[11,12,13,14,15,16,17].map(d => <div key={'r3-'+d} className={`u2-consult__day ${d===14?'u2-consult__day--sel':[13,15].includes(d)?'u2-consult__day--avail':''}`}>{d}</div>)}
                {[18,19,20,21,22,23,24].map(d => <div key={'r4-'+d} className={`u2-consult__day ${[20,21,22].includes(d)?'u2-consult__day--avail':''}`}>{d}</div>)}

              </div>
              <div className="u2-consult__slots">
                <span className="u2-consult__slot u2-consult__slot--taken">09:00</span>
                <span className="u2-consult__slot">10:30</span>
                <span className="u2-consult__slot u2-consult__slot--sel">11:30</span>
                <span className="u2-consult__slot">14:00</span>
                <span className="u2-consult__slot">15:30</span>
                <span className="u2-consult__slot u2-consult__slot--taken">16:30</span>

            </div>
          </div>
        </div>
      </section>
    );

    const FAQ = () => {
      const [open, setOpen] = useState(0);
      return (
        <section className="u2-sec u2-sec--white">
          <div className="u2-sec__inner">
            <div className="u2-sec__head u2-sec__head--center">
              <div className="u2-sec__eyebrow">FAQ</div>

            </div>
            <div className="u2-faq">
              {FAQS.map((f, i) => (
                <div key={i} className={`u2-faq__item${open === i ? ' open' : ''}`}>

    const FinalCTA = () => (
      <section className="u2-final" id="kontakt">

          <h2>Bereit, den Tool-Umzug hinter dir zu lassen?</h2>

          <div className="u2-final__btns">
            <a href="#beratung" className="btn btn--ink btn-lg">Gratis Gespräch buchen</a>
            <a href="index.html" className="btn btn--ghost btn-lg" style={{borderColor:'var(--fs-lime-ink)', color:'var(--fs-lime-ink)'}}>Zurück zur Startseite</a>
          </div>
          <div className="u2-final__note">Keine Kreditkarte. Keine Vertragsbindung. Ehrliche Beratung.</div>
        </div>
      </section>
    );

    const App = () => (
      <>
        <Nav />
        <main>
          <Hero />
          <FromStrip />
          <Promise />
          <Move />
          <Timeline />

          <ForYou />
          <Pricing />
          <Who />
          <Consult />
          <FAQ />
        </main>
        <FinalCTA />
        <Footer />

    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
