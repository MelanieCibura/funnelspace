<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mitgliederbereich, Onlinekurse & Community — Funnelspace</title>
<meta name="description" content="Onlinekurse, Mitgliederbereiche und Communities in einem Tool. Zugänge automatisch nach Kauf, Video-Hosting inklusive, DSGVO-konform aus Deutschland." />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="site.css" />
<style>
/* ── Hero ─────────────────────────────────────────── */
.mb-hero{background:var(--fs-ink);color:#fff;padding:96px 40px 88px;position:relative;overflow:hidden}
.mb-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,0.06) 1px,transparent 1.2px);background-size:8px 8px;pointer-events:none}
.mb-hero__inner{max-width:1280px;margin:0 auto;position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:72px;align-items:center}
.mb-hero__eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fs-lime);background:rgba(215,240,120,.1);border:1px solid rgba(215,240,120,.3);padding:6px 12px;border-radius:var(--radius-pill);margin-bottom:22px}
.mb-hero__eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fs-lime)}
.mb-hero h1{font-family:var(--font-display);font-size:clamp(42px,5vw,68px);font-weight:700;line-height:1.04;letter-spacing:-.03em;text-wrap:balance;color:#fff}
.mb-hero h1 em{font-style:normal;color:var(--fs-lime)}
.mb-hero__lead{margin-top:22px;font-size:19px;line-height:1.55;color:rgba(255,255,255,.7);max-width:540px}
.mb-hero__cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.mb-hero__proof{margin-top:24px;display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,.5)}
.mb-hero__proof span{display:flex;align-items:center;gap:6px}
.mb-hero__proof span::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--fs-lime)}
.mb-hero__visual{position:relative;background:var(--fs-paper);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:10px 10px;border-radius:var(--radius-xl);padding:24px;aspect-ratio:1/.95;display:grid;place-items:center;box-shadow:0 40px 80px -20px rgba(0,0,0,.4)}
.mb-hero__visual img{max-height:82%;max-width:82%;object-fit:contain}
.mb-hero__badge{position:absolute;background:#fff;color:var(--fs-ink);border-radius:var(--radius-lg);padding:12px 16px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px}
.mb-hero__badge--tl{top:24px;left:-24px}
.mb-hero__badge--br{bottom:20px;right:-20px}
.mb-hero__badge-dot{width:32px;height:32px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;font-weight:700;font-family:var(--font-display);font-size:13px}
.mb-hero__badge-label{font-size:11px;color:var(--fg-3);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.mb-hero__badge-val{font-size:15px;font-weight:700;font-family:var(--font-display);margin-top:2px}
.mb-replaces{background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.08);padding:22px 40px}
.mb-replaces__inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.mb-replaces__label{font-size:12px;color:rgba(255,255,255,.4);font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.mb-replaces__items{display:flex;gap:28px;flex-wrap:wrap}
.mb-replaces__item{font-family:var(--font-display);font-weight:700;font-size:16px;color:rgba(255,255,255,.4);letter-spacing:-.01em;text-decoration:line-through;text-decoration-color:rgba(215,240,120,.5);text-decoration-thickness:2px}
/* ── Sections ─────────────────────────────────────── */
.mb-sec{padding:104px 40px}
.mb-sec--alt{background:var(--fs-white)}
.mb-sec__inner{max-width:1280px;margin:0 auto}
.mb-sec__head{max-width:720px;margin:0 auto 64px;text-align:center}
.mb-eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
.mb-sec__head h2{font-family:var(--font-display);font-size:clamp(34px,3.6vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.mb-sec__head h2 em{font-style:normal;background:var(--fs-lime);color:var(--fs-lime-ink);padding:0 8px;border-radius:6px}
.mb-sec__head p{margin-top:16px;font-size:18px;color:var(--fg-2);line-height:1.55}
/* Drei Formate */
.mb-formats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.mb-format{background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:32px;display:flex;flex-direction:column;gap:14px;transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out)}
.mb-format:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.mb-format--ink{background:var(--fs-ink);border-color:var(--fs-ink)}
.mb-format--ink h3,.mb-format--ink li{color:#fff}
.mb-format--ink p{color:rgba(255,255,255,.65)}
.mb-format--ink .mb-format__num{background:var(--fs-lime);color:var(--fs-lime-ink)}
.mb-format--ink li svg{color:var(--fs-lime)}
.mb-format__num{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:16px}
.mb-format h3{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.mb-format p{font-size:15px;color:var(--fg-2);line-height:1.55}
.mb-format ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:9px}
.mb-format li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--fg-2);line-height:1.45}
.mb-format li svg{width:16px;height:16px;flex-shrink:0;margin-top:3px;color:var(--fs-lime-deep)}
/* Benefits */
.mb-benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border-1);border:1px solid var(--border-1);border-radius:var(--radius-lg);overflow:hidden}
.mb-benefit{background:var(--fs-white);padding:36px 32px;display:flex;flex-direction:column;gap:14px;transition:background var(--dur-med) var(--ease-out)}
.mb-benefit:hover{background:var(--fs-paper)}
.mb-benefit__icon{width:44px;height:44px;border-radius:var(--radius-sm);background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;flex-shrink:0}
.mb-benefit__icon svg{width:22px;height:22px}
.mb-benefit h3{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.mb-benefit p{font-size:15px;color:var(--fg-2);line-height:1.55}
/* Feature rows */
.mb-feat{display:grid;grid-template-columns:1fr 1.15fr;gap:80px;align-items:center;padding:88px 0;border-top:1px solid var(--border-1)}
.mb-feat:first-of-type{border-top:none;padding-top:0}
.mb-feat--flip .mb-feat__media{order:-1}
.mb-feat__eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
.mb-feat h3{font-family:var(--font-display);font-size:clamp(30px,3vw,42px);font-weight:700;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.mb-feat__body{margin-top:16px;font-size:17px;color:var(--fg-2);line-height:1.55}
.mb-feat ul{list-style:none;padding:0;margin-top:22px;display:flex;flex-direction:column;gap:12px}
.mb-feat li{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--fg-2);line-height:1.5}
.mb-feat li svg{width:18px;height:18px;flex-shrink:0;margin-top:3px;color:var(--fs-lime-deep)}
.mb-feat__media{background:var(--fs-paper);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:10px 10px;border-radius:var(--radius-xl);padding:28px;border:1px solid var(--border-1);aspect-ratio:5/4;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
/* ── Mockup shell ────────────────────────────────── */
.mk{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border-1);width:100%;height:100%;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-md);overflow:hidden}
.mk__head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--border-1)}
.mk__title{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:-.01em}
.mk__sub{font-size:9px;color:var(--fg-3);margin-top:2px}
.mk__dots{display:flex;gap:4px}
.mk__dots span{width:8px;height:8px;border-radius:50%;background:var(--fs-gray-300)}
.mk__pill{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--fs-gray-100);color:var(--fs-ink-soft);white-space:nowrap}
.mk__pill--lime{background:var(--fs-lime);color:var(--fs-lime-ink)}
.mk__pill--ink{background:var(--fs-ink);color:#fff}
/* Kurs-Curriculum */
.mk-course{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;flex:1;min-height:0}
.mk-mod{display:flex;flex-direction:column;gap:5px;min-height:0}
.mk-mod__label{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.mk-les{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border-1);border-radius:8px;background:#fff}
.mk-les--done{background:var(--fs-paper)}
.mk-les--lock{opacity:.55}
.mk-les__ic{width:18px;height:18px;border-radius:50%;background:var(--fs-gray-100);display:grid;place-items:center;flex-shrink:0}
.mk-les__ic svg{width:10px;height:10px;color:var(--fs-ink-soft)}
.mk-les--done .mk-les__ic{background:var(--fs-lime)}
.mk-les--done .mk-les__ic svg{color:var(--fs-lime-ink)}
.mk-les__t{font-size:10.5px;font-weight:700;color:var(--fs-ink);line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk-les__m{font-size:9px;color:var(--fg-3);white-space:nowrap}
.mk-video{background:var(--fs-ink);border-radius:10px;flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}
.mk-video::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.08) 1px,transparent 1.2px);background-size:7px 7px}
.mk-video__play{width:38px;height:38px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;position:relative;z-index:1}
.mk-video__play svg{width:16px;height:16px;margin-left:2px}
.mk-video__bar{position:absolute;left:10px;right:10px;bottom:10px;height:3px;border-radius:999px;background:rgba(255,255,255,.2);z-index:1}
.mk-video__bar i{display:block;height:100%;width:42%;border-radius:999px;background:var(--fs-lime)}
.mk-side{display:flex;flex-direction:column;gap:8px;min-height:0}
.mk-prog{border:1px solid var(--border-1);border-radius:10px;padding:9px}
.mk-prog__top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mk-prog__lbl{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.mk-prog__num{font-family:var(--font-display);font-weight:700;font-size:14px}
.mk-prog__track{height:5px;border-radius:999px;background:var(--fs-gray-200);overflow:hidden}
.mk-prog__track i{display:block;height:100%;background:var(--fs-lime)}
.mk-note{border:1px solid var(--border-1);border-radius:10px;padding:9px;font-size:10px;color:var(--fg-2);line-height:1.4}
.mk-note b{color:var(--fs-ink)}
/* Zugang / Automation */
.mk-flow{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;justify-content:center}
.mk-step{display:flex;gap:9px;align-items:center;padding:9px 10px;border:1px solid var(--border-1);border-radius:10px;background:#fff}
.mk-step--lime{background:var(--fs-lime);border-color:var(--fs-lime)}
.mk-step__ic{width:24px;height:24px;border-radius:7px;background:var(--fs-gray-100);display:grid;place-items:center;flex-shrink:0}
.mk-step__ic svg{width:12px;height:12px;color:var(--fs-ink-soft)}
.mk-step--lime .mk-step__ic{background:var(--fs-lime-ink)}
.mk-step--lime .mk-step__ic svg{color:var(--fs-lime)}
.mk-step__t{font-size:11px;font-weight:700;color:var(--fs-ink);line-height:1.2}
.mk-step__d{font-size:9.5px;color:var(--fg-3);margin-top:2px}
.mk-step--lime .mk-step__d{color:rgba(47,58,0,.7)}
.mk-arrow{display:grid;place-items:center;color:var(--fs-gray-300)}
.mk-arrow svg{width:14px;height:14px}
/* Community feed */
.mk-feed{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.mk-post{border:1px solid var(--border-1);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:6px}
.mk-post--pin{border-color:var(--fs-ink);border-width:2px}
.mk-post__who{display:flex;align-items:center;gap:7px}
.mk-av{width:20px;height:20px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;font-size:8px;font-weight:700;flex-shrink:0}
.mk-av--ink{background:var(--fs-ink);color:#fff}
.mk-av--gray{background:var(--fs-gray-300);color:var(--fs-ink)}
.mk-post__name{font-size:10.5px;font-weight:700}
.mk-post__time{font-size:9px;color:var(--fg-3)}
.mk-post__text{font-size:10.5px;line-height:1.4;color:var(--fs-ink)}
.mk-post__foot{display:flex;align-items:center;gap:10px;font-size:9px;color:var(--fg-3)}
.mk-post__foot span{display:flex;align-items:center;gap:4px}
.mk-post__foot svg{width:11px;height:11px}
.mk-stack{display:flex;align-items:center}
.mk-stack .mk-av{margin-left:-6px;border:2px solid #fff}
.mk-stack .mk-av:first-child{margin-left:0}
/* Integration cards */
.mb-int{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.mb-int__card{background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:28px 24px;display:flex;flex-direction:column;gap:12px;transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out)}
.mb-int__card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.mb-int__art{width:100%;aspect-ratio:16/10;background:var(--fs-paper);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:8px 8px;border-radius:var(--radius-md);display:grid;place-items:center;overflow:hidden}
.mb-int__art img{max-height:80%;max-width:80%;object-fit:contain}
.mb-int__card h4{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.mb-int__card p{font-size:13px;color:var(--fg-2);line-height:1.5}
.mb-int__link{margin-top:auto;font-size:13px;font-weight:700;color:var(--fs-ink);display:inline-flex;align-items:center;gap:4px;text-decoration:none;transition:gap var(--dur-fast) var(--ease-out)}
.mb-int__link:hover{gap:8px}
/* Testimonials */
.mb-testi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.mb-testi{background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:18px}
.mb-testi--dark{background:var(--fs-ink);border-color:var(--fs-ink)}
.mb-testi--lime{background:var(--fs-lime);border-color:var(--fs-lime)}
.mb-testi__stars{color:var(--fs-lime-deep);font-size:15px;letter-spacing:2px}
.mb-testi--dark .mb-testi__stars{color:var(--fs-lime)}
.mb-testi--lime .mb-testi__stars{color:var(--fs-lime-ink)}
.mb-testi blockquote{font-size:17px;line-height:1.5;flex:1;font-family:var(--font-display);font-weight:500;letter-spacing:-.01em;border:none;padding:0;margin:0;color:var(--fg-1)}
.mb-testi--dark blockquote{color:#fff}
.mb-testi--lime blockquote{color:var(--fs-lime-ink)}
.mb-testi__who{display:flex;align-items:center;gap:12px}
.mb-testi__avatar{width:40px;height:40px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.mb-testi--lime .mb-testi__avatar{background:var(--fs-ink);color:#fff}
.mb-testi--dark .mb-testi__avatar{background:#fff;color:var(--fs-ink)}
.mb-testi__name{font-size:14px;font-weight:700}
.mb-testi--dark .mb-testi__name{color:#fff}
.mb-testi__role{font-size:12px;color:var(--fg-3);margin-top:2px}
.mb-testi--dark .mb-testi__role{color:rgba(255,255,255,.5)}
.mb-testi--lime .mb-testi__role{color:rgba(47,58,0,.65)}
.mb-testi__stat{display:flex;align-items:baseline;gap:8px;padding-top:16px;border-top:1px solid var(--border-1)}
.mb-testi--dark .mb-testi__stat{border-top-color:rgba(255,255,255,.15)}
.mb-testi--lime .mb-testi__stat{border-top-color:rgba(47,58,0,.15)}
.mb-testi__stat-num{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.02em}
.mb-testi--dark .mb-testi__stat-num{color:var(--fs-lime)}
.mb-testi__stat-lbl{font-size:12px;color:var(--fg-3);line-height:1.3}
.mb-testi--dark .mb-testi__stat-lbl{color:rgba(255,255,255,.55)}
.mb-testi--lime .mb-testi__stat-lbl{color:rgba(47,58,0,.7)}
/* Launch-Timeline */
.mb-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-1);border:1px solid var(--border-1);border-radius:var(--radius-lg);overflow:hidden}
.mb-step{background:var(--fs-white);padding:32px 28px;display:flex;flex-direction:column;gap:10px}
.mb-step__n{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--fs-lime-ink);background:var(--fs-lime);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.mb-step h3{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.mb-step p{font-size:14px;color:var(--fg-2);line-height:1.5}
.mb-step__time{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);margin-top:auto;padding-top:8px}
/* FAQ */
.mb-faq{max-width:820px;margin:0 auto}
.mb-faq__item{border-bottom:1px solid var(--border-1)}
.mb-faq__item:first-child{border-top:1px solid var(--border-1)}
.mb-faq__btn{width:100%;background:none;border:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:24px 0;gap:20px;text-align:left;font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--fs-ink);letter-spacing:-.01em}
.mb-faq__icon{width:30px;height:30px;border-radius:50%;background:var(--fs-gray-100);flex-shrink:0;display:grid;place-items:center;font-size:18px;color:var(--fs-ink);transition:background var(--dur-fast),transform var(--dur-med) var(--ease-out)}
.mb-faq__item.open .mb-faq__icon{background:var(--fs-lime);transform:rotate(45deg)}
.mb-faq__body{font-size:15px;color:var(--fg-2);line-height:1.65;overflow:hidden;max-height:0;transition:max-height var(--dur-slow) var(--ease-out),padding var(--dur-slow) var(--ease-out)}
.mb-faq__item.open .mb-faq__body{max-height:420px;padding-bottom:24px}
/* Final CTA */
.mb-final{background:var(--fs-ink);padding:104px 40px;text-align:center;position:relative;overflow:hidden}
.mb-final::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.06) 1px,transparent 1.2px);background-size:8px 8px}
.mb-final__inner{position:relative;max-width:760px;margin:0 auto}
.mb-final h2{font-family:var(--font-display);font-size:clamp(36px,4vw,56px);font-weight:700;letter-spacing:-.03em;color:#fff;text-wrap:balance}
.mb-final h2 em{font-style:normal;color:var(--fs-lime)}
.mb-final p{margin:16px auto 0;font-size:18px;color:rgba(255,255,255,.6)}
.mb-final__btns{display:flex;gap:12px;justify-content:center;margin-top:36px;flex-wrap:wrap}
@media (max-width:1024px){
.mb-hero__inner{grid-template-columns:1fr;gap:48px}
.mb-hero__badge--tl{left:-12px}
.mb-hero__badge--br{right:-8px}
.mb-formats{grid-template-columns:1fr}
.mb-benefits{grid-template-columns:1fr 1fr}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "headlineVariant": "wissen"
}/*EDITMODE-END*/;

const TweaksPanel = ({ state, setState, visible, onClose }) => {
  if (!visible) return null;
  const opts = [
    { k:'wissen', l:'Wissen als Produkt', d:'„Dein Wissen wird zum Produkt."' },
    { k:'zugang', l:'Automatik', d:'„Verkauft um 22:04. Zugang um 22:04."' },
    { k:'community', l:'Community', d:'„Kurs plus Community — an einem Ort."' },
  ];
  return (
    <div style={{position:'fixed',bottom:20,right:20,zIndex:200,background:'#fff',border:'1px solid var(--border-1)',borderRadius:'var(--radius-lg)',boxShadow:'var(--shadow-lg)',padding:20,width:290,fontFamily:'var(--font-sans)'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:16}}>Tweaks</div>
        <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:'var(--fg-3)'}}>×</button>
      </div>
      <div style={{fontSize:11,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--fg-3)',marginBottom:10}}>Hero-Headline</div>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {opts.map(o => (
          <button key={o.k} onClick={() => {
            setState({...state, headlineVariant:o.k});
            window.parent.postMessage({type:'__edit_mode_set_keys', edits:{headlineVariant:o.k}}, '*');
          }} style={{textAlign:'left',padding:'10px 12px',border:state.headlineVariant===o.k?'2px solid var(--fs-ink)':'1px solid var(--border-1)',background:state.headlineVariant===o.k?'var(--fs-lime)':'#fff',borderRadius:10,cursor:'pointer',fontFamily:'var(--font-sans)'}}>
            <div style={{fontSize:13,fontWeight:700}}>{o.l}</div>
            <div style={{fontSize:11,color:'var(--fg-3)',marginTop:2}}>{o.d}</div>
          </button>
        ))}
      </div>
    </div>
  );
};

const App = () => {
  const [state, setState] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);
  React.useEffect(() => {
    const handler = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({type:'__edit_mode_available'}, '*');
    return () => window.removeEventListener('message', handler);
  }, []);
  return (<>
    <Nav />
    <main>
      <Hero variant={state.headlineVariant} />
      <Formats />
      <Benefits />
      <Features />
      <Launch />
      <Integrations />
      <Testimonials />
      <FAQ />
    </main>
    <FinalCTA />
    <Footer />
    <TweaksPanel state={state} setState={setState} visible={tweaksVisible} onClose={() => { setTweaksVisible(false); window.parent.postMessage({type:'__edit_mode_dismissed'},'*'); }} />
  </>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
