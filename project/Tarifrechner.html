<!doctype html>
<html lang="de">

  <link rel="stylesheet" href="site.css" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <style>

    .fk-hero__inner { max-width: 1280px; margin: 0 auto; position: relative; display: grid; grid-template-columns: 1.05fr 1fr; gap: 72px; align-items: center; }
    .fk-hero__eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fs-lime); background: rgba(215,240,120,0.1); border: 1px solid rgba(215,240,120,0.3); padding: 6px 12px; border-radius: var(--radius-pill); margin-bottom: 22px; }

    .fk-hero__lead { margin-top: 22px; font-size: 19px; line-height: 1.55; color: rgba(255,255,255,0.7); max-width: 520px; }
    .fk-hero__cta { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
    .fk-hero__proof { margin-top: 24px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: rgba(255,255,255,0.5); }
    .fk-hero__proof span { display: flex; align-items: center; gap: 6px; }
    .fk-hero__proof span::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--fs-lime); }
    .fk-hero__visual { position: relative; background: var(--fs-paper); background-image: radial-gradient(var(--fs-gray-300) 1px, transparent 1.2px); background-size: 10px 10px; border-radius: var(--radius-xl); padding: 24px; aspect-ratio: 1/0.95; display: grid; place-items: center; box-shadow: 0 40px 80px -20px rgba(0,0,0,0.4); }

    .fk-hero__badge-val { font-size: 15px; font-weight: 700; font-family: var(--font-display); margin-top: 2px; }

    .fk-types__item span { color: var(--fs-lime); }

    /* Sektionen */
    .fk-sec { padding: 104px 40px; }
    .fk-sec--alt { background: var(--fs-white); }
    .fk-sec--paper { background: var(--fs-paper); }
    .fk-sec__inner { max-width: 1280px; margin: 0 auto; }
    .fk-sec__head { max-width: 720px; margin: 0 auto 64px; text-align: center; }

    .fk-sec__head h2 { font-family: var(--font-display); font-size: clamp(34px, 3.6vw, 52px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; text-wrap: balance; }
    .fk-sec__head h2 em { font-style: normal; background: var(--fs-lime); color: var(--fs-lime-ink); padding: 0 8px; border-radius: 6px; }
    .fk-sec__head p { margin-top: 16px; font-size: 18px; color: var(--fg-2); line-height: 1.55; }

    .fk-perks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border-1); border: 1px solid var(--border-1); border-radius: var(--radius-lg); overflow: hidden; }
    .fk-perk { background: var(--fs-white); padding: 40px 32px; display: flex; flex-direction: column; gap: 14px; transition: background var(--dur-med) var(--ease-out); }
    .fk-perk:hover { background: var(--fs-paper); }
    .fk-perk__num { font-family: var(--font-display); font-weight: 800; font-size: 16px; width: 44px; height: 44px; border-radius: var(--radius-sm); background: var(--fs-lime); color: var(--fs-lime-ink); display: grid; place-items: center; }
    .fk-perk h3 { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .fk-perk p { font-size: 15px; color: var(--fg-2); line-height: 1.55; }

    /* ── Quiz ───────────────────────────────────────────────────── */
    .fq { max-width: 920px; margin: 0 auto; background: var(--fs-white); border: 1px solid var(--border-1); border-radius: var(--radius-xl); box-shadow: var(--shadow-md); padding: 40px; }
    .fq__progress { display: flex; align-items: center; gap: 16px; margin-bottom: 36px; }
    .fq__progress-count { font-size: 13px; color: var(--fg-3); white-space: nowrap; }
    .fq__progress-count strong { color: var(--fs-ink); font-weight: 700; }
    .fq__progress-bar { flex: 1; height: 8px; border-radius: 999px; background: var(--fs-gray-100); overflow: hidden; }
    .fq__progress-fill { height: 100%; background: var(--fs-lime); border-radius: 999px; transition: width var(--dur-slow) var(--ease-out); }
    .fq__q-head { margin-bottom: 28px; }
    .fq__q-eyebrow { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fs-lime-deep); margin-bottom: 12px; }
    .fq__q-head h3 { font-family: var(--font-display); font-size: clamp(24px, 2.6vw, 32px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.12; text-wrap: balance; }
    .fq__q-hint { margin-top: 10px; font-size: 15px; color: var(--fg-3); line-height: 1.5; }
    .fq__opts { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .fq__opts--2 { grid-template-columns: 1fr 1fr; }
    .fq__opt { display: flex; align-items: center; gap: 16px; text-align: left; cursor: pointer; background: var(--fs-white); border: 1.5px solid var(--border-1); border-radius: var(--radius-md); padding: 18px 20px; font-family: var(--font-sans); transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
    .fq__opt:hover { border-color: var(--fs-ink); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .fq__opt--active { border-color: var(--fs-ink); background: var(--fs-lime); }
    .fq__opt-icon { font-size: 26px; line-height: 1; flex-shrink: 0; }
    .fq__opt-body { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .fq__opt-label { font-size: 16px; font-weight: 700; color: var(--fs-ink); letter-spacing: -0.01em; }
    .fq__opt-sub { font-size: 13px; color: var(--fg-3); line-height: 1.4; }
    .fq__opt--active .fq__opt-sub { color: rgba(47,58,0,0.7); }
    .fq__opt-check { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; border: 1.5px solid var(--border-strong); color: transparent; transition: all var(--dur-fast) var(--ease-out); }
    .fq__opt-check svg { width: 14px; height: 14px; }
    .fq__opt--active .fq__opt-check { background: var(--fs-ink); border-color: var(--fs-ink); color: var(--fs-lime); }
    .fq__nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border-1); }
    .fq__nav-meta { font-size: 13px; color: var(--fg-3); text-align: center; flex: 1; }
    .fq-link { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; font-family: var(--font-sans); font-size: 14px; font-weight: 600; color: var(--fs-ink); padding: 8px 4px; transition: opacity var(--dur-fast); text-decoration: none; }
    .fq-link:hover { opacity: 0.6; }
    .fq-link:disabled { opacity: 0.3; cursor: default; }
    .fq-link svg { width: 15px; height: 15px; }

    /* ── Ergebnis (Tarif) ───────────────────────────────────────── */
    .tr-result { display: flex; flex-direction: column; gap: 32px; }
    .tr-block-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 16px; }

    .tr-hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 28px; background: var(--fs-ink); color: #fff; border-radius: var(--radius-lg); padding: 34px; position: relative; overflow: hidden; }
    .tr-hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(215,240,120,0.07) 1px, transparent 1.2px); background-size: 8px 8px; pointer-events: none; }
    .tr-hero__left { position: relative; }
    .tr-hero .fq__q-eyebrow { color: var(--fs-lime); }
    .tr-hero__match { display: inline-block; background: var(--fs-lime); color: var(--fs-lime-ink); font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: var(--radius-pill); margin-bottom: 16px; }
    .tr-hero__name { font-family: var(--font-display); font-size: clamp(28px, 3.2vw, 40px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; color: #fff; }
    .tr-hero__tag { margin-top: 8px; font-size: 15px; font-weight: 600; color: var(--fs-lime); }
    .tr-hero__for { margin-top: 12px; font-size: 15px; line-height: 1.55; color: rgba(255,255,255,0.7); max-width: 420px; }
    .tr-hero__price { position: relative; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: var(--radius-md); padding: 24px; display: flex; flex-direction: column; justify-content: center; }
    .tr-hero__price-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
    .tr-hero__price-num { font-family: var(--font-display); font-size: clamp(38px, 4.2vw, 52px); font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin-top: 8px; color: #fff; }
    .tr-hero__price-num small { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.55); margin-left: 6px; letter-spacing: 0; }
    .tr-hero__price-sub { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 8px; line-height: 1.4; }
    .tr-hero__cta { margin-top: 18px; justify-content: center; width: 100%; background: var(--fs-lime); color: var(--fs-lime-ink); border-color: var(--fs-lime); }
    .tr-hero__cta:hover { background: var(--fs-lime-deep); border-color: var(--fs-lime-deep); }

    .tr-breakdown, .tr-fit { background: var(--fs-paper); border: 1px solid var(--border-1); border-radius: var(--radius-lg); padding: 26px; }
    .tr-lines { display: flex; flex-direction: column; }
    .tr-line { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border-1); }
    .tr-line__body { display: flex; flex-direction: column; gap: 2px; }
    .tr-line__body strong { font-size: 15px; font-weight: 700; color: var(--fs-ink); }
    .tr-line__body span { font-size: 13px; color: var(--fg-3); line-height: 1.4; }
    .tr-line__amt { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--fs-ink); white-space: nowrap; }
    .tr-line--total { border-bottom: none; padding-bottom: 0; padding-top: 18px; margin-top: 4px; border-top: 2px solid var(--border-strong); }
    .tr-line--total .tr-line__body strong { font-size: 17px; }
    .tr-line--total .tr-line__amt { font-size: 24px; }
    .tr-breakdown__note { margin-top: 16px; font-size: 13px; color: var(--fg-3); line-height: 1.5; }

    .tr-fit ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tr-fit li { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--fg-1); line-height: 1.45; }
    .tr-fit svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; color: var(--fs-lime-deep); }

    .tr-compare__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .tr-card { position: relative; background: var(--fs-white); border: 1.5px solid var(--border-1); border-radius: var(--radius-lg); padding: 26px 22px; display: flex; flex-direction: column; }
    .tr-card--rec { border: 2px solid var(--fs-ink); box-shadow: var(--shadow-md); }
    .tr-card__flag { position: absolute; top: -12px; left: 22px; background: var(--fs-lime); color: var(--fs-lime-ink); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 12px; border-radius: var(--radius-pill); }
    .tr-card__name { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
    .tr-card__tag { font-size: 13px; color: var(--fg-3); margin-top: 4px; }
    .tr-card__price { font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 16px 0 18px; }
    .tr-card__price small { font-size: 13px; font-weight: 600; color: var(--fg-3); margin-left: 4px; letter-spacing: 0; }
    .tr-card__list { list-style: none; padding: 0; margin: 0 0 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .tr-card__list li { display: flex; align-items: flex-start; gap: 9px; font-size: 13.5px; color: var(--fg-1); line-height: 1.4; }
    .tr-card__list svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 2px; color: var(--fs-lime-deep); }
    .tr-card__cta { justify-content: center; width: 100%; }

    .tr-actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 4px; flex-wrap: wrap; }
    .tr-actions__link { color: var(--fs-lime-deep); }

    .fq-anim { animation: fqIn 0.32s var(--ease-out); }
    @keyframes fqIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fq-anim { animation: none; } }

    /* FAQ */
    .fk-faq { max-width: 820px; margin: 0 auto; }
    .fk-faq__item { border-bottom: 1px solid var(--border-1); }
    .fk-faq__item:first-child { border-top: 1px solid var(--border-1); }
    .fk-faq__btn { width: 100%; background: none; border: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 24px 0; gap: 20px; text-align: left; font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--fs-ink); letter-spacing: -0.01em; }
    .fk-faq__icon { width: 30px; height: 30px; border-radius: 50%; background: var(--fs-gray-100); flex-shrink: 0; display: grid; place-items: center; font-size: 18px; color: var(--fs-ink); transition: background var(--dur-fast), transform var(--dur-med) var(--ease-out); }
    .fk-faq__item.open .fk-faq__icon { background: var(--fs-lime); transform: rotate(45deg); }
    .fk-faq__body { font-size: 15px; color: var(--fg-2); line-height: 1.65; overflow: hidden; max-height: 0; transition: max-height var(--dur-slow) var(--ease-out), padding var(--dur-slow) var(--ease-out); }
    .fk-faq__item.open .fk-faq__body { max-height: 400px; padding-bottom: 24px; }

    /* Final CTA */
    .fk-final { background: var(--fs-ink); padding: 104px 40px; text-align: center; position: relative; overflow: hidden; }
    .fk-final::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(215,240,120,0.06) 1px, transparent 1.2px); background-size: 8px 8px; }
    .fk-final__inner { position: relative; max-width: 760px; margin: 0 auto; }
    .fk-final h2 { font-family: var(--font-display); font-size: clamp(36px, 4vw, 56px); font-weight: 700; letter-spacing: -0.03em; color: #fff; text-wrap: balance; }
    .fk-final h2 em { font-style: normal; color: var(--fs-lime); }
    .fk-final p { margin: 16px auto 0; font-size: 18px; color: rgba(255,255,255,0.6); }
    .fk-final__btns { display: flex; gap: 12px; justify-content: center; margin-top: 36px; flex-wrap: wrap; }

    /* Responsive */
    @media (max-width: 1024px) {
      .fk-hero__inner { grid-template-columns: 1fr; gap: 48px; }
      .fk-hero__badge--tl { left: -12px; }
      .fk-hero__badge--br { right: -8px; }
      .fk-perks { grid-template-columns: 1fr; }
      .tr-hero { grid-template-columns: 1fr; }
      .tr-compare__grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .fk-hero { padding: 64px 22px 64px; }
      .fk-sec { padding: 72px 22px; }
      .fk-types { padding: 18px 22px; }
      .fk-final { padding: 72px 22px; }
      .fq { padding: 24px 18px; }
      .fq__opts--2 { grid-template-columns: 1fr; }
      .tr-fit ul { grid-template-columns: 1fr; }
      .nav__links { display: none; }
    }
  </style>
</head>

      { id: "sales", eyebrow: "Frage 4 · Verkauf", title: "Wie gewinnst du hauptsächlich Kunden?", hint: "Daraus leiten wir die passenden Add-ons ab.", cols: 2, options: [
        { id: "funnel",    icon: "🎯", label: "Funnel & Landingpages",  sub: "Opt-ins, Sales-Pages, Sequenzen" },

      { id: "billing", eyebrow: "Frage 5 · Abrechnung", title: "Wie zahlst du am liebsten?", hint: "Letzte Frage — dann steht deine Empfehlung.", cols: 1, options: [
        { id: "monthly", label: "Monatlich, flexibel",      sub: "Jederzeit kündbar, keine Bindung" },
        { id: "yearly",  label: "Jährlich — 2 Monate sparen", sub: "990 € / Jahr statt 1.188 € + Wechselservice gratis" },
        { id: "unsure",  label: "Erstmal 14 Tage testen",   sub: "Ich will es kostenlos ausprobieren" } ] },
    ];

    const TARIF_PACKAGES = {
      solo: { id: "solo", name: "Solo", tagline: "Alles drin, ein Login", forWho: "Solopreneure, die starten und alle Basics an einem Ort wollen.", guthabenDefault: 0, addons: [], channels: "E-Mail",
        includes: ["Funnelspace Unlimited — alle Module unbegrenzt", "5 € E-Mail-Guthaben / Monat gratis (~3.500 E-Mails)", "Gratis Onboarding (normal 499 €)"] },
      wachstum: { id: "wachstum", name: "Wachstum", tagline: "Mehr Kanäle, mehr Reichweite", forWho: "Wachsende Coaches & Creator, die über mehrere Kanäle verkaufen.", guthabenDefault: 10, addons: [{ name: "Evergreen Funnel", price: 129 }], channels: "E-Mail + WhatsApp & SMS",
        includes: ["Alles aus Solo", "WhatsApp- & SMS-Versand freigeschaltet", "Nachrichten-Guthaben aufgeladen", "Add-on: Evergreen Funnel"] },
      skalierung: { id: "skalierung", name: "Skalierung", tagline: "Voll automatisiert verkaufen", forWho: "Etablierte Businesses & Agenturen, die auf Autopilot skalieren.", guthabenDefault: 25, addons: [{ name: "Ultimate Suite", price: 199 }], channels: "E-Mail + WhatsApp + KI-Telefonie",
        includes: ["Alles aus Wachstum", "Ultimate Suite: KI-Telefonie, Evergreen Funnel & Social Selling", "Großes Nachrichten-Guthaben inklusive", "Priorisierter Support"] },
    };
    const PACKAGE_ORDER = ["solo", "wachstum", "skalierung"];
    const BASE_MONTHLY = 99, BASE_YEARLY_PERMONTH = 82.5, EMAIL_UNIT = 0.0014;

    function eur(n) {
      if (Number.isInteger(n)) return n.toLocaleString("de-DE") + " €";
      return n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function guthabenReach(g) {
      if (!g) return "";
      const mails = Math.round((g / EMAIL_UNIT) / 100) * 100;
      return "~" + mails.toLocaleString("de-DE") + " E-Mails oder WhatsApp-Nachrichten extra";
    }
    function packageMonthly(pkgId, billing) {
      const pkg = TARIF_PACKAGES[pkgId];
      const base = billing === "yearly" ? BASE_YEARLY_PERMONTH : BASE_MONTHLY;
      return base + pkg.addons.reduce((s, a) => s + a.price, 0) + pkg.guthabenDefault;
    }
    function computeTarif(answers) {
      const s = { solo: 0, wachstum: 0, skalierung: 0 };
      const add = (k, v) => { s[k] += v; };
      switch (answers.stage) { case "start": add("solo",3); add("wachstum",1); break; case "growing": add("wachstum",3); break; case "scaling": add("skalierung",3); add("wachstum",1); break; case "agency": add("skalierung",3); break; }
      switch (answers.contacts) { case "small": add("solo",2); break; case "mid": add("wachstum",2); break; case "large": add("skalierung",2); add("wachstum",1); break; case "xlarge": add("skalierung",3); break; }
      switch (answers.channels) { case "email": add("solo",3); break; case "wa": add("wachstum",3); break; case "wa_tel": add("skalierung",2); add("wachstum",1); break; case "all": add("skalierung",3); break; }
      switch (answers.sales) { case "funnel": add("solo",1); add("wachstum",1); break; case "evergreen": add("wachstum",3); break; case "social": add("wachstum",2); add("skalierung",1); break; case "calls": add("skalierung",3); break; }
      let best = "wachstum", bestScore = -1, total = 0;
      for (const k of PACKAGE_ORDER) { total += s[k]; if (s[k] > bestScore) { bestScore = s[k]; best = k; } }
      const billing = answers.billing === "yearly" ? "yearly" : "monthly";
      const testing = answers.billing === "unsure";
      const guthabenByVol = { small: 0, mid: 10, large: 25, xlarge: 50 }[answers.contacts];
      const guthaben = guthabenByVol == null ? TARIF_PACKAGES[best].guthabenDefault : guthabenByVol;
      const pkg = TARIF_PACKAGES[best];
      const baseMonthly = billing === "yearly" ? BASE_YEARLY_PERMONTH : BASE_MONTHLY;
      const lineItems = [{ label: "Funnelspace Unlimited", note: billing === "yearly" ? "jährlich · 990 € / Jahr = 82,50 € / Monat" : "monatlich · jederzeit kündbar", amount: baseMonthly }];
      pkg.addons.forEach(a => lineItems.push({ label: "Add-on · " + a.name, note: "monatlich zubuchbar", amount: a.price }));
      if (guthaben > 0) lineItems.push({ label: "Nachrichten-Guthaben", note: guthabenReach(guthaben), amount: guthaben });
      const monthlyTotal = lineItems.reduce((sum, li) => sum + li.amount, 0);
      const fit = [];
      if (best === "solo") fit.push("Ein fester Preis, alle Module unbegrenzt — kein Add-on-Ballast.");
      if (best === "wachstum") fit.push("WhatsApp & SMS freigeschaltet — du erreichst deine Leute direkt.");
      if (best === "skalierung") fit.push("Ultimate Suite: KI-Telefonie, Evergreen Funnel & Social Selling in einem.");
      if (answers.contacts === "small") fit.push("Dein Versand liegt im monatlichen Gratis-Guthaben — kein Aufpreis.");
      if (answers.contacts === "large" || answers.contacts === "xlarge") fit.push("Guthaben passend zu deiner großen Liste vorkonfiguriert.");
      if (answers.sales === "evergreen") fit.push("Evergreen Funnel verkauft für dich, während du schläfst.");
      if (answers.sales === "social") fit.push("Social Selling bündelt Instagram- & Facebook-DMs an einem Ort.");
      if (answers.sales === "calls" || answers.channels === "all") fit.push("Outbound KI-Telefonie qualifiziert deine Leads automatisch vor.");
      if (billing === "yearly") fit.push("Jährlich zahlen: 2 Monate geschenkt + Wechselservice kostenlos.");
      if (testing) fit.push("Starte mit 14 Tagen kostenlos — ohne Kreditkarte, ohne Risiko.");
      while (fit.length < 3) fit.push("Alle Funktionen in einer Rechnung — statt 5 Tools und 5 Verträgen.");
      const match = Math.max(64, Math.min(96, 50 + Math.round((bestScore / Math.max(total, 1)) * 100) * 2));
      return { best, billing, testing, guthaben, monthlyTotal, lineItems, fit, match, pkg, scores: s };
    }

    /* ── Quiz-Komponenten ── */
    const TqCheck = () => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="5 12 10 17 19 7" /></svg>);

    const TqArrowL = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" /></svg>);

                </button>

        </div>

    }

    function TqResult({ result, onRestart }) {

                    <a href="Preise.html" className={"btn btn-lg tr-card__cta " + (rec ? "btn--primary" : "btn--ghost")}>{rec ? "Diesen Tarif wählen" : "Wählen"}</a>
                  </article>
                );
              })}
            </div>
          </div>
          <div className="tr-actions">
            <button type="button" className="fq-link" onClick={onRestart}><TqArrowL /> Rechner neu starten</button>
            <a href="Preise.html" className="fq-link tr-actions__link">Alle Details auf der Preisseite <TqArrowR /></a>
          </div>
        </div>
      );
    }

    function TarifQuiz() {
      const questions = TARIF_QUESTIONS;
      const [step, setStep] = useState(0);
      const [answers, setAnswers] = useState({});
      const total = questions.length;
      const allAnswered = questions.every(q => answers[q.id]);
      // Blank-proof: nur Ergebnis zeigen, wenn wirklich alle Fragen beantwortet sind.
      const isResult = step >= total && allAnswered;
      const isQuestion = !isResult;
      const qIndex = Math.min(step, total - 1);
      const current = isQuestion ? questions[qIndex] : null;
      const currentAnswer = current ? answers[current.id] : null;
      const result = useMemo(() => allAnswered ? computeTarif(answers) : null, [answers, allAnswered]);
      const answeredCount = Object.keys(answers).length;
      let progress = (answeredCount / total) * 100;
      if (isResult) progress = 100;
      function pickAnswer(optId) { const q = current; setAnswers(prev => ({ ...prev, [q.id]: optId })); setTimeout(() => setStep(s => s + 1), 220); }
      function goBack() { if (step > 0) setStep(step - 1); }
      function goNext() { if (isQuestion && currentAnswer) setStep(step + 1); }
      function restart() { setAnswers({}); setStep(0); }
      return (
        <div className="fq">
          {!isResult && (
            <div className="fq__progress">
              <div className="fq__progress-count"><span>Frage <strong>{qIndex + 1}</strong> von {total}</span></div>
              <div className="fq__progress-bar"><div className="fq__progress-fill" style={{ width: progress + "%" }} /></div>
              <div className="fq__progress-count">{Math.round(progress)}%</div>
            </div>
          )}
          {isQuestion && <TqQuestion q={current} value={currentAnswer} onChange={pickAnswer} />}
          {isResult && result && <TqResult result={result} onRestart={restart} />}
          {!isResult && (
            <div className="fq__nav">
              <button type="button" className="fq-link" onClick={goBack} disabled={step === 0}><TqArrowL /> Zurück</button>
              <div className="fq__nav-meta">Wähle eine Antwort — wir gehen automatisch weiter.</div>
              <button type="button" className="btn btn--ink" onClick={goNext} disabled={!currentAnswer}>Weiter <TqArrowR /></button>
            </div>
          )}
        </div>
      );
    }

    );

    function mountApp() {
      if (!window.Nav || !window.Footer) { return setTimeout(mountApp, 30); }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
    mountApp();
  </script>
</body>
</html>
