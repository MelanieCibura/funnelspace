<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Templates — Funnelspace</title>
  <meta name="description" content="Alle Vorlagen, die du brauchst – von Design bis Conversion. Design-Kollektionen und komplette Funnel-Templates inkl. Copy, Automationen & Setup-Anleitungen." />
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
  <style>
    /* ── Page-specific overrides ─────────────────────────────── */

    /* ── Hero ────────────────────────────────────────────────── */
    .tmpl-hero {
      padding: 96px 40px 80px;
      text-align: center;
      position: relative; overflow: hidden;
    }
    .tmpl-hero::before {
      content: "";
      position: absolute; inset: 0;
      background-image: var(--fs-halftone-fine);
      opacity: 0.45; pointer-events: none;
    }
    .tmpl-hero__badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--fs-ink); color: #fff;
      font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
      padding: 6px 16px; border-radius: var(--radius-pill);
      margin-bottom: 24px;
    }
    .tmpl-hero__badge-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--fs-lime); animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.3); }
    }
    .tmpl-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(44px, 5.5vw, 76px);
      font-weight: 700; line-height: 1.04;
      letter-spacing: -0.03em; text-wrap: balance;
      max-width: 860px; margin: 0 auto;
    }
    .tmpl-hero h1 strong {
      background: var(--fs-lime); color: var(--fs-lime-ink);
      padding: 0 8px; border-radius: 8px; font-weight: 700;
    }
    .tmpl-hero__lead {
      margin: 20px auto 0; max-width: 600px;
      font-size: 19px; line-height: 1.5; color: var(--fg-2);
    }
    .tmpl-hero__cta {
      display: flex; gap: 12px; justify-content: center;
      margin-top: 36px; flex-wrap: wrap;
    }
    .tmpl-hero__proof {
      margin-top: 20px; font-size: 13px; color: var(--fg-3);
    }

    /* ── Marquee ─────────────────────────────────────────────── */
    .marquee-wrap {
      background: var(--fs-white);
      border-top: 1px solid var(--border-1);
      border-bottom: 1px solid var(--border-1);
      padding: 20px 0; overflow: hidden;
    }
    .marquee-label {
      text-align: center; font-size: 11px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--fg-3); margin-bottom: 18px;
    }
    .marquee-track {
      display: flex; gap: 0; width: max-content;
      animation: marquee 32s linear infinite;
    }
    .marquee-track:hover { animation-play-state: paused; }
    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .marquee-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 32px;
      border-right: 1px solid var(--border-1);
      font-family: var(--font-display); font-size: 17px;
      font-weight: 700; color: var(--fs-gray-400);
      letter-spacing: -0.02em; white-space: nowrap;
    }
    .marquee-item__dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--fs-lime); flex-shrink: 0;
    }

    /* ── Section shared helpers ──────────────────────────────── */
    .tmpl-section { padding: 96px 40px; }
    .tmpl-section--alt { background: var(--fs-white); }
    .tmpl-section__inner { max-width: 1280px; margin: 0 auto; }
    .tmpl-section__head { text-align: center; margin-bottom: 64px; }
    .tmpl-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--fg-3); margin-bottom: 14px;
    }
    .tmpl-section__head h2 {
      font-family: var(--font-display);
      font-size: clamp(34px, 3.5vw, 52px);
      font-weight: 700; letter-spacing: -0.03em; text-wrap: balance;
    }
    .tmpl-section__head p { margin-top: 14px; font-size: 18px; color: var(--fg-2); }

    /* ── Template type cards ─────────────────────────────────── */
    .tmpl-types {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
    }
    .tmpl-type {
      background: var(--fs-white);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-xl); overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform var(--dur-med) var(--ease-out), box-shadow var(--dur-med) var(--ease-out);
    }
    .tmpl-type:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .tmpl-type__img {
      aspect-ratio: 16/10;
      background: var(--fs-paper); background-image: var(--fs-halftone);
      display: grid; place-items: center; position: relative;
    }
    .tmpl-type__img img { max-height: 130px; max-width: 72%; }
    .tmpl-type__tag {
      position: absolute; top: 14px; left: 14px;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 3px 10px;
      border-radius: var(--radius-pill);
    }
    .tmpl-type__body { padding: 24px 28px 30px; }
    .tmpl-type h3 {
      font-family: var(--font-display); font-size: 24px;
      font-weight: 700; letter-spacing: -0.02em; margin-bottom: 16px;
    }
    .tmpl-type ul {
      list-style: none; padding: 0; margin: 0 0 24px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .tmpl-type li {
      display: flex; gap: 10px; align-items: flex-start;
      font-size: 14px; color: var(--fg-2); line-height: 1.4;
    }
    .tmpl-type li::before {
      content: ""; width: 16px; height: 16px; border-radius: 50%;
      background: var(--fs-lime); flex-shrink: 0; margin-top: 2px;
    }
    .tmpl-type__count {
      font-size: 12px; font-weight: 600; color: var(--fg-3);
      border-top: 1px solid var(--border-1); padding-top: 16px;
      margin-top: 4px;
    }

    /* ── Included band ───────────────────────────────────────── */
    .included {
      background: var(--fs-ink); color: #fff;
      padding: 80px 40px;
    }
    .included__inner {
      max-width: 1280px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center;
    }
    .included__eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 14px;
    }
    .included h2 {
      font-family: var(--font-display); font-size: clamp(32px, 3vw, 46px);
      font-weight: 700; letter-spacing: -0.03em; color: #fff; text-wrap: balance;
    }
    .included p { margin-top: 14px; font-size: 17px; color: rgba(255,255,255,0.65); line-height: 1.55; }
    .included__grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    .included__item {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-lg); padding: 20px 22px;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .included__icon {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center;
      font-size: 18px; flex-shrink: 0;
    }
    .included__item-title { font-size: 14px; font-weight: 700; color: #fff; }
    .included__item-desc { font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 3px; line-height: 1.4; }

    /* ── Steps ───────────────────────────────────────────────── */
    .steps {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
      position: relative;
    }
    .steps::before {
      content: "";
      position: absolute; top: 28px; left: calc(100% / 6);
      width: calc(100% * 2/3); height: 1px;
      background: var(--border-2);
      z-index: 0;
    }
    .step { padding: 0 32px 0 0; position: relative; }
    .step:last-child { padding-right: 0; }
    .step__num {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center;
      font-family: var(--font-display); font-size: 22px; font-weight: 700;
      margin-bottom: 24px; position: relative; z-index: 1;
      border: 3px solid var(--fs-paper);
    }
    .step__label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--fg-3); margin-bottom: 8px;
    }
    .step h3 {
      font-family: var(--font-display); font-size: 24px;
      font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px;
    }
    .step p { font-size: 15px; color: var(--fg-2); line-height: 1.6; }

    /* ── Testimonials ────────────────────────────────────────── */
    .tmpl-testimonials {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
    }
    .tmpl-testi {
      background: var(--fs-white); border: 1px solid var(--border-1);
      border-radius: var(--radius-lg); padding: 28px;
      display: flex; flex-direction: column; gap: 16px;
      box-shadow: var(--shadow-xs);
    }
    .tmpl-testi__stars { color: var(--fs-lime-deep); font-size: 16px; letter-spacing: 2px; }
    .tmpl-testi blockquote {
      font-size: 15px; line-height: 1.6; color: var(--fg-1);
      border: none; padding: 0; margin: 0; flex: 1;
    }
    .tmpl-testi__who { display: flex; align-items: center; gap: 12px; }
    .tmpl-testi__avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0;
    }
    .tmpl-testi__name { font-size: 14px; font-weight: 700; color: var(--fs-ink); }
    .tmpl-testi__role { font-size: 12px; color: var(--fg-3); margin-top: 2px; }

    /* ── Brand CTA ───────────────────────────────────────────── */
    .brand-cta {
      background: var(--fs-paper);
      border: 2px solid var(--fs-ink);
      border-radius: var(--radius-xl); padding: 56px 64px;
      display: grid; grid-template-columns: 1fr auto; gap: 48px; align-items: center;
    }
    .brand-cta h2 {
      font-family: var(--font-display); font-size: clamp(26px, 2.5vw, 36px);
      font-weight: 700; letter-spacing: -0.02em; text-wrap: balance;
    }
    .brand-cta h2 em { font-family: 'Bitter', Georgia, serif; font-style: italic; font-weight: 700; color: var(--fs-lime-deep); }
    .brand-cta p { margin-top: 12px; font-size: 16px; color: var(--fg-2); line-height: 1.55; max-width: 520px; }
    .brand-cta__btns { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; flex-shrink: 0; }

    /* ── FAQ ─────────────────────────────────────────────────── */
    .faq-list { max-width: 800px; margin: 0 auto; }
    .faq-item {
      border-bottom: 1px solid var(--border-1);
    }
    .faq-item:first-child { border-top: 1px solid var(--border-1); }
    .faq-btn {
      width: 100%; background: none; border: none; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      padding: 22px 0; gap: 20px; text-align: left;
      font-family: var(--font-display); font-size: 18px; font-weight: 600;
      color: var(--fs-ink); letter-spacing: -0.01em;
      transition: color var(--dur-fast);
    }
    .faq-btn:hover { color: var(--fs-ink-soft); }
    .faq-icon {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--fs-gray-100); flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 18px; font-weight: 400; color: var(--fs-ink);
      transition: background var(--dur-fast), transform var(--dur-med) var(--ease-out);
    }
    .faq-item.open .faq-icon {
      background: var(--fs-lime); transform: rotate(45deg);
    }
    .faq-body {
      font-size: 15px; color: var(--fg-2); line-height: 1.65;
      overflow: hidden; max-height: 0;
      transition: max-height var(--dur-slow) var(--ease-out), padding var(--dur-slow) var(--ease-out);
      padding-bottom: 0;
    }
    .faq-item.open .faq-body {
      max-height: 600px; padding-bottom: 24px;
    }

    /* ── Final CTA ───────────────────────────────────────────── */
    .final-cta {
      background: var(--fs-lime); padding: 96px 40px; text-align: center;
    }
    .final-cta h2 {
      font-family: var(--font-display); font-size: clamp(36px, 4vw, 58px);
      font-weight: 700; letter-spacing: -0.04em; color: var(--fs-lime-ink);
      text-wrap: balance; max-width: 800px; margin: 0 auto;
    }
    .final-cta p { margin: 14px auto 0; font-size: 18px; color: var(--fs-lime-ink); opacity: 0.65; }
    .final-cta__btns { display: flex; gap: 14px; justify-content: center; margin-top: 36px; flex-wrap: wrap; }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 1024px) {
      .tmpl-types { grid-template-columns: 1fr 1fr; }
      .included__inner { grid-template-columns: 1fr; }
      .brand-cta { grid-template-columns: 1fr; }
      .brand-cta__btns { align-items: flex-start; }
      .tmpl-testimonials { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .tmpl-hero { padding: 64px 24px 56px; }
      .tmpl-section { padding: 64px 24px; }
      .tmpl-types { grid-template-columns: 1fr; }
      .steps { grid-template-columns: 1fr; gap: 40px; }
      .steps::before { display: none; }
      .step { padding-right: 0; }
      .included { padding: 64px 24px; }
      .included__grid { grid-template-columns: 1fr; }
      .brand-cta { padding: 36px 28px; }
      .final-cta { padding: 64px 24px; }
      .nav__links { display: none; }
    }
  </style>
</head>

  <div id="root"></div>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Nav.jsx"></script>

    /* ── Components ───────────────────────────────────────────── */

    const TmplHero = () => (
      <section className="tmpl-hero">

    const Marquee = () => {

    const TemplateTypes = () => (
      <section className="tmpl-section" id="templates">

            <p>Wähle den Funnel-Typ, der zu deinem Ziel passt — alles ist sofort einsatzbereit.</p>
          </div>
          <div className="tmpl-types">
            {TEMPLATE_TYPES.map(t => (
              <article key={t.name} className="tmpl-type">
                <div className="tmpl-type__img">
                  <img src={`assets/illustrations/${t.img}`} alt={t.name} />
                  {t.tag && <span className="tmpl-type__tag">{t.tag}</span>}
                </div>
                <div className="tmpl-type__body">
                  <h3>{t.name}</h3>
                  <p style={{fontSize:14, color:'var(--fg-2)', lineHeight:1.55, marginBottom:16}}>{t.desc}</p>
                  <ul>
                    {t.pages.map(p => <li key={p}>{p}</li>)}
                  </ul>
                  <div className="tmpl-type__count">{t.pages.length} Seiten & Assets inklusive</div>
                  <a href="#signup" className="btn btn--primary" style={{marginTop:20, width:'100%', justifyContent:'center'}}>
                    Template wählen
                  </a>
                </div>
              </article>
            ))}
          </div>
        </div>
      </section>
    );

    const IncludedBand = () => (
      <div className="included">
        <div className="included__inner">
          <div>
            <div className="included__eyebrow">Was inklusive ist</div>
            <h2>Nicht nur ein Design. Alles, was du für den Launch brauchst.</h2>
            <p>Jedes Template kommt mit einer vollständigen Ausstattung — damit du nicht erst alles zusammensuchen musst.</p>
            <a href="#templates" className="btn btn--primary btn-lg" style={{marginTop:32}}>
              Alle Templates ansehen
            </a>
          </div>
          <div className="included__grid">
            {INCLUDED_ITEMS.map(item => (
              <div key={item.title} className="included__item">
                <div className="included__icon">{item.icon}</div>
                <div>
                  <div className="included__item-title">{item.title}</div>
                  <div className="included__item-desc">{item.desc}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );

    const BrandCTA = () => (
      <section className="tmpl-section tmpl-section--alt">
        <div className="tmpl-section__inner">
          <div className="brand-cta">
            <div>
              <h2>Ein Template, das <em>wirklich</em> nach dir aussieht — nicht nach Template.</h2>
              <p>Übergib uns dein Design und wir passen dein neues Template an dein Branding an. Oder wir bauen eines komplett nach deiner Vorstellung. Die Wahl liegt bei dir.</p>
            </div>
            <div className="brand-cta__btns">
              <a href="#services" className="btn btn--ink btn-lg">Unsere Services entdecken</a>
              <a href="#demo" className="btn btn--ghost">Demo ansehen</a>
            </div>
          </div>
        </div>
      </section>
    );

    const SetupSteps = () => (
      <section className="tmpl-section">
        <div className="tmpl-section__inner">
          <div className="tmpl-section__head">
            <div className="tmpl-eyebrow">Setups</div>
            <h2>Wie unsere Templates funktionieren</h2>
            <p>In drei Schritten von der Vorlage zum fertigen Launch.</p>
          </div>
          <div className="steps">
            {STEPS.map(s => (
              <div key={s.num} className="step">
                <div className="step__num">{s.num}</div>
                <div className="step__label">{s.label}</div>
                <h3>{s.title}</h3>
                <p>{s.body}</p>
              </div>
            ))}
          </div>
          <div style={{textAlign:'center', marginTop:56}}>
            <a href="#templates" className="btn btn--primary btn-lg">Templates entdecken</a>
          </div>
        </div>
      </section>
    );

    const Testimonials = () => (
      <section className="tmpl-section tmpl-section--alt">
        <div className="tmpl-section__inner">
          <div className="tmpl-section__head">
            <div className="tmpl-eyebrow">Testimonials</div>
            <h2>Was andere Funnelspace Nutzer sagen</h2>
          </div>
          <div className="tmpl-testimonials">
            {TESTIMONIALS.map(t => (
              <article key={t.name} className="tmpl-testi">
                <div className="tmpl-testi__stars">★★★★★</div>
                <blockquote>{t.quote}</blockquote>
                <div className="tmpl-testi__who">
                  <div className="tmpl-testi__avatar">{t.initials}</div>
                  <div>
                    <div className="tmpl-testi__name">{t.name}</div>
                    <div className="tmpl-testi__role">{t.role}</div>
                  </div>
                </div>
              </article>
            ))}
          </div>
        </div>
      </section>
    );

    const FAQ = () => {
      const [open, setOpen] = React.useState(null);
      return (
        <section className="tmpl-section">
          <div className="tmpl-section__inner">
            <div className="tmpl-section__head">
              <div className="tmpl-eyebrow">FAQ</div>
              <h2>Häufig gestellte Fragen</h2>
            </div>
            <div className="faq-list">
              {FAQS.map((f, i) => (
                <div key={i} className={`faq-item${open === i ? ' open' : ''}`}>
                  <button className="faq-btn" onClick={() => setOpen(open === i ? null : i)}>
                    {f.q}
                    <span className="faq-icon">+</span>
                  </button>
                  <div className="faq-body">{f.a}</div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const FinalCTA = () => (
      <div className="final-cta">
        <h2>Funnelspace ersetzt Dutzende kostspielige, schwer zu verwaltende Tools.</h2>
        <p>Alles in einem. Keine Tool-Stapel. Keine Abo-Sammlung.</p>
        <div className="final-cta__btns">
          <a href="#signup" className="btn btn--ink btn-lg">Kostenlos testen</a>
          <a href="#demo" className="btn btn--ghost btn-lg" style={{borderColor:'var(--fs-lime-ink)', color:'var(--fs-lime-ink)'}}>Demo ansehen</a>
        </div>
      </div>
    );

    const SimpleFooter = () => (
      <footer style={{textAlign:'center', padding:'24px 40px', borderTop:'1px solid var(--border-1)', fontSize:13, color:'var(--fg-3)', background:'var(--fs-paper)'}}>
        <a href="index.html" style={{color:'var(--fs-ink)', textDecoration:'none', fontWeight:600}}>← Zurück zur Startseite</a>
        <span style={{margin:'0 16px'}}>·</span>
        © 2026 Funnelspace GmbH
      </footer>
    );

    const App = () => (
      <>
        <Nav />
        <main>
          <TmplHero />
          <Marquee />
          <TemplateTypes />
          <IncludedBand />
          <BrandCTA />
          <SetupSteps />
          <Testimonials />
          <FAQ />
        </main>
        <FinalCTA />
        <SimpleFooter />
      </>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
