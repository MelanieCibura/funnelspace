<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KI Builder — Funnelspace</title>
<meta name="description" content="Erstelle Landingpages, Funnels und Websites in Minuten statt Tagen. Der Funnelspace KI Builder baut deine Seiten per Chat, Screenshot oder URL — mit 1-Click CRM- und Kalender-Integration." />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="site.css" />
<style>
/* ── KI Builder Feature Page ── */
a{color:var(--fs-ink)}a:hover{color:var(--fs-lime-deep)}
/* Hero */
.kb-hero{background:var(--fs-ink);color:#fff;padding:96px 40px 0;position:relative}
.kb-hero::before{content:"";position:absolute;inset:0;overflow:hidden;background-image:radial-gradient(rgba(215,240,120,0.06) 1px,transparent 1.2px);background-size:8px 8px;pointer-events:none}
.kb-hero__inner{max-width:1080px;margin:0 auto;position:relative;text-align:center;z-index:1}
.kb-hero__eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--fs-lime);background:rgba(215,240,120,0.1);border:1px solid rgba(215,240,120,0.3);padding:6px 12px;border-radius:var(--radius-pill);margin-bottom:24px}
.kb-hero__eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fs-lime);animation:kb-pulse 1.6s ease-in-out infinite}
@keyframes kb-pulse{0%,100%{opacity:1}50%{opacity:0.35}}
.kb-hero h1{font-family:var(--font-display);font-size:clamp(42px,5vw,68px);font-weight:700;line-height:1.05;letter-spacing:-0.03em;text-wrap:balance;color:#fff}
.kb-hero h1 em{font-style:normal;color:var(--fs-lime)}
.kb-hero__lead{margin:20px auto 0;font-size:19px;line-height:1.55;color:rgba(255,255,255,0.7);max-width:620px}
.kb-hero__cta{display:flex;gap:12px;margin-top:32px;justify-content:center;flex-wrap:wrap}
.kb-stats{display:flex;gap:0;justify-content:center;margin-top:44px;flex-wrap:wrap}
.kb-stat{padding:0 36px;text-align:center;border-left:1px solid rgba(255,255,255,0.12)}
.kb-stat:first-child{border-left:none}
.kb-stat__num{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-0.02em;color:var(--fs-lime)}
.kb-stat__lbl{font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px}
/* Hero builder mockup */
.kb-builder{max-width:880px;margin:56px auto -110px;position:relative;background:var(--fs-paper);border-radius:var(--radius-xl);box-shadow:0 40px 80px -20px rgba(0,0,0,0.5);overflow:hidden;text-align:left}
.kb-builder__bar{display:flex;align-items:center;gap:8px;padding:11px 16px;background:var(--fs-gray-100);border-bottom:1px solid var(--border-1)}
.kb-builder__dots{display:flex;gap:4px}
.kb-builder__dots span{width:9px;height:9px;border-radius:50%;background:var(--fs-gray-300)}
.kb-builder__url{flex:1;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);background:#fff;padding:4px 12px;border-radius:999px;border:1px solid var(--border-1);text-align:center;max-width:320px;margin:0 auto}
.kb-builder__body{padding:36px 40px 40px}
.kb-builder__title{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-0.02em;color:var(--fs-ink);text-align:center}
.kb-builder__input{margin:20px auto 0;max-width:620px;background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:16px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)}
.kb-builder__input-text{flex:1;font-family:var(--font-mono);font-size:13px;color:var(--fs-ink);line-height:1.4;min-height:18px}
.kb-cursor{display:inline-block;width:8px;height:15px;background:var(--fs-ink);vertical-align:-2px;margin-left:2px;animation:kb-blink 1s steps(2) infinite}
@keyframes kb-blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.kb-builder__send{background:var(--fs-lime);color:var(--fs-lime-ink);border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.kb-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
.kb-mode{background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-md);padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out)}
.kb-mode:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kb-mode__icon{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center}
.kb-mode__icon svg{width:18px;height:18px}
.kb-mode h4{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:-0.01em;color:var(--fs-ink)}
.kb-mode p{font-size:12px;color:var(--fg-2);line-height:1.5}
/* Spacer under hero for the overlapping mockup */
.kb-hero-spacer{height:150px;background:var(--fs-white)}
/* Shared section */
.kb-sec{padding:104px 40px}
.kb-sec--alt{background:var(--fs-white)}
.kb-sec__inner{max-width:1280px;margin:0 auto}
.kb-sec__head{max-width:760px;margin:0 auto 64px;text-align:center}
.kb-eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
.kb-sec__head h2{font-family:var(--font-display);font-size:clamp(34px,3.6vw,52px);font-weight:700;letter-spacing:-0.03em;line-height:1.08;text-wrap:balance}
.kb-sec__head h2 em{font-style:normal;background:var(--fs-lime);color:var(--fs-lime-ink);padding:0 8px;border-radius:6px}
.kb-sec__head p{margin-top:16px;font-size:18px;color:var(--fg-2);line-height:1.55}
/* Showcase */
.kb-show{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.kb-show__card{background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out)}
.kb-show__card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.kb-show__thumb{aspect-ratio:16/10;background:var(--fs-paper);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:8px 8px;border-bottom:1px solid var(--border-1);padding:18px 22px 0;overflow:hidden;position:relative}
.kb-mini{background:#fff;border-radius:8px 8px 0 0;box-shadow:0 -2px 16px -6px rgba(0,0,0,0.12);height:100%;padding:12px;display:flex;flex-direction:column;gap:7px}
.kb-mini__nav{display:flex;justify-content:space-between;align-items:center}
.kb-mini__logo{width:34px;height:6px;border-radius:3px;background:var(--fs-ink)}
.kb-mini__links{display:flex;gap:4px}
.kb-mini__links span{width:16px;height:4px;border-radius:2px;background:var(--fs-gray-200)}
.kb-mini__h{height:9px;border-radius:3px;background:var(--fs-ink);width:72%}
.kb-mini__h--c{margin:0 auto}
.kb-mini__t{height:4px;border-radius:2px;background:var(--fs-gray-200)}
.kb-mini__t--s{width:55%}
.kb-mini__t--c{margin:0 auto}
.kb-mini__btn{width:56px;height:12px;border-radius:4px;background:var(--fs-lime)}
.kb-mini__btn--c{margin:2px auto 0}
.kb-mini__cols{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto}
.kb-mini__col{height:34px;border-radius:5px;background:var(--fs-gray-100);border:1px solid var(--border-1)}
.kb-mini__hero{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;align-items:center;flex:1}
.kb-mini__img{height:100%;min-height:40px;border-radius:5px;background:var(--fs-gray-100);border:1px solid var(--border-1);display:grid;place-items:center}
.kb-mini__img svg{width:16px;height:16px;color:var(--fs-gray-400)}
.kb-mini__form{display:flex;flex-direction:column;gap:4px;flex:1;justify-content:center}
.kb-mini__form span{height:9px;border-radius:3px;background:var(--fs-gray-100);border:1px solid var(--border-1)}
.kb-mini__form b{height:11px;border-radius:3px;background:var(--fs-lime)}
.kb-mini__cal{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;flex:1;align-content:center}
.kb-mini__cal span{aspect-ratio:1;border-radius:3px;background:var(--fs-gray-100);border:1px solid var(--border-1)}
.kb-mini__cal span.on{background:var(--fs-lime);border-color:var(--fs-lime)}
.kb-show__meta{padding:18px 22px 20px;display:flex;flex-direction:column;gap:6px}
.kb-show__meta h3{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-0.01em}
.kb-show__meta p{font-size:13px;color:var(--fg-2);line-height:1.5}
.kb-show__time{margin-top:6px;font-family:var(--font-mono);font-size:11px;color:var(--fs-ink);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.kb-show__time svg{width:11px;height:11px;color:var(--fs-lime-deep)}
/* Feature rows */
.kb-feat{display:grid;grid-template-columns:1fr 1.15fr;gap:80px;align-items:center;padding:88px 0;border-top:1px solid var(--border-1)}
.kb-feat:first-of-type{border-top:none;padding-top:0}
.kb-feat--flip .kb-feat__media{order:-1}
.kb-feat__eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:14px}
.kb-feat h3{font-family:var(--font-display);font-size:clamp(28px,2.8vw,40px);font-weight:700;line-height:1.1;letter-spacing:-0.02em;text-wrap:balance}
.kb-feat__body{margin-top:16px;font-size:17px;color:var(--fg-2);line-height:1.55}
.kb-feat ul{list-style:none;padding:0;margin-top:22px;display:flex;flex-direction:column;gap:12px}
.kb-feat li{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--fg-2);line-height:1.5}
.kb-feat li svg{width:18px;height:18px;flex-shrink:0;margin-top:3px;color:var(--fs-lime-deep)}
.kb-feat__media{background:var(--fs-paper);background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:10px 10px;border-radius:var(--radius-xl);padding:28px;border:1px solid var(--border-1);aspect-ratio:5/4;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);display:grid;place-items:stretch}
/* Mock shared card */
.kb-card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border-1);width:100%;height:100%;box-shadow:var(--shadow-md);overflow:hidden;display:flex;flex-direction:column}
/* Mock: chat */
.mkb-chat{padding:14px;gap:10px}
.mkb-chat__head{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--border-1)}
.mkb-chat__title{font-family:var(--font-display);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;letter-spacing:-0.01em}
.mkb-spark{width:18px;height:18px;border-radius:50%;background:var(--fs-lime);display:grid;place-items:center;flex-shrink:0}
.mkb-spark svg{width:11px;height:11px;color:var(--fs-lime-ink)}
.mkb-chat__status{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);display:flex;align-items:center;gap:5px}
.mkb-chat__status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fs-success)}
.mkb-msg{display:flex;gap:8px;align-items:flex-start}
.mkb-msg__av{width:22px;height:22px;border-radius:50%;flex-shrink:0;background:var(--fs-ink);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700}
.mkb-msg--ai .mkb-msg__av{background:var(--fs-lime);color:var(--fs-lime-ink)}
.mkb-msg__bubble{background:var(--fs-gray-100);border-radius:10px;padding:8px 10px;font-size:11px;line-height:1.45;color:var(--fs-ink);max-width:84%}
.mkb-msg--user .mkb-msg__bubble{background:var(--fs-ink);color:#fff}
.mkb-msg--ai .mkb-msg__bubble{background:var(--fs-paper);border:1px solid var(--border-1)}
.mkb-page{margin-top:8px;background:#fff;border:1px solid var(--border-1);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm)}
.mkb-page__h{height:8px;border-radius:3px;background:var(--fs-ink);width:70%}
.mkb-page__t{height:4px;border-radius:2px;background:var(--fs-gray-200)}
.mkb-page__t--s{width:50%}
.mkb-page__btn{width:60px;height:12px;border-radius:4px;background:var(--fs-lime);margin-top:2px}
.mkb-chat__input{margin-top:auto;background:var(--fs-gray-100);border-radius:10px;padding:9px 10px;display:flex;align-items:center;gap:8px;border:1px solid var(--border-1)}
.mkb-chat__input-text{flex:1;font-size:11px;color:var(--fg-3);font-family:var(--font-mono)}
.mkb-chat__input-send{width:22px;height:22px;border-radius:6px;background:var(--fs-ink);display:grid;place-items:center}
.mkb-chat__input-send svg{width:11px;height:11px;color:#fff}
/* Mock: integrations */
.mkb-int{padding:24px;align-items:center;justify-content:center;gap:14px}
.mkb-int__node{width:100%;max-width:280px;background:#fff;border:1px solid var(--border-1);border-radius:var(--radius-md);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)}
.mkb-int__node--hl{border:2px solid var(--fs-ink)}
.mkb-int__icon{width:32px;height:32px;border-radius:8px;background:var(--fs-gray-100);display:grid;place-items:center;flex-shrink:0}
.mkb-int__icon svg{width:16px;height:16px;color:var(--fs-ink)}
.mkb-int__icon--lime{background:var(--fs-lime)}
.mkb-int__icon--lime svg{color:var(--fs-lime-ink)}
.mkb-int__name{font-size:12px;font-weight:700;color:var(--fs-ink)}
.mkb-int__meta{font-size:10px;color:var(--fg-3);margin-top:1px}
.mkb-int__st{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--fs-lime);color:var(--fs-lime-ink)}
.mkb-int__link{width:1px;height:14px;background:var(--fs-gray-300);position:relative}
.mkb-int__link::after{content:"";position:absolute;left:-3px;bottom:-1px;border:3.5px solid transparent;border-top-color:var(--fs-gray-400)}
/* Mock: import */
.mkb-imp{padding:16px;gap:12px}
.mkb-imp__drop{border:2px dashed var(--fs-gray-300);border-radius:var(--radius-md);padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--fs-paper)}
.mkb-imp__drop svg{width:22px;height:22px;color:var(--fs-gray-500)}
.mkb-imp__drop b{font-size:12px;font-weight:700;color:var(--fs-ink)}
.mkb-imp__drop span{font-size:10px;color:var(--fg-3)}
.mkb-imp__or{text-align:center;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-3)}
.mkb-imp__url{display:flex;gap:8px;align-items:center;background:var(--fs-gray-100);border:1px solid var(--border-1);border-radius:10px;padding:8px 10px}
.mkb-imp__url-text{flex:1;font-family:var(--font-mono);font-size:11px;color:var(--fs-ink)}
.mkb-imp__go{background:var(--fs-ink);color:#fff;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:700}
.mkb-imp__scan{margin-top:auto;background:var(--fs-paper);border:1px solid var(--border-1);border-radius:var(--radius-md);padding:10px 12px;display:flex;align-items:center;gap:10px}
.mkb-imp__scan-bar{flex:1;height:6px;border-radius:3px;background:var(--fs-gray-200);overflow:hidden}
.mkb-imp__scan-bar i{display:block;height:100%;width:72%;background:var(--fs-lime);border-radius:3px}
.mkb-imp__scan span{font-family:var(--font-mono);font-size:10px;color:var(--fg-2);white-space:nowrap}
/* Mock: responsive */
.mkb-resp{padding:20px;flex-direction:row;align-items:flex-end;justify-content:center;gap:18px;background:#fff}
.mkb-dev{border:2px solid var(--fs-ink);border-radius:10px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow-sm)}
.mkb-dev--desktop{width:52%;aspect-ratio:16/11}
.mkb-dev--tablet{width:26%;aspect-ratio:3/4}
.mkb-dev--phone{width:15%;aspect-ratio:9/17;border-radius:14px}
.mkb-dev i{display:block;border-radius:3px;background:var(--fs-gray-200)}
.mkb-dev i.h{background:var(--fs-ink);height:8px;width:70%}
.mkb-dev i.t{height:4px}
.mkb-dev i.t.s{width:55%}
.mkb-dev i.b{background:var(--fs-lime);height:9px;width:40%;margin-top:auto;margin-bottom:2px}
.mkb-dev__lbl{font-size:9px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--fg-3);text-align:center;margin-top:6px}
/* Mock: time compare */
.mkb-time{padding:28px;justify-content:center;gap:22px}
.mkb-time__row{display:flex;flex-direction:column;gap:8px}
.mkb-time__lbl{display:flex;justify-content:space-between;align-items:baseline}
.mkb-time__name{font-size:12px;font-weight:700;color:var(--fs-ink)}
.mkb-time__val{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-0.02em}
.mkb-time__bar{height:14px;border-radius:7px;background:var(--fs-gray-100);overflow:hidden}
.mkb-time__bar i{display:block;height:100%;border-radius:7px}
.mkb-time__bar--old i{width:100%;background:var(--fs-gray-300)}
.mkb-time__bar--new i{width:7%;background:var(--fs-lime);min-width:26px}
.mkb-time__foot{margin-top:6px;padding-top:16px;border-top:1px solid var(--border-1);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fg-2)}
.mkb-time__foot b{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--fs-ink)}
/* Mock: branding */
.mkb-brand{padding:18px;gap:14px}
.mkb-brand__head{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-3);display:flex;align-items:center;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--border-1)}
.mkb-brand__head::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fs-lime-deep)}
.mkb-brand__row{display:flex;align-items:center;gap:10px}
.mkb-brand__lbl{font-size:11px;font-weight:700;color:var(--fs-ink-soft);width:64px;flex-shrink:0}
.mkb-brand__swatches{display:flex;gap:6px}
.mkb-brand__sw{width:26px;height:26px;border-radius:7px;border:1px solid var(--border-1)}
.mkb-brand__font{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--fs-ink)}
.mkb-brand__font small{font-size:11px;font-weight:400;color:var(--fg-3);margin-left:8px}
.mkb-brand__tone{display:flex;gap:6px;flex-wrap:wrap}
.mkb-brand__chip{font-size:10px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fs-gray-100);color:var(--fs-ink-soft)}
.mkb-brand__chip--on{background:var(--fs-lime);color:var(--fs-lime-ink)}
.mkb-brand__prev{margin-top:auto;background:var(--fs-paper);border:1px solid var(--border-1);border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;gap:6px}
.mkb-brand__prev-h{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:-0.01em;color:var(--fs-ink)}
.mkb-brand__prev-t{font-size:10px;color:var(--fg-2);line-height:1.5}
.mkb-brand__prev-btn{align-self:flex-start;background:var(--fs-lime);color:var(--fs-lime-ink);font-size:10px;font-weight:700;padding:5px 10px;border-radius:6px;margin-top:2px}
/* Final CTA */
.kb-final{background:var(--fs-ink);padding:104px 40px;text-align:center;position:relative;overflow:hidden}
.kb-final::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,0.06) 1px,transparent 1.2px);background-size:8px 8px}
.kb-final__inner{position:relative;max-width:760px;margin:0 auto}
.kb-final h2{font-family:var(--font-display);font-size:clamp(36px,4vw,56px);font-weight:700;letter-spacing:-0.03em;color:#fff;text-wrap:balance}
.kb-final h2 em{font-style:normal;color:var(--fs-lime)}
.kb-final p{margin:16px auto 0;font-size:18px;color:rgba(255,255,255,0.6)}
.kb-final__btns{display:flex;gap:12px;justify-content:center;margin-top:36px;flex-wrap:wrap}
/* Responsive */
@media (max-width:1024px){
.kb-show{grid-template-columns:1fr 1fr}
.kb-feat{grid-template-columns:1fr;gap:40px}
.kb-feat--flip .kb-feat__media{order:0}
}
@media (max-width:768px){
.kb-hero{padding:64px 22px 0}
.kb-sec{padding:72px 22px}
.kb-builder__body{padding:24px 20px 26px}
