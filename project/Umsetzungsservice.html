<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Umsetzungsservice — Funnelspace</title>
<meta name="description" content="Done-4-You mit festen Paketpreisen: Website, Funnels, Kursbereich, CRM- und E-Mail-Setup. Umsetzung in 14 Tagen, ab 249 €." />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="site.css" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<style>
/* ── Hero ─────────────────────────────────────────────── */
.ag-hero{background:var(--fs-paper);padding:64px 40px 88px;position:relative;overflow:hidden}
.ag-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.3px);background-size:22px 22px;opacity:.5;pointer-events:none}
.ag-hero__inner{max-width:1280px;margin:0 auto;position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center}
.ag-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fs-lime-ink);background:var(--fs-lime);padding:6px 14px;border-radius:var(--radius-pill);margin-bottom:24px}
.ag-hero h1{font-family:var(--font-display);font-size:clamp(42px,5.2vw,72px);font-weight:800;line-height:1.02;letter-spacing:-.035em;text-wrap:balance;color:var(--fs-ink)}
.ag-hero h1 em{font-style:normal;position:relative;z-index:0}
.ag-hero h1 em::after{content:"";position:absolute;left:-2px;right:-2px;bottom:.06em;height:.32em;background:var(--fs-lime);z-index:-1;border-radius:2px}
.ag-hero__lead{margin-top:22px;font-size:18px;line-height:1.6;color:var(--fg-2);max-width:540px}
.ag-hero__cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;align-items:center}
.ag-hero__facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.ag-hero__fact{display:flex;flex-direction:column;gap:2px;background:var(--fs-white);border:1.5px solid var(--fs-ink);border-radius:var(--radius-md);padding:12px 18px}
.ag-hero__fact b{font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--fs-ink)}
.ag-hero__fact span{font-size:12px;color:var(--fg-3)}
.ag-hero__visual{position:relative;background:var(--fs-white);border:2px solid var(--fs-ink);border-radius:var(--radius-xl);padding:26px;aspect-ratio:1/.94;display:grid;place-items:center;box-shadow:14px 14px 0 var(--fs-ink);overflow:hidden}
.ag-hero__visual img{max-height:100%;max-width:100%;object-fit:contain}
.ag-hero__price{position:absolute;bottom:-24px;left:-20px;background:var(--fs-ink);color:#fff;border-radius:var(--radius-lg);padding:16px 22px;box-shadow:var(--shadow-lg)}
.ag-hero__price small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fs-lime)}
.ag-hero__price b{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.03em;display:block;margin-top:4px}
.ag-hero__price i{font-style:normal;font-size:12px;color:rgba(255,255,255,.55)}

/* ── Sections ─────────────────────────────────────────── */
.ag-sec{padding:104px 40px}
.ag-sec--white{background:var(--fs-white)}
.ag-sec--paper{background:var(--fs-paper)}
.ag-sec__inner{max-width:1280px;margin:0 auto}
.ag-sec__head{max-width:760px;margin:0 0 56px}
.ag-sec__head--center{margin:0 auto 56px;text-align:center}
.ag-sec__eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fs-lime-deep);margin-bottom:14px}
.ag-sec__head h2{font-family:var(--font-display);font-size:clamp(32px,3.6vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1.05;text-wrap:balance;color:var(--fs-ink)}
.ag-sec__head h2 em{font-style:normal;position:relative;z-index:0}
.ag-sec__head h2 em::after{content:"";position:absolute;left:-1px;right:-1px;bottom:.08em;height:.3em;background:var(--fs-lime);z-index:-1;border-radius:2px}
.ag-sec__head p{margin-top:16px;font-size:18px;color:var(--fg-2);line-height:1.55}

/* ── Argument cards ───────────────────────────────────── */
.ag-args{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.ag-arg{background:var(--fs-white);border:2px solid var(--fs-ink);border-radius:var(--radius-lg);padding:30px}
.ag-arg--lime{background:var(--fs-lime)}
.ag-arg__num{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--fs-ink);opacity:.5}
.ag-arg h3{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.025em;margin-top:14px;color:var(--fs-ink)}
.ag-arg p{margin-top:10px;font-size:15px;line-height:1.6;color:var(--fg-2)}
.ag-arg--lime p{color:rgba(47,58,0,.78)}

/* ── Filter ───────────────────────────────────────────── */
.ag-filter{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:40px}
.ag-filter button{font-family:var(--font-sans);font-size:14px;font-weight:600;color:var(--fs-ink);background:var(--fs-white);border:1.5px solid var(--fs-gray-300);border-radius:var(--radius-pill);padding:9px 18px;cursor:pointer;transition:all var(--dur-med) var(--ease-out)}
.ag-filter button:hover{border-color:var(--fs-ink)}
.ag-filter button.is-on{background:var(--fs-ink);border-color:var(--fs-ink);color:#fff}

/* ── Service cards ────────────────────────────────────── */
.ag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.ag-card{background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);transition:transform var(--dur-med) var(--ease-out),box-shadow var(--dur-med) var(--ease-out),border-color var(--dur-med)}
.ag-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--fs-gray-300)}
.ag-card__media{position:relative;background:var(--fs-paper);border-bottom:1px solid var(--border-1);aspect-ratio:16/9;display:grid;place-items:center;padding:18px}
.ag-card__media::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--fs-gray-300) 1px,transparent 1.2px);background-size:16px 16px;opacity:.45}
.ag-card__media img{position:relative;max-height:100%;max-width:82%;object-fit:contain}
.ag-card__badge{position:absolute;top:12px;left:12px;background:var(--fs-lime);color:var(--fs-lime-ink);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:var(--radius-pill)}
.ag-card__body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px;flex:1}
.ag-card__top{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.ag-card__top h3{font-family:var(--font-display);font-size:21px;font-weight:800;letter-spacing:-.025em;color:var(--fs-ink);line-height:1.15}
.ag-card__price{font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.03em;color:var(--fs-ink);white-space:nowrap}
.ag-card__price small{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);text-align:right}
.ag-card__teaser{font-size:14px;line-height:1.6;color:var(--fg-2)}
.ag-card__tags{display:flex;gap:6px;flex-wrap:wrap}
.ag-card__tags span{font-size:11px;font-weight:600;color:var(--fg-2);background:var(--fs-paper);border:1px solid var(--border-1);border-radius:var(--radius-xs);padding:4px 9px}
.ag-card__foot{margin-top:auto;display:flex;gap:8px;align-items:center;padding-top:4px}
.ag-card__more{font-family:var(--font-sans);font-size:14px;font-weight:600;color:var(--fs-ink);background:none;border:none;cursor:pointer;padding:8px 4px;display:inline-flex;align-items:center;gap:6px;border-bottom:2px solid var(--fs-lime)}
.ag-card__more:hover{border-bottom-color:var(--fs-ink)}
.ag-card__time{font-size:12px;color:var(--fg-3);margin-left:auto;display:flex;align-items:center;gap:5px}

/* ── Drawer ───────────────────────────────────────────── */
.ag-scrim{position:fixed;inset:0;background:rgba(42,45,51,.55);z-index:200;opacity:0;pointer-events:none;transition:opacity var(--dur-med) var(--ease-out)}
.ag-scrim.is-open{opacity:1;pointer-events:auto}
.ag-drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--fs-white);z-index:201;display:flex;flex-direction:column;transform:translateX(102%);transition:transform var(--dur-slow) var(--ease-out);box-shadow:var(--shadow-lg)}
.ag-drawer.is-open{transform:none}
.ag-drawer__head{background:var(--fs-ink);color:#fff;padding:26px 30px;position:relative;flex-shrink:0}
.ag-drawer__head::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(215,240,120,.08) 1px,transparent 1.2px);background-size:8px 8px}
.ag-drawer__close{position:absolute;top:20px;right:22px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;cursor:pointer;display:grid;place-items:center;transition:background var(--dur-fast)}
.ag-drawer__close:hover{background:rgba(255,255,255,.22)}
.ag-drawer__kicker{position:relative;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fs-lime)}
.ag-drawer__head h3{position:relative;font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.03em;color:#fff;margin-top:10px;padding-right:44px}
.ag-drawer__meta{position:relative;display:flex;gap:20px;margin-top:16px;flex-wrap:wrap}
.ag-drawer__meta div{font-size:12px;color:rgba(255,255,255,.5)}
.ag-drawer__meta b{display:block;font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.02em;color:#fff;margin-top:2px}
.ag-drawer__scroll{overflow-y:auto;padding:28px 30px 34px;flex:1}
.ag-drawer__teaser{font-size:16px;line-height:1.6;color:var(--fg-1)}
.ag-block{margin-top:28px}
.ag-block h4{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);padding-bottom:10px;border-bottom:1px solid var(--border-1);margin-bottom:16px}
.ag-block p{font-size:15px;line-height:1.65;color:var(--fg-2)}
.ag-block ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px}
.ag-block li{display:grid;grid-template-columns:20px 1fr;gap:11px;font-size:15px;line-height:1.5;color:var(--fg-1)}
.ag-block li svg{width:18px;height:18px;color:var(--fs-lime-deep);margin-top:2px}
.ag-drawer__foot{border-top:1px solid var(--border-1);padding:18px 30px;display:flex;gap:12px;align-items:center;background:var(--fs-paper);flex-shrink:0}
.ag-drawer__foot span{font-size:12px;color:var(--fg-3)}

/* ── Bundles ──────────────────────────────────────────── */
.ag-bundles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.ag-bundle{background:var(--fs-white);border:1px solid var(--border-1);border-radius:var(--radius-lg);padding:30px;display:flex;flex-direction:column;gap:18px}
.ag-bundle--f{background:var(--fs-ink);border-color:var(--fs-ink)}
.ag-bundle__tag{align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:var(--fs-lime);color:var(--fs-lime-ink);padding:4px 10px;border-radius:var(--radius-pill)}
.ag-bundle h3{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--fs-ink)}
.ag-bundle--f h3{color:#fff}
.ag-bundle__tagline{font-size:14px;color:var(--fg-2);line-height:1.5;margin-top:-10px}
.ag-bundle--f .ag-bundle__tagline{color:rgba(255,255,255,.6)}
.ag-bundle ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.ag-bundle li{display:grid;grid-template-columns:18px 1fr;gap:10px;font-size:14px;color:var(--fg-1);line-height:1.45}
.ag-bundle--f li{color:rgba(255,255,255,.82)}
.ag-bundle li svg{width:16px;height:16px;color:var(--fs-lime-deep);margin-top:2px}
.ag-bundle--f li svg{color:var(--fs-lime)}
.ag-bundle__price{margin-top:auto;padding-top:16px;border-top:1px solid var(--border-1);display:flex;align-items:baseline;gap:10px}
.ag-bundle--f .ag-bundle__price{border-color:rgba(255,255,255,.14)}
.ag-bundle__price b{font-family:var(--font-display);font-size:34px;font-weight:800;letter-spacing:-.04em;color:var(--fs-ink)}
.ag-bundle--f .ag-bundle__price b{color:#fff}
.ag-bundle__price s{font-size:15px;color:var(--fg-3)}
.ag-bundle--f .ag-bundle__price s{color:rgba(255,255,255,.4)}
.ag-bundle__save{font-size:12px;font-weight:700;color:var(--fs-lime-ink);background:var(--fs-lime);padding:3px 9px;border-radius:var(--radius-xs);margin-left:auto}

/* ── Process ──────────────────────────────────────────── */
.ag-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.ag-steps::before{content:"";position:absolute;top:26px;left:26px;right:26px;height:2px;background:var(--border-1)}
.ag-step{padding-right:28px;position:relative}
.ag-step__num{width:54px;height:54px;border-radius:50%;background:var(--fs-lime);color:var(--fs-lime-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:20px;font-weight:800;border:4px solid var(--fs-white);position:relative}
.ag-sec--paper .ag-step__num{border-color:var(--fs-paper)}
.ag-step__lbl{margin-top:20px;font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--fs-lime-deep)}
.ag-step h3{font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:8px;color:var(--fs-ink)}
.ag-step p{margin-top:10px;font-size:14px;line-height:1.6;color:var(--fg-2)}

/* ── Notes ────────────────────────────────────────────── */
.ag-notes{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--border-1)}
.ag-note{padding:26px 28px 26px 0;border-bottom:1px solid var(--border-1)}
.ag-note h4{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.015em;color:var(--fs-ink)}
.ag-note p{margin-top:8px;font-size:14px;line-height:1.6;color:var(--fg-2)}

/* ── FAQ ──────────────────────────────────────────────── */
.ag-faq{max-width:820px;margin:0 auto}
.ag-faq__item{border-bottom:1px solid var(--border-1)}
.ag-faq__item:first-child{border-top:1px solid var(--border-1)}
.ag-faq__btn{width:100%;background:none;border:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;text-align:left;font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--fs-ink);letter-spacing:-.01em}
.ag-faq__icon{width:30px;height:30px;border-radius:50%;background:var(--fs-gray-100);flex-shrink:0;display:grid;place-items:center;font-size:18px;color:var(--fs-ink);transition:background var(--dur-fast),transform var(--dur-med) var(--ease-out)}
.ag-faq__item.open .ag-faq__icon{background:var(--fs-lime);transform:rotate(45deg)}
.ag-faq__body{font-size:15px;line-height:1.65;color:var(--fg-2);overflow:hidden;max-height:0;transition:max-height var(--dur-slow) var(--ease-out),padding var(--dur-slow) var(--ease-out);max-width:700px}
.ag-faq__item.open .ag-faq__body{max-height:400px;padding-bottom:24px}

/* ── Final CTA ────────────────────────────────────────── */
.ag-final{background:var(--fs-lime);padding:100px 40px;position:relative;overflow:hidden;color:var(--fs-lime-ink)}
.ag-final::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(47,58,0,.08) 1px,transparent 1.3px);background-size:22px 22px;opacity:.5}
.ag-final__inner{position:relative;max-width:1280px;margin:0 auto;display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.ag-final h2{font-family:var(--font-display);font-size:clamp(34px,4vw,54px);font-weight:800;letter-spacing:-.035em;line-height:1.05;color:var(--fs-lime-ink);text-wrap:balance}
.ag-final p{margin-top:16px;font-size:18px;line-height:1.55;color:rgba(47,58,0,.75);max-width:520px}
.ag-final__btns{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.ag-final__note{margin-top:16px;font-size:13px;color:rgba(47,58,0,.55)}
.ag-final__card{background:var(--fs-white);border:2px solid var(--fs-lime-ink);border-radius:var(--radius-lg);padding:26px}
.ag-final__card h4{font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--fs-ink)}
.ag-final__card ul{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:10px}
.ag-final__card li{display:grid;grid-template-columns:18px 1fr;gap:10px;font-size:14px;line-height:1.5;color:var(--fg-1)}
.ag-final__card li svg{width:16px;height:16px;color:var(--fs-lime-deep);margin-top:2px}

@media (max-width:1024px){
  .ag-hero__inner{grid-template-columns:1fr;gap:56px}
  .ag-args{grid-template-columns:1fr}
  .ag-grid{grid-template-columns:repeat(2,1fr)}
  .ag-bundles{grid-template-columns:1fr}
  .ag-steps{grid-template-columns:1fr 1fr;gap:32px 0}.ag-steps::before{display:none}
  .ag-notes{grid-template-columns:1fr 1fr}
  .ag-final__inner{grid-template-columns:1fr}
}
@media (max-width:768px){
  .ag-hero{padding:44px 22px 70px}
  .ag-sec{padding:72px 22px}
  .ag-grid{grid-template-columns:1fr}
  .ag-steps{grid-template-columns:1fr}
  .ag-notes{grid-template-columns:1fr}
  .ag-note{padding-right:0}
  .ag-final{padding:72px 22px}
  .ag-hero__price{left:0;bottom:-30px}
  .nav__links{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="agentur-data.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const eur = n => n.toLocaleString('de-DE');
const Check = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
const Clock = () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>;
const Arrow = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/></svg>;
const X = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>;

const ARGS = [
  { n:'01', t:'Feste Pakete', d:'Unsere Done-4-You-Angebote basieren auf Setups, die wir für diese Branche und diese Software entwickelt haben. Kein Individualprojekt mit offenem Ende — ein Festpreis, ein Termin, ein Ergebnis.', lime:true },
  { n:'02', t:'Templates, die Zeit und Geld sparen', d:'Hunderte Stunden Entwicklung stecken in unseren Premium-Templates. Du wählst dein Lieblings-Layout, wir passen Texte, Bilder und Branding an — individuell, ohne den Aufwand.' },
  { n:'03', t:'Ein Ansprechpartner, ein Zeitplan', d:'Kommunikation läuft über ein Ticket direkt in deinem Funnelspace-Account. Kein E-Mail-Pingpong, keine Abstimmungsschleifen — Lieferung in der Regel in 14 Tagen.' },
];

/* ── Services ───────────────────────────────────────── */
const ServiceCard = ({ s, onOpen }) => (
  <article className="ag-card">
    <div className="ag-card__media">
      {s.badge && <span className="ag-card__badge">{s.badge}</span>}
      <img src={s.illu} alt="" />
    </div>
    <div className="ag-card__body">
      <div className="ag-card__top">
        <h3>{s.name}</h3>
        <div className="ag-card__price">{eur(s.price)} €<small>einmalig</small></div>
      </div>
      <p className="ag-card__teaser">{s.teaser}</p>
      <div className="ag-card__tags">{s.tags.map(t => <span key={t}>{t}</span>)}</div>
      <div className="ag-card__foot">
        <button className="ag-card__more" onClick={() => onOpen(s)}>Details ansehen <Arrow /></button>
        <span className="ag-card__time"><Clock /> {s.time}</span>
      </div>
    </div>
  </article>
);

const Services = ({ onOpen }) => {
  const [cat, setCat] = useState('alle');
  const list = cat === 'alle' ? AGENTUR_SERVICES : AGENTUR_SERVICES.filter(s => s.cat === cat);
  return (
    <section className="ag-sec ag-sec--white" id="pakete">
      <div className="ag-sec__inner">
        <div className="ag-sec__head ag-sec__head--center">
          <div className="ag-sec__eyebrow">Wähle deine Services</div>
          <h2>Jedes Paket zum <em>Festpreis</em>. Lieferung inklusive Termin.</h2>
          <p>Einzeln buchbar oder kombiniert. Alle Preise einmalig, zzgl. USt., ein Korrekturdurchlauf inklusive.</p>
        </div>
        <div className="ag-filter">
          {AGENTUR_CATEGORIES.map(c => (
            <button key={c.id} className={cat === c.id ? 'is-on' : ''} onClick={() => setCat(c.id)}>{c.label}</button>
          ))}
        </div>
        <div className="ag-grid">
          {list.map(s => <ServiceCard key={s.id} s={s} onOpen={onOpen} />)}
        </div>
      </div>
    </section>
  );
};

const Drawer = ({ s, onClose }) => {
  useEffect(() => {
    const fn = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', fn);
    return () => window.removeEventListener('keydown', fn);
  }, [onClose]);
  return (
    <>
      <div className={`ag-scrim${s ? ' is-open' : ''}`} onClick={onClose} />
      <aside className={`ag-drawer${s ? ' is-open' : ''}`} aria-hidden={!s}>
        {s && (
          <>
            <div className="ag-drawer__head">
              <button className="ag-drawer__close" onClick={onClose} aria-label="Schließen"><X /></button>
              <div className="ag-drawer__kicker">Done-4-You Paket</div>
              <h3>{s.name}</h3>
              <div className="ag-drawer__meta">
                <div>Festpreis<b>{eur(s.price)} €</b></div>
                <div>Lieferzeit<b>{s.time}</b></div>
                <div>Korrekturen<b>1 Runde</b></div>
              </div>
            </div>
            <div className="ag-drawer__scroll">
              <p className="ag-drawer__teaser">{s.teaser}</p>
              {s.blocks.map(b => (
                <div className="ag-block" key={b.h}>
                  <h4>{b.h}</h4>
                  {b.body && <p>{b.body}</p>}
                  {b.items && <ul>{b.items.map(i => <li key={i}><Check />{i}</li>)}</ul>}
                </div>
              ))}
              <div className="ag-block">
                <h4>Der Prozess</h4>
                <ul>{AGENTUR_PROCESS.map(p => <li key={p.n}><Check />{p.t} — {p.d}</li>)}</ul>
              </div>
            </div>
            <div className="ag-drawer__foot">
              <a href="#termin" className="btn btn--primary" onClick={onClose}>Service anfragen</a>
              <span>Antwort innerhalb von 1 Werktag</span>
            </div>
          </>
        )}
      </aside>
    </>
  );
};

/* ── Sections ───────────────────────────────────────── */
const Hero = () => (
  <section className="ag-hero">
    <div className="ag-hero__inner">
      <div>
        <div className="ag-eyebrow">Umsetzungsservice · Done-4-You</div>
        <h1>Der schnellste Weg von der Idee zur <em>Umsetzung</em>.</h1>
        <p className="ag-hero__lead">
          Viele bauen alles von Grund auf neu — in der Annahme, ihr Setup müsse komplett individuell sein.
          Die erfolgreichsten setzen auf bewährte Systeme, kommen schnell in die Umsetzung und optimieren später.
          Genau dafür gibt es unsere festen Paketpreise.
        </p>
        <div className="ag-hero__cta">
          <a href="#pakete" className="btn btn--primary btn-lg">Pakete ansehen</a>
          <a href="#termin" className="btn btn--ghost btn-lg">Erstgespräch buchen</a>
        </div>
        <div className="ag-hero__facts">
          <div className="ag-hero__fact"><b>ab 249 €</b><span>Festpreis, einmalig</span></div>
          <div className="ag-hero__fact"><b>14 Tage</b><span>bis zur Übergabe</span></div>
          <div className="ag-hero__fact"><b>14 Pakete</b><span>einzeln oder als Bundle</span></div>
        </div>
      </div>
      <div>
        <div className="ag-hero__visual">
          <img src="assets/illustrations/bg.jpg" alt="Funnelspace Umsetzungsservice" />
          <div className="ag-hero__price">
            <small>Beliebtestes Paket</small>
            <b>Webseite — 999 €</b>
            <i>7 Seiten · Workflows · in 14 Tagen live</i>
          </div>
        </div>
      </div>
    </div>
  </section>
);

const Args = () => (
  <section className="ag-sec ag-sec--paper">
    <div className="ag-sec__inner">
      <div className="ag-sec__head">
        <div className="ag-sec__eyebrow">Warum feste Pakete</div>
        <h2>Weniger Komplexität. <em>Schneller live.</em></h2>
        <p>Wir nehmen dir die Entscheidungen ab, die dich sonst wochenlang aufhalten — ohne endlose Schleifen und ohne Agenturpreise.</p>
      </div>
      <div className="ag-args">
        {ARGS.map(a => (
          <div key={a.n} className={`ag-arg${a.lime ? ' ag-arg--lime' : ''}`}>
            <div className="ag-arg__num">{a.n}</div>
            <h3>{a.t}</h3>
            <p>{a.d}</p>
          </div>
        ))}
      </div>
    </div>
  </section>
);

const Bundles = () => (
  <section className="ag-sec ag-sec--paper">
    <div className="ag-sec__inner">
      <div className="ag-sec__head ag-sec__head--center">
        <div className="ag-sec__eyebrow">Bundles</div>
        <h2>Mehrere Pakete? <em>Günstiger im Bundle.</em></h2>
        <p>Wir bauen alles in einem Durchlauf — das spart Abstimmung, Zeit und Geld.</p>
      </div>
      <div className="ag-bundles">
        {AGENTUR_BUNDLES.map(b => (
          <article key={b.id} className={`ag-bundle${b.featured ? ' ag-bundle--f' : ''}`}>
            {b.featured && <span className="ag-bundle__tag">Am häufigsten gebucht</span>}
            <h3>{b.name}</h3>
            <p className="ag-bundle__tagline">{b.tagline}</p>
            <ul>{b.items.map(i => <li key={i}><Check />{i}</li>)}</ul>
            <div className="ag-bundle__price">
              <b>{eur(b.price)} €</b>
              <s>{eur(b.regular)} €</s>
              <span className="ag-bundle__save">− {eur(b.regular - b.price)} €</span>
            </div>
            <a href="#termin" className={`btn ${b.featured ? 'btn--primary' : 'btn--ink'}`} style={{justifyContent:'center'}}>Bundle anfragen</a>
            <span style={{fontSize:12, color: b.featured ? 'rgba(255,255,255,.45)' : 'var(--fg-3)', textAlign:'center', marginTop:-8}}>Lieferzeit {b.time}</span>
          </article>
        ))}
      </div>
    </div>
  </section>
);

const Process = () => (
  <section className="ag-sec ag-sec--white">
    <div className="ag-sec__inner">
      <div className="ag-sec__head">
        <div className="ag-sec__eyebrow">Der Prozess</div>
        <h2>Vier Schritte — und der Aufwand liegt bei uns.</h2>
      </div>
      <div className="ag-steps">
        {AGENTUR_PROCESS.map(p => (
          <div className="ag-step" key={p.n}>
            <div className="ag-step__num">{p.n}</div>
            <div className="ag-step__lbl">{p.lbl}</div>
            <h3>{p.t}</h3>
            <p>{p.d}</p>
          </div>
        ))}
      </div>
    </div>
  </section>
);

const Notes = () => (
  <section className="ag-sec ag-sec--paper">
    <div className="ag-sec__inner">
      <div className="ag-sec__head">
        <div className="ag-sec__eyebrow">Gut zu wissen</div>
        <h2>Was von dir kommt — und was von uns.</h2>
        <p>Damit der Zeitplan hält, brauchen wir ein paar Dinge von deiner Seite. Alles andere übernehmen wir.</p>
      </div>
      <div className="ag-notes">
        {AGENTUR_NOTES.map(n => (
          <div className="ag-note" key={n.t}>
            <h4>{n.t}</h4>
            <p>{n.d}</p>
          </div>
        ))}
      </div>
    </div>
  </section>
);

const Faq = () => {
  const [open, setOpen] = useState(0);
  return (
    <section className="ag-sec ag-sec--white">
      <div className="ag-sec__inner">
        <div className="ag-sec__head ag-sec__head--center">
          <div className="ag-sec__eyebrow">FAQ</div>
          <h2>Häufige Fragen zum Umsetzungsservice.</h2>
        </div>
        <div className="ag-faq">
          {AGENTUR_FAQ.map((f, i) => (
            <div key={i} className={`ag-faq__item${open === i ? ' open' : ''}`}>
              <button className="ag-faq__btn" onClick={() => setOpen(open === i ? null : i)}>
                {f.q}<span className="ag-faq__icon">+</span>
              </button>
              <div className="ag-faq__body">{f.a}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
};

const Final = () => (
  <section className="ag-final" id="termin">
    <div className="ag-final__inner">
      <div>
        <h2>Du brauchst was Individuelles oder hast noch Fragen?</h2>
        <p>Vereinbare einen Termin — wir schauen uns dein Vorhaben an und sagen dir offen, welches Paket passt oder ob es ein Angebot braucht.</p>
        <div className="ag-final__btns">
          <a href="#booking" className="btn btn--ink btn-lg">Termin vereinbaren</a>
          <a href="#pakete" className="btn btn--ghost btn-lg" style={{borderColor:'var(--fs-lime-ink)', color:'var(--fs-lime-ink)'}}>Zurück zu den Paketen</a>
        </div>
        <p className="ag-final__note">30 Minuten · unverbindlich · kostenlos</p>
      </div>
      <div className="ag-final__card">
        <h4>Im Erstgespräch klären wir</h4>
        <ul>
          {['Welches Paket zu deinem Angebot passt','Was du vorbereiten musst — und was nicht','Realistischer Termin für deinen Launch','Ob ein Bundle günstiger ist als Einzelpakete'].map(i => (
            <li key={i}><Check />{i}</li>
          ))}
        </ul>
      </div>
    </div>
  </section>
);

const App = () => {
  const [active, setActive] = useState(null);
  useEffect(() => { document.body.style.overflow = active ? 'hidden' : ''; }, [active]);
  return (
    <>
      <Nav />
      <main>
        <Hero />
        <Args />
        <Services onOpen={setActive} />
        <Bundles />
        <Process />
        <Notes />
        <Faq />
      </main>
      <Final />
      <Footer />
      <Drawer s={active} onClose={() => setActive(null)} />
    </>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
