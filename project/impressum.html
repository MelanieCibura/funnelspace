<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Impressum — Funnelspace</title>
  <meta name="description" content="Impressum und Anbieterkennzeichnung der Funnelspace GmbH gemäß § 5 DDG." />
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
  <style>
    a { color: var(--fs-ink); }
    a:hover { color: var(--fs-lime-deep); }

    /* ── Hero ─────────────────────────────────────────────────── */
    .im-hero {
      padding: 72px 40px 48px;
      border-bottom: 1px solid var(--border-1);
      position: relative; overflow: hidden;
    }
    .im-hero__inner { max-width: 860px; margin: 0 auto; position: relative; z-index: 1; }
    .im-hero__eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--fg-3); margin-bottom: 16px;
    }
    .im-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(38px, 5vw, 58px);
      font-weight: 700; line-height: 1.04;
      letter-spacing: -0.03em; text-wrap: balance;
    }
    .im-hero__lead {
      margin-top: 16px; font-size: 17px;
      color: var(--fg-2); max-width: 560px; line-height: 1.55;
    }
    .im-hero__updated {
      display: inline-flex; align-items: center; gap: 9px;
      margin-top: 22px; font-size: 13px; color: var(--fg-3);
    }
    .im-hero__dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--fs-lime-deep); flex-shrink: 0;
      box-shadow: 0 0 0 4px rgba(215,240,120,0.35);
    }

    /* ── Body layout ──────────────────────────────────────────── */
    .im-main {
      max-width: 860px; margin: 0 auto;
      padding: 56px 40px 40px;
      display: grid; gap: 28px;
    }

    .im-block {
      background: var(--fs-white);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-lg);
      padding: 32px 34px;
      box-shadow: var(--shadow-xs);
    }
    .im-block--marker {
      border: 2px solid var(--border-strong);
      padding: 31px 33px;
    }

    .im-block h2 {
      font-family: var(--font-display);
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--fg-3);
      margin-bottom: 18px;
    }

    .im-block p { font-size: 16px; line-height: 1.6; color: var(--fg-1); }
    .im-block p + p { margin-top: 14px; }
    .im-block strong { font-weight: 700; color: var(--fs-ink); }

    /* address / key-value rows */
    .im-address {
      font-size: 17px; line-height: 1.7; color: var(--fs-ink);
    }
    .im-address .im-name { font-weight: 700; font-family: var(--font-display); font-size: 20px; letter-spacing: -0.01em; }

    .im-rows { display: grid; gap: 14px; }
    .im-row {
      display: grid; grid-template-columns: 210px 1fr; gap: 20px;
      padding-bottom: 14px; border-bottom: 1px solid var(--border-1);
      align-items: baseline;
    }
    .im-row:last-child { border-bottom: none; padding-bottom: 0; }
    .im-row__label {
      font-size: 13px; font-weight: 600; color: var(--fg-3);
      letter-spacing: 0.01em;
    }
    .im-row__value { font-size: 16px; color: var(--fs-ink); line-height: 1.5; }
    .im-row__value .mono { font-family: var(--font-mono); font-size: 14px; }

    .im-contact { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
    .im-contact a {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 600; text-decoration: none;
      color: var(--fs-ink);
      padding: 10px 16px; border: 1.5px solid var(--border-2);
      border-radius: var(--radius-md); background: var(--fs-white);
      transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }
    .im-contact a:hover { border-color: var(--fs-ink); color: var(--fs-ink); transform: translateY(-1px); }
    .im-contact svg { color: var(--fg-3); flex-shrink: 0; }

    /* placeholder note */
    .im-note {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--fs-lime); color: var(--fs-lime-ink);
      border-radius: var(--radius-md);
      padding: 16px 18px; font-size: 13px; line-height: 1.5;
      margin-top: 4px;
    }
    .im-note svg { flex-shrink: 0; margin-top: 1px; }
    .im-note strong { color: var(--fs-lime-ink); }

    .im-eu {
      display: flex; align-items: center; gap: 16px;
      background: var(--fs-paper); background-image: var(--fs-halftone);
      border: 1px solid var(--border-1); border-radius: var(--radius-md);
      padding: 18px 20px; margin-top: 16px;
    }
    .im-eu p { font-size: 14px; }

    /* ── Footer ───────────────────────────────────────────────── */
    .im-footer {
      max-width: 860px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
      padding: 24px 40px 56px; font-size: 13px; color: var(--fg-3);
    }
    .im-footer a { text-decoration: none; font-weight: 600; }
    .im-footer__links { display: flex; gap: 18px; }

    @media (max-width: 640px) {
      .im-hero { padding: 48px 24px 36px; }
      .im-main { padding: 40px 24px 24px; }
      .im-block { padding: 26px 22px; }
      .im-block--marker { padding: 25px 21px; }
      .im-row { grid-template-columns: 1fr; gap: 4px; }
      .im-footer { padding: 24px 24px 48px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Nav.jsx"></script>

  <script type="text/babel">
    const MailIcon = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
      </svg>
    );
    const PhoneIcon = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z" />
      </svg>
    );
    const GlobeIcon = () => (
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10" /><path d="M2 12h20" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
      </svg>
    );
    const InfoIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" />
      </svg>
    );

    const Row = ({ label, children }) => (
      <div className="im-row">
        <div className="im-row__label">{label}</div>
        <div className="im-row__value">{children}</div>
      </div>
    );

    const App = () => (
      <React.Fragment>
        <Nav />

        <header className="im-hero">
          <div className="im-hero__inner">
            <div className="im-hero__eyebrow">Rechtliches</div>
            <h1>Impressum</h1>
            <p className="im-hero__lead">
              Anbieterkennzeichnung und Pflichtangaben gemäß § 5 Digitale-Dienste-Gesetz (DDG)
              sowie § 18 Medienstaatsvertrag (MStV).
            </p>
            <div className="im-hero__updated">
              <span className="im-hero__dot"></span>
              Stand: Juli 2026
            </div>
          </div>
        </header>

        <main className="im-main">

          {/* Anbieter */}
          <section className="im-block im-block--marker">
            <h2>Anbieter</h2>
            <div className="im-address">
              <span className="im-name">Funnelspace GmbH</span><br />
              Musterstraße 12<br />
              10115 Berlin<br />
              Deutschland
            </div>
            <div className="im-note">
              <InfoIcon />
              <span><strong>Platzhalter.</strong> Bitte ersetze Straße, PLZ und Ort durch die im Handelsregister eingetragene Geschäftsanschrift.</span>
            </div>
          </section>

          {/* Kontakt */}
          <section className="im-block">
            <h2>Kontakt</h2>
            <div className="im-contact">
              <a href="tel:+493000000000"><PhoneIcon /> +49 30 000 000 00</a>
              <a href="mailto:hallo@funnelspace.de"><MailIcon /> hallo@funnelspace.de</a>
              <a href="index.html"><GlobeIcon /> www.funnelspace.de</a>
            </div>
          </section>

          {/* Vertretung & Register */}
          <section className="im-block">
            <h2>Vertretung &amp; Register</h2>
            <div className="im-rows">
              <Row label="Vertretungsberechtigte Geschäftsführung">
                Max Mustermann
              </Row>
              <Row label="Registergericht">
                Amtsgericht Berlin (Charlottenburg)
              </Row>
              <Row label="Handelsregisternummer">
                <span className="mono">HRB 000000 B</span>
              </Row>
              <Row label="Umsatzsteuer-Identifikationsnummer">
                <span className="mono">DE000000000</span> <span style={{color:'var(--fg-3)'}}>· gemäß § 27 a UStG</span>
              </Row>
            </div>
            <div className="im-note">
              <InfoIcon />
              <span><strong>Platzhalter.</strong> Geschäftsführung, HRB-Nummer und USt-IdNr. mit euren echten Registerdaten überschreiben.</span>
            </div>
          </section>

          {/* Verantwortlich für den Inhalt */}
          <section className="im-block">
            <h2>Redaktionell verantwortlich</h2>
            <p>Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV:</p>
            <p>
              <strong>Max Mustermann</strong><br />
              Funnelspace GmbH · Musterstraße 12 · 10115 Berlin
            </p>
          </section>

          {/* Streitschlichtung */}
          <section className="im-block">
            <h2>EU-Streitschlichtung &amp; Verbraucherstreitbeilegung</h2>
            <p>
              Die Europäische Kommission stellt eine Plattform zur Online-Streitbeilegung (OS) bereit,
              die du unter <a href="https://ec.europa.eu/consumers/odr/" target="_blank" rel="noopener">ec.europa.eu/consumers/odr</a> findest.
              Unsere E-Mail-Adresse findest du oben im Impressum.
            </p>
            <div className="im-eu">
              <p>
                Wir sind nicht bereit und nicht verpflichtet, an Streitbeilegungsverfahren vor einer
                Verbraucherschlichtungsstelle teilzunehmen.
              </p>
            </div>
          </section>

          {/* Haftung */}
          <section className="im-block">
            <h2>Haftung für Inhalte &amp; Links</h2>
            <p>
              Als Diensteanbieter sind wir gemäß § 7 Abs. 1 DDG für eigene Inhalte auf diesen Seiten
              nach den allgemeinen Gesetzen verantwortlich. Nach §§ 8 bis 10 DDG sind wir als
              Diensteanbieter jedoch nicht verpflichtet, übermittelte oder gespeicherte fremde
              Informationen zu überwachen oder nach Umständen zu forschen, die auf eine rechtswidrige
              Tätigkeit hinweisen.
            </p>
            <p>
              Unser Angebot enthält Links zu externen Websites Dritter, auf deren Inhalte wir keinen
              Einfluss haben. Deshalb können wir für diese fremden Inhalte auch keine Gewähr übernehmen.
              Für die Inhalte der verlinkten Seiten ist stets der jeweilige Anbieter oder Betreiber der
              Seiten verantwortlich.
            </p>
          </section>

          {/* Urheberrecht */}
          <section className="im-block">
            <h2>Urheberrecht</h2>
            <p>
              Die durch die Betreiber erstellten Inhalte und Werke auf diesen Seiten unterliegen dem
              deutschen Urheberrecht. Die Vervielfältigung, Bearbeitung, Verbreitung und jede Art der
              Verwertung außerhalb der Grenzen des Urheberrechts bedürfen der schriftlichen Zustimmung
              der Funnelspace GmbH.
            </p>
          </section>

        </main>

        <footer className="im-footer">
          <a href="index.html">← Zurück zur Startseite</a>
          <div className="im-footer__links">
            <a href="#">Datenschutz</a>
            <a href="#">AGB</a>
            <span>© 2026 Funnelspace GmbH</span>
          </div>
        </footer>
      </React.Fragment>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
